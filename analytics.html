<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudTask Analytics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f7f5;font-family:Arial,sans-serif;color:#17231d}.wrap{max-width:760px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:23px;font-weight:900;color:#16834b}.muted{color:#667085;font-size:12px}.card{background:#fff;border:1px solid #e1e8e3;border-radius:16px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f5f8f6;border-radius:12px;padding:12px}.metric b{display:block;font-size:25px;margin-top:5px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;background:#eaf1ed}.primary{background:#16834b;color:#fff}.chart{width:100%;height:250px}.error{background:#fff0f0;color:#a21d1d;padding:12px;border-radius:10px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="head"><div><div class="logo">StudTask Analytics</div><div class="muted">Live platform trends from the production database.</div></div><button class="btn" onclick="location.href='admin.html'">← ADMIN</button></div><div id="auth" class="card">Checking administrator access...</div><main id="app" style="display:none"><div class="card"><div class="grid" id="metrics"></div></div><div class="card"><b>Referral Growth</b><div class="muted">Current referral funnel.</div><div class="grid" id="referralMetrics" style="margin-top:10px"></div></div><div class="card"><b>30-Day Activity</b><div class="muted">Tasks, applications and completed tasks.</div><canvas id="activity" class="chart"></canvas></div><div class="card"><b>30-Day Financial Activity</b><div class="muted">Completed deposits, withdrawals and released task value.</div><canvas id="finance" class="chart"></canvas></div><div class="card"><button id="refresh" class="btn primary" onclick="load()">↻ REFRESH ANALYTICS</button><span id="updated" class="muted"></span></div></main></div><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);function days(){let a=[];for(let i=29;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}function agg(rows,ds,val){let m=Object.fromEntries(ds.map(d=>[d,0]));(rows||[]).forEach(r=>{let d=new Date(r.created_at).toISOString().slice(0,10);if(d in m)m[d]+=Number(val(r)||0)});return ds.map(d=>m[d])}function draw(id,series){let c=$(id),ctx=c.getContext("2d"),w=c.clientWidth||700,h=250,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let max=Math.max(1,...series.flatMap(s=>s.data)),pad=25,cw=w-pad*2,ch=h-40;ctx.clearRect(0,0,w,h);series.forEach(s=>{ctx.beginPath();s.data.forEach((v,i)=>{let x=pad+cw*i/(s.data.length-1),y=10+ch-(v/max)*ch;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.stroke()})}async function load(){let b=$("refresh");b.disabled=true;try{let s=(await db.auth.getSession()).data.session;if(!s){location.href="login.html";return}let adm=await db.from("admin_users").select("user_id").eq("user_id",s.user.id).maybeSingle();if(!adm.data){$("auth").className="card error";$("auth").textContent="Administrator access required.";return}$("auth").style.display="none";$("app").style.display="block";let ds=days(),since=new Date(Date.now()-30*86400000).toISOString();let [u,t,a,p,de,w,r]=await Promise.all([db.from("profiles").select("id",{count:"exact",head:true}),db.from("tasks").select("id,status,created_at").gte("created_at",since),db.from("task_applications").select("id,created_at").gte("created_at",since),db.from("task_payments").select("amount,status,created_at").gte("created_at",since),db.from("deposit_requests").select("amount,status,created_at").gte("created_at",since),db.from("withdrawal_requests").select("net_amount,amount,status,created_at").gte("created_at",since),db.from("referrals").select("status,created_at")]);for(let q of [t,a,p,de,w,r])if(q.error)throw q.error;let ts=t.data||[],as=a.data||[],ps=p.data||[],des=de.data||[],ws=w.data||[],rs=r.data||[];$("metrics").innerHTML='<div class="metric"><small>USERS</small><b>'+Number(u.count||0)+'</b></div><div class="metric"><small>TASKS 30D</small><b>'+ts.length+'</b></div><div class="metric"><small>APPLICATIONS 30D</small><b>'+as.length+'</b></div><div class="metric"><small>COMPLETED 30D</small><b>'+ts.filter(x=>x.status==="completed").length+'</b></div><div class="metric"><small>TASK VALUE</small><b>₦'+ps.filter(x=>["released","completed"].includes(x.status)).reduce((n,x)=>n+Number(x.amount||0),0).toLocaleString()+'</b></div><div class="metric"><small>DEPOSITS</small><b>₦'+des.filter(x=>x.status==="completed").reduce((n,x)=>n+Number(x.amount||0),0).toLocaleString()+'</b></div><div class="metric"><small>WITHDRAWALS</small><b>₦'+ws.filter(x=>x.status==="completed").reduce((n,x)=>n+Number(x.net_amount??x.amount??0),0).toLocaleString()+'</b></div><div class="metric"><small>ACTIVE TASKS</small><b>'+ts.filter(x=>["open","accepted","in_progress","awaiting_verification"].includes(x.status)).length+'</b></div>';let qualified=rs.filter(x=>x.status==="qualified").length,registered=rs.filter(x=>x.status==="registered").length,rejected=rs.filter(x=>x.status==="rejected").length;$("referralMetrics").innerHTML="<div class=\"metric\"><small>TOTAL</small><b>"+rs.length+"</b></div><div class=\"metric\"><small>QUALIFIED</small><b>"+qualified+"</b></div><div class=\"metric\"><small>REGISTERED</small><b>"+registered+"</b></div><div class=\"metric\"><small>RATE</small><b>"+(rs.length?Math.round(qualified/rs.length*100):0)+"%</b></div>";draw("activity",[{data:agg(ts,ds,()=>1),color="#16834b"},{data:agg(as,ds,()=>1),color="#2563eb"},{data:agg(ts.filter(x=>x.status==="completed"),ds,()=>1),color="#d97706"}]);draw("finance",[{data:agg(des.filter(x=>x.status==="completed"),ds,x=>x.amount),color="#16834b"},{data:agg(ws.filter(x=>x.status==="completed"),ds,x=>x.net_amount??x.amount),color="#2563eb"},{data:agg(ps.filter(x=>["released","completed"].includes(x.status)),ds,x=>x.amount),color="#d97706"}]);$("updated").textContent=" · Updated "+new Date().toLocaleTimeString()}catch(e){$("auth").className="card error";$("auth").textContent=e.message||"Could not load analytics."}finally{b.disabled=false}}load();</script><script src="brand.js"></script></body></html>
