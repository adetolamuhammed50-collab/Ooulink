<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OOULink — Connect. Get things done. Earn.</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
      padding-bottom: 80px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    /* HEADER */

    header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #e7ebe8;
      position: relative;
      background: white;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #16834b;
    }

    .location {
      margin-top: 10px;
      display: inline-block;
      background: #f0f6f2;
      color: #16834b;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .auth-buttons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .auth-buttons a {
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      padding: 8px 9px;
      border-radius: 8px;
    }

    .signup {
      color: #16834b;
      border: 1px solid #16834b;
      background: white;
    }

    .login {
      color: white;
      background: #16834b;
    }

    .profile-btn {
      text-decoration: none;
      color: #16834b;
      border: 1px solid #16834b;
      background: white;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }

    .logout-btn {
      border: none;
      color: white;
      background: #d9534f;
      padding: 8px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* LOCATION MENU */

    .location-menu {
      display: none;
      position: absolute;
      top: 105px;
      left: 16px;
      right: 16px;
      background: white;
      border: 1px solid #dfe5e1;
      border-radius: 13px;
      padding: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      z-index: 2000;
    }

    .location-title {
      font-size: 13px;
      font-weight: 700;
      padding: 8px;
      color: #333;
    }

    .location-menu button {
      width: 100%;
      border: none;
      background: white;
      text-align: left;
      padding: 12px 9px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .location-menu button:hover {
      background: #f0f6f2;
    }

    /* HERO */

    .hero {
      padding: 28px 18px 22px;
      background: linear-gradient(135deg, #16834b, #0d6238);
      color: white;
    }

    .hero h1 {
      margin: 0 0 9px;
      font-size: 29px;
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.92;
    }

    .hero-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .post,
    .find {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 14px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .post {
      background: white;
      color: #16834b;
      border: 1px solid #16834b;
    }

    .find {
      background: #0a4d2c;
      color: white;
    }

    /* CONTENT */

    .section {
      padding: 22px 16px 5px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-heading a {
      color: #16834b;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    /* TASK CARDS */

    .task-card {
      border: 1px solid #e3e8e5;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      background: white;
      cursor: pointer;
    }

    .task-card:active {
      transform: scale(0.99);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .task-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 7px;
      line-height: 1.35;
    }

    .task-price {
      color: #16834b;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .task-info {
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      margin-top: 8px;
      background: #edf7f1;
      color: #16834b;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 25px 10px;
      color: #777;
      font-size: 13px;
    }

    .loading-icon {
      font-size: 22px;
      margin-bottom: 7px;
    }

    /* EMPTY */

    .empty {
      display: none;
      text-align: center;
      padding: 28px 18px;
      border: 1px dashed #d9e1dc;
      border-radius: 14px;
      background: #fafcfb;
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .empty-text {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty-button {
      display: inline-block;
      margin-top: 13px;
      background: #16834b;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    /* ERROR */

    .error-box {
      display: none;
      padding: 14px;
      background: #fff5f5;
      border: 1px solid #f0d2d2;
      border-radius: 12px;
      color: #a94442;
      font-size: 12px;
      line-height: 1.5;
    }

    /* HOW IT WORKS */

    .how {
      margin: 20px 16px;
      padding: 18px;
      background: #f4f8f5;
      border-radius: 14px;
    }

    .how h2 {
      margin: 0 0 15px;
      font-size: 17px;
    }

    .step {
      display: flex;
      gap: 11px;
      margin-bottom: 14px;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .step-number {
      min-width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16834b;
      color: white;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
    }

    .step-text strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .step-text span {
      color: #777;
      font-size: 11px;
      line-height: 1.4;
    }

    /* FOOTER NAV */

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid #e5e8e6;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      z-index: 1000;
    }

    nav a {
      text-align: center;
      font-size: 11px;
      color: #777;
      text-decoration: none;
    }

    nav a.active {
      color: #16834b;
      font-weight: 700;
    }

    /* LOGIN STATUS */

    .welcome {
      display: none;
      padding: 10px 16px 0;
      color: #555;
      font-size: 12px;
    }

    @media (max-width: 360px) {

      .logo {
        font-size: 20px;
      }

      .auth-buttons a,
      .logout-btn,
      .profile-btn {
        font-size: 9px;
        padding: 7px;
      }

      .hero h1 {
        font-size: 26px;
      }

    }
  </style>
</head>
