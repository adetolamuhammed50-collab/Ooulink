<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Details • OOULink</title>

  <meta
    name="description"
    content="View task details, applications, files, chat and task progress on OOULink."
  >

  <style>
    :root{
      --green:#16a34a;
      --green-dark:#15803d;
      --green-light:#dcfce7;
      --green-soft:#f0fdf4;

      --text:#17211b;
      --muted:#64748b;

      --white:#ffffff;
      --bg:#f6faf7;
      --border:#e2e8f0;

      --danger:#dc2626;
      --danger-bg:#fef2f2;

      --warning:#d97706;
      --warning-bg:#fffbeb;

      --blue:#2563eb;
      --blue-bg:#eff6ff;

      --shadow:
        0 8px 25px rgba(15,23,42,.07);

      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      line-height:1.5;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .app{
      width:100%;
      max-width:480px;
      min-height:100vh;
      margin:0 auto;
      background:var(--bg);
      padding-bottom:92px;
    }

    /* =========================
       HEADER
       ========================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:50;

      display:flex;
      align-items:center;
      justify-content:space-between;

      min-height:64px;
      padding:12px 16px;

      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--border);

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .back-button{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid var(--border);
      border-radius:14px;

      background:var(--white);
      color:var(--text);

      font-size:21px;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .back-button:active{
      transform:scale(.94);
      background:#f1f5f9;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;

      font-size:19px;
      font-weight:800;
      letter-spacing:-.3px;
    }

    .brand-mark{
      width:32px;
      height:32px;
display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:var(--green);
      color:white;

      font-size:15px;
      font-weight:900;
    }

    .header-spacer{
      width:42px;
      height:42px;
    }

    /* =========================
       MAIN
       ========================= */

    main{
      padding:16px;
    }

    .page{
      width:100%;
    }

    /* =========================
       LOADING
       ========================= */

    .loading-state{
      padding:28px 0;
    }

    .skeleton{
      position:relative;
      overflow:hidden;

      background:#e8eef0;
      border-radius:12px;
    }

    .skeleton::after{
      content:"";

      position:absolute;
      inset:0;

      transform:translateX(-100%);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.65),
          transparent
        );

      animation:skeleton-shimmer 1.4s infinite;
    }

    @keyframes skeleton-shimmer{
      100%{
        transform:translateX(100%);
      }
    }

    .skeleton-title{
      width:72%;
      height:28px;
      margin-bottom:14px;
    }

    .skeleton-line{
      width:100%;
      height:14px;
      margin-bottom:10px;
    }

    .skeleton-line.short{
      width:65%;
    }

    .skeleton-card{
      height:160px;
      margin-top:18px;
    }

    /* =========================
       ERROR / EMPTY
       ========================= */

    .state-card{
      padding:28px 20px;
      margin-top:20px;

      background:var(--white);
      border:1px solid var(--border);
      border-radius:var(--radius);

      box-shadow:var(--shadow);
      text-align:center;
    }

    .state-icon{
      width:54px;
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin:0 auto 14px;

      border-radius:16px;

      background:var(--green-light);

      font-size:25px;
    }

    .state-card.error .state-icon{
      background:var(--danger-bg);
    }

    .state-title{
      margin-bottom:7px;

      font-size:19px;
      font-weight:800;
    }
 .state-text{
      color:var(--muted);
      font-size:14px;
    }

    .retry-button{
      margin-top:18px;
    }

    /* =========================
       BUTTONS
       ========================= */

    .btn{
      width:100%;
      min-height:46px;

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      padding:11px 16px;

      border:0;
      border-radius:13px;

      font-size:14px;
      font-weight:750;

      transition:
        transform .15s ease,
        opacity .15s ease,
        background .15s ease;
    }

    .btn:active{
      transform:scale(.97);
    }

    .btn:disabled{
      cursor:not-allowed;
      opacity:.55;
      transform:none;
    }

    .btn-primary{
      background:var(--green);
      color:white;
    }

    .btn-primary:hover{
      background:var(--green-dark);
    }

    .btn-secondary{
      background:#f1f5f9;
      color:var(--text);
    }

    .btn-secondary:hover{
      background:#e2e8f0;
    }

    .btn-danger{
      background:var(--danger);
      color:white;
    }

    .btn-danger-outline{
      background:transparent;
      color:var(--danger);
      border:1px solid #fecaca;
    }

    .btn-warning{
      background:var(--warning);
      color:white;
    }

    .btn-blue{
      background:var(--blue);
      color:white;
    }

    .button-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .button-row .btn{
      flex:1 1 140px;
    }

    /* =========================
       TASK HERO
       ========================= */

    .task-hero{
      padding:20px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f0fdf4
        );

      border:1px solid #d9f3df;
      border-radius:22px;

      box-shadow:var(--shadow);
    }

    .task-category{
      display:inline-flex;
      align-items:center;

      padding:6px 10px;

      border-radius:999px;

      background:var(--green-light);
      color:var(--green-dark);

      font-size:12px;
      font-weight:800;
    }

    .task-title{
      margin-top:13px;

      font-size:25px;
      line-height:1.18;
      letter-spacing:-.5px;
      font-weight:850;
      word-break:break-word;
    }

    .task-description{
      margin-top:12px;

      color:#475569;
      font-size:14px;

      white-space:pre-wrap;
      word-break:break-word;
    }

    /* =========================
       STATUS
       ========================= */

    .status-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;

      margin-top:15px;
      padding:7px 11px;

      border-radius:999px;

      font-size:12px;
      font-weight:800;
    }

    .status-open{
      background:var(--green-light);
      color:var(--green-dark);
    }

    .status-progress{
      background:var(--blue-bg);
      color:#1d4ed8;
    }

    .status-submitted{
      background:var(--warning-bg);
      color:#b45309;
    }

    .status-completed{
      background:#ecfdf5;
      color:#047857;
    }

    .status-rejected{
      background:var(--danger-bg);
      color:#b91c1c;
    }

    .status-cancelled{
      background:#f1f5f9;
      color:#475569;
    }

/* =========================
       INFORMATION GRID
       ========================= */

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;

      margin-top:18px;
    }

    .info-item{
      min-width:0;
      padding:13px;

      background:rgba(255,255,255,.9);
      border:1px solid var(--border);
      border-radius:14px;
    }

    .info-label{
      color:var(--muted);

      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .info-value{
      margin-top:4px;

      font-size:14px;
      font-weight:800;

      overflow-wrap:anywhere;
    }

    .budget-value{
      color:var(--green-dark);
      font-size:17px;
    }

    /* =========================
       SECTIONS
       ========================= */

    .section{
      margin-top:16px;
      padding:18px;

      background:var(--white);
      border:1px solid var(--border);
      border-radius:var(--radius);

      box-shadow:0 4px 16px rgba(15,23,42,.04);
    }

    .section-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      margin-bottom:14px;
    }

    .section-title{
      font-size:16px;
      font-weight:850;
    }

    .section-subtitle{
      margin-top:3px;

      color:var(--muted);
      font-size:12px;
    }

    /* =========================
       POSTER / PROFILE
       ========================= */

    .person{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .avatar{
      width:48px;
      height:48px;

      flex:0 0 48px;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      border-radius:50%;

      background:var(--green-light);
      color:var(--green-dark);

      font-size:17px;
      font-weight:850;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .person-info{
      min-width:0;
      flex:1;
    }

    .person-name{
      font-size:14px;
      font-weight:800;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .person-meta{
      margin-top:2px;

      color:var(--muted);
      font-size:12px;
    }

    .profile-link{
      flex:0 0 auto;

      padding:8px 10px;

      border-radius:10px;

      background:var(--green-soft);
      color:var(--green-dark);

      font-size:12px;
      font-weight:800;
    }

    /* =========================
       ALERTS / NOTICES
       ========================= */

    .notice{
      padding:13px 14px;

      border-radius:13px;

      font-size:13px;
    }

    .notice.info{
      background:var(--blue-bg);
      color:#1e40af;
    }

    .notice.success{
      background:var(--green-soft);
      color:var(--green-dark);
    }

    .notice.warning{
      background:var(--warning-bg);
      color:#92400e;
    }

    .notice.danger{
      background:var(--danger-bg);
      color:#991b1b;
    }

    /* =========================
       TIMELINE
       ========================= */

    .timeline{
      display:flex;
      flex-direction:column;
      gap:0;
    }

    .timeline-item{
      position:relative;

      display:flex;
      gap:12px;

      padding-bottom:18px;
    }

    .timeline-item:last-child{
      padding-bottom:0;
    }

    .timeline-dot-wrap{
      position:relative;

      flex:0 0 24px;

      display:flex;
      justify-content:center;
    }

    .timeline-dot{
      width:12px;
      height:12px;

      margin-top:4px;

      border-radius:50%;

      background:#cbd5e1;
      border:3px solid white;
      box-shadow:0 0 0 1px #cbd5e1;

      z-index:2;
    }

    .timeline-item.active .timeline-dot{
      background:var(--green);
      box-shadow:0 0 0 1px var(--green);
    }

    .timeline-item.done .timeline-dot{
      background:var(--green-dark);
      box-shadow:0 0 0 1px var(--green-dark);
    }

    .timeline-line{
      position:absolute;

      top:16px;
      bottom:-2px;

      width:1px;

      background:#e2e8f0;
    }

    .timeline-content{
      min-width:0;
    }

    .timeline-title{
      font-size:13px;
      font-weight:800;
    }

    .timeline-text{
      margin-top:2px;

      color:var(--muted);
      font-size:12px;
    }
    /* =========================
       CHAT
       ========================= */

    .chat-box{
      display:flex;
      flex-direction:column;
      gap:8px;

      max-height:320px;
      overflow-y:auto;

      padding:4px 0;
    }

    .chat-empty{
      padding:16px;

      border-radius:12px;

      background:#f8fafc;

      color:var(--muted);

      font-size:12px;
      text-align:center;
    }

    .message{
      max-width:84%;
      padding:9px 11px;

      border-radius:14px;

      font-size:12px;
      word-break:break-word;
    }

    .message.mine{
      align-self:flex-end;

      background:var(--green);
      color:white;

      border-bottom-right-radius:5px;
    }

    .message.theirs{
      align-self:flex-start;

      background:#f1f5f9;
      color:var(--text);

      border-bottom-left-radius:5px;
    }

    .message-author{
      margin-bottom:3px;

      font-size:10px;
      font-weight:800;
      opacity:.75;
    }

    .message-time{
      margin-top:4px;

      font-size:9px;
      opacity:.65;
    }

    .chat-compose{
      display:flex;
      gap:8px;

      margin-top:11px;
    }

    .chat-input{
      flex:1;

      min-width:0;
      min-height:42px;

      padding:10px 12px;

      border:1px solid var(--border);
      border-radius:12px;

      outline:none;

      background:white;

      font-size:12px;
    }

    .chat-input:focus{
      border-color:#86efac;
      box-shadow:0 0 0 3px rgba(34,197,94,.08);
    }

    .send-btn{
      width:44px;
      min-height:42px;

      flex:0 0 44px;

      padding:0;

      border:0;
      border-radius:12px;

      background:var(--green);
      color:white;

      font-size:16px;
    }

    /* =========================
       REVIEWS
       ========================= */

    .review-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .review{
      padding:12px;

      border:1px solid var(--border);
      border-radius:13px;

      background:#fafafa;
    }

    .review-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .reviewer{
      display:flex;
      align-items:center;
      gap:8px;

      min-width:0;
    }

    .reviewer-avatar{
      width:30px;
      height:30px;

      flex:0 0 30px;

      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      background:var(--green-light);
      color:var(--green-dark);

      font-size:11px;
      font-weight:800;
    }

    .reviewer-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .reviewer-name{
      font-size:12px;
      font-weight:800;
    }

    .stars{
      color:#d97706;
      font-size:13px;
      white-space:nowrap;
    }

    .review-text{
      margin-top:8px;

      color:#475569;
      font-size:12px;
      white-space:pre-wrap;
    }
/* =========================
       REPORT
       ========================= */

    .report-link{
      display:inline-flex;
      align-items:center;
      gap:5px;

      color:var(--danger);

      font-size:12px;
      font-weight:750;
    }

    /* =========================
       BOTTOM NAV
       ========================= */

    .bottom-nav{
      position:fixed;
      left:50%;
      bottom:0;
      z-index:60;

      width:100%;
      max-width:480px;

      transform:translateX(-50%);

      display:grid;
      grid-template-columns:repeat(5,1fr);

      padding:8px 8px calc(8px + env(safe-area-inset-bottom));

      background:rgba(255,255,255,.97);
      border-top:1px solid var(--border);

      box-shadow:0 -5px 20px rgba(15,23,42,.06);

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .nav-item{
      min-height:54px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;

      border-radius:13px;

      color:#64748b;

      font-size:10px;
      font-weight:700;

      transition:
        transform .15s ease,
        background .15s ease,
        color .15s ease;
    }

    .nav-item:active{
      transform:scale(.94);
    }

    .nav-item.active{
      background:var(--green-soft);
      color:var(--green-dark);
    }

    .nav-icon{
      font-size:18px;
      line-height:1;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:100;

      display:none;
      align-items:flex-end;
      justify-content:center;

      padding:16px;

      background:rgba(15,23,42,.48);
    }

    .modal-backdrop.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:480px;
      max-height:85vh;
      overflow-y:auto;

      padding:20px;

      background:white;
      border-radius:22px 22px 16px 16px;

      box-shadow:0 20px 50px rgba(15,23,42,.2);

      animation:modal-in .18s ease;
    }

    @keyframes modal-in{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .modal-title{
      font-size:18px;
      font-weight:850;
    }

    .modal-text{
      margin-top:6px;

      color:var(--muted);
      font-size:13px;
    }

    .modal-actions{
      display:flex;
      gap:9px;

      margin-top:18px;
    }

    .modal-actions .btn{
      flex:1;
    }

    /* =========================
       TOAST
       ========================= */

    .toast-container{
      position:fixed;
      left:50%;
      bottom:82px;
      z-index:120;

      width:calc(100% - 32px);
      max-width:448px;

      transform:translateX(-50%);

      display:flex;
      flex-direction:column;
      gap:8px;

      pointer-events:none;
    }

    .toast{
      padding:12px 14px;

      border-radius:13px;

      background:#17211b;
      color:white;

      box-shadow:0 10px 30px rgba(15,23,42,.18);

      font-size:12px;
      font-weight:700;

      animation:toast-in .18s ease;
    }

    .toast.success{
      background:var(--green-dark);
    }

    .toast.error{
      background:#b91c1c;
    }

    @keyframes toast-in{
      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }
/* =========================
       RESPONSIVE
       ========================= */

    @media (max-width:360px){
      main{
        padding:12px;
      }

      .task-hero{
        padding:16px;
      }

      .task-title{
        font-size:22px;
      }

      .info-grid{
        grid-template-columns:1fr;
      }

      .section{
        padding:15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         TOP BAR
         ========================= -->

    <header class="topbar">

      <button
        class="back-button"
        type="button"
        onclick="goBack()"
        aria-label="Go back"
      >
        ←
      </button>

      <div class="brand">
        <span class="brand-mark">O</span>
        <span>OOULink</span>
      </div>

      <div class="header-spacer"></div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>

      <div id="page" class="page">

        <div class="loading-state">

          <div class="skeleton skeleton-title"></div>

          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>

          <div class="skeleton skeleton-card"></div>

          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>

        </div>

      </div>

    </main>

  </div>


  <!-- =========================
       BOTTOM NAVIGATION
       ========================= -->

  <nav class="bottom-nav">

    <a
      class="nav-item"
      href="index.html"
      aria-label="Home"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a
      class="nav-item"
      href="my-tasks.html"
      aria-label="My Tasks"
    >
      <span class="nav-icon">✓</span>
      <span>My Tasks</span>
    </a>

    <a
      class="nav-item"
      href="post-task.html"
      aria-label="Post Task"
    >
      <span class="nav-icon">＋</span>
      <span>Post</span>
    </a>

    <a
      class="nav-item"
      href="alerts.html"
      aria-label="Alerts"
    >
      <span class="nav-icon">♢</span>
      <span>Alerts</span>
    </a>

    <a
      class="nav-item"
      href="profile.html"
      aria-label="Profile"
    >
      <span class="nav-icon">◉</span>
      <span>Profile</span>
    </a>

  </nav>
<!-- =========================
       MODAL
       ========================= -->

  <div
    id="modalBackdrop"
    class="modal-backdrop"
    onclick="closeModalFromBackdrop(event)"
  >

    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      onclick="event.stopPropagation()"
    >

      <div id="modalTitle" class="modal-title">
        Confirm action
      </div>

      <div id="modalText" class="modal-text">
        Are you sure?
      </div>

      <div class="modal-actions">

        <button
          class="btn btn-secondary"
          type="button"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          id="modalConfirmButton"
          class="btn btn-primary"
          type="button"
        >
          Continue
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       TOAST CONTAINER
       ========================= -->

  <div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================================
       OOULINK TASK DETAILS
       BLOCK 1
       CORE SETUP + SAFE UI HELPERS
       ========================================================= */


    /* =========================
       SUPABASE CONFIG
       ========================= */

    const SUPABASE_URL =
      "https://dthvdxgxesomltlruogp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr4";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       GLOBAL STATE
       ========================= */

    let currentUser = null;

    let currentTask = null;

    let ownerProfile = null;

    let runnerProfile = null;

    let myApplication = null;

    let taskApplications = [];

    let taskAttachments = [];

    let taskMessages = [];

    let taskReviews = [];

    let isLoading = false;

    let isSubmitting = false;

    let realtimeChannel = null;


    /* =========================
       DOM REFERENCES
       ========================= */

    const page =
      document.getElementById("page");

    const modalBackdrop =
      document.getElementById("modalBackdrop");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalText =
      document.getElementById("modalText");

    const modalConfirmButton =
      document.getElementById("modalConfirmButton");

    const toastContainer =
      document.getElementById("toastContainer");
/* =========================
       BASIC HELPERS
       ========================= */

    function escapeHtml(value){

      if(value === null || value === undefined){
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value){

      return escapeHtml(value)
        .replace(/`/g, "&#096;");
    }


    function getTaskId(){

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("id");
    }


    function goBack(){

      if(
        document.referrer &&
        document.referrer.includes(
          window.location.host
        )
      ){
        window.history.back();
        return;
      }

      window.location.href =
        "index.html";
    }


    function formatMoney(value){

      const number =
        Number(value);

      if(
        Number.isNaN(number)
      ){
        return "₦0";
      }

      return "₦" +
        number.toLocaleString(
          "en-NG",
          {
            maximumFractionDigits:0
          }
        );
    }


    function formatDate(value){

      if(!value){
        return "Not specified";
      }

      const date =
        new Date(value);

      if(
        Number.isNaN(
          date.getTime()
        )
      ){
        return "Not specified";
      }

      return date.toLocaleDateString(
        "en-NG",
        {
          day:"numeric",
          month:"short",
          year:"numeric"
        }
      );
    }


    function formatDateTime(value){

      if(!value){
        return "Not specified";
      }

      const date =
        new Date(value);

      if(
        Number.isNaN(
          date.getTime()
        )
      ){
        return "Not specified";
      }

      return date.toLocaleString(
        "en-NG",
        {
          day:"numeric",
          month:"short",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit"
        }
      );
    }


    function getInitials(name){

      const clean =
        String(name || "")
          .trim();

      if(!clean){
        return "U";
      }

      const parts =
        clean
          .split(/\s+/)
          .filter(Boolean);

      if(parts.length === 1){
        return parts[0]
          .slice(0,1)
          .toUpperCase();
      }

      return (
        parts[0].slice(0,1) +
        parts[parts.length - 1]
          .slice(0,1)
      ).toUpperCase();
    }


    function displayName(profile){

      if(!profile){
        return "OOULink User";
      }

      return (
        profile.full_name ||
        profile.username ||
        "OOULink User"
      );
    }


    function profileAvatar(profile){

      if(
        profile &&
        profile.avatar_url
      ){

        return `
          <img
            src="${escapeAttribute(
              profile.avatar_url
            )}"
            alt="${escapeAttribute(
              displayName(profile)
            )}"
            loading="lazy"
          >
        `;

      }

      return escapeHtml(
        getInitials(
          displayName(profile)
        )
      );
    }


    function profileLocation(profile){

      if(
        !profile ||
        !profile.location
      ){
        return "";
      }

      return escapeHtml(
        profile.location
      );
    }


    function profileXp(profile){

      const xp =
        Number(
          profile?.xp ?? 0
        );

      return Number.isFinite(xp)
        ? xp
        : 0;
    }


    function profileReputation(profile){

      const reputation =
        Number(
          profile?.reputation ?? 0
        );

      return Number.isFinite(reputation)
        ? reputation
        : 0;
    }
/* =========================
       STATUS HELPERS
       ========================= */

    function normalizeStatus(status){

      return String(
        status || "open"
      )
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_");
    }


    function statusLabel(status){

      const normalized =
        normalizeStatus(status);

      const labels = {

        open:"Open",

        assigned:"Runner Selected",

        accepted:"Runner Selected",

        in_progress:"In Progress",

        "in-progress":"In Progress",

        submitted:"Submitted",

        completed:"Completed",

        rejected:"Rejected",

        cancelled:"Cancelled",

        canceled:"Cancelled"

      };

      return (
        labels[normalized] ||
        String(status || "Open")
          .replace(/_/g," ")
          .replace(
            /\b\w/g,
            char => char.toUpperCase()
          )
      );
    }


    function statusClass(status){

      const normalized =
        normalizeStatus(status);

      if(
        normalized === "completed"
      ){
        return "status-completed";
      }

      if(
        normalized === "rejected"
      ){
        return "status-rejected";
      }

      if(
        normalized === "cancelled" ||
        normalized === "canceled"
      ){
        return "status-cancelled";
      }

      if(
        normalized === "submitted"
      ){
        return "status-submitted";
      }

      if(
        normalized === "in_progress" ||
        normalized === "in-progress" ||
        normalized === "assigned" ||
        normalized === "accepted"
      ){
        return "status-progress";
      }

      return "status-open";
    }


    function isStatus(status){

      return (
        normalizeStatus(
          currentTask?.status
        ) === normalizeStatus(status)
      );
    }


    /* =========================
       USER / ROLE HELPERS
       ========================= */

    function isOwner(){

      return Boolean(
        currentUser &&
        currentTask &&
        currentTask.user_id &&
        currentUser.id ===
          currentTask.user_id
      );
    }


    function isRunner(){

      return Boolean(
        currentUser &&
        currentTask &&
        currentTask.runner_id &&
        currentUser.id ===
          currentTask.runner_id
      );
    }


    function isParticipant(){

      return (
        isOwner() ||
        isRunner()
      );
    }

function canApply(){

      if(!currentUser){
        return false;
      }

      if(isOwner()){
        return false;
      }

      if(isRunner()){
        return false;
      }

      if(
        !currentTask ||
        !isStatus("open")
      ){
        return false;
      }

      return true;
    }


    function canUseChat(){

      return Boolean(
        currentUser &&
        isParticipant()
      );
    }


    /* =========================
       LOADING UI
       ========================= */

    function showLoading(){

      page.innerHTML = `

        <div class="loading-state">

          <div class="skeleton skeleton-title"></div>

          <div class="skeleton skeleton-line"></div>

          <div class="skeleton skeleton-line short"></div>

          <div class="skeleton skeleton-card"></div>

          <div class="skeleton skeleton-line"></div>

          <div class="skeleton skeleton-line short"></div>

        </div>

      `;
    }


    function showError(
      title,
      message
    ){

      page.innerHTML = `

        <section class="state-card error">

          <div class="state-icon">
            ⚠️
          </div>

          <div class="state-title">
            ${escapeHtml(title)}
          </div>

          <div class="state-text">
            ${escapeHtml(message)}
          </div>

          <button
            type="button"
            class="btn btn-primary retry-button"
            onclick="initializePage()"
          >
            Try Again
          </button>

        </section>

      `;
    }


    function showNotFound(){

      page.innerHTML = `

        <section class="state-card">

          <div class="state-icon">
            🔎
          </div>

          <div class="state-title">
            Task not found
          </div>

          <div class="state-text">
            This task may have been deleted,
            or the task link is invalid.
          </div>

          <button
            type="button"
            class="btn btn-primary retry-button"
            onclick="window.location.href='index.html'"
          >
            Back Home
          </button>

        </section>

      `;
    }
/* =========================
       TOASTS
       ========================= */

    function showToast(
      message,
      type = ""
    ){

      if(!toastContainer){
        return;
      }

      const toast =
        document.createElement("div");

      toast.className =
        `toast ${type}`.trim();

      toast.textContent =
        String(message || "");

      toastContainer.appendChild(
        toast
      );

      window.setTimeout(() => {

        toast.style.opacity = "0";

        toast.style.transform =
          "translateY(8px)";

        window.setTimeout(() => {

          toast.remove();

        },180);

      },2800);
    }


    /* =========================
       MODAL
       ========================= */

    let modalAction = null;


    function openModal(
      title,
      text,
      confirmText,
      action,
      confirmClass = "btn-primary"
    ){

      modalTitle.textContent =
        title || "Confirm action";

      modalText.textContent =
        text || "Are you sure?";

      modalConfirmButton.textContent =
        confirmText || "Continue";

      modalConfirmButton.className =
        `btn ${confirmClass}`;

      modalAction =
        typeof action === "function"
          ? action
          : null;

      modalBackdrop.classList.add(
        "show"
      );

      document.body.style.overflow =
        "hidden";
    }


    function closeModal(){

      modalBackdrop.classList.remove(
        "show"
      );

      document.body.style.overflow =
        "";

      modalAction = null;
    }


    function closeModalFromBackdrop(
      event
    ){

      if(
        event.target ===
        modalBackdrop
      ){
        closeModal();
      }
    }


    async function confirmModal(){

      if(
        typeof modalAction !==
        "function"
      ){
        closeModal();
        return;
      }

      const action =
        modalAction;

      closeModal();

      try{

        await action();

      }catch(error){

        console.error(
          "MODAL ACTION:",
          error
        );

        showToast(
          error?.message ||
          "Something went wrong.",
          "error"
        );

      }
    }
/* =========================
       EVENT SETUP
       ========================= */

    modalConfirmButton.addEventListener(
      "click",
      confirmModal
    );


    document.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Escape" &&
          modalBackdrop.classList.contains(
            "show"
          )
        ){

          closeModal();

        }

      }
    );


    /* =========================
       SAFE IMAGE HANDLING
       ========================= */

    document.addEventListener(
      "error",
      event => {

        const target =
          event.target;

        if(
          target &&
          target.tagName === "IMG"
        ){

          target.style.display =
            "none";

        }

      },
      true
    );


    /* =========================
       INITIAL PAGE START
       ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        initializePage();

      }
    );

  </script>

</body>
