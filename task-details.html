<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const content=document.getElementById("content");
const dot=document.getElementById("dot");
const topStatus=document.getElementById("topStatus");

let currentUser=null;
let currentTask=null;
let myApplication=null;
let taskOwnerProfile=null;
let taskRunnerProfile=null;
let selectedRating=0;
let busy=false;
let chatChannel=null;
let taskMessages=[];
let taskReviews=[];
let pageReady=false;

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function money(value){
const amount=Number(value||0);
return "₦"+amount.toLocaleString("en-NG");
}

function dateText(value){
if(!value){
return "Not specified";
}

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "Not specified";
}

return date.toLocaleString(
"en-NG",
{
dateStyle:"medium",
timeStyle:"short"
}
);
}

function shortDate(value){
if(!value){
return "";
}

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return "";
}

return date.toLocaleDateString(
"en-NG",
{
day:"numeric",
month:"short",
year:"numeric"
}
);
}

function fileSize(bytes){

const size=Number(bytes||0);

if(!size){
return "";
}

if(size<1024){
return size+" B";
}

if(size<1048576){
return (size/1024).toFixed(1)+" KB";
}

return (size/1048576).toFixed(1)+" MB";
}

function statusLabel(status){

const labels={
open:"OPEN",
accepted:"ACCEPTED",
in_progress:"IN PROGRESS",
awaiting_verification:"AWAITING VERIFICATION",
completed:"COMPLETED",
rejected:"REJECTED",
cancelled:"CANCELLED",
pending:"PENDING",
selected:"SELECTED",
withdrawn:"WITHDRAWN"
};

return labels[status]||
String(status||"UNKNOWN").replace(/_/g," ").toUpperCase();
}

function statusText(status){

const messages={

open:
"This task is open for applications.",

accepted:
"A runner has been selected and can start the task.",

in_progress:
"The selected runner is currently working on the task.",

awaiting_verification:
"The runner submitted the task and is waiting for verification.",

completed:
"The owner approved the work. This task is completed.",

rejected:
"The owner rejected the submitted work.",

cancelled:
"This task has been cancelled."

};

return messages[status]||
"Task status information is unavailable.";

}

function statusClass(status){

const allowed=[
"open",
"accepted",
"in_progress",
"awaiting_verification",
"completed",
"rejected",
"cancelled",
"pending",
"selected",
"withdrawn"
];

return allowed.includes(status)
?"status-"+status
:"status-unknown";
}

function taskId(){

return new URLSearchParams(
location.search
).get("id");

}

function isOwner(){

return !!currentTask &&
!!currentUser &&
currentTask.user_id===currentUser.id;

}

function isRunner(){

return !!currentTask &&
!!currentUser &&
currentTask.runner_id===currentUser.id;

}

function participant(){

return isOwner()||isRunner();

}

function hasRunner(){

return !!currentTask?.runner_id;

}

function canApply(){

return !!currentUser &&
!!currentTask &&
!isOwner() &&
!hasRunner() &&
currentTask.status==="open" &&
(!myApplication||
["withdrawn"].includes(myApplication.status));

}

function canStartTask(){

return isRunner()&&
currentTask?.status==="accepted";

}

function canSubmitTask(){

return isRunner()&&
currentTask?.status==="in_progress";

}

function canApproveTask(){

return isOwner()&&
currentTask?.status==="awaiting_verification";

}

function canRejectTask(){

return isOwner()&&
currentTask?.status==="awaiting_verification";

}

function canCancelTask(){

return isOwner()&&
currentTask?.status==="open";

}

function canReview(){

return !!currentUser &&
!!currentTask &&
currentTask.status==="completed" &&
participant();

}

function getProfileName(profile){

return profile?.full_name||
profile?.username||
"OOULink User";

}

function getProfileUsername(profile){

if(!profile?.username){
return "";
}

return "@"+profile.username;

}

function avatarHtml(profile,className="avatar"){

const name=escapeHtml(
getProfileName(profile)
);

if(profile?.avatar_url){

return `
<img
class="${className}"
src="${escapeHtml(profile.avatar_url)}"
alt="${name}"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
>
<div
class="${className} avatar-fallback"
style="display:none"
aria-hidden="true"
>
👤
</div>
`;

}

return `
<div class="${className} avatar-fallback"
aria-label="${name}">
👤
</div>
`;

}

async function getCurrentUser(){

const {
data,
error
}=await supabaseClient.auth.getUser();

if(error){

console.error(
"AUTH USER:",
error
);

return null;
}

return data?.user||null;

}

async function loadTask(){

const id=taskId();

if(!id){

showError(
"Missing task",
"This page needs a task ID."
);

return false;
}

const {
data,
error
}=await supabaseClient
.from("tasks")
.select("*")
.eq("id",id)
.single();

if(error){

console.error(
"TASK LOAD:",
error
);

showError(
"Unable to load task",
error.message||
"The task could not be loaded."
);

return false;
}

if(!data){

showError(
"Task not found",
"This task may have been deleted."
);

return false;
}

currentTask=data;

return true;

}

async function loadProfiles(){

if(!currentTask){
return;
}

const profileIds=[];

if(currentTask.user_id){
profileIds.push(currentTask.user_id);
}

if(
currentTask.runner_id&&
!profileIds.includes(currentTask.runner_id)
){
profileIds.push(currentTask.runner_id);
}

if(!profileIds.length){
return;
}

const {
data,
error
}=await supabaseClient
.from("profiles")
.select(
"id,username,full_name,location,avatar_url,reputation,xp"
)
.in("id",profileIds);

if(error){

console.error(
"PROFILE LOAD:",
error
);

return;
}

for(const profile of data||[]){

if(profile.id===currentTask.user_id){
taskOwnerProfile=profile;
}

if(profile.id===currentTask.runner_id){
taskRunnerProfile=profile;
}

}

}

async function loadMyApplication(){

if(!currentUser||!currentTask){
return null;
}

const {
data,
error
}=await supabaseClient
.from("task_applications")
.select(
"id,task_id,runner_id,status,created_at,updated_at"
)
.eq("task_id",currentTask.id)
.eq("runner_id",currentUser.id)
.maybeSingle();

if(error){

console.error(
"APPLICATION:",
error
);

return null;
}

return data||null;

}

async function updateDot(){

if(!currentUser){
dot.style.display="none";
return;
}

const {
count,
error
}=await supabaseClient
.from("notifications")
.select(
"id",
{
count:"exact",
head:true
}

?"#166534"
:

:"#6b7280"
};

?"✓"

index+1

:"700"
};
color:${
state==="current"
?"#172033"
:"#667085"
};
">
${escapeHtml(step.label)}

function subscribeToChat(){

cleanupChatChannel();

if(!canUseChat()){
return;
}

chatChannel=
supabaseClient
.channel(
"task-chat-"+currentTask.id
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"task_messages",
filter:"task_id=eq."+currentTask.id
},
payload=>{

const incoming=
payload.new;

if(!incoming){
return;
}

if(
taskMessages.some(
message=>
String(message.id)===
String(incoming.id)
)
){
return;
}

taskMessages.push(
incoming
);

renderMessages();

}
)
.subscribe(
status=>{

if(status==="CHANNEL_ERROR"){
console.error(
"CHAT CHANNEL ERROR"
);
}

}
);

}

)

if(error){

);

alert(

"Could not send message."
);

busy=false;

if(sendButton){

sendButton.disabled=false;
sendButton.textContent="SEND";

}

return;

}

if(data){

!taskMessages.some(
item=>
String(item.id)===
String(data.id)
)
){

taskMessages.push(data);

}

}

input.value="";

busy=false;

if(sendButton){

sendButton.disabled=false;
sendButton.textContent="SEND";

}

renderMessages();

}

        Task found. Loading details...
      </div>
    `;

    await renderTask();

    try{
      currentUser=await getCurrentUser();
    }catch(error){
      console.error("AUTH:",error);
      currentUser=null;
    }

    if(currentUser){

      loadProfiles()
      .then(()=>{
        return renderTask();
      })
      .catch(error=>{
        console.error("PROFILE LOAD:",error);
      });

      loadMyApplication()
      .then(data=>{
        myApplication=data;
        return renderTask();
      })
      .catch(error=>{
        console.error("APPLICATION LOAD:",error);
      });

    }

    cleanupTaskRealtime();

    taskRealtimeChannel=
    setupRealtimeTaskUpdates();

    updateDot();

  }catch(error){

    console.error("PAGE INIT:",error);

    showError(
      "Task loading failed",
      error?.message||
      "OOULink could not load this task."
    );

  }

  }

window.addEventListener(
"beforeunload",
()=>{

cleanupChatChannel();
cleanupTaskRealtime();

}
);

document.addEventListener(
"visibilitychange",
()=>{

if(
document.visibilityState==="visible"&&
pageReady
){

updateDot();

}

}
);

initializePage();

</script>
</body>
</html>
