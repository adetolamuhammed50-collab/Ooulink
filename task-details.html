    .accept,

    /* =========================

    .bottom-nav {

    .bottom-nav a span {

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  const SUPABASE_URL =
    "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const content =
    document.getElementById("content");


  const notificationDot =
    document.getElementById(
      "notificationDot"
    );


  let currentTask = null;

  let currentUser = null;


  /* =========================
     ESCAPE HTML
     ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     FORMAT MONEY
     ========================= */

  function formatMoney(amount) {

    return "₦" +
      Number(amount).toLocaleString(
        "en-NG"
      );

  }


  /* =========================
     FORMAT DATE
     ========================= */

  function formatDate(date) {

    return new Date(date)
      .toLocaleString(
        "en-NG",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

  }


  /* =========================
     FORMAT FILE SIZE
     ========================= */

  function formatFileSize(bytes) {

    if (!bytes) {
      return "Unknown size";
    }


    if (bytes < 1024) {

      return bytes + " B";

    }


    if (bytes < 1024 * 1024) {

      return (
        (bytes / 1024).toFixed(1) +
        " KB"
      );

    }


    return (
      (bytes / (1024 * 1024)).toFixed(1) +
      " MB"
    );

  }


  /* =========================
     NOTIFICATION DOT
     ========================= */

  async function updateNotificationDot() {

    if (!currentUser) {
      return;
    }


    const {
      count,
      error
    } =
      await supabaseClient
        .from("notifications")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "is_read",
          false
        );


    if (error) {

      console.error(
        "NOTIFICATION DOT ERROR:",
        error
      );

      return;

    }


    notificationDot.style.display =
      count > 0
        ? "block"
        : "none";

  }


  /* =========================
     LOAD TASK FILES
     ========================= */

  async function loadTaskFiles(
    taskId
  ) {

    const filesContainer =
      document.getElementById(
        "taskFilesContainer"
      );


    if (!filesContainer) {
      return;
    }


    filesContainer.innerHTML = `
      <div class="files-loading">
        Loading files...
      </div>
    `;


    const {
      data: files,
      error
    } =
      await supabaseClient
        .from("task_attachments")
        .select(
          "id,file_name,file_path,file_size,mime_type,created_at"
        )
        .eq(
          "task_id",
          taskId
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "TASK FILES ERROR:",
        error
      );


      filesContainer.innerHTML = `
        <div class="file-error">
          We couldn't load the task files.
        </div>
      `;

      return;

    }


    if (!files || files.length === 0) {

      filesContainer.innerHTML = `
        <div class="no-files">
          No PDF files were attached to this task.
        </div>
      `;

      return;

    }


    filesContainer.innerHTML = "";


    for (const file of files) {

      const fileCard =
        document.createElement(
          "div"
        );


      fileCard.className =
        "file-card";


      fileCard.innerHTML = `

        <div class="file-top">

          <div class="pdf-icon">
            📄
          </div>

          <div class="file-info">

            <div class="file-name">
              ${escapeHtml(file.file_name)}
            </div>

            <div class="file-size">
              ${formatFileSize(file.file_size)}
            </div>

          </div>

        </div>

        <a
          href="#"
          class="file-button"
          data-file-id="${escapeHtml(file.id)}"
        >
          🔓 OPEN PDF
        </a>

      `;


      const button =
        fileCard.querySelector(
          ".file-button"
        );


      button.addEventListener(
        "click",
        async function(event) {

          event.preventDefault();


          button.textContent =
            "OPENING...";


          button.style.pointerEvents =
            "none";


          /*
            Create a temporary signed
            URL from the private bucket.
          */

          const {
            data,
            error:
              signedUrlError
          } =
            await supabaseClient.storage
              .from("TaskFiles")
              .createSignedUrl(
                file.file_path,
                60 * 10
              );


          if (
            signedUrlError ||
            !data?.signedUrl
          ) {

            console.error(
              "SIGNED URL ERROR:",
              signedUrlError
            );


            alert(
              "We couldn't open this PDF.\n\n" +
              (
                signedUrlError?.message ||
                "Access denied."
              )
            );


            button.textContent =
              "🔓 OPEN PDF";

            button.style.pointerEvents =
              "auto";


            return;

          }


          /*
            Open the temporary URL.
          */

          window.open(
            data.signedUrl,
            "_blank"
          );


          button.textContent =
            "🔓 OPEN PDF";

          button.style.pointerEvents =
            "auto";

        }
      );


      filesContainer.appendChild(
        fileCard
      );

    }

  }


  /* =========================
     LOAD TASK
     ========================= */

  async function loadTask() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const taskId =
      params.get("id");


    if (!taskId) {

      content.innerHTML =
        `
          <div class="error">
            Task not found.
          </div>
        `;

      return;

    }


    /* =========================
       CHECK LOGIN
       ========================= */

    const {
      data: sessionData
    } =
      await supabaseClient.auth
        .getSession();


    if (!sessionData.session) {

      window.location.href =
        "login.html?redirect=task-details.html?id=" +
        encodeURIComponent(
          taskId
        );

      return;

    }


    currentUser =
      sessionData.session.user;


    await updateNotificationDot();


    /* =========================
       LOAD TASK
       ========================= */

    const {
      data: task,
      error
    } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq(
          "id",
          taskId
        )
        .single();


    if (
      error ||
      !task
    ) {

      console.error(
        "TASK LOAD ERROR:",
        error
      );


      content.innerHTML = `

        <div class="error">

          We couldn't find this task.

          <br><br>

          <a href="find-tasks.html">
            ← Back to tasks
          </a>

        </div>

      `;

      return;

    }


    currentTask =
      task;


    /* =========================
       USER ROLES
       ========================= */

    const isOwner =
      task.user_id ===
      currentUser.id;


    const isRunner =
      task.runner_id ===
      currentUser.id;


    const isTaken =
      task.runner_id !== null;


    /*
      Only the task owner or
      assigned runner should be able
      to see/download private files.
    */

    const canAccessFiles =
      isOwner ||
      isRunner;


    /* =========================
       ACCEPT BUTTON
       ========================= */

    let buttonText =
      "ACCEPT TASK";


    let disabled =
      false;


    if (isOwner) {

      buttonText =
        "YOUR TASK";

      disabled =
        true;

    }


    if (
      isTaken &&
      !isOwner
    ) {

      buttonText =
        "TASK ALREADY ACCEPTED";

      disabled =
        true;

    }


    if (
      task.status ===
        "completed" ||
      task.status ===
        "cancelled"
    ) {

      buttonText =
        "TASK CLOSED";

      disabled =
        true;

    }


    /* =========================
       CHAT
       ========================= */

    const canChat =
      task.runner_id &&
      (
        isOwner ||
        isRunner
      );


    /* =========================
       RENDER
       ========================= */

    content.innerHTML = `

      <div class="category">
        ${escapeHtml(task.category)}
      </div>


      <h1>
        ${escapeHtml(task.title)}
      </h1>


      <div class="description">
        ${escapeHtml(task.description)}
      </div>


      <div class="budget">
        ${formatMoney(task.budget)}
      </div>


      <div class="info">


        <div class="info-row">

          <div class="label">
            📍 Location
          </div>

          <div class="value">
            ${escapeHtml(task.location)}
          </div>

        </div>


        <div class="info-row">

          <div class="label">
            ⏰ Deadline
          </div>

          <div class="value">
            ${formatDate(task.deadline)}
          </div>

        </div>


        <div class="info-row">

          <div class="label">
            📌 Status
          </div>

          <div class="value">
            ${escapeHtml(task.status)}
          </div>

        </div>


      </div>


      ${
        canAccessFiles
        ? `

          <div class="files-section">

            <div class="files-title">
              📎 Task Files
            </div>

            <div class="files-subtitle">
              PDF files attached to this task
            </div>

            <div id="taskFilesContainer">

              <div class="files-loading">
                Loading files...
              </div>

            </div>

          </div>

        `
        : ""
      }


      <button
        id="acceptButton"
        class="accept"
        onclick="acceptTask()"
        ${disabled ? "disabled" : ""}
      >
        ${buttonText}
      </button>


      ${
        canChat
        ? `

          <a
            href="chat.html?id=${encodeURIComponent(task.id)}"
            class="chat-btn"
          >

            💬 ${
              isOwner
              ? "CHAT WITH RUNNER"
              : "CHAT WITH POSTER"
            }

          </a>

        `
        : ""
      }


      <a
        href="#"
        class="report"
        onclick="reportTask(event)"
      >
        Report this task
      </a>

    `;


    /*
      Load files only after the
      task UI has been rendered.
    */

    if (canAccessFiles) {

      await loadTaskFiles(
        task.id
      );

    }

  }


  /* =========================
     ACCEPT TASK
     ========================= */

  async function acceptTask() {

    if (
      !currentTask ||
      !currentUser
    ) {

      return;

    }


    if (
      currentTask.user_id ===
      currentUser.id
    ) {

      alert(
        "You cannot accept your own task."
      );

      return;

    }


    if (
      currentTask.runner_id
    ) {

      alert(
        "This task has already been accepted."
      );

      return;

    }


    if (
      currentTask.status !==
      "open"
    ) {

      alert(
        "This task is no longer available."
      );

      return;

    }


    const button =
      document.getElementById(
        "acceptButton"
      );


    button.disabled =
      true;


    button.textContent =
      "ACCEPTING...";


    /* =========================
       CLAIM TASK
       ========================= */

    const {
      data: updatedTask,
      error: updateError
    } =
      await supabaseClient
        .from("tasks")
        .update({

          runner_id:
            currentUser.id,

          status:
            "accepted"

        })
        .eq(
          "id",
          currentTask.id
        )
        .eq(
          "status",
          "open"
        )
        .is(
          "runner_id",
          null
        )
        .select()
        .single();


    if (
      updateError ||
      !updatedTask
    ) {

      console.error(
        "ACCEPT TASK ERROR:",
        updateError
      );


      button.disabled =
        false;


      button.textContent =
        "ACCEPT TASK";


      alert(

        "Accept failed:\n\n" +

        (
          updateError?.message ||
          "The task could not be accepted."
        ) +

        "\n\nCode: " +

        (
          updateError?.code ||
          "unknown"
        )

      );


      return;

    }


    currentTask =
      updatedTask;


    /* =========================
       NOTIFY OWNER
       ===currentTask.status
