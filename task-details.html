/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatMoney(amount) {

  return "₦" +
    Number(amount)
      .toLocaleString("en-NG");
}


function formatDate(date) {

  return new Date(date)
    .toLocaleString(
      "en-NG",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
}


function formatFileSize(bytes) {

  if (!bytes) return "";

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {
    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );
  }

  return (
    (bytes / (1024 * 1024)).toFixed(1) +
    " MB"
  );
}


function getTaskId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");
}


function setRating(rating) {

  selectedRating = rating;

  const buttons =
    document.querySelectorAll(
      "#starRating button"
    );

  buttons.forEach(
    (button, index) => {

      button.textContent =
        index < rating
          ? "★"
          : "☆";
    }
  );
}


/* =========================
   NOTIFICATION DOT
========================= */

async function updateNotificationDot() {

  if (!currentUser) return;

  const {
    count,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select(
        "id",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "is_read",
        false
      );

  if (error) {

    console.error(
      "Notification dot error:",
      error
    );

    return;
  }

  notificationDot.style.display =
    count > 0
      ? "block"
      : "none";
}


/* =========================
   LOAD TASK FILES
========================= */

async function loadTaskFiles(
  taskId
) {

  const filesSection =
    document.getElementById(
      "filesSection"
    );

  if (!filesSection) return;

  filesSection.innerHTML = `
    <div class="files-title">
      📎 Task Files
    </div>

    <div class="files-note">
      Loading attached PDF files...
    </div>
  `;

  const {
    data: files,
    error
  } =
    await supabaseClient
      .from(
        "task_attachments"
      )
      .select(`
        id,
        file_name,
        file_path,
        file_size,
        mime_type,
        created_at
      `)
      .eq(
        "task_id",
        taskId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {

    console.error(
      "TASK FILES ERROR:",
      error
    );

    filesSection.innerHTML = `
      <div class="files-title">
        📎 Task Files
      </div>

      <div class="no-files">
        Unable to load the attached files.
      </div>
    `;

    return;
  }

  if (
    !files ||
    files.length === 0
  ) {

    filesSection.innerHTML = `
      <div class="files-title">
        📎 Task Files
      </div>

      <div class="no-files">
        No PDF files were attached to this task.
      </div>
    `;

    return;
  }

  let html = `
    <div class="files-title">
      📎 Task Files
    </div>

    <div class="files-note">
      PDF files attached to this task.
    </div>
  `;

  for (
    const file of files
  ) {

    const {
      data: signedData,
      error: signedError
    } =
      await supabaseClient
        .storage
        .from("TaskFiles")
        .createSignedUrl(
          file.file_path,
          60 * 10
        );

    if (
      signedError ||
      !signedData?.signedUrl
    ) {

      html += `
        <div class="file-card">

          <div class="pdf-icon">
            📄
          </div>

          <div class="file-info">

            <div class="file-name">
              ${escapeHtml(
                file.file_name
              )}
            </div>

            <div class="file-size">
              File unavailable
            </div>

          </div>

        </div>
      `;

      continue;
    }

    html += `
      <div class="file-card">

        <div class="pdf-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(
              file.file_name
            )}
          </div>

          <div class="file-size">
            PDF
            ${
              file.file_size
                ? " • " +
                  formatFileSize(
                    file.file_size
                  )
                : ""
            }
          </div>

        </div>

        <a
          class="file-button"
          href="${escapeHtml(
            signedData.signedUrl
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          VIEW PDF
        </a>

      </div>
    `;
  }

  filesSection.innerHTML =
    html;
}

   APPLICANT PROFILE
========================= */

async function getApplicantProfile(
  userId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        full_name,
        location,
        avatar_url,
        reputation,
        xp
      `)
      .eq(
        "id",
        userId
      )
      .maybeSingle();

  if (error) {

    console.error(
      "APPLICANT PROFILE ERROR:",
      error
    );

    return null;
  }

  return data;
}

    /* =========================

async function startTask() {
  if (!currentTask || !currentUser) return;

  if (currentTask.runner_id !== currentUser.id) {
    alert("Only the selected runner can start this task.");
    return;
  }

  if (currentTask.status !== "accepted") {
    alert("This task cannot be started right now.");
    return;
  }

  const button =
    document.getElementById("startButton");

  if (button) {
    button.disabled = true;
    button.textContent = "STARTING...";
  }

  const { data: updatedTask, error } =
    await supabaseClient
      .from("tasks")
      .update({
        status: "in_progress"
      })
      .eq("id", currentTask.id)
      .eq("runner_id", currentUser.id)
      .eq("status", "accepted")
      .select()
      .single();

  if (error || !updatedTask) {
    console.error(
      "START TASK ERROR:",
      error
    );

    if (button) {
      button.disabled = false;
      button.textContent = "▶ START TASK";
    }

    alert(
      "Could not start the task.\n\n" +
      (error?.message || "Please try again.")
    );

    return;
  }

  currentTask = updatedTask;

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentTask.user_id,
      task_id: currentTask.id,
      type: "task_in_progress",
      title: "Task started",
      message:
        `The selected runner has started "${currentTask.title}".`
    });

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_in_progress",
      title: "Task started",
      message:
        `You started "${currentTask.title}".`

/* =========================
   REJECT TASK
========================= */

async function rejectTask() {
  if (!currentTask || !currentUser) return;

  if (currentTask.user_id !== currentUser.id) {
    alert(
      "Only the task owner can reject this task."
    );
    return;
  }

  if (currentTask.status !== "awaiting_verification") {
    alert(
      "This task is not awaiting verification."
    );
    return;
  }

  const noteInput =
    document.getElementById("rejectionNote");

  const rejectionNote =
    noteInput?.value.trim() || "";

  if (!rejectionNote) {
    alert(
      "Please provide a reason for rejecting the task."
    );

    noteInput?.focus();

    return;
  }

  if (rejectionNote.length > 500) {
    alert(
      "Please keep the rejection reason under 500 characters."
    );

    return;
  }

  const button =
    document.getElementById("rejectButton");

  const confirmButton =
    document.querySelector(
      "#rejectBox button"
    );

  if (button) {
    button.disabled = true;
  }

  if (confirmButton) {
    confirmButton.disabled = true;
    confirmButton.textContent =
      "REJECTING...";
  }

  const { data: updatedTask, error } =
    await supabaseClient
      .from("tasks")
      .update({
        status: "rejected",
        rejection_note: rejectionNote
      })
      .eq("id", currentTask.id)
      .eq("user_id", currentUser.id)
      .eq("status", "awaiting_verification")
      .select()
      .single();

  if (error || !updatedTask) {
    console.error(
      "REJECT TASK ERROR:",
      error
    );

    if (button) {
      button.disabled = false;
    }

    if (confirmButton) {
      confirmButton.disabled = false;
      confirmButton.textContent =
        "CONFIRM REJECTION";
    }

    alert(
      "Could not reject the task.\n\n" +
      (error?.message || "Please try again.")
    );

    return;
  }

  currentTask = updatedTask;

  if (currentTask.runner_id) {
    await supabaseClient
      .from("notifications")
      .insert({
        user_id: currentTask.runner_id,
        task_id: currentTask.id,
        type: "task_rejected",
        title: "Task rejected",
        message:
          `The owner rejected "${currentTask.title}". Reason: ${rejectionNote}`
      });
  }

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_rejected",
      title: "Task rejected",
      message:
        `You rejected "${currentTask.title}".`
    });

  alert(
    "Task rejected. The task is now closed."
  );

  window.location.reload();
}

========================= */

async function loadTaskReviews(taskId) {
  const reviewList =
    document.getElementById("taskReviewList");

  if (!reviewList) return;

  reviewList.innerHTML =
    '<div style="color:#777;font-size:13px;">Loading reviews...</div>';

  const { data: reviews, error } =
    await supabaseClient
      .from("reviews")
      .select(`
        id,
        reviewer_id,
        reviewee_id,
        rating,
        note,
        created_at
      `)
      .eq("task_id", taskId)
      .order("created_at", {
        ascending: false
      });

  if (error) {
    console.error(
      "TASK REVIEWS ERROR:",
      error
    );

    reviewList.innerHTML =
      '<div style="color:#777;font-size:13px;">Unable to load reviews.</div>';

    return;
  }

  if (!reviews || reviews.length === 0) {
    reviewList.innerHTML =
      '<div style="color:#777;font-size:13px;">No reviews yet.</div>';

    return;
  }

  const ids = [
    ...new Set(
      reviews.flatMap(review => [
        review.reviewer_id,
        review.reviewee_id
      ])
    )
  ];

  const { data: profiles } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,full_name,avatar_url"
      )
      .in("id", ids);

  const profileMap = {};

  (profiles || []).forEach(profile => {
    profileMap[profile.id] = profile;
  });

  let html = "";

  reviews.forEach(review => {
    const reviewer =
      profileMap[review.reviewer_id];

    const reviewerName =
      reviewer?.full_name ||
      reviewer?.username ||
      "OOULink User";

    const safeName =
      escapeHtml(reviewerName);

    const safeNote =
      escapeHtml(review.note || "");

    const stars =
      "★".repeat(
        Math.max(
          0,
          Math.min(5, Number(review.rating))
        )
      );

    const emptyStars =
      "☆".repeat(
        5 -
        Math.max(
          0,
          Math.min(5, Number(review.rating))
        )
      );

    html += `
      <div
        style="
          background:#fff;
          border:1px solid #e5e7eb;
          border-radius:12px;
          padding:12px;
          margin-top:10px;
        "
      >
        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:10px;
          "
        >
          <strong>
            ${safeName}
          </strong>

          <span
            style="
              color:#f59e0b;
              white-space:nowrap;
            "
          >
            ${stars}${emptyStars}
          </span>
        </div>

        ${
          safeNote
          ? `
            <div
              style="
                margin-top:8px;
                color:#5d6678;
                line-height:1.5;
                font-size:13px;
              "
            >
              ${safeNote}
            </div>
          `
          : ""
        }

        <div
          style="
            margin-top:8px;
            color:#9299a7;
            font-size:11px;
          "
        >
          ${formatDate(review.created_at)}
        </div>
      </div>
    `;
  });

  reviewList.innerHTML = html;
}

/* =========================
   TASK STATUS LABEL
========================= */

function getStatusLabel(status) {
  const labels = {
    open: "OPEN",
    accepted: "ACCEPTED",
    in_progress: "IN PROGRESS",
    awaiting_verification:
      "AWAITING VERIFICATION",
    completed: "COMPLETED",
    rejected: "REJECTED",
    cancelled: "CANCELLED"
  };

  return labels[status] || status;
}


/* =========================
   STATUS DESCRIPTION
========================= */

function getStatusDescription(task) {
  if (!task) return "";

  switch (task.status) {
    case "open":
      return "This task is open for applications.";

    case "accepted":
      return "A runner has been selected. The task can now be started.";

    case "in_progress":
      return "The selected runner is currently working on this task.";

    case "awaiting_verification":
      return "The runner has submitted the task and is waiting for the owner's verification.";

    case "completed":
      return "The owner approved the work. This task is completed.";

    case "rejected":
      return "The owner rejected the submitted work. This task is closed.";

    case "cancelled":
      return "This task has been cancelled.";

    default:
      return "";
  }
}

/* =========================
   APPLICATION ACTION
========================= */

async function handleApplicationAction() {
  if (!currentTask || !currentUser) {
    return;
  }

  if (
    currentTask.user_id ===
    currentUser.id
  ) {
    return;
  }

  const existingApplication =
    await getMyApplication(
      currentTask.id
    );

  if (
    existingApplication?.status ===
    "pending"
  ) {
    await withdrawApplication(
      existingApplication.id
    );

    return;
  }

  if (
    existingApplication?.status ===
    "withdrawn"
  ) {
    await applyForTask();

    return;
  }

  if (
    existingApplication?.status ===
    "rejected"
  ) {
    alert(
      "Your previous application was not selected for this task."
    );

    return;
  }

  if (
    currentTask.status !== "open" ||
    currentTask.runner_id
  ) {
    alert(
      "This task is no longer accepting applications."
    );

    return;
  }

  await applyForTask();
}

          )}
        </div>
      `
      : ""
    }

    ${actionHtml}

    ${
      canChat
      ? `
        <a
          href="chat.html?id=${encodeURIComponent(
            task.id
          )}"
          class="chat-btn"
        >
          💬 ${
            isOwner
            ? "CHAT WITH RUNNER"
            : "CHAT WITH POSTER"
          }
        </a>
      `
      : ""
    }

    ${
      canViewFiles
      ? `
        <div
          id="filesSection"
          class="files-section"
        >
          <div class="files-title">
            📎 Task Files
          </div>

          <div class="files-note">
            Loading attached PDF files...
          </div>
        </div>
      `
      : ""
    }

    ${
      task.status === "completed" ||
      task.status === "rejected"
      ? `
        <div
          style="
            margin-top:22px;
            padding-top:18px;
            border-top:1px solid #edf0f4;
          "
        >
          <div
            style="
              font-size:18px;
              font-weight:800;
              margin-bottom:5px;
            "
          >
            ⭐ Reviews
          </div>

          <div
            id="taskReviewList"
          >
            Loading reviews...
          </div>
        </div>
      `
      : ""
    }

    ${
      (
        task.status === "completed" ||
        task.status === "rejected"
      ) &&
      isParticipant
      ? `
        <div
          id="reviewSection"
          style="
            margin-top:20px;
            padding:16px;
            border-radius:12px;
            background:#f8fafc;
          "
        >
          <h3 style="margin-top:0;">
            ⭐ Leave a Review
          </h3>

          <p
            style="
              font-size:14px;
              color:#666;
              margin-top:6px;
            "
          >
            How was your experience with this person?
          </p>

          <div
            id="starRating"
            style="
              display:flex;
              gap:8px;
              font-size:30px;
              margin:12px 0;
            "
          >
            <button
              type="button"
              onclick="setRating(1)"
            >
              ☆
            </button>

            <button
              type="button"
              onclick="setRating(2)"
            >
              ☆
            </button>

            <button
              type="button"
              onclick="setRating(3)"
            >
              ☆
            </button>

            <button
              type="button"
              onclick="setRating(4)"
            >
              ☆
            </button>

            <button
              type="button"
              onclick="setRating(5)"
            >
              ☆
            </button>
          </div>

          <textarea
            id="reviewNote"
            maxlength="500"
            placeholder="Optional note about your experience..."
            style="
              width:100%;
              min-height:90px;
              padding:10px;
              border:1px solid #ddd;
              border-radius:8px;
              resize:vertical;
            "
          ></textarea>

          <button
            id="submitReviewButton"
            class="accept"
            onclick="submitReview()"
            style="
              margin-top:10px;
              background:#16834b;
            "
          >
            ⭐ SUBMIT REVIEW
          </button>
        </div>
      `
      : ""
    }

    <a
      href="#"
      class="report"
      onclick="reportTask(event)"
    >
      Report this task
    </a>
  `;

  if (canViewFiles) {
    await loadTaskFiles(
      task.id
    );
  }

  if (
    isOwner &&
    task.status === "open" &&
    !task.runner_id
  ) {
    await loadApplicants(
      task.id
    );
  }

  if (
    task.status === "completed" ||
    task.status === "rejected"
  ) {
    await loadTaskReviews(
      task.id
    );
  }
}


/* =========================
   INITIALIZE PAGE
========================= */

loadTask();
