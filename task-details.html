<script>

const SUPABASE_URL =

/* =========================
   HELPERS
========================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatMoney(amount) {
  return "₦" +
    Number(amount).toLocaleString("en-NG");
}


function formatDate(date) {
  return new Date(date).toLocaleString("en-NG", {
    dateStyle: "medium",
    timeStyle: "short"
  });
}


function formatFileSize(bytes) {

  if (!bytes) return "";

  if (bytes < 1024)
    return bytes + " B";

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}


/* =========================
   NOTIFICATION DOT
========================= */

async function updateNotificationDot() {

  if (!currentUser) return;

  const { count, error } =
    await supabaseClient
      .from("notifications")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("user_id", currentUser.id)
      .eq("is_read", false);

  if (error) {
    console.error(
      "Notification dot error:",
      error
    );
    return;
  }

  notificationDot.style.display =
    count > 0 ? "block" : "none";
}


/* =========================
   LOAD TASK FILES
========================= */

async function loadTaskFiles(taskId) {

  const filesSection =
    document.getElementById("filesSection");

  if (!filesSection) return;

  filesSection.innerHTML = `
    <div class="files-title">
      📎 Task Files
    </div>

    <div class="files-note">
      Loading attached PDF files...
    </div>
  `;


  const { data: files, error } =
    await supabaseClient
      .from("task_attachments")
      .select(`
        id,
        file_name,
        file_path,
        file_size,
        mime_type,
        created_at
      `)
      .eq("task_id", taskId)
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "TASK FILES ERROR:",
      error
    );

    filesSection.innerHTML = `
      <div class="files-title">
        📎 Task Files
      </div>

      <div class="no-files">
        Unable to load the attached files.
      </div>
    `;

    return;
  }


  if (!files || files.length === 0) {

    filesSection.innerHTML = `
      <div class="files-title">
        📎 Task Files
      </div>

      <div class="no-files">
        No PDF files were attached to this task.
      </div>
    `;

    return;
  }


  let html = `
    <div class="files-title">
      📎 Task Files
    </div>

    <div class="files-note">
      PDF files attached to this task.
    </div>
  `;


  for (const file of files) {

    const { data: signedData, error: signedError } =
      await supabaseClient.storage
        .from("TaskFiles")
        .createSignedUrl(
          file.file_path,
          60 * 10
        );


    if (signedError || !signedData?.signedUrl) {

      console.error(
        "SIGNED URL ERROR:",
        signedError
      );

      html += `
        <div class="file-card">

          <div class="pdf-icon">
            📄
          </div>

          <div class="file-info">

            <div class="file-name">
              ${escapeHtml(file.file_name)}
            </div>

            <div class="file-size">
              File unavailable
            </div>

          </div>

        </div>
      `;

      continue;
    }


    html += `
      <div class="file-card">

        <div class="pdf-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.file_name)}
          </div>

          <div class="file-size">
            PDF
            ${file.file_size
              ? " • " + formatFileSize(file.file_size)
              : ""}
          </div>

        </div>

        <a
          class="file-button"
          href="${escapeHtml(signedData.signedUrl)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          VIEW PDF
        </a>

      </div>
    `;
  }


  filesSection.innerHTML = html;
}


/* =========================
   LOAD TASK
========================= */

async function loadTask() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const taskId =
    params.get("id");


  if (!taskId) {

    content.innerHTML =
      '<div class="error">Task not found.</div>';

    return;
  }


  const { data: sessionData } =
    await supabaseClient.auth.getSession();


  if (!sessionData.session) {

    window.location.href =
      "login.html?redirect=task-details.html?id=" +
      encodeURIComponent(taskId);

    return;
  }


  currentUser =
    sessionData.session.user;


  await updateNotificationDot();


  const { data: task, error } =
    await supabaseClient
      .from("tasks")
      .select("*")
      .eq("id", taskId)
      .single();


  if (error || !task) {

    console.error(
      "TASK LOAD ERROR:",
      error
    );

    content.innerHTML = `
      <div class="error">

        We couldn't find this task.

        <br><br>

        <a href="find-tasks.html">
          ← Back to tasks
        </a>

      </div>
    `;

    return;
  }


  currentTask = task;


  const isOwner =
    task.user_id === currentUser.id;

  const isRunner =
    task.runner_id === currentUser.id;

  const isTaken =
    task.runner_id !== null;


  let buttonText =
    "ACCEPT TASK";

  let disabled = false;


  if (isOwner) {

    buttonText = "YOUR TASK";
    disabled = true;

  }


  if (isTaken && !isOwner) {

    buttonText =
      "TASK ALREADY ACCEPTED";

    disabled = true;

  }


  if (
    task.status === "completed" ||
    task.status === "cancelled"
  ) {

    buttonText = "TASK CLOSED";
    disabled = true;

  }


  const canChat =
    task.runner_id &&
    (isOwner || isRunner);


  /*
   * Only the task owner and accepted runner
   * can see the private task files.
   */

  const canViewFiles =
    isOwner || isRunner;


  content.innerHTML = `

    <div class="category">
      ${escapeHtml(task.category)}
    </div>

    <h1>
      ${escapeHtml(task.title)}
    </h1>

    <div class="description">
      ${escapeHtml(task.description)}
    </div>

    <div class="budget">
      ${formatMoney(task.budget)}
    </div>

    <div class="info">

      <div class="info-row">

        <div class="label">
          📍 Location
        </div>

        <div class="value">
          ${escapeHtml(task.location)}
        </div>

      </div>


      <div class="info-row">

        <div class="label">
          ⏰ Deadline
        </div>

        <div class="value">
          ${formatDate(task.deadline)}
        </div>

      </div>


      <div class="info-row">

        <div class="label">
          📌 Status
        </div>

        <div class="value">
          ${escapeHtml(task.status)}
        </div>

      </div>

    </div>


    <button
      id="acceptButton"
      class="accept"
      onclick="acceptTask()"
      ${disabled ? "disabled" : ""}
    >
      ${buttonText}
    </button>
${
  isRunner && task.status === "in_progress"
  ? `
    <button
      id="verifyButton"
      class="accept"
      onclick="submitForVerification()"
      style="margin-top:10px;background:#f59e0b;"
    >
      📤 SUBMIT FOR VERIFICATION
    </button>
  `
  : ""
}

    ${
      isRunner && task.status === "accepted"
      ? `
        <button
          id="startButton"
          class="accept"
          onclick="startTask()"
          style="margin-top:10px;background:#16834b;"
        >
          ▶ START TASK
        </button>
      `
      : ""
    }
${
  isOwner && task.status === "awaiting_verification"
  ? `
    <button
      id="approveButton"
      class="accept"
      onclick="approveTask()"
      style="margin-top:10px;background:#16834b;"
    >
      ✅ APPROVE & COMPLETE
    </button>

    <button
      id="rejectButton"
      class="accept"
      onclick="showRejectBox()"
      style="margin-top:10px;background:#dc2626;"
    >
      ❌ REJECT TASK
    </button>

    <div
      id="rejectBox"
      style="display:none;margin-top:10px;"
    >
      <textarea
        id="rejectionNote"
        placeholder="Explain why you are rejecting this task..."
        style="width:100%;min-height:90px;padding:10px;border:1px solid #ccc;border-radius:8px;"
      ></textarea>

      <button
        class="accept"
        onclick="rejectTask()"
        style="margin-top:10px;background:#dc2626;"
      >
        CONFIRM REJECTION
      </button>
    </div>
  `
  : ""
}

    ${
      canChat
      ? `
        <a
          href="chat.html?id=${encodeURIComponent(task.id)}"
          class="chat-btn"
        >
          💬 ${
            isOwner
            ? "CHAT WITH RUNNER"
            : "CHAT WITH POSTER"
          }
        </a>
      `
      : ""
    }


    ${
      canViewFiles
      ? `
        <div
          id="filesSection"
          class="files-section"
        >
          <div class="files-title">
            📎 Task Files
          </div>

          <div class="files-note">
            Loading attached PDF files...
          </div>
        </div>
      `
      : ""
    }

<!-- =========================
     REVIEWS
========================= -->
${
  (
    (task.status === "completed" || task.status === "rejected") &&
    (task.user_id === currentUser.id || task.runner_id === currentUser.id)
  )
  ? `
    <div
      id="reviewSection"
      style="margin-top:20px;padding:16px;border-radius:12px;background:#f8fafc;"
    >
      <h3 style="margin-top:0;">⭐ Leave a Review</h3>

      <p style="font-size:14px;color:#666;">
        How was your experience with this person?

      <div
        id="starRating"

        <button type="button" onclick="setRating(1)">☆</button>
        <button type="button" onclick="setRating(2)">☆</button>

      <textarea

      <button

      >
        ⭐ SUBMIT REVIEW

      ${
        task.status === "rejected"
        ? `

            class="accept"
            onclick="showReportBox()"
            style="margin-top:10px;background:#dc2626;"
          >
            🚩 REPORT
          </button>

  `

}
    <a

  if (canViewFiles) {

/* =========================
   ACCEPT TASK
========================= */

async function acceptTask() {

  if (!currentTask || !currentUser)
    return;


  if (currentTask.user_id === currentUser.id) {

    alert(
      "You cannot accept your own task."
    );

    return;
  }


  if (currentTask.runner_id) {

    alert(
      "This task has already been accepted."
    );

    return;
  }


  if (currentTask.status !== "open") {

    alert(
      "This task is no longer available."
    );

    return;
  }


  const button =
    document.getElementById(
      "acceptButton"
    );


  button.disabled = true;

  button.textContent =
    "ACCEPTING...";


  const { data: updatedTask, error: updateError } =
    await supabaseClient
      .from("tasks")
      .update({
        runner_id: currentUser.id,
        status: "accepted"
      })
      .eq("id", currentTask.id)
      .eq("status", "open")
      .is("runner_id", null)
      .select()
      .single();


  if (updateError || !updatedTask) {

    console.error(
      "ACCEPT TASK ERROR:",
      updateError
    );

    button.disabled = false;

    button.textContent =
      "ACCEPT TASK";

    alert(
      "Accept failed:\n\n" +
      (
        updateError?.message ||
        "The task could not be accepted."
      )
    );

    return;
  }


  currentTask =
    updatedTask;


  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentTask.user_id,
      task_id: currentTask.id,
      type: "task_accepted",
      title: "Task accepted",
      message:
        `Someone accepted your task "${currentTask.title}".`
    });


  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_accepted",
      title: "Task accepted",
      message:
        `You accepted "${currentTask.title}".`
    });


  alert(
    "Task accepted successfully! 🚀"
  );


  window.location.reload();
}

/* =========================
   START TASK
========================= */

async function startTask() {

  if (!currentTask || !currentUser)
    return;

  if (currentTask.runner_id !== currentUser.id) {
    alert("Only the accepted runner can start this task.");
    return;
  }

  if (currentTask.status !== "accepted") {
    alert("This task cannot be started right now.");
    return;
  }

  const button =
    document.getElementById("startButton");

  if (button) {
    button.disabled = true;
    button.textContent = "STARTING...";
  }

  const { data: updatedTask, error } =
    await supabaseClient
      .from("tasks")
      .update({
        status: "in_progress"
      })
      .eq("id", currentTask.id)
      .eq("runner_id", currentUser.id)
      .eq("status", "accepted")
      .select()
      .single();

  if (error || !updatedTask) {

    console.error(
      "START TASK ERROR:",
      error
    );

    if (button) {
      button.disabled = false;
      button.textContent = "▶ START TASK";
    }

    alert(
      "Could not start the task.\n\n" +
      (error?.message || "Please try again.")
    );

    return;
  }

  currentTask = updatedTask;

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentTask.user_id,
      task_id: currentTask.id,
      type: "task_in_progress",
      title: "Task in progress",
      message:
        `The runner has started "${currentTask.title}".`
    });

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_in_progress",
      title: "Task in progress",
      message:
        `You started "${currentTask.title}".`
    });

  alert("Task is now in progress! 🚀");

  window.location.reload();
}
async function submitForVerification() {

  if (!currentTask || !currentUser) return;

  if (currentTask.runner_id !== currentUser.id) {
    alert("Only the assigned runner can submit this task.");
    return;
  }

  if (currentTask.status !== "in_progress") {
    alert("This task is not ready for verification.");
    return;
  }

  const button = document.getElementById("verifyButton");

  if (button) {
    button.disabled = true;
    button.textContent = "SUBMITTING...";
  }

  const { data: updatedTask, error } =
    await supabaseClient
      .from("tasks")
      .update({
        status: "awaiting_verification"
      })
      .eq("id", currentTask.id)
      .eq("runner_id", currentUser.id)
      .eq("status", "in_progress")
      .select()
      .single();

  if (error || !updatedTask) {

    console.error("VERIFICATION ERROR:", error);

    if (button) {
      button.disabled = false;
      button.textContent = "📤 SUBMIT FOR VERIFICATION";
    }

    alert(
      "Could not submit for verification.\n\n" +
      (error?.message || "Please try again.")
    );

    return;
  }

  currentTask = updatedTask;

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentTask.user_id,
      task_id: currentTask.id,
      type: "task_verification",
      title: "Task ready for verification",
      message:
        `The runner submitted "${currentTask.title}" for your verification.`
    });

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_verification",
      title: "Task submitted",
      message:
        `You submitted "${currentTask.title}" for verification.`
    });

  alert("Task submitted for verification! 📤");

  window.location.reload();
}
/* =========================

/* =========================
   SHOW REJECT BOX
========================= */

function showRejectBox() {

  const box =
    document.getElementById("rejectBox");

  if (!box) return;

  box.style.display = "block";

  const note =
    document.getElementById("rejectionNote");

  if (note) {
    note.focus();
  }
}


/* =========================
   REJECT TASK
========================= */

async function rejectTask() {

  if (!currentTask || !currentUser)
    return;

  if (currentTask.user_id !== currentUser.id) {
    alert("Only the task owner can reject this task.");
    return;
  }

  if (currentTask.status !== "awaiting_verification") {
    alert("This task is not awaiting verification.");
    return;
  }

  const noteInput =
    document.getElementById("rejectionNote");

  const rejectionNote =
    noteInput?.value.trim() || "";

  if (!rejectionNote) {
    alert("Please provide a rejection reason.");
    noteInput?.focus();
    return;
  }

  const button =
    document.getElementById("rejectButton");

  const confirmButton =
    document.querySelector(
      "#rejectBox button"
    );

  if (button) {
    button.disabled = true;
  }

  if (confirmButton) {
    confirmButton.disabled = true;
    confirmButton.textContent = "REJECTING...";
  }

  const { data: updatedTask, error } =
    await supabaseClient
      .from("tasks")
      .update({
        status: "rejected",
        rejection_note: rejectionNote
      })
      .eq("id", currentTask.id)
      .eq("user_id", currentUser.id)
      .eq("status", "awaiting_verification")
      .select()
      .single();

  if (error || !updatedTask) {

    console.error(
      "REJECT TASK ERROR:",
      error
    );

    if (button) {
      button.disabled = false;
    }

    if (confirmButton) {
      confirmButton.disabled = false;
      confirmButton.textContent = "CONFIRM REJECTION";
    }

    alert(
      "Could not reject the task.\n\n" +
      (error?.message || "Please try again.")
    );

    return;
  }

  currentTask = updatedTask;

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentTask.runner_id,
      task_id: currentTask.id,
      type: "task_rejected",
      title: "Task rejected",
      message:
        `The owner rejected "${currentTask.title}". Reason: ${rejectionNote}`
    });

  await supabaseClient
    .from("notifications")
    .insert({
      user_id: currentUser.id,
      task_id: currentTask.id,
      type: "task_rejected",
      title: "Task rejected",
      message:
        `You rejected "${currentTask.title}".`
    });

  alert("Task rejected. The chat is now closed.");

  window.location.reload();
}
