name: Integrate application form
on:
  push:
    paths:
      - application-form.js
      - .github/workflows/integrate-application-form.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject application form script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('task-details.html')
          s=p.read_text()
          tag='<script src="application-form.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add task-details.html
          git diff --cached --quiet || git commit -m 'Integrate enhanced application form'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/integrate-application-form.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary application integration workflow'
          git push