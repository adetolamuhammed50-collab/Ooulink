name: Integrate Recently Viewed Tasks

on:
  push:
    paths:
      - '.github/workflows/integrate-recent-tasks.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate recently viewed tracking
        run: |
          python - <<'PY'
          from pathlib import Path

          task_file = Path("task-details.html")
          task_text = task_file.read_text(encoding="utf-8")

          marker = "/* recently-viewed-integration */"
          if marker not in task_text:
              function = '''
          /* recently-viewed-integration */
          function recordRecentlyViewedTask(taskId) {
              if (!taskId) return;
              const key = "studtask_recent_tasks";
              const maxItems = 20;
              try {
                  const saved = JSON.parse(localStorage.getItem(key) || "[]");
                  const ids = Array.isArray(saved) ? saved.filter(item => typeof item === "string") : [];
                  const updated = [taskId, ...ids.filter(id => id !== taskId)].slice(0, maxItems);
                  localStorage.setItem(key, JSON.stringify(updated));
              } catch (error) {
                  console.warn("Could not save recently viewed task.", error);
              }
          }

          '''
              anchor = "async function loadTask(){"
              if anchor not in task_text:
                  raise SystemExit("Could not find loadTask anchor in task-details.html")
              task_text = task_text.replace(anchor, function + anchor, 1)
              task_text = task_text.replace(anchor + "\n", anchor + "\n  recordRecentlyViewedTask(taskId);\n", 1)
              task_file.write_text(task_text, encoding="utf-8")

          profile_file = Path("profile.html")
          profile_text = profile_file.read_text(encoding="utf-8")
          profile_marker = "data-recent-tasks-link"
          if profile_marker not in profile_text:
              anchor = '<a href="saved-tasks.html"'
              if anchor not in profile_text:
                  raise SystemExit("Could not find saved tasks link in profile.html")
              recent_link = '<a href="recent-tasks.html" data-recent-tasks-link style="display:block;text-decoration:none;text-align:center;margin:12px 0;padding:13px;border-radius:12px;background:#f0f7f3;color:#16834b;font-weight:800">🕘 RECENTLY VIEWED</a>'
              profile_text = profile_text.replace(anchor, recent_link + anchor, 1)
              profile_file.write_text(profile_text, encoding="utf-8")
          PY

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-details.html profile.html
          git rm .github/workflows/integrate-recent-tasks.yml
          git commit -m "Add recently viewed task tracking and profile entry"
          git push
