name: Fast page startup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'perf: speed up page startup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add connection hints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hints = '''<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin data-studtask-fast-start="cdn">
          <link rel="preconnect" href="https://dthvdxgxesomltlruogp.supabase.co" data-studtask-fast-start="supabase">
          <link rel="dns-prefetch" href="//cdn.jsdelivr.net" data-studtask-fast-start="cdn-dns">
          <link rel="dns-prefetch" href="//dthvdxgxesomltlruogp.supabase.co" data-studtask-fast-start="supabase-dns">'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'data-studtask-fast-start' in text:
                  continue
              marker = '<meta name="viewport"'
              start = text.find(marker)
              if start == -1:
                  continue
              end = text.find('>', start)
              if end == -1:
                  continue
              block = '\n<meta name="studtask-fast-start" content="enabled">\n' + hints
              text = text[:end + 1] + block + text[end + 1:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: speed up page startup"
          git push
