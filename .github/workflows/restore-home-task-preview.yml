name: Restore home task preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-home-task-preview.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Restore home task preview integration'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore Find Tasks preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '    <div class="games-card">'
          section = '''    <section class="task-preview" aria-labelledby="taskPreviewTitle">
        <div class="task-preview-head">
          <div>
            <h2 id="taskPreviewTitle">Find Tasks</h2>
            <p>See available tasks and find one you can help with.</p>
          </div>
          <a href="find-tasks.html">View all →</a>
        </div>
        <div id="homeTaskPreview" class="home-task-list">
          <div class="home-task-loading">Loading available tasks...</div>
        </div>
      </section>

'''
          if 'id="homeTaskPreview"' not in s:
              if marker not in s:
                  raise SystemExit('Home insertion marker not found')
              s = s.replace(marker, section + marker, 1)

          style_marker = '    .games-card,\n    .how {'
          styles = '''    .task-preview {
      margin: 20px 16px;
      padding: 17px;
      background: #fff;
      border: 1px solid #e1e8e4;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.045);
    }

    .task-preview-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .task-preview-head h2 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .task-preview-head p {
      margin: 0;
      color: #68736d;
      font-size: 11px;
      line-height: 1.4;
    }

    .task-preview-head a {
      flex-shrink: 0;
      color: #16834b;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding-top: 2px;
    }

    .home-task-list {
      display: grid;
      gap: 9px;
    }

    .home-task {
      display: block;
      padding: 12px;
      border: 1px solid #e7ece9;
      border-radius: 12px;
      text-decoration: none;
      color: #222;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .home-task:hover {
      transform: translateY(-1px);
      border-color: #cfe2d6;
      box-shadow: 0 4px 12px rgba(22,131,75,.08);
    }

    .home-task:active {
      transform: scale(.98);
    }

    .home-task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .home-task-category {
      color: #16834b;
      background: #eef8f2;
      border-radius: 999px;
      padding: 4px 7px;
      font-size: 9px;
      font-weight: 800;
    }

    .home-task-budget {
      color: #16834b;
      font-size: 13px;
      font-weight: 800;
    }

    .home-task h3 {
      margin: 8px 0 4px;
      font-size: 14px;
      line-height: 1.3;
    }

    .home-task-meta {
      color: #727c76;
      font-size: 10px;
      line-height: 1.4;
    }

    .home-task-loading,
    .home-task-empty {
      color: #68736d;
      background: #f6f8f7;
      border-radius: 11px;
      padding: 14px;
      text-align: center;
      font-size: 11px;
    }

'''
          if '.task-preview {' not in s:
              if style_marker not in s:
                  raise SystemExit('Home style insertion marker not found')
              s = s.replace(style_marker, styles + style_marker, 1)

          script_marker = '    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";'
          script = '''    const HOME_TASK_PREVIEW_LIMIT = 3;

    function escapeHomeTask(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    async function loadHomeTaskPreview() {
      const box = document.getElementById("homeTaskPreview");
      if (!box || !window.supabase) return;
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data, error } = await client
        .from("tasks")
        .select("id,title,category,location,budget,deadline,status,moderation_status")
        .eq("status", "open")
        .eq("moderation_status", "approved")
        .order("created_at", { ascending: false })
        .limit(HOME_TASK_PREVIEW_LIMIT);

      if (error) {
        box.innerHTML = '<div class="home-task-empty">Unable to load tasks right now. <a href="find-tasks.html">Find Tasks</a></div>';
        return;
      }

      if (!data || !data.length) {
        box.innerHTML = '<div class="home-task-empty">No available tasks yet. <a href="find-tasks.html">Browse tasks</a></div>';
        return;
      }

      box.innerHTML = data.map(task => {
        const budget = Number(task.budget || 0).toLocaleString();
        const location = escapeHomeTask(task.location || "Location not set");
        return `<a class="home-task" href="task-details.html?id=${encodeURIComponent(task.id)}">
          <div class="home-task-top">
            <span class="home-task-category">${escapeHomeTask(task.category || "Task")}</span>
            <span class="home-task-budget">₦${budget}</span>
          </div>
          <h3>${escapeHomeTask(task.title || "Untitled task")}</h3>
          <div class="home-task-meta">📍 ${location}</div>
        </a>`;
      }).join("");
    }

'''
          if 'async function loadHomeTaskPreview()' not in s:
              if script_marker not in s:
                  raise SystemExit('Home script insertion marker not found')
              s = s.replace(script_marker, script + script_marker, 1)

          call_marker = '    const SUPABASE_KEY'
          pos = s.find(call_marker)
          if pos == -1:
              raise SystemExit('Supabase key marker not found')
          line_end = s.find('\n', pos)
          if line_end == -1:
              raise SystemExit('Supabase key line not found')
          after_key = line_end + 1
          if 'loadHomeTaskPreview();' not in s:
              s = s[:after_key] + '    loadHomeTaskPreview();\n' + s[after_key:]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Restore home task preview integration'
          git push
