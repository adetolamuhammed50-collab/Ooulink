name: Integrate Trust & Reputation UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate trust links
        shell: python
        run: |
          from pathlib import Path

          profile = Path("profile.html")
          text = profile.read_text(encoding="utf-8")

          profile_marker = 'data-trust-link="profile-trust-link"'
          if profile_marker not in text:
              target = '</div><div class="section"><div class="title">🏆 Achievements'
              replacement = '</div><a class="btn verify" data-trust-link="profile-trust-link" href="trust.html">🛡️ VIEW TRUST & REPUTATION</a><div class="section"><div class="title">🏆 Achievements'
              if target not in text:
                  raise SystemExit("Could not find the profile trust insertion point.")
              text = text.replace(target, replacement, 1)
              profile.write_text(text, encoding="utf-8")

          task = Path("task-details.html")
          text = task.read_text(encoding="utf-8")

          if 'function renderTrustAction()' not in text:
              anchor = 'function renderDisputeAction() {'
              function = '''function renderTrustAction() {
    const box = document.getElementById("actionContent");
    if (!box || !currentTask) return;

    const posterId = currentTask.user_id;
    const runnerId = currentTask.runner_id;
    if (!posterId && !runnerId) return;

    const wrap = document.createElement("div");
    wrap.className = "trust-action";
    wrap.style.cssText = "margin-top:10px;padding:12px;border:1px solid #e0eee5;border-radius:12px;background:#f8fbf9";

    const title = document.createElement("div");
    title.textContent = "🛡️ Trust & Reputation";
    title.style.cssText = "font-size:12px;font-weight:800;color:#172033;margin-bottom:8px";
    wrap.appendChild(title);

    const addLink = (label, userId) => {
        if (!userId) return;
        const link = document.createElement("a");
        link.href = "trust.html?user=" + encodeURIComponent(userId);
        link.textContent = label;
        link.className = "action-btn";
        link.style.cssText = "display:block;text-align:center;text-decoration:none;margin-top:7px";
        wrap.appendChild(link);
    };

    addLink("View Poster Trust Profile", posterId);
    if (runnerId) addLink("View Runner Trust Profile", runnerId);

    box.appendChild(wrap);
}

'''
              if anchor not in text:
                  raise SystemExit("Could not find the task-details dispute function.")
              text = text.replace(anchor, function + anchor, 1)

          call = 'renderActions();renderDisputeAction();'
          replacement = 'renderActions();renderDisputeAction();renderTrustAction();'
          if replacement not in text:
              if call not in text:
                  raise SystemExit("Could not find the task-details render call.")
              text = text.replace(call, replacement, 1)

          task.write_text(text, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.html task-details.html
          git rm .github/workflows/trust-integration.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Trust & Reputation UI integration"
          git push
