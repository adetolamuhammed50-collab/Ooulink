name: Integrate StudTask Referrals

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Integrate referral scripts and profile link
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ["signup.html", "login.html"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              tag = '<script src="referral.js"></script>'
              if tag not in text:
                  text = text.replace("</body>", f"{tag}</body>", 1)
                  path.write_text(text, encoding="utf-8")

          path = Path("profile.html")
          text = path.read_text(encoding="utf-8")
          tag = '<a href="referrals.html" class="btn verify" style="display:block;text-align:center;margin-top:9px">👥 REFER FRIENDS</a>'
          if "href=\"referrals.html\"" not in text:
              marker = '<a href="wallet.html"'
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signup.html login.html profile.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Integrate StudTask referral system"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/integrate-referrals.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Workflow already removed."
          else
            git commit -m "Remove temporary referral integration workflow"
            git push
          fi
