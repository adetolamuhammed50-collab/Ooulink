name: Integrate dispute action

on: push

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Trigger dispute integration'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Integrate dispute action into task details
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("task-details.html")
          html = path.read_text(encoding="utf-8")

          if "function renderDisputeAction()" not in html:
              function_code = r'''

          function renderDisputeAction() {
            const box = document.getElementById("actionContent");
            if (!box || !currentTask || !currentUser) return;

            const status = normalizeStatus(currentTask.status);
            const isParticipant = currentTask.user_id === currentUser.id || currentTask.runner_id === currentUser.id;
            const canDispute = isParticipant && ["accepted", "in_progress", "awaiting_verification"].includes(status);

            if (!canDispute) return;
            if (document.getElementById("openDisputeBtn")) return;

            const button = document.createElement("button");
            button.id = "openDisputeBtn";
            button.className = "action-btn danger-btn";
            button.type = "button";
            button.textContent = "⚠️ Open Dispute";
            button.addEventListener("click", () => {
              window.location.href = `disputes.html?task=${encodeURIComponent(currentTask.id)}`;
            });

            const note = document.createElement("div");
            note.className = "safety-note";
            note.textContent = "Use a dispute when there is a serious task or payment disagreement that cannot be resolved normally.";

            box.appendChild(button);
            box.appendChild(note);
          }
          '''

              anchor = "async function loadTask()"
              if anchor not in html:
                  raise SystemExit("Could not find the task loader anchor.")

              html = html.replace(anchor, function_code + "\n" + anchor, 1)

          html = html.replace("renderActions();", "renderActions();renderDisputeAction();")
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .dispute-integration .github/workflows/dispute-integration.yml
          git add task-details.html
          git commit -m "Integrate dispute action into task details"
          git push
