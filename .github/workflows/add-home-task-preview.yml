name: Add home task preview

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-preview:
    if: "github.event.head_commit.message != 'Add home task preview'"
    runs-on: ubuntu-latest
    steps:
      - name: Add home task preview
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: context.ref.replace('refs/heads/', '') });
            const sha = current.data.sha;
            const text = Buffer.from(current.data.content, 'base64').toString('utf8');

            const css = `

    .task-preview {
      margin: 20px 16px;
    }
    .task-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .task-preview-head h2 { margin: 0; font-size: 18px; }
    .task-preview-head a { color: #16834b; font-size: 11px; font-weight: 800; text-decoration: none; }
    .home-task {
      background: #fff;
      border: 1px solid #e3e9e5;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,.035);
      transition: transform .16s ease, box-shadow .18s ease;
    }
    .home-task:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,0,0,.06); }
    .home-task:active { transform: scale(.985); }
    .home-task-top, .home-task-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .home-task-category { color: #16834b; background: #e8f6ee; border-radius: 20px; padding: 5px 8px; font-size: 10px; font-weight: 800; }
    .home-task-budget { color: #16834b; font-size: 13px; font-weight: 800; }
    .home-task h3 { margin: 9px 0 6px; font-size: 15px; line-height: 1.3; }
    .home-task p { margin: 0 0 9px; color: #68736d; font-size: 11px; line-height: 1.45; }
    .home-task-meta { justify-content: flex-start; flex-wrap: wrap; }
    .home-task-meta span { color: #68736d; background: #f3f6f4; border-radius: 8px; padding: 5px 7px; font-size: 9px; }
    .home-task-view { display: block; margin-top: 10px; text-align: center; text-decoration: none; background: #16834b; color: #fff; padding: 9px; border-radius: 9px; font-size: 11px; font-weight: 800; }
    .home-task-empty, .home-task-loading { padding: 18px; text-align: center; color: #68736d; background: #f5f8f6; border-radius: 14px; font-size: 11px; }
`;

            const html = `

    <section class="task-preview" aria-labelledby="homeTasksTitle">
      <div class="task-preview-head">
        <h2 id="homeTasksTitle">Find Tasks</h2>
        <a href="find-tasks.html">View all →</a>
      </div>
      <div id="homeTaskPreview">
        <div class="home-task-loading">Loading available tasks...</div>
      </div>
    </section>
`;

            const js = `

    (async function loadHomeTaskPreview() {
      const box = document.getElementById("homeTaskPreview");
      if (!box || !window.supabase) return;

      function escHome(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
      }
      function moneyHome(value) {
        const amount = Number(value);
        return Number.isFinite(amount) ? "₦" + amount.toLocaleString("en-NG") : "Budget not specified";
      }
      function deadlineHome(value) {
        if (!value) return "No deadline";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "No deadline" : "⏳ " + date.toLocaleDateString("en-NG", {day:"numeric",month:"short"});
      }

      const { data, error } = await supabaseClient
        .from("tasks")
        .select("id,title,description,category,location,budget,deadline,status,moderation_status,created_at")
        .eq("status", "open")
        .eq("moderation_status", "approved")
        .gte("deadline", new Date().toISOString())
        .order("created_at", {ascending:false})
        .limit(3);

      if (error) {
        box.innerHTML = '<div class="home-task-empty">Unable to load tasks right now.</div>';
        return;
      }
      const tasks = data || [];
      if (!tasks.length) {
        box.innerHTML = '<div class="home-task-empty">No available tasks right now. Check again soon.</div>';
        return;
      }
      box.innerHTML = tasks.map(task => `
        <article class="home-task">
          <div class="home-task-top">
            <span class="home-task-category">${escHome(task.category || "Other")}</span>
            <span class="home-task-budget">${moneyHome(task.budget)}</span>
          </div>
          <h3>${escHome(task.title || "Untitled task")}</h3>
          <p>${escHome(task.description || "No description provided.")}</p>
          <div class="home-task-meta">
            <span>📍 ${escHome(task.location || "Location not specified")}</span>
            <span>${deadlineHome(task.deadline)}</span>
          </div>
          <a class="home-task-view" href="task-details.html?id=${encodeURIComponent(task.id)}">View Task</a>
        </article>
      `).join("");
    })();
`;

            let updated = text;
            if (!updated.includes('.task-preview {')) updated = updated.replace('\n  </style>', css + '\n  </style>');
            if (!updated.includes('id="homeTaskPreview"')) updated = updated.replace('    <div class="games-card">', html + '\n    <div class="games-card">');
            if (!updated.includes('loadHomeTaskPreview')) updated = updated.replace('\n  </script>', js + '\n  </script>');

            if (updated === text) {
              core.info('Home task preview already exists.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Add home task preview',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha,
              branch: context.ref.replace('refs/heads/', '')
            });
