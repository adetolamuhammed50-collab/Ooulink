name: Integrate user blocking
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate block script
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['profile.html','chat.html']:
              p=Path(name)
              s=p.read_text()
              tag='<script src="block.js"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
                  p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile.html chat.html
          git diff --cached --quiet || git commit -m 'Integrate user blocking into profiles and chat'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/integrate-user-blocking.yml
          git add .github/workflows/integrate-user-blocking.yml
          git diff --cached --quiet || git commit -m 'Remove temporary blocking integration workflow'
          git push
