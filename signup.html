<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up — OOULink</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#222;min-height:100vh}.container{width:100%;max-width:480px;margin:auto;padding:24px 18px 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:24px}.back{font-size:24px;color:#16834b;text-decoration:none;transition:.15s}.back:active{transform:scale(.85)}h1{margin:0;color:#16834b;font-size:28px}p.sub{margin:5px 0 22px;color:#666;font-size:14px}.form-group{margin-bottom:15px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#333}input,select{width:100%;padding:14px;border:1px solid #d7ddd9;border-radius:12px;background:#fff;font-size:15px;outline:none;transition:.2s}input:focus,select:focus{border-color:#16834b;box-shadow:0 0 0 3px rgba(22,131,75,.1)}.password-wrap{position:relative}.password-wrap input{padding-right:50px}.toggle-pass{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:19px;cursor:pointer;transition:.12s}.toggle-pass:active{transform:translateY(-50%) scale(.82);background:#edf5f0}.btn{width:100%;border:0;border-radius:12px;padding:15px;background:#16834b;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:5px;transition:transform .12s,opacity .2s,box-shadow .2s}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.65;cursor:not-allowed}.message{display:none;margin:15px 0;padding:13px;border-radius:11px;font-size:13px;line-height:1.45}.message.error{display:block;background:#fff0f0;color:#c62828;border:1px solid #ffd1d1}.message.success{display:block;background:#eefaf3;color:#16834b;border:1px solid #c9ead7}.hint{font-size:11px;color:#777;margin-top:5px}select{appearance:auto}button,a,input,select{touch-action:manipulation}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class="container"><div class="top"><a class="back" href="index.html">←</a><div><h1>Create Account</h1><p class="sub">Join OOULink and start getting things done.</p></div></div><form id="signupForm"><div class="form-group"><label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your full name" required></div><div class="form-group"><label for="username">Username</label><input id="username" type="text" placeholder="Choose a username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required><div class="hint">3–20 characters: letters, numbers and _ only.</div></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required></div><div class="form-group"><label for="location">Location</label><select id="location" required><option value="">Choose your location</option><option value="OOU — Ago-Iwoye">OOU — Ago-Iwoye</option><option value="OOU — Ibogun Campus">OOU — Ibogun Campus</option><option value="Sagamu">Sagamu</option><option value="Ayetoro">Ayetoro</option><option value="Other">Other</option></select></div><div class="form-group"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="Create a password" minlength="6" required><button type="button" class="toggle-pass" data-target="password" aria-label="Show password">👁️</button></div><div class="hint">Minimum 6 characters.</div></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="password-wrap"><input id="confirmPassword" type="password" placeholder="Enter password again" minlength="6" required><button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Show password">👁️</button></div></div><div id="message" class="message"></div><button id="signupButton" class="btn" type="submit">CREATE ACCOUNT</button></form></div><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),form=document.getElementById("signupForm"),button=document.getElementById("signupButton"),message=document.getElementById("message");function showMessage(text,type){message.textContent=text;message.className="message "+type}document.querySelectorAll(".toggle-pass").forEach(btn=>btn.addEventListener("click",()=>{const input=document.getElementById(btn.dataset.target),visible=input.type==="text";input.type=visible?"password":"text";btn.textContent=visible?"👁️":"🙈";btn.setAttribute("aria-label",visible?"Show password":"Hide password")}));form.addEventListener("submit",async function(event){event.preventDefault();if(button.disabled)return;const name=document.getElementById("name").value.trim(),username=document.getElementById("username").value.trim().toLowerCase(),email=document.getElementById("email").value.trim(),location=document.getElementById("location").value,password=document.getElementById("password").value,confirmPassword=document.getElementById("confirmPassword").value;if(!name||!username||!email||!location||!password||!confirmPassword){showMessage("Please fill in all fields.","error");return}if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){showMessage("Username must be 3–20 characters and use only letters, numbers or _.","error");return}if(password.length<6){showMessage("Password must be at least 6 characters.","error");return}if(password!==confirmPassword){showMessage("Passwords do not match.","error");return}button.disabled=true;button.textContent="CHECKING...";const{data:usernameAvailable,error:usernameError}=await supabaseClient.rpc("is_username_available",{check_username:username});if(usernameError){showMessage("Could not check username availability. Please try again.","error");button.disabled=false;button.textContent="CREATE ACCOUNT";return}if(!usernameAvailable){showMessage("That username is already taken. Please choose another.","error");button.disabled=false;button.textContent="CREATE ACCOUNT";return}button.textContent="CREATING ACCOUNT...";const{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:"https://ooulink.vercel.app",data:{full_name:name,username,location}}});if(error){showMessage(error.message,"error");button.disabled=false;button.textContent="CREATE ACCOUNT";return}if(data.user){const{error:profileError}=await supabaseClient.from("profiles").update({username,full_name:name,location}).eq("id",data.user.id);if(profileError){showMessage("Account created, but your profile could not be completed. Please contact support.","error");button.disabled=false;button.textContent="CREATE ACCOUNT";return}showMessage("Account created successfully! Check your email to confirm your account.","success");form.reset();document.querySelectorAll(".toggle-pass").forEach(btn=>{btn.textContent="👁️";btn.setAttribute("aria-label","Show password")});button.disabled=false;button.textContent="ACCOUNT CREATED"}});document.querySelectorAll("button").forEach(btn=>btn.addEventListener("pointerdown",()=>{btn.style.transform="scale(.96)"}));document.querySelectorAll("button").forEach(btn=>{["pointerup","pointercancel","pointerleave"].forEach(e=>btn.addEventListener(e,()=>{btn.style.transform=""}))});</script></body></html>
