<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f9f8;
      color: #17201b;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .logo {
      text-align: center;
      color: #16834b;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid #e5e8e6;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfe5e1;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #16834b;
    }

    .signup-btn {
      width: 100%;
      border: none;
      background: #16834b;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .signup-btn:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .success {
      display: block;
      background: #eef7f2;
      color: #16834b;
    }

    .error {
      display: block;
      background: #fff1f1;
      color: #c62828;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }

    .login-text a {
      color: #16834b;
      font-weight: 700;
      text-decoration: none;
    }

    .terms {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="app">

    <a href="index.html" class="back">
      ← Back to OOULink
    </a>

    <div class="logo">
      OOULink
    </div>

    <div class="subtitle">
      Connect. Get things done. Earn.
    </div>

    <div class="card">

      <h1>
        Create your account
      </h1>

      <div id="message" class="message"></div>

      <form id="signupForm">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="location">
          Location
        </label>

        <select id="location" required>

          <option value="">
            Choose your location
          </option>

          <option value="OOU — Ago-Iwoye">
            OOU — Ago-Iwoye
          </option>

          <option value="OOU — Ibogun Campus">
            OOU — Ibogun Campus
          </option>

          <option value="Sagamu">
            Sagamu
          </option>

          <option value="Ayetoro">
            Ayetoro
          </option>

          <option value="Other">
            Other
          </option>

        </select>

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="signup-btn"
          id="signupButton"
        >
          CREATE ACCOUNT
        </button>

      </form>

      <div class="terms">
        By creating an account, you agree to use OOULink responsibly and follow the platform's rules.
      </div>

    </div>

    <div class="login-text">
      Already have an account?
      <a href="login.html">
        Log in
      </a>
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://dthvdxgxesomltlruogp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

    const { createClient } =
      supabase;

    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("signupButton");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const location =
          document.getElementById("location").value;

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "CREATING ACCOUNT...";


        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name,
                location: location
              }

            }

          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent =
            "CREATE ACCOUNT";

          return;
        }


        if (data.user) {

          showMessage(
            "Account created successfully! Check your email to confirm your account.",
            "success"
          );

          form.reset();

          button.disabled = false;

          button.textContent =
            "ACCOUNT CREATED";

        }

      }

    );

  </script>

</body>
</html>
