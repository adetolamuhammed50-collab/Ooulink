<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f9f8;
      color: #17201b;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .logo {
      text-align: center;
      color: #16834b;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid #e5e8e6;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfe5e1;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #16834b;
    }

    .signup-btn {
      width: 100%;
      border: none;
      background: #16834b;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }

    .login-text a {
      color: #16834b;
      font-weight: 700;
      text-decoration: none;
    }

    .terms {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="app">

    <a href="index.html" class="back">
      ← Back to OOULink
    </a>

    <div class="logo">
      OOULink
    </div>

    <div class="subtitle">
      Connect. Get things done. Earn.
    </div>

    <div class="card">

      <h1>
        Create your account
      </h1>

      <form id="signupForm">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >


        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >


        <label for="location">
          Location
        </label>

        <select id="location" required>

          <option value="">
            Choose your location
          </option>

          <option value="OOU — Ago-Iwoye">
            OOU — Ago-Iwoye
          </option>

          <option value="OOU — Ibogun Campus">
            OOU — Ibogun Campus
          </option>

          <option value="Sagamu">
            Sagamu
          </option>

          <option value="Ayetoro">
            Ayetoro
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >


        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        >


        <button
          type="submit"
          class="signup-btn"
        >
          CREATE ACCOUNT
        </button>

      </form>


      <div class="terms">
        By creating an account, you agree to use OOULink responsibly and follow the platform's rules.
      </div>

    </div>


    <div class="login-text">
      Already have an account?
      <a href="login.html">
        Log in
      </a>
    </div>

  </div>


  <script>

    document
      .getElementById("signupForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

          alert("Passwords do not match.");

          return;
        }

        alert(
          "Signup form is working! Next we will connect it to Supabase."
        );

      });

  </script>

</body>
</html>
