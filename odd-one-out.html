<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd One Out • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.game{background:#fff;border:1px solid #e3eee7;border-radius:22px;padding:20px 16px;text-align:center;box-shadow:0 6px 20px #1231}.timer{font-size:14px;color:#159447;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{height:68px;border:2px solid #e3eee7;background:#f8fffa;border-radius:15px;font-size:29px;cursor:pointer;transition:transform .12s,border-color .12s}.item:active{transform:scale(.93)}.item.correct{border-color:#159447;background:#eef9f1}.item.wrong{border-color:#d95b48;background:#fff1ee}.message{height:28px;margin-top:14px;font-size:13px;font-weight:700;color:#159447}.start,.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:13px 22px;font-weight:800}.start{margin-top:12px}.result{display:none;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:38px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-width:350px){.item{height:60px;font-size:25px}.grid{gap:7px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>👀 Odd One Out</h1><p>Find the different item before time runs out!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="round">0</b><span>ROUND</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="game"><div class="timer">⏱️ <span id="time">30</span>s</div><div class="grid" id="grid"></div><div class="message" id="message">Find the different one!</div><button class="start" id="start">START GAME</button></div><div class="result" id="result"><h2>🏆 Game Over!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">30 seconds • Find the odd item • Each correct answer = 1 point</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const grid=document.getElementById("grid"),scoreEl=document.getElementById("score"),roundEl=document.getElementById("round"),bestEl=document.getElementById("best"),timeEl=document.getElementById("time"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");const sets=[["🍎","🍎","🍎","🍎","🍎","🍎","🍎","🍊"],["🐶","🐶","🐶","🐶","🐶","🐶","🐶","🐱"],["⭐","⭐","⭐","⭐","⭐","⭐","⭐","🌟"],["❤️","❤️","❤️","❤️","❤️","❤️","❤️","💙"],["⚽","⚽","⚽","⚽","⚽","⚽","⚽","🏀"],["🚗","🚗","🚗","🚗","🚗","🚗","🚗","🚕"],["😀","😀","😀","😀","😀","😀","😀","😃"],["🔵","🔵","🔵","🔵","🔵","🔵","🔵","🟢"],["🌸","🌸","🌸","🌸","🌸","🌸","🌸","🌼"],["🔥","🔥","🔥","🔥","🔥","🔥","🔥","💧"]];let score=0,round=0,time=30,timer=null,running=false,best=Number(localStorage.getItem("ooulink_odd_best")||0);bestEl.textContent=best;function nextRound(){if(!running)return;const set=sets[Math.floor(Math.random()*sets.length)],arr=[...set];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),x=arr[i];arr[i]=arr[j];arr[j]=x}grid.innerHTML="";message.textContent="Find the different one!";arr.forEach((v,i)=>{const b=document.createElement("button");b.className="item";b.textContent=v;b.onclick=()=>pick(b,v,set[7]);grid.appendChild(b)});round++;roundEl.textContent=round}function pick(btn,value,odd){if(!running)return;if(value===odd){btn.classList.add("correct");score++;scoreEl.textContent=score;message.textContent="✅ Correct!";setTimeout(nextRound,220)}else{btn.classList.add("wrong");message.textContent="❌ Wrong one!";setTimeout(nextRound,350)}}function endGame(){running=false;clearInterval(timer);finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_odd_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best! You found "+score+" odd ones."}else resultText.textContent="You found "+score+" odd ones in 30 seconds.";result.style.display="block";grid.innerHTML="";message.textContent="Time's up!"}function startGame(){clearInterval(timer);score=0;round=0;time=30;running=true;scoreEl.textContent=0;roundEl.textContent=0;timeEl.textContent=30;result.style.display="none";nextRound();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}start.onclick=startGame;again.onclick=startGame;</script></body></html>
