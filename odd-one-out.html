<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd One Out • StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4fff7; color: #123; font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding-bottom: 88px; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #e3eee7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 22px; font-weight: 800; color: #159447; }
    .back, .start, .again { border: 0; cursor: pointer; font-weight: 800; transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease; touch-action: manipulation; }
    .back { background: #eef9f1; color: #159447; border-radius: 12px; padding: 10px 13px; }
    .back:hover, .start:hover, .again:hover { box-shadow: 0 6px 16px rgba(21,148,71,.2); }
    .back:active, .start:active, .again:active { transform: scale(.94); opacity: .85; }
    .back:focus-visible, .start:focus-visible, .again:focus-visible, .item:focus-visible, .bottom-nav a:focus-visible { outline: 3px solid rgba(21,148,71,.22); outline-offset: 2px; }
    .wrap { padding: 20px 18px; }
    .intro { text-align: center; }
    .intro h1 { margin: 5px 0; font-size: 27px; }
    .intro p { margin: 0; color: #6d7972; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .stat { background: #fff; border: 1px solid #e3eee7; border-radius: 15px; text-align: center; padding: 12px 5px; }
    .stat b { display: block; color: #159447; font-size: 20px; }
    .stat span { font-size: 10px; color: #718078; }
    .game { background: #fff; border: 1px solid #e3eee7; border-radius: 22px; padding: 20px 16px; text-align: center; box-shadow: 0 6px 20px rgba(18,51,34,.08); }
    .timer { font-size: 14px; color: #159447; font-weight: 800; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .item { height: 68px; border: 2px solid #e3eee7; background: #f8fffa; color: #123; border-radius: 15px; font-size: 29px; cursor: pointer; transition: transform .12s ease, border-color .12s ease, background .12s ease; touch-action: manipulation; }
    .item:active { transform: scale(.93); }
    .item.correct { border-color: #159447; background: #eef9f1; }
    .item.wrong { border-color: #d95b48; background: #fff1ee; }
    .message { height: 28px; margin-top: 14px; font-size: 13px; font-weight: 700; color: #159447; }
    .start, .again { background: #159447; color: #fff; border-radius: 13px; padding: 13px 22px; }
    .start { margin-top: 12px; }
    .result { display: none; background: #fff; border: 1px solid #e3eee7; border-radius: 20px; padding: 20px; text-align: center; margin-top: 16px; }
    .result h2 { margin: 0 0 8px; }
    .big { font-size: 38px; font-weight: 900; color: #159447; }
    .result p { color: #68756e; font-size: 13px; }
    .hint { text-align: center; color: #87938c; font-size: 11px; margin: 12px 0; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #e5e8ec; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 9px; z-index: 10; box-shadow: 0 -6px 22px rgba(0,0,0,.06); }
    .bottom-nav a { position: relative; min-height: 54px; padding: 5px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #687386; font-size: 9px; font-weight: 600; border-radius: 12px; transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bottom-nav a span { font-size: 18px; line-height: 20px; margin-bottom: 2px; transition: transform .16s ease; }
    .bottom-nav a:hover { color: #16834b; background: rgba(22,131,75,.05); }
    .bottom-nav a:active { transform: scale(.91); }
    .bottom-nav a:active span { transform: scale(.86); }
    .bottom-nav a.active { color: #16834b; font-weight: 800; background: rgba(22,131,75,.09); box-shadow: inset 0 0 0 1px rgba(22,131,75,.07); }
    .bottom-nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; border-radius: 10px; background: #16834b; transform: translateX(-50%); }
    @media (max-width: 350px) { .item { height: 60px; font-size: 25px; } .grid { gap: 7px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">StudTask</div>
    <button class="back" type="button" onclick="location.href='games.html'">← Games</button>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>👀 Odd One Out</h1>
      <p>Find the different item before time runs out!</p>
    </section>

    <section class="stats">
      <div class="stat"><b id="score">0</b><span>SCORE</span></div>
      <div class="stat"><b id="round">0</b><span>ROUND</span></div>
      <div class="stat"><b id="best">0</b><span>BEST</span></div>
    </section>

    <div class="game">
      <div class="timer">⏱️ <span id="time">30</span>s</div>
      <div class="grid" id="grid"></div>
      <div class="message" id="message">Find the different one!</div>
      <button class="start" id="start" type="button">START GAME</button>
    </div>

    <div class="result" id="result">
      <h2>🏆 Game Over!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="resultText"></p>
      <button class="again" id="again" type="button">PLAY AGAIN</button>
    </div>

    <div class="hint">30 seconds • Find the odd item • Each correct answer = 1 point</div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html"><span>⌂</span>Home</a>
    <a href="my-tasks.html"><span>✓</span>My Tasks</a>
    <a href="post-task.html"><span>＋</span>Post</a>
    <a href="alerts.html"><span>🔔</span>Alerts</a>
    <a href="profile.html"><span>♙</span>Profile</a>
  </nav>

  <script>
    const grid = document.getElementById("grid");
    const scoreEl = document.getElementById("score");
    const roundEl = document.getElementById("round");
    const bestEl = document.getElementById("best");
    const timeEl = document.getElementById("time");
    const message = document.getElementById("message");
    const start = document.getElementById("start");
    const again = document.getElementById("again");
    const result = document.getElementById("result");
    const finalScore = document.getElementById("finalScore");
    const resultText = document.getElementById("resultText");

    const sets = [
      ["🍎","🍎","🍎","🍎","🍎","🍎","🍎","🍊"],
      ["🐶","🐶","🐶","🐶","🐶","🐶","🐶","🐱"],
      ["⭐","⭐","⭐","⭐","⭐","⭐","⭐","🌟"],
      ["❤️","❤️","❤️","❤️","❤️","❤️","❤️","💙"],
      ["⚽","⚽","⚽","⚽","⚽","⚽","⚽","🏀"],
      ["🚗","🚗","🚗","🚗","🚗","🚗","🚗","🚕"],
      ["😀","😀","😀","😀","😀","😀","😀","😃"],
      ["🔵","🔵","🔵","🔵","🔵","🔵","🔵","🟢"],
      ["🌸","🌸","🌸","🌸","🌸","🌸","🌸","🌼"],
      ["🔥","🔥","🔥","🔥","🔥","🔥","🔥","💧"]
    ];

    let score = 0;
    let round = 0;
    let time = 30;
    let timer = null;
    let running = false;
    let best = Number(localStorage.getItem("studtask_odd_best") || 0);

    bestEl.textContent = best;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function nextRound() {
      if (!running) return;

      const set = sets[Math.floor(Math.random() * sets.length)];
      const items = shuffle([...set]);
      const odd = set[set.length - 1];

      grid.innerHTML = "";
      message.textContent = "Find the different one!";

      items.forEach((value) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "item";
        button.textContent = value;
        button.addEventListener("click", () => pick(button, value, odd));
        grid.appendChild(button);
      });

      round += 1;
      roundEl.textContent = round;
    }

    function pick(button, value, odd) {
      if (!running) return;

      if (value === odd) {
        button.classList.add("correct");
        score += 1;
        scoreEl.textContent = score;
        message.textContent = "✅ Correct!";
        setTimeout(nextRound, 220);
      } else {
        button.classList.add("wrong");
        message.textContent = "❌ Wrong one!";
        setTimeout(nextRound, 350);
      }
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      finalScore.textContent = score;

      if (score > best) {
        best = score;
        localStorage.setItem("studtask_odd_best", best);
        bestEl.textContent = best;
        resultText.textContent = "New personal best! You found " + score + " odd ones.";
      } else {
        resultText.textContent = "You found " + score + " odd ones in 30 seconds.";
      }

      result.style.display = "block";
      grid.innerHTML = "";
      message.textContent = "Time's up!";
    }

    function startGame() {
      clearInterval(timer);
      score = 0;
      round = 0;
      time = 30;
      running = true;
      scoreEl.textContent = "0";
      roundEl.textContent = "0";
      timeEl.textContent = "30";
      result.style.display = "none";
      nextRound();

      timer = setInterval(() => {
        time -= 1;
        timeEl.textContent = time;
        if (time <= 0) endGame();
      }, 1000);
    }

    start.addEventListener("click", startGame);
    again.addEventListener("click", startGame);
  </script>
</body>
</html>
