<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Tap • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.arena{height:420px;background:#fff;border:2px solid #dcebe1;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 6px 20px #1231}.target{position:absolute;width:62px;height:62px;border-radius:50%;background:#159447;color:#fff;display:none;align-items:center;justify-content:center;font-size:25px;font-weight:900;box-shadow:0 5px 15px #15944755;user-select:none;touch-action:manipulation}.target:active{transform:scale(.88)}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#65736b;font-size:15px}.start{border:0;background:#159447;color:#fff;border-radius:14px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 5px 15px #15944733}.result{display:none;text-align:center;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;margin-top:16px}.result h2{margin:0 0 8px}.scorebig{font-size:38px;font-weight:900;color:#159447}.result p{color:#6d7972;font-size:13px}.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:12px 20px;font-weight:800}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-height:650px){.arena{height:340px}}@media(max-width:350px){.arena{height:360px}.target{width:56px;height:56px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="history.back()">← Back</button></header><main class="wrap"><section class="intro"><h1>🎯 Quick Tap</h1><p>Tap the target as fast as you can!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="time">30</b><span>SECONDS</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="arena" id="arena"><div class="message" id="message"><div><div style="font-size:45px;margin-bottom:8px">🎯</div><div>Ready to test your speed?</div><br><button class="start" id="start">START GAME</button></div></div><div class="target" id="target">+</div></div><div class="result" id="result"><h2>🏆 Time's Up!</h2><div class="scorebig" id="finalScore">0</div><p id="resultText">Great job!</p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">30 seconds • Tap every target • Beat your best score</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const target=document.getElementById("target"),arena=document.getElementById("arena"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");let score=0,time=30,timer=null,running=false,best=Number(localStorage.getItem("ooulink_quick_tap_best")||0);bestEl.textContent=best;function moveTarget(){const r=arena.getBoundingClientRect(),size=62,x=Math.max(5,Math.random()*(r.width-size-10)),y=Math.max(5,Math.random()*(r.height-size-10));target.style.left=x+"px";target.style.top=y+"px";target.style.display="flex"}function endGame(){running=false;clearInterval(timer);target.style.display="none";finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_quick_tap_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best! Keep going!";}else if(score>=20)resultText.textContent="⚡ Lightning fast!";else if(score>=10)resultText.textContent="👏 Nice speed!";else resultText.textContent="💪 Good start — try again!";result.style.display="block"}function startGame(){score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;result.style.display="none";message.style.display="none";moveTarget();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}target.addEventListener("pointerdown",e=>{if(!running)return;e.preventDefault();score++;scoreEl.textContent=score;moveTarget()});start.addEventListener("click",startGame);again.addEventListener("click",startGame);</script></body></html>
