<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Tap • StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4fff7; color: #123; font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding-bottom: 88px; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #e3eee7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 22px; font-weight: 800; color: #159447; }
    .back, .start, .again { border: 0; cursor: pointer; font-weight: 800; transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease; touch-action: manipulation; }
    .back { background: #eef9f1; color: #159447; border-radius: 12px; padding: 10px 13px; }
    .back:hover, .start:hover, .again:hover { box-shadow: 0 6px 16px rgba(21,148,71,.2); }
    .back:active, .start:active, .again:active { transform: scale(.94); opacity: .85; }
    .back:focus-visible, .start:focus-visible, .again:focus-visible, .target:focus-visible, .bottom-nav a:focus-visible { outline: 3px solid rgba(21,148,71,.22); outline-offset: 2px; }
    .wrap { padding: 20px 18px; }
    .intro { text-align: center; }
    .intro h1 { margin: 5px 0; font-size: 27px; }
    .intro p { margin: 0; color: #6d7972; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .stat { background: #fff; border: 1px solid #e3eee7; border-radius: 15px; text-align: center; padding: 12px 5px; }
    .stat b { display: block; color: #159447; font-size: 20px; }
    .stat span { font-size: 10px; color: #718078; }
    .arena { height: 420px; background: #fff; border: 2px solid #dcebe1; border-radius: 22px; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(18,51,34,.08); }
    .target { position: absolute; width: 62px; height: 62px; border: 0; border-radius: 50%; background: #159447; color: #fff; display: none; align-items: center; justify-content: center; font-size: 25px; font-weight: 900; box-shadow: 0 5px 15px rgba(21,148,71,.33); user-select: none; touch-action: manipulation; cursor: pointer; transition: transform .12s ease, opacity .12s ease; }
    .target:active { transform: scale(.88); }
    .message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 25px; color: #65736b; font-size: 15px; }
    .start, .again { background: #159447; color: #fff; border-radius: 14px; padding: 13px 22px; font-size: 15px; }
    .result { display: none; text-align: center; background: #fff; border: 1px solid #e3eee7; border-radius: 20px; padding: 20px; margin-top: 16px; }
    .result h2 { margin: 0 0 8px; }
    .scorebig { font-size: 38px; font-weight: 900; color: #159447; }
    .result p { color: #6d7972; font-size: 13px; }
    .hint { text-align: center; color: #87938c; font-size: 11px; margin: 12px 0; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #e5e8ec; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 9px; z-index: 10; box-shadow: 0 -6px 22px rgba(0,0,0,.06); }
    .bottom-nav a { position: relative; min-height: 54px; padding: 5px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #687386; font-size: 9px; font-weight: 600; border-radius: 12px; transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bottom-nav a span { font-size: 18px; line-height: 20px; margin-bottom: 2px; transition: transform .16s ease; }
    .bottom-nav a:hover { color: #16834b; background: rgba(22,131,75,.05); }
    .bottom-nav a:active { transform: scale(.91); }
    .bottom-nav a:active span { transform: scale(.86); }
    .bottom-nav a.active { color: #16834b; font-weight: 800; background: rgba(22,131,75,.09); box-shadow: inset 0 0 0 1px rgba(22,131,75,.07); }
    .bottom-nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; border-radius: 10px; background: #16834b; transform: translateX(-50%); }
    @media (max-height: 650px) { .arena { height: 340px; } }
    @media (max-width: 350px) { .arena { height: 360px; } .target { width: 56px; height: 56px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">StudTask</div>
    <button class="back" type="button" onclick="history.back()">← Back</button>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>🎯 Quick Tap</h1>
      <p>Tap the target as fast as you can!</p>
    </section>

    <section class="stats">
      <div class="stat"><b id="score">0</b><span>SCORE</span></div>
      <div class="stat"><b id="time">30</b><span>SECONDS</span></div>
      <div class="stat"><b id="best">0</b><span>BEST</span></div>
    </section>

    <div class="arena" id="arena">
      <div class="message" id="message">
        <div>
          <div style="font-size:45px;margin-bottom:8px">🎯</div>
          <div>Ready to test your speed?</div>
          <br>
          <button class="start" id="start" type="button">START GAME</button>
        </div>
      </div>
      <button class="target" id="target" type="button" aria-label="Tap target">+</button>
    </div>

    <div class="result" id="result">
      <h2>🏆 Time's Up!</h2>
      <div class="scorebig" id="finalScore">0</div>
      <p id="resultText">Great job!</p>
      <button class="again" id="again" type="button">PLAY AGAIN</button>
    </div>

    <div class="hint">30 seconds • Tap every target • Beat your best score</div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html"><span>⌂</span>Home</a>
    <a href="my-tasks.html"><span>✓</span>My Tasks</a>
    <a href="post-task.html"><span>＋</span>Post</a>
    <a href="alerts.html"><span>🔔</span>Alerts</a>
    <a href="profile.html"><span>♙</span>Profile</a>
  </nav>

  <script>
    const target = document.getElementById("target");
    const arena = document.getElementById("arena");
    const message = document.getElementById("message");
    const start = document.getElementById("start");
    const again = document.getElementById("again");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const bestEl = document.getElementById("best");
    const result = document.getElementById("result");
    const finalScore = document.getElementById("finalScore");
    const resultText = document.getElementById("resultText");

    let score = 0;
    let time = 30;
    let timer = null;
    let running = false;
    let best = Number(localStorage.getItem("studtask_quick_tap_best") || 0);

    bestEl.textContent = best;

    function moveTarget() {
      const rect = arena.getBoundingClientRect();
      const size = target.offsetWidth || 62;
      const x = Math.max(5, Math.random() * (rect.width - size - 10));
      const y = Math.max(5, Math.random() * (rect.height - size - 10));
      target.style.left = x + "px";
      target.style.top = y + "px";
      target.style.display = "flex";
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      target.style.display = "none";
      finalScore.textContent = score;

      if (score > best) {
        best = score;
        localStorage.setItem("studtask_quick_tap_best", best);
        bestEl.textContent = best;
        resultText.textContent = "New personal best! Keep going!";
      } else if (score >= 20) {
        resultText.textContent = "Lightning fast!";
      } else if (score >= 10) {
        resultText.textContent = "Nice speed!";
      } else {
        resultText.textContent = "Good start — try again!";
      }

      result.style.display = "block";
    }

    function startGame() {
      score = 0;
      time = 30;
      running = true;
      scoreEl.textContent = "0";
      timeEl.textContent = "30";
      result.style.display = "none";
      message.style.display = "none";
      moveTarget();
      clearInterval(timer);

      timer = setInterval(() => {
        time -= 1;
        timeEl.textContent = time;
        if (time <= 0) endGame();
      }, 1000);
    }

    target.addEventListener("pointerdown", event => {
      if (!running) return;
      event.preventDefault();
      score += 1;
      scoreEl.textContent = score;
      moveTarget();
    });

    start.addEventListener("click", startGame);
    again.addEventListener("click", startGame);
  </script>
</body>
</html>
