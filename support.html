<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16834b"><title>StudTask Support</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;font-family:Arial,sans-serif;color:#17231d;padding-bottom:90px}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff}.head{padding:18px 16px 14px;border-bottom:1px solid #e5ebe7;position:sticky;top:0;background:#fff;z-index:5}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:22px;font-weight:900}.sub{font-size:11px;color:#6b7280;margin-top:3px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;cursor:pointer;background:#16834b;color:#fff}.btn.secondary{background:#eef3ef;color:#31513f}.btn:disabled{opacity:.55}.wrap{padding:14px}.hero{background:linear-gradient(135deg,#16834b,#0d6238);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:19px}.hero p{margin:0;font-size:12px;line-height:1.5;opacity:.92}.card{border:1px solid #e2e9e5;border-radius:16px;padding:14px;margin-bottom:11px;background:#fff;box-shadow:0 4px 14px #00000008}.ticket{cursor:pointer}.ticket:active{transform:scale(.99)}.ticket-head{display:flex;justify-content:space-between;gap:10px}.ticket-title{font-weight:900;font-size:14px}.meta{font-size:10px;color:#718078;margin-top:5px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;text-transform:uppercase;background:#dcfce7;color:#166534}.badge.pending{background:#fef3c7;color:#92400e}.badge.closed{background:#e5e7eb;color:#4b5563}.badge.answered{background:#dbeafe;color:#1d4ed8}.empty{text-align:center;padding:35px 12px;color:#718078;font-size:13px}.form{display:grid;gap:10px}.input,.select,.textarea{width:100%;border:1px solid #d8e1dc;border-radius:11px;padding:11px;font:inherit;background:#fff}.textarea{min-height:100px;resize:vertical}.input:focus,.select:focus,.textarea:focus{outline:none;border-color:#16834b;box-shadow:0 0 0 3px #16834b18}.section-title{font-size:15px;font-weight:900;margin:18px 0 9px}.messages{display:grid;gap:8px;margin-bottom:10px}.msg{padding:10px 12px;border-radius:13px;background:#f2f6f3;font-size:12px;line-height:1.5}.msg.me{background:#e9f7ef}.msg .who{font-size:9px;font-weight:900;color:#16834b;margin-bottom:3px}.back{display:block;text-align:center;color:#16834b;text-decoration:none;font-weight:800;font-size:12px;margin:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e8e6;display:flex;justify-content:space-around;padding:8px 5px 10px;z-index:10}.nav a{min-width:58px;padding:5px 6px;text-align:center;text-decoration:none;color:#68736d;font-size:10px;border-radius:12px}.nav a.active{color:#16834b;background:#eef8f2;font-weight:800}.nav-icon{display:block;font-size:18px;line-height:20px}.error{background:#fee2e2;color:#991b1b;border-radius:11px;padding:12px;font-size:12px}.notice{background:#f0f6f2;color:#31513f;border-radius:11px;padding:10px;font-size:11px}.row{display:flex;gap:8px;align-items:center}.row .btn{flex:1}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="app">
<header class="head"><div class="top"><div><div class="title">Support</div><div class="sub">Get help from the StudTask team</div></div><button class="btn secondary" type="button" onclick="showList()">MY TICKETS</button></div></header>
<div class="wrap" id="content"><div class="hero"><h2>How can we help?</h2><p>Tell us what happened. Keep payment references, task details, and any useful information in your message.</p></div><div id="list"></div></div>
<a class="back" href="index.html">← Back to StudTask</a></main>
<nav class="nav"><a href="index.html"><span class="nav-icon">⌂</span>Home</a><a href="my-tasks.html"><span class="nav-icon">✓</span>My Tasks</a><a href="post-task.html"><span class="nav-icon">＋</span>Post</a><a href="alerts.html"><span class="nav-icon">🔔</span>Alerts</a><a href="profile.html" class="active"><span class="nav-icon">♙</span>Profile</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,tickets=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const badge=s=>'<span class="badge '+(s==="pending"?"pending":s==="closed"?"closed":s==="answered"?"answered":"")+'">'+esc(s)+'</span>';
function formatDate(v){return v?new Date(v).toLocaleString():""}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href="login.html";return}user=session.user;showList()}
async function showList(){document.getElementById("list").innerHTML='<div class="notice">Loading your support tickets...</div>';const {data,error}=await sb.from("support_tickets").select("id,subject,category,status,created_at,updated_at").order("updated_at",{ascending:false});if(error){document.getElementById("list").innerHTML='<div class="error">'+esc(error.message)+'</div>';return}tickets=data||[];let html='<div class="row"><button class="btn" type="button" onclick="newTicket()">＋ NEW SUPPORT TICKET</button></div><div class="section-title">Your tickets</div>';if(!tickets.length)html+='<div class="empty">No support tickets yet.</div>';else html+=tickets.map(t=>'<div class="card ticket" onclick="openTicket(\''+t.id+'\')"><div class="ticket-head"><div><div class="ticket-title">'+esc(t.subject)+'</div><div class="meta">'+esc(t.category)+' • Updated '+esc(formatDate(t.updated_at))+'</div></div>'+badge(t.status)+'</div></div>').join("");document.getElementById("list").innerHTML=html}
function newTicket(){document.getElementById("list").innerHTML='<div class="card"><div class="section-title" style="margin-top:0">New support ticket</div><form class="form" onsubmit="createTicket(event)"><input id="subject" class="input" maxlength="120" required placeholder="What do you need help with?"><select id="category" class="select" required><option value="account">Account</option><option value="payments">Payments</option><option value="tasks">Tasks</option><option value="verification">Verification</option><option value="safety">Safety</option><option value="technical">Technical issue</option><option value="other">Other</option></select><textarea id="message" class="textarea" maxlength="4000" required placeholder="Describe the issue..."></textarea><div class="row"><button class="btn secondary" type="button" onclick="showList()">CANCEL</button><button class="btn" type="submit">SEND TO SUPPORT</button></div></form></div>'}
async function createTicket(e){e.preventDefault();const subject=document.getElementById("subject").value.trim(),category=document.getElementById("category").value,message=document.getElementById("message").value.trim();if(!subject||!message)return;const buttons=e.target.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);const {data:t,error}=await sb.from("support_tickets").insert({user_id:user.id,subject,category}).select("id").single();if(error){alert(error.message);buttons.forEach(b=>b.disabled=false);return}const {error:me}=await sb.from("support_messages").insert({ticket_id:t.id,sender_id:user.id,message});if(me){alert(me.message);return}openTicket(t.id)}
async function openTicket(id){document.getElementById("list").innerHTML='<div class="notice">Loading ticket...</div>';const {data:t,error:te}=await sb.from("support_tickets").select("id,subject,category,status,created_at,updated_at,user_id").eq("id",id).single();if(te){document.getElementById("list").innerHTML='<div class="error">'+esc(te.message)+'</div>';return}const {data:m,error:me}=await sb.from("support_messages").select("id,sender_id,message,created_at").eq("ticket_id",id).order("created_at",{ascending:true});if(me){document.getElementById("list").innerHTML='<div class="error">'+esc(me.message)+'</div>';return}let html='<button class="btn secondary" type="button" onclick="showList()">← BACK TO TICKETS</button><div class="card"><div class="ticket-head"><div><div class="ticket-title">'+esc(t.subject)+'</div><div class="meta">'+esc(t.category)+' • Created '+esc(formatDate(t.created_at))+'</div></div>'+badge(t.status)+'</div></div><div class="section-title">Conversation</div><div class="messages">'+(m||[]).map(x=>'<div class="msg '+(x.sender_id===user.id?"me":"")+'"><div class="who">'+(x.sender_id===user.id?"YOU":"STUDTASK SUPPORT")+' • '+esc(formatDate(x.created_at))+'</div>'+esc(x.message)+'</div>').join("")+'</div>';if(t.status!=="closed")html+='<form class="form" onsubmit="replyTicket(event,\''+id+'\')"><textarea id="reply" class="textarea" maxlength="4000" required placeholder="Write a reply..."></textarea><button class="btn" type="submit">SEND REPLY</button></form>';else html+='<div class="notice">This ticket is closed. Create a new ticket if you still need help.</div>';document.getElementById("list").innerHTML=html}
async function replyTicket(e,id){e.preventDefault();const message=document.getElementById("reply").value.trim();if(!message)return;const b=e.target.querySelector("button");b.disabled=true;const {error}=await sb.from("support_messages").insert({ticket_id:id,sender_id:user.id,message});if(error){alert(error.message);b.disabled=false;return}await sb.from("support_tickets").update({status:"open"}).eq("id",id).eq("user_id",user.id);openTicket(id)}
init();
</script><script src="brand.js"></script></body></html>
