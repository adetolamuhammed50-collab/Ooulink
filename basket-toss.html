<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basket Toss • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.court{height:410px;background:linear-gradient(#dff6e6 0 55%,#d19a63 55%);border:2px solid #dcebe1;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 6px 20px #1231;touch-action:none}.hoop{position:absolute;right:35px;top:72px;width:82px;height:105px}.backboard{position:absolute;right:0;top:0;width:58px;height:58px;background:#fff;border:4px solid #555;border-radius:4px}.rim{position:absolute;right:2px;top:55px;width:55px;height:13px;border:5px solid #e05b3d;border-radius:50%}.net{position:absolute;right:8px;top:65px;width:43px;height:40px;border-left:3px solid #eee;border-right:3px solid #eee;border-bottom:3px solid #eee;border-radius:0 0 18px 18px}.ball{position:absolute;left:45px;bottom:28px;width:48px;height:48px;border-radius:50%;background:#e87932;color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;user-select:none;transition:transform .15s}.ball:active{transform:scale(.9)}.aim{position:absolute;left:45px;bottom:90px;width:180px;height:3px;background:#15944755;transform-origin:left center;display:none}.message{position:absolute;inset:0;z-index:4;background:#ffffffcc;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#65736b}.start{border:0;background:#159447;color:#fff;border-radius:14px;padding:13px 22px;font-weight:800;margin-top:10px}.result{display:none;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:38px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:12px 20px;font-weight:800}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>🏀 Basket Toss</h1><p>Tap the ball to shoot and score as many baskets as possible!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="shots">0</b><span>SHOTS</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="court" id="court"><div class="message" id="message"><div><div style="font-size:50px">🏀</div><div>Ready to shoot?</div><button class="start" id="start">START GAME</button></div></div><div class="hoop"><div class="backboard"></div><div class="rim"></div><div class="net"></div></div><div class="aim" id="aim"></div><div class="ball" id="ball">🏀</div></div><div class="result" id="result"><h2>🏆 Game Over!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">20 shots • Tap the ball • Every basket = 1 point</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const court=document.getElementById("court"),ball=document.getElementById("ball"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),scoreEl=document.getElementById("score"),shotsEl=document.getElementById("shots"),bestEl=document.getElementById("best"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText"),aim=document.getElementById("aim");let running=false,score=0,shots=0,best=Number(localStorage.getItem("ooulink_basket_best")||0);bestEl.textContent=best;function resetBall(){ball.style.left="45px";ball.style.bottom="28px";ball.style.transform="none"}function shoot(){if(!running)return;shots++;shotsEl.textContent=shots;const made=Math.random()<.55;if(made){score++;scoreEl.textContent=score;ball.style.transition="left .35s,bottom .35s,transform .35s";ball.style.left="305px";ball.style.bottom="250px";ball.style.transform="scale(.65) rotate(360deg)";setTimeout(()=>{resetBall()},400)}else{ball.style.transition="left .3s,bottom .3s,transform .3s";ball.style.left=(190+Math.random()*90)+"px";ball.style.bottom="250px";ball.style.transform="rotate(300deg)";setTimeout(()=>resetBall(),400)}if(shots>=20)setTimeout(endGame,500)}function endGame(){if(!running)return;running=false;finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_basket_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best! You scored "+score+" baskets."}else resultText.textContent="You scored "+score+" out of 20 shots.";result.style.display="block"}function startGame(){running=true;score=0;shots=0;scoreEl.textContent=0;shotsEl.textContent=0;result.style.display="none";message.style.display="none";resetBall()}ball.addEventListener("pointerdown",e=>{e.preventDefault();shoot()});start.onclick=startGame;again.onclick=startGame;</script></body></html>
