<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basket Toss • StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4fff7; color: #123; font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding-bottom: 88px; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #e3eee7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 22px; font-weight: 800; color: #159447; }
    button { font-family: inherit; }
    .back, .start, .again { border: 0; cursor: pointer; font-weight: 800; transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease; touch-action: manipulation; }
    .back { background: #eef9f1; color: #159447; border-radius: 12px; padding: 10px 13px; }
    .back:hover, .start:hover, .again:hover { box-shadow: 0 6px 16px rgba(21,148,71,.2); }
    .back:active, .start:active, .again:active { transform: scale(.94); opacity: .85; }
    .back:focus-visible, .start:focus-visible, .again:focus-visible, .ball:focus-visible, .bottom-nav a:focus-visible { outline: 3px solid rgba(21,148,71,.22); outline-offset: 2px; }
    .wrap { padding: 20px 18px; }
    .intro { text-align: center; }
    .intro h1 { margin: 5px 0; font-size: 27px; }
    .intro p { margin: 0; color: #6d7972; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .stat { background: #fff; border: 1px solid #e3eee7; border-radius: 15px; text-align: center; padding: 12px 5px; }
    .stat b { display: block; color: #159447; font-size: 20px; }
    .stat span { font-size: 10px; color: #718078; }
    .court { height: 410px; background: linear-gradient(#dff6e6 0 55%, #d19a63 55%); border: 2px solid #dcebe1; border-radius: 22px; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(18,51,34,.08); touch-action: none; }
    .hoop { position: absolute; right: 35px; top: 72px; width: 82px; height: 105px; }
    .backboard { position: absolute; right: 0; top: 0; width: 58px; height: 58px; background: #fff; border: 4px solid #555; border-radius: 4px; }
    .rim { position: absolute; right: 2px; top: 55px; width: 55px; height: 13px; border: 5px solid #e05b3d; border-radius: 50%; }
    .net { position: absolute; right: 8px; top: 65px; width: 43px; height: 40px; border-left: 3px solid #eee; border-right: 3px solid #eee; border-bottom: 3px solid #eee; border-radius: 0 0 18px 18px; }
    .ball { position: absolute; left: 45px; bottom: 28px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: #e87932; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 27px; cursor: pointer; user-select: none; transition: transform .15s ease, left .35s ease, bottom .35s ease; touch-action: manipulation; }
    .ball:active { transform: scale(.9); }
    .message { position: absolute; inset: 0; z-index: 4; background: rgba(255,255,255,.8); display: flex; align-items: center; justify-content: center; text-align: center; padding: 25px; color: #65736b; }
    .start, .again { background: #159447; color: #fff; border-radius: 14px; padding: 13px 22px; margin-top: 10px; }
    .result { display: none; background: #fff; border: 1px solid #e3eee7; border-radius: 20px; padding: 20px; text-align: center; margin-top: 16px; }
    .result h2 { margin: 0 0 8px; }
    .big { font-size: 38px; font-weight: 900; color: #159447; }
    .result p { color: #68756e; font-size: 13px; }
    .hint { text-align: center; color: #87938c; font-size: 11px; margin: 12px 0; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #e5e8ec; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 9px; z-index: 10; box-shadow: 0 -6px 22px rgba(0,0,0,.06); }
    .bottom-nav a { position: relative; min-height: 54px; padding: 5px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #687386; font-size: 9px; font-weight: 600; border-radius: 12px; transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bottom-nav a span { font-size: 18px; line-height: 20px; margin-bottom: 2px; transition: transform .16s ease; }
    .bottom-nav a:hover { color: #16834b; background: rgba(22,131,75,.05); }
    .bottom-nav a:active { transform: scale(.91); }
    .bottom-nav a:active span { transform: scale(.86); }
    .bottom-nav a.active { color: #16834b; font-weight: 800; background: rgba(22,131,75,.09); box-shadow: inset 0 0 0 1px rgba(22,131,75,.07); }
    .bottom-nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; border-radius: 10px; background: #16834b; transform: translateX(-50%); }
    @media (max-width: 350px) { .court { height: 360px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">StudTask</div>
    <button class="back" type="button" onclick="location.href='games.html'">← Games</button>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>🏀 Basket Toss</h1>
      <p>Tap the ball to shoot and score as many baskets as possible!</p>
    </section>

    <section class="stats">
      <div class="stat"><b id="score">0</b><span>SCORE</span></div>
      <div class="stat"><b id="shots">0</b><span>SHOTS</span></div>
      <div class="stat"><b id="best">0</b><span>BEST</span></div>
    </section>

    <div class="court" id="court">
      <div class="message" id="message">
        <div>
          <div style="font-size:50px">🏀</div>
          <div>Ready to shoot?</div>
          <button class="start" id="start" type="button">START GAME</button>
        </div>
      </div>
      <div class="hoop"><div class="backboard"></div><div class="rim"></div><div class="net"></div></div>
      <button class="ball" id="ball" type="button" aria-label="Shoot basketball">🏀</button>
    </div>

    <div class="result" id="result">
      <h2>🏆 Game Over!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="resultText"></p>
      <button class="again" id="again" type="button">PLAY AGAIN</button>
    </div>

    <div class="hint">20 shots • Tap the ball • Every basket = 1 point</div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html"><span>⌂</span>Home</a>
    <a href="my-tasks.html"><span>✓</span>My Tasks</a>
    <a href="post-task.html"><span>＋</span>Post</a>
    <a href="alerts.html"><span>🔔</span>Alerts</a>
    <a href="profile.html"><span>♙</span>Profile</a>
  </nav>

  <script>
    const ball = document.getElementById("ball");
    const message = document.getElementById("message");
    const start = document.getElementById("start");
    const again = document.getElementById("again");
    const scoreEl = document.getElementById("score");
    const shotsEl = document.getElementById("shots");
    const bestEl = document.getElementById("best");
    const result = document.getElementById("result");
    const finalScore = document.getElementById("finalScore");
    const resultText = document.getElementById("resultText");

    let running = false;
    let score = 0;
    let shots = 0;
    let best = Number(localStorage.getItem("studtask_basket_best") || 0);

    bestEl.textContent = best;

    function resetBall() {
      ball.style.left = "45px";
      ball.style.bottom = "28px";
      ball.style.transform = "none";
    }

    function shoot() {
      if (!running) return;

      shots += 1;
      shotsEl.textContent = shots;

      const made = Math.random() < 0.55;
      if (made) {
        score += 1;
        scoreEl.textContent = score;
        ball.style.left = "305px";
        ball.style.bottom = "250px";
        ball.style.transform = "scale(.65) rotate(360deg)";
      } else {
        ball.style.left = (190 + Math.random() * 90) + "px";
        ball.style.bottom = "250px";
        ball.style.transform = "rotate(300deg)";
      }

      setTimeout(resetBall, 400);
      if (shots >= 20) setTimeout(endGame, 500);
    }

    function endGame() {
      if (!running) return;
      running = false;
      finalScore.textContent = score;

      if (score > best) {
        best = score;
        localStorage.setItem("studtask_basket_best", best);
        bestEl.textContent = best;
        resultText.textContent = "New personal best! You scored " + score + " baskets.";
      } else {
        resultText.textContent = "You scored " + score + " out of 20 shots.";
      }

      result.style.display = "block";
    }

    function startGame() {
      running = true;
      score = 0;
      shots = 0;
      scoreEl.textContent = "0";
      shotsEl.textContent = "0";
      result.style.display = "none";
      message.style.display = "none";
      resetBall();
    }

    ball.addEventListener("pointerdown", event => {
      event.preventDefault();
      shoot();
    });

    start.addEventListener("click", startGame);
    again.addEventListener("click", startGame);
  </script>
  <script src="brand.js"></script>
</body>
</html>
