<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Saved Tasks — StudTask</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#16a34a;--green-dark:#15803d;--green-light:#ecfdf3;--text:#17201a;--muted:#6b7280;--border:#e5e7eb;--bg:#f6f8f7;--white:#fff;--red:#dc2626;--shadow:0 4px 18px rgba(0,0,0,.06)}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}.app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative}
.header{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:20}.back{width:40px;height:40px;border:0;background:transparent;border-radius:12px;font-size:24px}.title{flex:1;text-align:center;font-size:16px;font-weight:800}.brand{width:40px;text-align:right;color:var(--green-dark);font-size:12px;font-weight:800}
main{padding:14px 14px 100px}.intro{margin-bottom:12px;color:var(--muted);font-size:13px;line-height:1.5}.task-list{display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.card:active{transform:scale(.98)}.top{display:flex;gap:8px;align-items:center;margin-bottom:9px}.category{background:var(--green-light);color:var(--green-dark);padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800}.budget{margin-left:auto;color:var(--green-dark);font-weight:800;font-size:14px}.card h3{font-size:16px;line-height:1.3;margin-bottom:6px}.desc{color:#4b5563;font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px}.remove{margin-top:12px;width:100%;min-height:38px;border:1px solid #fecaca;background:#fff;color:var(--red);border-radius:10px;font-weight:700}.empty{background:#fff;border-radius:18px;padding:35px 20px;text-align:center;box-shadow:var(--shadow)}.empty-icon{font-size:40px;margin-bottom:10px}.empty h2{font-size:18px;margin-bottom:7px}.empty p{color:var(--muted);font-size:13px;line-height:1.5}.primary{display:inline-block;margin-top:15px;background:var(--green);color:#fff;text-decoration:none;border-radius:11px;padding:11px 16px;font-weight:800;font-size:13px}.loading{height:125px;border-radius:17px;background:linear-gradient(90deg,#edf0ee 25%,#f7f8f7 50%,#edf0ee 75%);background-size:200% 100%;animation:shine 1.4s infinite}@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;height:66px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(255,255,255,.92);border:1px solid rgba(229,231,235,.9);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.12);backdrop-filter:blur(16px);z-index:90}.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-radius:15px;background:transparent;color:#66706a;text-decoration:none;font-size:10px;font-weight:700;gap:2px}.nav.active{background:var(--green-light);color:var(--green-dark)}.nav span{font-size:19px}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="back" id="back">‹</button><div class="title">Saved Tasks</div><div class="brand">StudTask</div></header>
<main><div class="intro">Tasks you save are kept here so you can find them again later.</div><div id="list" class="task-list"><div class="loading"></div><div class="loading"></div></div></main>
<nav class="bottom-nav"><a class="nav" href="index.html"><span>⌂</span>Home</a><a class="nav" href="my-tasks.html"><span>✓</span>My Tasks</a><a class="nav" href="post-task.html"><span>＋</span>Post</a><a class="nav" href="alerts.html"><span>🔔</span>Alerts</a><a class="nav active" href="profile.html"><span>👤</span>Profile</a></nav>
</div>
<script>
const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co";
const SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const list=document.getElementById("list");
document.getElementById("back").onclick=()=>history.length>1?history.back():location.href="index.html";
function esc(value){return String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]))}
function money(value){return "₦"+Number(value||0).toLocaleString("en-NG")}
function date(value){return new Date(value).toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"})}
function render(tasks){
 if(!tasks.length){list.innerHTML='<div class="empty"><div class="empty-icon">🔖</div><h2>No saved tasks</h2><p>When you save an available task, it will appear here.</p><a class="primary" href="find-tasks.html">Find Tasks</a></div>';return}
 list.innerHTML=tasks.map(task=>`<article class="card" data-id="${esc(task.id)}"><div class="top"><span class="category">${esc(task.category||"Task")}</span><span class="budget">${money(task.budget)}</span></div><h3>${esc(task.title)}</h3><div class="desc">${esc(task.description||"No description provided.")}</div><div class="meta"><span>📍 ${esc(task.location||"Location not specified")}</span><span>⏳ ${date(task.deadline)}</span></div><button class="remove" type="button" data-remove="${esc(task.id)}">Remove from Saved</button></article>`).join("");
 list.querySelectorAll("[data-id]").forEach(card=>card.addEventListener("click",event=>{if(event.target.closest("[data-remove]"))return;location.href="task-details.html?id="+encodeURIComponent(card.dataset.id)}));
 list.querySelectorAll("[data-remove]").forEach(button=>button.addEventListener("click",async event=>{event.stopPropagation();button.disabled=true;button.textContent="Removing...";const{error}=await supabaseClient.rpc("unsave_task",{p_task_id:button.dataset.remove});if(error){button.disabled=false;button.textContent="Remove from Saved";alert(error.message);return}await loadSaved()}));
}
async function loadSaved(){
 const{data:{session}}=await supabaseClient.auth.getSession();
 if(!session){location.href="login.html";return}
 const{data,error}=await supabaseClient.from("saved_tasks").select("task_id,created_at,tasks(id,title,description,category,location,budget,deadline,status,moderation_status)").eq("user_id",session.user.id).order("created_at",{ascending:false});
 if(error){list.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h2>Couldn\'t load saved tasks</h2><p>'+esc(error.message)+'</p></div>';return}
 const tasks=(data||[]).map(row=>row.tasks).filter(task=>task&&task.status==="open"&&task.moderation_status==="approved"&&new Date(task.deadline)>=new Date());
 render(tasks);
}
loadSaved();
</script>
</body>
</html>
