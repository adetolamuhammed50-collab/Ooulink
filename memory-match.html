<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match • StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4fff7; color: #123; font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding-bottom: 88px; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #e3eee7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 22px; font-weight: 800; color: #159447; }
    .back, .btn { border: 0; background: #159447; color: #fff; border-radius: 13px; padding: 12px 20px; font-weight: 800; cursor: pointer; transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease; touch-action: manipulation; }
    .back { background: #eef9f1; color: #159447; padding: 10px 13px; }
    .back:hover, .btn:hover { box-shadow: 0 6px 16px rgba(21,148,71,.2); }
    .back:active, .btn:active { transform: scale(.94); opacity: .85; }
    .back:focus-visible, .btn:focus-visible, .card:focus-visible, .bottom-nav a:focus-visible { outline: 3px solid rgba(21,148,71,.22); outline-offset: 2px; }
    .wrap { padding: 20px 18px; }
    .intro { text-align: center; }
    .intro h1 { margin: 5px 0; font-size: 27px; }
    .intro p { margin: 0; color: #6d7972; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .stat { background: #fff; border: 1px solid #e3eee7; border-radius: 15px; text-align: center; padding: 12px 5px; }
    .stat b { display: block; color: #159447; font-size: 20px; }
    .stat span { font-size: 10px; color: #718078; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; background: #fff; border: 1px solid #e3eee7; border-radius: 22px; padding: 14px; box-shadow: 0 6px 20px rgba(18,51,34,.08); }
    .card { height: 72px; border: 0; border-radius: 14px; background: #159447; color: #fff; font-size: 28px; font-weight: 800; cursor: pointer; transition: transform .15s ease, background .15s ease; touch-action: manipulation; }
    .card:active { transform: scale(.94); }
    .card.open, .card.matched { background: #eef9f1; color: #159447; }
    .card.matched { box-shadow: inset 0 0 0 2px #159447; }
    .message { text-align: center; min-height: 25px; margin: 14px 0; color: #159447; font-size: 13px; font-weight: 700; }
    .result { display: none; background: #fff; border: 1px solid #e3eee7; border-radius: 20px; padding: 20px; text-align: center; margin-top: 16px; }
    .result h2 { margin: 0 0 8px; }
    .big { font-size: 38px; font-weight: 900; color: #159447; }
    .result p { color: #68756e; font-size: 13px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #e5e8ec; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 9px; z-index: 10; box-shadow: 0 -6px 22px rgba(0,0,0,.06); }
    .bottom-nav a { position: relative; min-height: 54px; padding: 5px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #687386; font-size: 9px; font-weight: 600; border-radius: 12px; transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bottom-nav a span { font-size: 18px; line-height: 20px; margin-bottom: 2px; transition: transform .16s ease; }
    .bottom-nav a:hover { color: #16834b; background: rgba(22,131,75,.05); }
    .bottom-nav a:active { transform: scale(.91); }
    .bottom-nav a:active span { transform: scale(.86); }
    .bottom-nav a.active { color: #16834b; font-weight: 800; background: rgba(22,131,75,.09); box-shadow: inset 0 0 0 1px rgba(22,131,75,.07); }
    .bottom-nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; border-radius: 10px; background: #16834b; transform: translateX(-50%); }
    @media (max-width: 350px) { .card { height: 62px; font-size: 24px; } .board { gap: 7px; padding: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">StudTask</div>
    <button class="back" type="button" onclick="location.href='games.html'">← Games</button>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>🃏 Memory Match</h1>
      <p>Find all the matching pairs!</p>
    </section>

    <section class="stats">
      <div class="stat"><b id="moves">0</b><span>MOVES</span></div>
      <div class="stat"><b id="pairs">0/8</b><span>PAIRS</span></div>
      <div class="stat"><b id="best">—</b><span>BEST</span></div>
    </section>

    <div class="board" id="board"></div>
    <div class="message" id="message">Match two cards to begin.</div>
    <button class="btn" id="newGame" type="button">NEW GAME</button>

    <div class="result" id="result">
      <h2>🏆 You Won!</h2>
      <div class="big" id="finalMoves">0</div>
      <p id="resultText"></p>
      <button class="btn" id="again" type="button">PLAY AGAIN</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html"><span>⌂</span>Home</a>
    <a href="my-tasks.html"><span>✓</span>My Tasks</a>
    <a href="post-task.html"><span>＋</span>Post</a>
    <a href="alerts.html"><span>🔔</span>Alerts</a>
    <a href="profile.html"><span>♙</span>Profile</a>
  </nav>

  <script>
    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const pairsEl = document.getElementById("pairs");
    const bestEl = document.getElementById("best");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const finalMoves = document.getElementById("finalMoves");
    const resultText = document.getElementById("resultText");
    const newGame = document.getElementById("newGame");
    const again = document.getElementById("again");

    const symbols = ["🍎", "🚗", "⭐", "🐶", "⚽", "🎵", "🌟", "🔥"];
    let cards = [];
    let first = null;
    let second = null;
    let lock = false;
    let moves = 0;
    let pairs = 0;
    let timer = null;
    let time = 0;
    let best = Number(localStorage.getItem("studtask_memory_best") || 0);

    bestEl.textContent = best || "—";

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startGame() {
      clearInterval(timer);
      cards = shuffle([...symbols, ...symbols]);
      first = null;
      second = null;
      lock = false;
      moves = 0;
      pairs = 0;
      time = 0;
      movesEl.textContent = "0";
      pairsEl.textContent = "0/8";
      bestEl.textContent = best || "—";
      message.textContent = "Match two cards to begin.";
      result.style.display = "none";
      board.innerHTML = "";

      cards.forEach((symbol, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        button.textContent = "?";
        button.dataset.index = index;
        button.addEventListener("click", () => flip(button, index));
        board.appendChild(button);
      });

      timer = setInterval(() => { time += 1; }, 1000);
    }

    function flip(card, index) {
      if (lock || card.classList.contains("matched") || card === first) return;

      card.textContent = cards[index];
      card.classList.add("open");

      if (!first) {
        first = card;
        return;
      }

      second = card;
      moves += 1;
      movesEl.textContent = moves;

      if (cards[Number(first.dataset.index)] === cards[index]) {
        first.classList.add("matched");
        second.classList.add("matched");
        first = null;
        second = null;
        pairs += 1;
        pairsEl.textContent = pairs + "/8";
        message.textContent = "✅ Match!";
        if (pairs === 8) finishGame();
      } else {
        message.textContent = "Try another pair.";
        lock = true;
        setTimeout(() => {
          first.textContent = "?";
          second.textContent = "?";
          first.classList.remove("open");
          second.classList.remove("open");
          first = null;
          second = null;
          lock = false;
        }, 700);
      }
    }

    function finishGame() {
      clearInterval(timer);
      const oldBest = best;

      if (!best || moves < best) {
        best = moves;
        localStorage.setItem("studtask_memory_best", best);
        bestEl.textContent = best;
      }

      finalMoves.textContent = moves + " moves";
      resultText.textContent = "You matched all 8 pairs in " + time + " seconds." + (!oldBest || moves < oldBest ? " New best!" : "");
      result.style.display = "block";
      message.textContent = "🎉 All pairs matched!";
    }

    newGame.addEventListener("click", startGame);
    again.addEventListener("click", startGame);
    startGame();
  </script>
  <script src="brand.js"></script>
</body>
</html>
