<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#fff;border:1px solid #e3eee7;border-radius:22px;padding:14px;box-shadow:0 6px 20px #1231}.card{height:72px;border:0;border-radius:14px;background:#159447;color:#fff;font-size:28px;font-weight:800;cursor:pointer;transition:transform .15s,background .15s}.card:active{transform:scale(.94)}.card.open,.card.matched{background:#eef9f1;color:#159447}.card.matched{box-shadow:inset 0 0 0 2px #159447}.message{text-align:center;min-height:25px;margin:14px 0;color:#159447;font-size:13px;font-weight:700}.btn{border:0;background:#159447;color:#fff;border-radius:13px;padding:12px 20px;font-weight:800;display:block;margin:16px auto 0}.result{display:none;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:38px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-width:350px){.card{height:62px;font-size:24px}.board{gap:7px;padding:10px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>🃏 Memory Match</h1><p>Find all the matching pairs!</p></section><section class="stats"><div class="stat"><b id="moves">0</b><span>MOVES</span></div><div class="stat"><b id="pairs">0/8</b><span>PAIRS</span></div><div class="stat"><b id="best">—</b><span>BEST</span></div></section><div class="board" id="board"></div><div class="message" id="message">Match two cards to begin.</div><button class="btn" id="newGame">NEW GAME</button><div class="result" id="result"><h2>🏆 You Won!</h2><div class="big" id="finalMoves">0</div><p id="resultText"></p><button class="btn" id="again">PLAY AGAIN</button></div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const board=document.getElementById("board"),movesEl=document.getElementById("moves"),pairsEl=document.getElementById("pairs"),bestEl=document.getElementById("best"),message=document.getElementById("message"),result=document.getElementById("result"),finalMoves=document.getElementById("finalMoves"),resultText=document.getElementById("resultText"),newGame=document.getElementById("newGame"),again=document.getElementById("again");const symbols=["🍎","🚗","⭐","🐶","⚽","🎵","🌟","🔥"];let cards=[],first=null,second=null,lock=false,moves=0,pairs=0,timer=null,time=0,best=Number(localStorage.getItem("ooulink_memory_best")||0);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}function startGame(){clearInterval(timer);cards=shuffle([...symbols,...symbols]);first=null;second=null;lock=false;moves=0;pairs=0;time=0;movesEl.textContent=0;pairsEl.textContent="0/8";bestEl.textContent=best||"—";message.textContent="Match two cards to begin.";result.style.display="none";board.innerHTML="";cards.forEach((symbol,i)=>{const b=document.createElement("button");b.className="card";b.textContent="?";b.dataset.index=i;b.onclick=()=>flip(b,i);board.appendChild(b)});timer=setInterval(()=>time++,1000)}function flip(card,index){if(lock||card.classList.contains("matched")||card===first)return;card.textContent=cards[index];card.classList.add("open");if(!first){first=card;return}second=card;moves++;movesEl.textContent=moves;if(cards[Number(first.dataset.index)]===cards[index]){first.classList.add("matched");second.classList.add("matched");first=null;second=null;pairs++;pairsEl.textContent=pairs+"/8";message.textContent="✅ Match!";if(pairs===8)finishGame()}else{message.textContent="Try another pair.";lock=true;setTimeout(()=>{first.textContent="?";second.textContent="?";first.classList.remove("open");second.classList.remove("open");first=null;second=null;lock=false},700)}}function finishGame(){clearInterval(timer);let old=best;if(!best||moves<best){best=moves;localStorage.setItem("ooulink_memory_best",best);bestEl.textContent=best}finalMoves.textContent=moves+" moves";resultText.textContent="You matched all 8 pairs in "+time+" seconds."+(!old||moves<old?" 🔥 New best!":"");result.style.display="block";message.textContent="🎉 All pairs matched!"}newGame.onclick=startGame;again.onclick=startGame;startGame();</script></body></html>
