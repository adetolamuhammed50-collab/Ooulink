<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Reset Password — StudTask</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}
.container{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#fff;padding:25px 20px 40px}
.back{display:inline-flex;align-items:center;color:#16834b;text-decoration:none;font-size:14px;margin-bottom:30px;padding:8px 10px;margin-left:-10px;border-radius:10px}
.logo{text-align:center;font-size:28px;font-weight:800;color:#16834b;margin-bottom:8px}
.subtitle{text-align:center;color:#777;font-size:14px;margin-bottom:30px}
.card{background:#fff;border:1px solid #e5e8e6;border-radius:16px;padding:22px;box-shadow:0 4px 15px rgba(0,0,0,.04)}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #d8ddda;border-radius:10px;font-size:15px;margin-bottom:18px;outline:none}
input:focus{border-color:#16834b;box-shadow:0 0 0 3px rgba(22,131,75,.1)}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#16834b;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px;text-align:center;line-height:1.4}
.error{display:block;background:#fff0f0;color:#b42318}
.success{display:block;background:#edf9f2;color:#16834b}
.hint{text-align:center;color:#777;font-size:12px;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<div class="container">
<a href="login.html" class="back">← Back to Login</a>
<div class="logo">StudTask</div>
<div class="subtitle" id="subtitle">Set a new password for your account.</div>
<div class="card">
<form id="resetForm">
<label for="password">New Password</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter a new password" required>
<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your new password" required>
<button type="submit" id="resetButton">UPDATE PASSWORD</button>
</form>
<div id="message" class="message"></div>
<div class="hint">Use at least 8 characters and choose a password you do not reuse elsewhere.</div>
</div>
</div>
<script>
const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const form = document.getElementById("resetForm");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const message = document.getElementById("message");
const button = document.getElementById("resetButton");
const subtitle = document.getElementById("subtitle");

function showMessage(text, type) {
  message.className = "message " + type;
  message.textContent = text;
}

let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    subtitle.textContent = "Choose a new password for your account.";
  }
});

(async () => {
  const { data } = await supabaseClient.auth.getSession();
  if (data?.session) {
    recoveryReady = true;
    subtitle.textContent = "Choose a new password for your account.";
  }
})();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (password.length < 8) {
    showMessage("Password must be at least 8 characters.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "UPDATING...";
  message.className = "message";
  message.textContent = "";

  try {
    if (!recoveryReady) {
      throw new Error("This password-reset link is invalid or has expired. Request a new reset email.");
    }

    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) throw error;

    showMessage("Password updated successfully. You can now log in with your new password.", "success");
    form.reset();
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1800);
  } catch (error) {
    showMessage(error.message || "Could not update your password. Please request a new reset email.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "UPDATE PASSWORD";
  }
});
</script>
<script src="brand.js"></script>
</body>
</html>
