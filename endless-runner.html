<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endless Runner • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.arena{height:390px;background:linear-gradient(#dff6e6 0 72%,#bde4c8 72%);border:2px solid #dcebe1;border-radius:22px;position:relative;overflow:hidden;touch-action:manipulation;box-shadow:0 6px 20px #1231}.ground{position:absolute;bottom:0;left:0;width:100%;height:28%;background:repeating-linear-gradient(90deg,#9bd0aa 0 35px,#a8d8b5 35px 70px)}.player{position:absolute;left:45px;bottom:28%;width:42px;height:52px;background:#159447;border-radius:14px 14px 8px 8px;font-size:27px;display:flex;align-items:center;justify-content:center;z-index:2}.player.jump{animation:jump .55s ease-out}@keyframes jump{0%{bottom:28%}45%{bottom:62%}100%{bottom:28%}}.obstacle{position:absolute;bottom:28%;right:-45px;width:38px;height:52px;background:#e26a43;border-radius:9px 9px 4px 4px;z-index:2}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#65736b;font-size:15px;background:#ffffffbb;z-index:4}.start{border:0;background:#159447;color:#fff;border-radius:14px;padding:13px 22px;font-weight:800;margin-top:10px}.result{display:none;text-align:center;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:38px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:12px 20px;font-weight:800}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-height:650px){.arena{height:330px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>🏃 Endless Runner</h1><p>Jump over obstacles and survive as long as possible!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="speed">1</b><span>SPEED</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="arena" id="arena"><div class="message" id="message"><div><div style="font-size:48px">🏃</div><div>Ready to run?</div><button class="start" id="start">START GAME</button></div></div><div class="player" id="player">🏃</div><div class="ground"></div></div><div class="result" id="result"><h2>💥 Game Over!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">Tap the game area to jump • Avoid the obstacles</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const arena=document.getElementById("arena"),player=document.getElementById("player"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),scoreEl=document.getElementById("score"),speedEl=document.getElementById("speed"),bestEl=document.getElementById("best"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");let running=false,score=0,speed=4,best=Number(localStorage.getItem("ooulink_runner_best")||0),obstacles=[],loop=null,spawn=null,jumping=false;bestEl.textContent=best;function jump(){if(!running||jumping)return;jumping=true;player.classList.remove("jump");void player.offsetWidth;player.classList.add("jump");setTimeout(()=>{jumping=false},550)}function collision(o){const a=player.getBoundingClientRect(),b=o.getBoundingClientRect();return a.left<b.right-7&&a.right>b.left+7&&a.top<b.bottom-7&&a.bottom>b.top+7}function endGame(){running=false;clearInterval(loop);clearInterval(spawn);obstacles.forEach(o=>o.remove());obstacles=[];finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_runner_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best!";}else resultText.textContent="You survived with a score of "+score+".";result.style.display="block";message.style.display="none"}function createObstacle(){if(!running)return;const o=document.createElement("div");o.className="obstacle";o.style.right="-45px";arena.appendChild(o);obstacles.push(o)}function startGame(){running=true;score=0;speed=4;scoreEl.textContent=0;speedEl.textContent=1;result.style.display="none";message.style.display="none";obstacles.forEach(o=>o.remove());obstacles=[];clearInterval(loop);clearInterval(spawn);spawn=setInterval(createObstacle,1300);loop=setInterval(()=>{obstacles.forEach((o,i)=>{let r=parseFloat(o.style.right)||-45;r+=speed;o.style.right=r+"px";if(r>arena.clientWidth+50){o.remove();obstacles.splice(i,1);score++;scoreEl.textContent=score;if(score%10===0){speed=Math.min(10,speed+.5);speedEl.textContent=Math.round(speed-3)}}else if(collision(o))endGame()})},30)}arena.addEventListener("pointerdown",e=>{if(e.target===start)return;jump()});start.onclick=startGame;again.onclick=startGame;</script></body></html>
