<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Test Payments - StudTask</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:480px;margin:auto;padding:18px 15px}.back{color:#16834b;text-decoration:none;font-size:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}h1{font-size:25px;margin-top:12px}.sub,.meta{font-size:11px;color:#687386;margin-top:5px}.item{padding:13px 0;border-top:1px solid #edf0f3}.item:first-child{border-top:0}.amount{font-size:20px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 13px;color:#fff;font-weight:800;font-size:11px;margin-top:10px;width:100%}.ok{background:#16834b}.fail{background:#b85c00}.input{width:100%;padding:11px;border:1px solid #dce2e8;border-radius:9px;margin-top:8px}.empty{padding:20px;text-align:center;color:#8993a3;font-size:11px}.msg{font-size:11px;color:#687386;margin-top:10px}.hint{font-size:10px;color:#8993a3;margin-top:8px}</style></head><body><main class="wrap"><a class="back" href="admin.html">← Back to Admin</a><h1>Test Payments</h1><p class="sub">Admin-only simulated provider. No real money is moved outside the test wallet.</p><section class="card"><div id="list"><div class="empty">Loading...</div></div><div id="msg" class="msg"></div></section></main><script>const U="https://dthvdxgxesomltlruogp.supabase.co",K="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",s=supabase.createClient(U,K),$=x=>document.getElementById(x),money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2});async function init(){const a=await s.auth.getSession();if(!a.data?.session){location.href="index.html";return}const uid=a.data.session.user.id;const ad=await s.from("admin_users").select("user_id").eq("user_id",uid).maybeSingle();if(ad.error||!ad.data){$("list").innerHTML="<div class=empty>Admin access required.</div>";return}load()}async function load(){const r=await s.from("deposit_requests").select("id,user_id,amount,status,provider,created_at").eq("status","pending").order("created_at",{ascending:true});if(r.error){$("list").textContent=r.error.message;return}if(!r.data?.length){$("list").innerHTML="<div class=empty>No pending test deposits.</div>";return}$("list").innerHTML=r.data.map(x=>`<div class=item><div class=amount>${money(x.amount)}</div><div class=meta>Deposit ID: ${x.id}<br>User: ${x.user_id}<br>${new Date(x.created_at).toLocaleString()}</div><input class=input id="ref_${x.id}" placeholder="Unique test provider reference"><button class="btn ok" onclick="process('${x.id}','completed')">CONFIRM SUCCESS</button><button class="btn fail" onclick="process('${x.id}','failed')">SIMULATE FAILURE</button><div class=hint>Success credits the wallet. Failure marks the payment failed without crediting it.</div></div>`).join("")}async function process(id,status){const ref=$("ref_"+id)?.value.trim();if(!ref){$("msg").textContent="Enter a unique provider reference.";return}$("msg").textContent="Processing...";const{error}=await s.rpc("test_process_deposit",{p_deposit_id:id,p_status:status,p_provider_reference:ref});if(error){$("msg").textContent=error.message;return}$("msg").textContent=status==='completed'?"Test payment completed and wallet credited.":"Test payment failed; wallet was not credited.";load()}init();</script></body></html>
