<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Chat • OOULink</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
  padding-bottom: 75px;
}

.header {
  background: white;
  padding: 15px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back {
  color: #2563eb;
  text-decoration: none;
  font-size: 14px;
  display: inline-block;
  margin-bottom: 10px;
}

.task-title {
  font-size: 19px;
  font-weight: bold;
  margin: 0;
}

.subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-top: 5px;
}

.realtime-status {
  font-size: 11px;
  margin-top: 6px;
}

.realtime-status.connected {
  color: #16a34a;
}

.realtime-status.warning {
  color: #d97706;
}

.files-section {
  background: white;
  margin: 12px;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.files-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
}

.file-card {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 11px;
  margin-bottom: 9px;
  background: #fafafa;
}

.file-card:last-child {
  margin-bottom: 0;
}

.file-name {
  font-size: 14px;
  font-weight: bold;
  word-break: break-word;
}

.file-size {
  font-size: 11px;
  color: #6b7280;
  margin-top: 3px;
}

.pdf-button {
  display: block;
  margin-top: 9px;
  padding: 10px;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
}

.pdf-button:active {
  transform: scale(0.98);
}

.no-files {
  color: #6b7280;
  font-size: 13px;
  text-align: center;
  padding: 8px;
}

.file-error {
  color: #dc2626;
  font-size: 13px;
  text-align: center;
  padding: 8px;
}

.messages {
  padding: 15px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.loading,
.empty,
.error {
  text-align: center;
  color: #6b7280;
  padding: 40px 15px;
}

.error {
  color: #dc2626;
}

.message-row {
  display: flex;
}

.message-row.mine {
  justify-content: flex-end;
}

.message-row.theirs {
  justify-content: flex-start;
}

.bubble {
  max-width: 78%;
  padding: 10px 13px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}

.mine .bubble {
  background: #2563eb;
  color: white;
  border-bottom-right-radius: 4px;
}

.theirs .bubble {
  background: white;
  color: #111827;
  border: 1px solid #e5e7eb;
  border-bottom-left-radius: 4px;
}

.time {
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.7;
  text-align: right;
}

.blocked-message {
  display: none;
  margin: 0 10px 8px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 12px;
  line-height: 1.4;
}

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #e5e7eb;
  padding: 10px;
  display: flex;
  gap: 8px;
  z-index: 20;
}

.composer input {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 22px;
  padding: 11px 14px;
  font-size: 14px;
  outline: none;
}

.composer input:focus {
  border-color: #2563eb;
}

.send-btn {
  border: none;
  background: #2563eb;
  color: white;
  padding: 0 18px;
  border-radius: 22px;
  font-weight: bold;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>

<body>

<div class="header">

<a
  href="javascript:history.back()"
  class="back"
>
  ← Back
</a>

<h1
  id="taskTitle"
  class="task-title"
>
  Loading...
</h1>

<div
  id="subtitle"
  class="subtitle"
></div>

<div
  id="realtimeStatus"
  class="realtime-status"
>
  Connecting to live chat...
</div>

</div>

<section class="files-section">

<div class="files-title">
  📎 Task Files
</div>

<div id="filesContainer">

<div class="no-files">
  Loading files...
</div>

</div>

</section>

<div
  id="messages"
  class="messages"
>

<div class="loading">
  Loading chat...
</div>

</div>

<div
  id="blockedMessage"
  class="blocked-message"
></div>

<form
  id="composer"
  class="composer"
>

<input
  id="messageInput"
  type="text"
  placeholder="Type a message..."
  autocomplete="off"
  maxlength="1000"
>

<button
  id="sendBtn"
  class="send-btn"
  type="submit"
>
  Send
</button>

</form>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   STATE
========================= */

let currentUser = null;
let currentTask = null;
let otherUserId = null;
let realtimeChannel = null;
let sending = false;

const params =
  new URLSearchParams(
    window.location.search
  );

const taskId =
  params.get("id");


/* =========================
   ELEMENTS
========================= */

const messagesBox =
  document.getElementById(
    "messages"
  );

const taskTitle =
  document.getElementById(
    "taskTitle"
  );

const subtitle =
  document.getElementById(
    "subtitle"
  );

const realtimeStatus =
  document.getElementById(
    "realtimeStatus"
  );

const filesContainer =
  document.getElementById(
    "filesContainer"
  );

const composer =
  document.getElementById(
    "composer"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const blockedMessage =
  document.getElementById(
    "blockedMessage"
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================
   FILE SIZE
========================= */

function formatFileSize(bytes) {

  if (!bytes) {
    return "";
  }

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {

    return (
      (bytes / 1024)
        .toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / (1024 * 1024))
      .toFixed(1) +
    " MB"
  );

}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

  if (!messagesBox) {
    return;
  }

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================
   NORMALIZE
========================= */

function normalizeForCheck(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(
      /[\u200B-\u200D\uFEFF]/g,
      ""
    );

}


/* =========================
   BAD WORD FILTER
========================= */

const blockedWords = [

  "fuck",
  "fucking",
  "fucked",
  "shit",
  "bullshit",
  "bitch",
  "bastard",
  "asshole",
  "dickhead",
  "motherfucker",
  "slut",
  "whore"

];


/* =========================
   CONTACT FILTER
========================= */

function containsContactInfo(text) {

  const normalized =
    normalizeForCheck(text);


  /* WhatsApp */

  if (
    normalized.includes(
      "whatsapp"
    ) ||
    normalized.includes(
      "wa.me"
    )
  ) {

    return true;

  }


  /*
    Remove common separators
    before checking numbers.
  */

  const digitsOnly =
    normalized.replace(
      /[\s().+\-]/g,
      ""
    );


  /* Nigerian phone numbers */

  const nigerianPhone =
    /(?:234|0)(?:70|80|81|90|91)\d{8}/;

  if (
    nigerianPhone.test(
      digitsOnly
    )
  ) {

    return true;

  }


  /*
    Long number sequences.
  */

  const longNumber =
    /\d{10,}/;

  if (
    longNumber.test(
      digitsOnly
    )
  ) {

    return true;

  }


  /*
    Account-number wording.
  */

  const accountPattern =
    /\b(?:account|acct|account\s*no|account\s*number)\b[\s:#-]*\d{8,}/i;

  if (
    accountPattern.test(text)
  ) {

    return true;

  }


  return false;

}


/* =========================
   VALIDATE MESSAGE
========================= */

function validateMessage(text) {

  const normalized =
    normalizeForCheck(text);


  if (!normalized.trim()) {

    return {
      allowed: false,
      reason:
        "Please type a message."
    };

  }


  /*
    Bad language.
  */

  for (
    const word of blockedWords
  ) {

    const pattern =
      new RegExp(
        `(^|[^a-z])${word}([^a-z]|$)`,
        "i"
      );

    if (
      pattern.test(
        normalized
      )
    ) {

      return {
        allowed: false,
        reason:
          "Please keep the chat respectful. That language isn't allowed on OOULink."
      };

    }

  }


  /*
    Contact information.
  */

  if (
    containsContactInfo(text)
  ) {

    return {
      allowed: false,
      reason:
        "For your safety, phone numbers, bank/account numbers and WhatsApp/contact details cannot be shared in OOULink chat."
    };

  }


  return {
    allowed: true,
    reason: ""
  };

}


/* =========================
   SHOW BLOCKED MESSAGE
========================= */

let blockedTimer = null;

function showBlockedMessage(message) {

  if (!blockedMessage) {
    return;
  }

  blockedMessage.textContent =
    "⚠️ " + message;

  blockedMessage.style.display =
    "block";

  clearTimeout(
    blockedTimer
  );

  blockedTimer =
    setTimeout(
      () => {

        blockedMessage.style.display =
          "none";

        blockedMessage.textContent =
          "";

      },
      5000
    );

}


/* =========================
   LOAD TASK
========================= */

async function loadTask() {

  if (!taskId) {

    throw new Error(
      "No chat task was specified."
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("tasks")
      .select(`
        id,
        user_id,
        runner_id,
        title,
        status
      `)
      .eq(
        "id",
        taskId
      )
      .single();


  if (
    error ||
    !data
  ) {

    console.error(
      "Task loading error:",
      error
    );

    throw new Error(
      "Task could not be found."
    );

  }


  currentTask =
    data;


  /*
    Chat only becomes available
    after acceptance.
  */

  if (
    !currentTask.runner_id
  ) {

    throw new Error(
      "This task has not been accepted yet."
    );

  }


  /*
    Only participants can chat.
  */

  if (
    currentUser.id !==
      currentTask.user_id &&
    currentUser.id !==
      currentTask.runner_id
  ) {

    throw new Error(
      "You are not part of this task."
    );

  }


  if (
    currentUser.id ===
    currentTask.user_id
  ) {

    otherUserId =
      currentTask.runner_id;

    subtitle.textContent =
      "Chatting with the task runner";

  } else {

    otherUserId =
      currentTask.user_id;

    subtitle.textContent =
      "Chatting with the task poster";

  }


  taskTitle.textContent =
    currentTask.title;

}


/* =========================
   LOAD TASK FILES
========================= */

async function loadTaskFiles() {

  if (!filesContainer) {
    return;
  }

  filesContainer.innerHTML =
    `<div class="loading">
      Loading files...
    </div>`;


  const {
    data: files,
    error
  } =
    await supabaseClient
      .from("task_attachments")
      .select(`
        id,
        file_name,
        file_path,
        file_size,
        mime_type,
        created_at
      `)
      .eq(
        "task_id",
        currentTask.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "File loading error:",
      error
    );

    filesContainer.innerHTML =
      `<div class="file-error">
        Unable to load files.
      </div>`;

    return;

  }


  if (
    !files ||
    files.length === 0
  ) {

    filesContainer.innerHTML =
      `<div class="no-files">
        No files attached.
      </div>`;

    return;

  }


  filesContainer.innerHTML =
    "";


  for (
    const file of files
  ) {

    const {
      data: signed,
      error: signedError
    } =
      await supabaseClient
        .storage
        .from("TaskFiles")
        .createSignedUrl(
          file.file_path,
          600
        );


    if (
      signedError ||
      !signed?.signedUrl
    ) {

      continue;

    }


    const card =
      document.createElement(
        "div"
      );

    card.className =
      "file-card";


    card.innerHTML = `

      <div class="file-name">
        📄 ${escapeHTML(
          file.file_name
        )}
      </div>

      <div class="file-size">
        ${formatFileSize(
          file.file_size
        )}
      </div>

      <a
        class="pdf-button"
        href="${signed.signedUrl}"
        target="_blank"
        rel="noopener noreferrer"
      >
        VIEW PDF
      </a>

    `;


    filesContainer.appendChild(
      card
    );

  }

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(message) {

  if (
    !messagesBox ||
    !message ||
    !currentUser
  ) {

    return;

  }


  /*
    Prevent duplicates.
  */

  if (
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ) {

    return;

  }


  const mine =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement(
      "div"
    );


  /*
    IMPORTANT:
    Your CSS uses "mine"
    and "theirs".
  */

  row.className =
    mine
      ? "message-row mine"
      : "message-row theirs";


  row.dataset.messageId =
    message.id;


  /*
    IMPORTANT:
    Your CSS uses .bubble
    and .time.
  */

  row.innerHTML = `

    <div class="bubble">

      ${escapeHTML(
        message.message
      )}

      <div class="time">
        ${formatTime(
          message.created_at
        )}
      </div>

    </div>

  `;


  messagesBox.appendChild(
    row
  );

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  if (
    !currentTask ||
    !currentUser ||
    !messagesBox
  ) {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(`
        id,
        task_id,
        sender_id,
        receiver_id,
        message,
        is_read,
        created_at
      `)
      .eq(
        "task_id",
        currentTask.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Message loading error:",
      error
    );

    messagesBox.innerHTML =
      `<div class="error">
        Unable to load messages.
      </div>`;

    return;

  }


  messagesBox.innerHTML =
    "";


  for (
    const message of
    data || []
  ) {

    renderMessage(
      message
    );

  }


  scrollToBottom();


  /*
    Mark received messages
    as read.
  */

  const unread =
    (data || [])
      .filter(
        message =>
          message.receiver_id ===
            currentUser.id &&
          !message.is_read
      )
      .map(
        message =>
          message.id
      );


  if (
    unread.length > 0
  ) {

    const {
      error:
        readError
    } =
      await supabaseClient
        .from("messages")
        .update({
          is_read: true
        })
        .in(
          "id",
          unread
        );


    if (readError) {

      console.warn(
        "Could not mark messages read:",
        readError
      );

    }

  }

}


/* =========================
   REALTIME
========================= */

function startRealtime() {

  if (
    !currentTask ||
    !currentUser
  ) {

    return;

  }


  if (
    realtimeChannel
  ) {

    return;

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "ooulink-chat-" +
        currentTask.id
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            `task_id=eq.${currentTask.id}`
        },
        async payload => {

          const message =
            payload.new;


          if (
            !message ||
            message.task_id !==
              currentTask.id
          ) {

            return;

          }


          renderMessage(
            message
          );

          scrollToBottom();


          /*
            If the message was
            sent to us, mark it read.
          */

          if (
            message.receiver_id ===
              currentUser.id &&
            !message.is_read
          ) {

            await supabaseClient
              .from("messages")
              .update({
                is_read: true
              })
              .eq(
                "id",
                message.id
              );

          }

        }
      )
      .subscribe(
        status => {

          console.log(
            "Chat realtime:",
            status
          );


          if (
            !realtimeStatus
          ) {
            return;
          }


          if (
            status ===
            "SUBSCRIBED"
          ) {

            realtimeStatus.textContent =
              "🟢 Live chat connected";

            realtimeStatus.className =
              "realtime-status connected";

          } else if (
            status ===
            "CHANNEL_ERROR"
          ) {

            realtimeStatus.textContent =
              "⚠️ Live chat connection error";

            realtimeStatus.className =
              "realtime-status warning";

          } else if (
            status ===
            "TIMED_OUT"
          ) {

            realtimeStatus.textContent =
              "⚠️ Live chat connection timed out";

            realtimeStatus.className =
              "realtime-status warning";

          }

        }
      );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  if (
    sending ||
    !currentTask ||
    !otherUserId ||
    !currentUser
  ) {

    return;

  }


  const text =
    messageInput.value.trim();


  if (!text) {

    return;

  }


  const validation =
    validateMessage(
      text
    );


  if (
    !validation.allowed
  ) {

    showBlockedMessage(
      validation.reason
    );

    return;

  }


  sending = true;

  sendBtn.disabled =
    true;

  const originalText =
    sendBtn.textContent;

  sendBtn.textContent =
    "Sending...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          task_id:
            currentTask.id,

          sender_id:
            currentUser.id,

          receiver_id:
            otherUserId,

          message:
            text
        })
        .select(`
          id,
          task_id,
          sender_id,
          receiver_id,
          message,
          is_read,
          created_at
        `)
        .single();


    if (error) {

      console.error(
        "Send message error:",
        error
      );

      showBlockedMessage(
        "Message could not be sent. Please try again."
      );

      return;

    }


    /*
      Show immediately.
      Realtime won't duplicate it
      because of the ID check.
    */

    if (data) {

      renderMessage(
        data
      );

      scrollToBottom();

    }


    messageInput.value =
      "";


    /*
      Create notification
      for the other participant.
    */

    const {
      error:
        notificationError
    } =
      await supabaseClient
        .from("notifications")
        .insert({
          user_id:
            otherUserId,

          task_id:
            currentTask.id,

          type:
            "new_message",

          title:
            "New message",

          message:
            `You received a new message about "${currentTask.title}".`
        });


    if (
      notificationError
    ) {

      console.warn(
        "Notification error:",
        notificationError
      );

    }

  } finally {

    sendBtn.disabled =
      false;

    sendBtn.textContent =
      originalText;

    sending = false;

  }

}


/* =========================
   FORM SUBMIT
========================= */

if (composer) {

  composer.addEventListener(
    "submit",
    event => {

      event.preventDefault();

      sendMessage();

    }
  );

}


/* =========================
   ENTER TO SEND
========================= */

if (messageInput) {

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );

}


/* =========================
   START CHAT
========================= */

async function startChat() {

  try {

    if (
      !taskId
    ) {

      throw new Error(
        "No chat task was specified."
      );

    }


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth
        .getSession();


    if (
      !session
    ) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      session.user;


    await loadTask();


    await Promise.all([
      loadTaskFiles(),
      loadMessages()
    ]);


    startRealtime();


  } catch (error) {

    console.error(
      "Chat startup error:",
      error
    );


    if (messagesBox) {

      messagesBox.innerHTML = `

        <div class="error">

          ❌ ${escapeHTML(
            error.message ||
            "Unable to load chat."
          )}

        </div>

      `;

    }


    if (messageInput) {

      messageInput.disabled =
        true;

    }


    if (sendBtn) {

      sendBtn.disabled =
        true;

    }

  }

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      realtimeChannel
    ) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);


/* =========================
   START APP
========================= */

startChat();

</script>

</body>
</html>
