<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat • OOULink</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 75px;
    }

    .header {
      background: white;
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .task-title {
      font-size: 19px;
      font-weight: bold;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-top: 5px;
    }

    .messages {
      padding: 15px;
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      color: #6b7280;
      padding: 40px 15px;
    }

    .error {
      color: #dc2626;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .theirs .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .time {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.7;
      text-align: right;
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 10px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .composer input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 22px;
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
    }

    .composer input:focus {
      border-color: #2563eb;
    }

    .send-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 18px;
      border-radius: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="javascript:history.back()" class="back">← Back</a>

    <h1 id="taskTitle" class="task-title">Loading...</h1>
    <div id="subtitle" class="subtitle"></div>
  </div>

  <div id="messages" class="messages">
    <div class="loading">Loading chat...</div>
  </div>

  <form id="composer" class="composer">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
      maxlength="1000"
    >

    <button id="sendBtn" class="send-btn" type="submit">
      Send
    </button>
  </form>

  <script>
    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentTask = null;
    let otherUserId = null;

    const params = new URLSearchParams(window.location.search);
    const taskId = params.get("id");

    const messagesBox = document.getElementById("messages");
    const taskTitle = document.getElementById("taskTitle");
    const subtitle = document.getElementById("subtitle");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(dateString) {
      const date = new Date(dateString);

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function scrollToBottom() {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function loadTask() {
      const { data, error } = await supabaseClient
        .from("tasks")
        .select(`
          id,
          user_id,
          runner_id,
          title,
          status
        `)
        .eq("id", taskId)
        .single();

      if (error || !data) {
        throw new Error("Task could not be found.");
      }

      currentTask = data;

      // Chat is only available when a runner has accepted the task.
      if (!currentTask.runner_id) {
        throw new Error("This task has not been accepted yet.");
      }

      if (
        currentUser.id !== currentTask.user_id &&
        currentUser.id !== currentTask.runner_id
      ) {
        throw new Error("You are not part of this task.");
      }

      if (currentUser.id === currentTask.user_id) {
        otherUserId = currentTask.runner_id;
        subtitle.textContent = "Chatting with the task runner";
      } else {
        otherUserId = currentTask.user_id;
        subtitle.textContent = "Chatting with the task poster";
      }

      taskTitle.textContent = currentTask.title;
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from("messages")
        .select(`
          id,
          sender_id,
          receiver_id,
          message,
          is_read,
          created_at
        `)
        .eq("task_id", currentTask.id)
        .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        messagesBox.innerHTML =
          '<div class="error">Could not load messages.</div>';
        return;
      }

      if (!data || data.length === 0) {
        messagesBox.innerHTML =
          '<div class="empty">No messages yet.<br>Start the conversation 👋</div>';
        return;
      }

      messagesBox.innerHTML = data.map(msg => {
        const mine = msg.sender_id === currentUser.id;

        return `
          <div class="message-row ${mine ? "mine" : "theirs"}">
            <div class="bubble">
              ${escapeHTML(msg.message)}
              <div class="time">
                ${formatTime(msg.created_at)}
              </div>
            </div>
          </div>
        `;
      }).join("");

      scrollToBottom();

      // Mark messages sent to the current user as read.
      await supabaseClient
        .from("messages")
        .update({ is_read: true })
        .eq("task_id", currentTask.id)
        .eq("receiver_id", currentUser.id)
        .eq("is_read", false);
    }

    async function sendMessage() {
      const text = messageInput.value.trim();

      if (!text || !otherUserId) return;

      sendBtn.disabled = true;

      const { error } = await supabaseClient
        .from("messages")
        .insert({
          task_id: currentTask.id,
          sender_id: currentUser.id,
          receiver_id: otherUserId,
          message: text
        });

      if (error) {
        console.error(error);
        alert("Could not send message: " + error.message);
        sendBtn.disabled = false;
        return;
      }

      // Create a notification for the other participant.
      const { error: notificationError } = await supabaseClient
        .from("notifications")
        .insert({
          user_id: otherUserId,
          task_id: currentTask.id,
          type: "new_message",
          title: "New message",
          message: `You received a new message about "${currentTask.title}".`
        });

      if (notificationError) {
        console.error(
          "Message sent, but notification failed:",
          notificationError
        );
      }

      messageInput.value = "";
      sendBtn.disabled = false;

      await loadMessages();
      messageInput.focus();
    }

    composer.addEventListener("submit", async function(event) {
      event.preventDefault();
      await sendMessage();
    });

    async function start() {
      if (!taskId) {
        messagesBox.innerHTML =
          '<div class="error">No task was specified.</div>';
        composer.style.display = "none";
        return;
      }

      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError || !sessionData.session) {
        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(window.location.href);
        return;
      }

      currentUser = sessionData.session.user;

      try {
        await loadTask();
        await loadMessages();

        // Refresh messages periodically.
        setInterval(loadMessages, 5000);

      } catch (error) {
        console.error(error);

        messagesBox.innerHTML =
          `<div class="error">${escapeHTML(error.message)}</div>`;

        composer.style.display = "none";
      }
    }

    start();
  </script>

</body>
</html>
