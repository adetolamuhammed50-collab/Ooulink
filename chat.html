s">Loading files...</div></div></section><div id="messages" class="messages"><div class="loading">Loading chat...</div></div><div id="blockedMessage" class="blocked-message"></div><form id="composer" class="composer"><input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" maxlength="1000"><button id="sendBtn" class="send-btn" type="submit">Send</button></form><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,currentTask=null,otherUserId=null,realtimeChannel=null,sending=false,lastSentText="",lastSentAt=0,blockedTimer=null;const params=new URLSearchParams(location.search),taskId=params.get("id"),messagesBox=document.getElementById("messages"),taskTitle=document.getElementById("taskTitle"),subtitle=document.getElementById("subtitle"),realtimeStatus=document.getElementById("realtimeStatus"),filesContainer=document.getElementById("filesContainer"),composer=document.getElementById("composer"),messageInput=document.getElementById("messageInput"),sendBtn=document.getElementById("sendBtn"),blockedMessage=document.getElementById("blockedMessage");function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function formatTime(v){return new Date(v).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}function formatFileSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB"}function scrollToBottom(){if(messagesBox)messagesBox.scrollTop=messagesBox.scrollHeight}function normalizeForCheck(t){return String(t||"").toLowerCase().normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g,"")}const blockedWords=["fuck","fucking","fucked","shit","bullshit","bitch","bastard","asshole","dickhead","motherfucker","slut","whore"];function containsContactInfo(text){const n=normalizeForCheck(text);if(n.includes("whatsapp")||n.includes("wa.me"))return true;const d=n.replace(/[\s().+\-]/g,"");if(/(?:234|0)(?:70|80|81|90|91)\d{8}/.test(d)||/\d{10,}/.test(d)||/\b(?:account|acct|account\s*no|account\s*number)\b[\s:#-]*\d{8,}/i.test(text))return true;return false}function validateMessage(text){const n=normalizeForCheck(text);if(!n.trim())return{allowed:false,reason:"Please type a message."};if(n.length>1000)return{allowed:false,reason:"Message is too long. Please keep it under 1,000 characters."};for(const word of blockedWords)if(new RegExp(`(^|[^a-z])${word}([^a-z]|$)`,"i").test(n))return{allowed:false,reason:"Please keep the chat respectful. That language isn't allowed on OOULink."};if(containsContactInfo(text))return{allowed:false,reason:"For your safety, phone numbers, bank/account numbers and WhatsApp/contact details cannot be shared in OOULink chat."};return{allowed:true,reason:""}}function showBlockedMessage(msg){if(!blockedMessage)return;blockedMessage.textContent="⚠️ "+msg;blockedMessage.style.display="block";clearTimeout(blockedTimer);blockedTimer=setTimeout(()=>{blockedMessage.style.display="none";blockedMessage.textContent=""},5000)}let moderationBlocked=false;function showModerationScreen(d){if(moderationBlocked)return;moderationBlocked=true;const temporary=d.ban_type==="temporary",until=temporary&&d.banned_until?new Date(d.banned_until).toLocaleString():null;document.body.innerHTML=`<div class="restricted"><div class="restricted-box"><div class="restricted-icon">🚫</div><h2>OOULink Account Restricted</h2><p>Your account is currently ${temporary?"temporarily":"permanently"} restricted and cannot use chat.</p>${until?`<p><strong>Restriction ends:</strong><br>${escapeHTML(until)}</p>`:""}${d.ban_reason?`<p><strong>Reason:</strong><br>${escapeHTML(d.ban_reason)}</p>`:""}<p>If you believe this action was made in error, contact OOULink support.</p><button class="logout-btn" onclick="logoutModerated()">LOG OUT</button></div></div>`}async function logoutModerated(){await supabaseClient.auth.signOut();location.href="login.html"}async function checkModeration(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return false}const{data,error}=await supabaseClient.from("user_moderation").select("status,ban_type,banned_until,ban_reason").eq("user_id",session.user.id).maybeSingle();if(error)return true;if(data?.status==="banned"){const active=data.ban_type==="permanent"||(data.ban_type==="temporary"&&data.banned_until&&new Date(data.banned_until)>new Date());if(active){showModerationScreen(data);return false}}return true}async function loadTask(){if(!taskId)throw new Error("No chat task was specified.");const{data,error}=await supabaseClient.from("tasks").select("id,user_id,runner_id,title,status").eq("id",taskId).single();if(error||!data){console.error("Task loading error:",error);throw new Error("Task could not be found.")}currentTask=data;if(!currentTask.runner_id)throw new Error("This task has not been accepted yet.");if(currentUser.id!==currentTask.user_id&&currentUser.id!==currentTask.runner_id)throw new Error("You are not part of this task.");if(currentUser.id===currentTask.user_id){otherUserId=currentTask.runner_id;subtitle.textContent="Chatting with the task runner"}else{otherUserId=currentTask.user_id;subtitle.textContent="Chatting with the task poster"}taskTitle.textContent=currentTask.title}async function loadTaskFiles(){if(!filesContainer)return;filesContainer.innerHTML='<div class="loading">Loading files...</div>';const{data:files,error}=await supabaseClient.from("task_attachments").select("id,file_name,file_path,file_size,mime_type,created_at").eq("task_id",currentTask.id).order("created_at",{ascending:true});if(error){console.error("File loading error:",error);filesContainer.innerHTML='<div class="file-error">Unable to load files.</div>';return}if(!files?.length){filesContainer.innerHTML='<div class="no-files">No files attached.</div>';return}filesContainer.innerHTML="";for(const file of files){const{data:signed,error:signedError}=await supabaseClient.storage.from("TaskFiles").createSignedUrl(file.file_path,600);if(signedError||!signed?.signedUrl)continue;const card=document.createElement("div");card.className="file-card";card.innerHTML=`<div class="file-name">📄 ${escapeHTML(file.file_name)}</div><div class="file-size">${formatFileSize(file.file_size)}</div><a class="pdf-button" href="${signed.signedUrl}" target="_blank" rel="noopener noreferrer">VIEW FILE</a>`;filesContainer.appendChild(card)}}function renderMessage(message){if(!messagesBox||!message||!currentUser)return;if(document.querySelector(`[data-message-id="${CSS.escape(String(message.id))}"]`))return;const mine=message.sender_id===currentUser.id,row=document.createElement("div");row.className=mine?"message-row mine":"message-row theirs";row.dataset.messageId=message.id;const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=message.message;const time=document.createElement("div");time.className="time";time.textContent=formatTime(message.created_at);bubble.appendChild(time);row.appendChild(bubble);messagesBox.appendChild(row)}async function loadMessages(){if(!currentTask||!currentUser)return;const{data,error}=await supabaseClient.from("messages").select("id,task_id,sender_id,receiver_id,message,is_read,created_at").eq("task_id",currentTask.id).order("created_at",{ascending:true});if(error){console.error("Message loading error:",error);messagesBox.innerHTML='<div class="error">Unable to load messages.</div>';return}messagesBox.innerHTML="";if(!data?.length)messagesBox.innerHTML='<div class="empty">No messages yet. Start the conversation.</div>';for(const message of data||[])renderMessage(message);scrollToBottom();const unread=(data||[]).filter(m=>m.receiver_id===currentUser.id&&!m.is_read).map(m=>m.id);if(unread.length){const{error:readError}=await supabaseClient.from("messages").update({is_read:true}).in("id",unread);if(readError)console.warn("Could not mark messages read:",readError)}}function startRealtime(){if(!currentTask||!currentUser||realtimeChannel)return;realtimeChannel=supabaseClient.channel("ooulink-chat-"+currentTask.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`task_id=eq.${currentTask.id}`},async payload=>{const message=payload.new;if(!message||message.task_id!==currentTask.id)return;if(message.sender_id!==currentUser.id&&message.receiver_id!==currentUser.id)return;renderMessage(message);scrollToBottom();if(message.receiver_id===currentUser.id&&!message.is_read){const{error}=await supabaseClient.from("messages").update({is_read:true}).eq("id",message.id);if(error)console.warn("Read update error:",error)}}).subscribe(status=>{if(!realtimeStatus)return;if(status==="SUBSCRIBED"){realtimeStatus.textContent="🟢 Live chat connected";realtimeStatus.className="realtime-status connected"}else if(status==="CHANNEL_ERROR"){realtimeStatus.textContent="⚠️ Live chat connection error";realtimeStatus.className="realtime-status warning"}else if(status==="TIMED_OUT"){realtimeStatus.textContent="⚠️ Live chat connection timed out";realtimeStatus.className="realtime-status warning"}})}async function sendMessage(){if(sending||!currentTask||!otherUserId||!currentUser)return;const text=messageInput.value.trim();if(!text)return;const validation=validateMessage(text);if(!validation.allowed){showBlockedMessage(validation.reason);return}const now=Date.now();if(now-lastSentAt<900){showBlockedMessage("⚡ Please slow down and wait a moment before sending again.");return}if(text===lastSentText&&now-lastSentAt<10000){showBlockedMessage("⚡ That message was already sent. Please type something new.");return}sending=true;sendBtn.disabled=true;const originalText=sendBtn.textContent;sendBtn.textContent="Sending...";try{const{data,error}=await supabaseClient.from("messages").insert({task_id:currentTask.id,sender_id:currentUser.id,receiver_id:otherUserId,message:text}).select("id,task_id,sender_id,receiver_id,message,is_read,created_at").single();if(error){console.error("Send message error:",error);const msg=error.message||"";if(msg.includes("OOULINK_RATE_LIMITED"))showBlockedMessage(msg.split("OOULINK_RATE_LIMITED:")[1]||"You are sending messages too quickly. Please wait before sending another message.");else if(msg.includes("OOULINK_ACCOUNT_BANNED")){showBlockedMessage("Your account is currently restricted.");await checkModeration()}else showBlockedMessage("Message could not be sent. Please try again.");return}lastSentText=text;lastSentAt=Date.now();if(data){renderMessage(data);scrollToBottom()}messageInput.value="";const{error:notificationError}=await supabaseClient.from("notifications").insert({user_id:otherUserId,task_id:currentTask.id,type:"new_message",title:"New message",message:`You received a new message about "${currentTask.title}".`});if(notificationError)console.warn("Notification error:",notificationError)}finally{sendBtn.disabled=false;sendBtn.textContent=originalText;sending=false}}composer?.addEventListener("submit",e=>{e.preventDefault();sendMessage()});messageInput?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});async function startChat(){try{if(!taskId)throw new Error("No chat task was specified.");const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return}currentUser=session.user;if(!(await checkModeration()))return;await loadTask();await Promise.all([loadTaskFiles(),loadMessages()]);startRealtime()}catch(error){console.error("Chat startup error:",error);if(messagesBox)messagesBox.innerHTML=`<div class="error">❌ ${escapeHTML(error.message||"Unable to load chat.")}</div>`;if(messageInput)messageInput.disabled=true;if(sendBtn)sendBtn.disabled=true}}window.addEventListener("beforeunload",()=>{if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel)});sta
