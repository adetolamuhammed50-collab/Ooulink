<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat - StudTask</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #111827; padding-bottom: 160px; }
    .app { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; background: #f5f7fb; }
    .header { position: sticky; top: 0; z-index: 20; background: #16834b; color: #fff; padding: 12px 16px 15px; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .back { display: inline-flex; align-items: center; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 10px; margin: -6px 0 5px -10px; border-radius: 10px; transition: transform .16s ease, background .18s ease; }
    .back:hover { background: rgba(255,255,255,.12); }
    .back:active { transform: scale(.95); }
    .chat-person { display: flex; align-items: center; gap: 11px; min-width: 0; color: #fff; text-decoration: none; border-radius: 14px; padding: 7px; margin-left: -7px; }
    .chat-person:hover { background: rgba(255,255,255,.1); }
    .avatar { width: 48px; height: 48px; flex: none; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.72); display: grid; place-items: center; overflow: hidden; font-size: 18px; font-weight: 800; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .person-info { min-width: 0; flex: 1; }
    .person-name, .person-handle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person-name { font-size: 16px; font-weight: 800; }
    .person-handle { margin-top: 3px; font-size: 11px; color: rgba(255,255,255,.78); }
    .profile-hint { flex: none; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.82); }
    .task-title, .realtime-status { padding-left: 66px; word-break: break-word; }
    .task-title { margin-top: 8px; font-size: 13px; font-weight: 700; line-height: 1.3; }
    .realtime-status { margin-top: 5px; font-size: 10px; color: rgba(255,255,255,.76); }
    .realtime-status.connected { color: #dcfce7; }
    .realtime-status.warning { color: #fef3c7; }
    .content { padding-bottom: 12px; }
    .files-section { margin: 12px; padding: 14px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .files-title { margin-bottom: 10px; font-size: 16px; font-weight: 700; }
    .file-card { padding: 11px; margin-bottom: 9px; background: #fafafa; border: 1px solid #e5e7eb; border-radius: 10px; }
    .file-card:last-child { margin-bottom: 0; }
    .file-name { font-size: 14px; font-weight: 700; word-break: break-word; }
    .file-size { margin-top: 3px; color: #6b7280; font-size: 11px; }
    .pdf-button, .attachment-link { display: block; margin-top: 9px; padding: 10px; background: #16834b; color: #fff; border-radius: 8px; text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; }
    .no-files, .file-error { padding: 8px; color: #6b7280; font-size: 13px; text-align: center; }
    .file-error { color: #dc2626; }
    .messages { display: flex; flex-direction: column; gap: 8px; min-height: 300px; padding: 15px 12px; overflow-wrap: anywhere; }
    .loading, .empty, .error { padding: 40px 15px; color: #6b7280; text-align: center; }
    .error { color: #dc2626; }
    .date-separator { display: flex; align-items: center; gap: 9px; margin: 12px 0 4px; color: #9ca3af; font-size: 10px; font-weight: 700; }
    .date-separator::before, .date-separator::after { content: ""; height: 1px; flex: 1; background: #e5e7eb; }
    .message-row { display: flex; animation: messageIn .2s ease both; }
    .message-row.mine { justify-content: flex-end; }
    .message-row.theirs { justify-content: flex-start; }
    .message-wrap { max-width: 82%; }
    .bubble { padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 2px 6px rgba(0,0,0,.04); }
    .mine .bubble { background: #16834b; color: #fff; border-bottom-right-radius: 4px; }
    .theirs .bubble { background: #fff; color: #111827; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
    .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 4px; font-size: 10px; opacity: .72; }
    .message-status.failed { color: #dc2626; }
    .retry-btn { border: 0; background: transparent; color: #dc2626; font-size: 10px; font-weight: 700; padding: 0; cursor: pointer; }
    .message-attachment { margin-top: 8px; overflow: hidden; border-radius: 10px; background: rgba(0,0,0,.08); }
    .message-attachment img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
    .attachment-link { margin: 0; border-radius: 0; background: rgba(0,0,0,.14); }
    .blocked-message { display: none; margin: 0 10px 8px; padding: 10px 12px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; color: #9a3412; font-size: 12px; line-height: 1.4; }
    .selected-file { display: none; margin: 0 10px 8px; padding: 9px 11px; background: #eef8f2; border: 1px solid #ccebd8; border-radius: 10px; font-size: 12px; }
    .selected-file strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-file { float: right; border: 0; background: transparent; color: #dc2626; font-weight: 700; cursor: pointer; }
    .composer { position: fixed; left: 50%; bottom: 74px; z-index: 40; display: flex; flex-wrap: wrap; width: 100%; max-width: 480px; gap: 8px; padding: 10px; background: rgba(255,255,255,.97); border-top: 1px solid #e5e7eb; box-shadow: 0 -4px 14px rgba(0,0,0,.05); transform: translateX(-50%); backdrop-filter: blur(12px); }
    .composer input[type="text"] { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 22px; outline: none; background: #fff; font-size: 14px; }
    .composer input[type="text"]:focus { border-color: #16834b; box-shadow: 0 0 0 3px rgba(22,131,75,.1); }
    .attach-btn { width: 44px; flex: none; border: 1px solid #d1d5db; border-radius: 50%; background: #fff; color: #16834b; font-size: 18px; cursor: pointer; }
    .send-btn { flex: none; min-width: 74px; border: 0; border-radius: 22px; background: #16834b; color: #fff; padding: 0 18px; font-weight: 700; cursor: pointer; }
    .send-btn:disabled, .attach-btn:disabled { opacity: .5; cursor: not-allowed; }
    .restricted { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.62); }
    .restricted-box { width: 100%; max-width: 420px; padding: 28px 22px; background: #fff; border-radius: 20px; text-align: center; }
    .restricted-icon { font-size: 48px; }
    .restricted-box h2 { margin: 12px 0 8px; }
    .restricted-box p { color: #4b5563; font-size: 14px; line-height: 1.5; }
    .logout-btn { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #16834b; color: #fff; font-weight: 700; cursor: pointer; }
    .nav { position: fixed; left: 50%; bottom: 0; z-index: 50; display: flex; width: 100%; max-width: 480px; height: 74px; padding: 7px 8px calc(7px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid #e5e7eb; box-shadow: 0 -5px 18px rgba(0,0,0,.08); transform: translateX(-50%); backdrop-filter: blur(14px); }
    .nav-link { position: relative; display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: center; justify-content: center; gap: 3px; margin: 0 2px; padding: 7px 4px; border-radius: 13px; color: #6b7280; background: transparent; text-decoration: none; font-size: 10px; font-weight: 700; }
    .nav-link.active { color: #16834b; background: #eef8f2; }
    .nav-link.active::before { content: ""; position: absolute; top: 2px; left: 50%; width: 24px; height: 3px; border-radius: 4px; background: #16834b; transform: translateX(-50%); }
    .nav-icon { display: grid; place-items: center; min-height: 24px; font-size: 20px; }
    @keyframes messageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <a href="javascript:history.back()" class="back">← Back</a>
      <a id="chatPerson" class="chat-person" href="#" aria-label="View profile">
        <span id="personAvatar" class="avatar">?</span>
        <span class="person-info">
          <span id="personName" class="person-name">Loading profile...</span>
          <span id="personHandle" class="person-handle">Tap to view profile</span>
        </span>
        <span class="profile-hint">PROFILE ›</span>
      </a>
      <div id="taskTitle" class="task-title">Loading task...</div>
      <div id="realtimeStatus" class="realtime-status">Connecting to live chat...</div>
    </header>

    <div class="content">
      <section class="files-section">
        <div class="files-title">📎 Task Files</div>
        <div id="filesContainer"><div class="no-files">Loading files...</div></div>
      </section>
      <div id="messages" class="messages"><div class="loading">Loading chat...</div></div>
      <div id="blockedMessage" class="blocked-message"></div>
      <div id="selectedFile" class="selected-file">
        <button id="removeFile" class="remove-file" type="button">REMOVE</button>
        <strong id="selectedFileName"></strong>
        <span id="selectedFileInfo"></span>
      </div>
    </div>
  </main>

  <form id="composer" class="composer">
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
    <button id="attachBtn" class="attach-btn" type="button" aria-label="Attach a file" title="Attach a file">📎</button>
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" maxlength="1000">
    <button id="sendBtn" class="send-btn" type="submit">Send</button>
  </form>

  <nav class="nav" aria-label="Main navigation">
    <a class="nav-link" href="index.html"><span class="nav-icon">⌂</span><span>Home</span></a>
    <a class="nav-link" href="my-tasks.html"><span class="nav-icon">✓</span><span>My Tasks</span></a>
    <a class="nav-link" href="post-task.html"><span class="nav-icon">＋</span><span>Post</span></a>
    <a class="nav-link" href="alerts.html"><span class="nav-icon">🔔</span><span>Alerts</span></a>
    <a class="nav-link" href="profile.html"><span class="nav-icon">♙</span><span>Profile</span></a>
  </nav>

  <script>
    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentTask = null;
    let otherUserId = null;
    let realtimeChannel = null;
    let sending = false;
    let selectedFile = null;
    let lastSentText = "";
    let lastSentAt = 0;
    let blockedTimer = null;
    let moderationBlocked = false;

    const taskId = new URLSearchParams(location.search).get("id");
    const messagesBox = document.getElementById("messages");
    const taskTitle = document.getElementById("taskTitle");
    const realtimeStatus = document.getElementById("realtimeStatus");
    const filesContainer = document.getElementById("filesContainer");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const selectedFileBox = document.getElementById("selectedFile");
    const selectedFileName = document.getElementById("selectedFileName");
    const selectedFileInfo = document.getElementById("selectedFileInfo");
    const removeFile = document.getElementById("removeFile");
    const blockedMessage = document.getElementById("blockedMessage");
    const chatPerson = document.getElementById("chatPerson");
    const personAvatar = document.getElementById("personAvatar");
    const personName = document.getElementById("personName");
    const personHandle = document.getElementById("personHandle");

    function escapeHTML(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function dateKey(value) {
      const date = new Date(value);
      return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
    }

    function formatDateLabel(value) {
      const date = new Date(value);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      if (dateKey(date) === dateKey(today)) return "Today";
      if (dateKey(date) === dateKey(yesterday)) return "Yesterday";
      return date.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
    }

    function formatFileSize(bytes) {
      if (!bytes) return "";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function normalizeForCheck(text) {
      return String(text || "").toLowerCase().normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g, "");
    }

    const blockedWords = ["fuck", "fucking", "fucked", "shit", "bullshit", "bitch", "bastard", "asshole", "dickhead", "motherfucker", "slut", "whore"];

    function containsContactInfo(text) {
      const normalized = normalizeForCheck(text);
      if (normalized.includes("whatsapp") || normalized.includes("wa.me")) return true;
      const digitsOnly = normalized.replace(/[\s().+\-]/g, "");
      if (/(?:234|0)(?:70|80|81|90|91)\d{8}/.test(digitsOnly)) return true;
      if (/\d{10,}/.test(digitsOnly)) return true;
      return /\b(?:account|acct|account\s*no|account\s*number)\b[\s:#-]*\d{8,}/i.test(text);
    }

    function validateMessage(text) {
      const normalized = normalizeForCheck(text);
      if (!normalized.trim()) return { allowed: false, reason: "Please type a message or attach a file." };
      if (normalized.length > 1000) return { allowed: false, reason: "Message is too long. Please keep it under 1,000 characters." };
      for (const word of blockedWords) {
        if (new RegExp(`(^|[^a-z])${word}([^a-z]|$)`, "i").test(normalized)) {
          return { allowed: false, reason: "Please keep the chat respectful. That language isn't allowed on StudTask." };
        }
      }
      if (containsContactInfo(text)) {
        return { allowed: false, reason: "For your safety, phone numbers, bank/account numbers and WhatsApp/contact details cannot be shared in StudTask chat." };
      }
      return { allowed: true, reason: "" };
    }

    function showBlockedMessage(text) {
      blockedMessage.textContent = "⚠️ " + text;
      blockedMessage.style.display = "block";
      clearTimeout(blockedTimer);
      blockedTimer = setTimeout(() => {
        blockedMessage.style.display = "none";
        blockedMessage.textContent = "";
      }, 5000);
    }

    function showModerationScreen(details) {
      if (moderationBlocked) return;
      moderationBlocked = true;
      const temporary = details.ban_type === "temporary";
      const until = temporary && details.banned_until ? new Date(details.banned_until).toLocaleString() : null;
      document.body.innerHTML = `<div class="restricted"><div class="restricted-box"><div class="restricted-icon">🚫</div><h2>StudTask Account Restricted</h2><p>Your account is currently ${temporary ? "temporarily" : "permanently"} restricted and cannot use chat.</p>${until ? `<p><strong>Restriction ends:</strong><br>${escapeHTML(until)}</p>` : ""}${details.ban_reason ? `<p><strong>Reason:</strong><br>${escapeHTML(details.ban_reason)}</p>` : ""}<button class="logout-btn" onclick="logoutModerated()">LOG OUT</button></div></div>`;
    }

    async function logoutModerated() {
      await supabaseClient.auth.signOut();
      location.href = "login.html";
    }

    async function checkModeration() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        location.href = "login.html";
        return false;
      }
      const { data, error } = await supabaseClient.from("user_moderation").select("status,ban_type,banned_until,ban_reason").eq("user_id", session.user.id).maybeSingle();
      if (error) return true;
      if (data?.status === "banned") {
        const active = data.ban_type === "permanent" || (data.ban_type === "temporary" && data.banned_until && new Date(data.banned_until) > new Date());
        if (active) {
          showModerationScreen(data);
          return false;
        }
      }
      return true;
    }

    async function loadTask() {
      if (!taskId) throw new Error("No chat task was specified.");
      const { data, error } = await supabaseClient.from("tasks").select("id,user_id,runner_id,title,status").eq("id", taskId).single();
      if (error || !data) throw new Error("Task could not be found.");
      currentTask = data;
      if (!currentTask.runner_id) throw new Error("This task has not been accepted yet.");
      if (currentUser.id !== currentTask.user_id && currentUser.id !== currentTask.runner_id) throw new Error("You are not part of this task.");
      otherUserId = currentUser.id === currentTask.user_id ? currentTask.runner_id : currentTask.user_id;
      taskTitle.textContent = currentTask.title;
    }

    async function loadOtherUserProfile() {
      const { data } = await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").eq("id", otherUserId).maybeSingle();
      const name = data?.full_name || data?.username || "StudTask User";
      personName.textContent = name;
      personHandle.textContent = data?.username ? "@" + data.username : "Tap to view profile";
      chatPerson.href = "profile.html?id=" + encodeURIComponent(otherUserId);
      const fallback = document.createElement("span");
      fallback.textContent = name.trim().charAt(0).toUpperCase() || "U";
      personAvatar.replaceChildren(fallback);
      if (data?.avatar_url) {
        const image = document.createElement("img");
        image.src = data.avatar_url;
        image.alt = name + " profile picture";
        image.onerror = () => personAvatar.replaceChildren(fallback);
        personAvatar.replaceChildren(image);
      }
    }

    async function loadTaskFiles() {
      filesContainer.innerHTML = '<div class="loading">Loading files...</div>';
      const { data: files, error } = await supabaseClient.from("task_attachments").select("id,file_name,file_path,file_size,mime_type,created_at").eq("task_id", currentTask.id).order("created_at", { ascending: true });
      if (error) {
        filesContainer.innerHTML = '<div class="file-error">Unable to load files.</div>';
        return;
      }
      if (!files?.length) {
        filesContainer.innerHTML = '<div class="no-files">No files attached.</div>';
        return;
      }
      filesContainer.innerHTML = "";
      for (const file of files) {
        const { data: signed, error: signedError } = await supabaseClient.storage.from("TaskFiles").createSignedUrl(file.file_path, 600);
        if (signedError || !signed?.signedUrl) continue;
        const card = document.createElement("div");
        card.className = "file-card";
        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = "📄 " + file.file_name;
        const size = document.createElement("div");
        size.className = "file-size";
        size.textContent = formatFileSize(file.file_size);
        const link = document.createElement("a");
        link.className = "pdf-button";
        link.href = signed.signedUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "VIEW FILE";
        card.append(name, size, link);
        filesContainer.appendChild(card);
      }
    }

    async function loadMessageAttachments(messageId) {
      const { data, error } = await supabaseClient.from("message_attachments").select("id,file_name,file_path,file_size,mime_type,created_at").eq("message_id", messageId).order("created_at", { ascending: true });
      if (error) return [];
      const results = [];
      for (const attachment of data || []) {
        const { data: signed } = await supabaseClient.storage.from("ChatFiles").createSignedUrl(attachment.file_path, 600);
        if (signed?.signedUrl) results.push({ ...attachment, signedUrl: signed.signedUrl });
      }
      return results;
    }

    function createAttachmentElement(attachment) {
      const box = document.createElement("div");
      box.className = "message-attachment";
      if (attachment.mime_type.startsWith("image/")) {
        const image = document.createElement("img");
        image.src = attachment.signedUrl;
        image.alt = attachment.file_name;
        image.loading = "lazy";
        box.appendChild(image);
      }
      const link = document.createElement("a");
      link.className = "attachment-link";
      link.href = attachment.signedUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `📎 ${attachment.file_name} · ${formatFileSize(attachment.file_size)}`;
      box.appendChild(link);
      return box;
    }

    function addDateSeparator(value) {
      const separator = document.createElement("div");
      separator.className = "date-separator";
      separator.textContent = formatDateLabel(value);
      messagesBox.appendChild(separator);
    }

    async function renderMessage(message, options = {}) {
      if (!message || !currentUser) return;
      if (document.querySelector(`[data-message-id="${CSS.escape(String(message.id))}"]`)) return;
      if (options.dateSeparator !== false) {
        const previous = messagesBox.querySelector(".message-row:last-of-type");
        const previousDate = previous?.dataset.createdAt;
        if (!previousDate || dateKey(previousDate) !== dateKey(message.created_at)) addDateSeparator(message.created_at);
      }
      const mine = message.sender_id === currentUser.id;
      const row = document.createElement("div");
      row.className = mine ? "message-row mine" : "message-row theirs";
      row.dataset.messageId = message.id;
      row.dataset.createdAt = message.created_at || new Date().toISOString();
      const wrap = document.createElement("div");
      wrap.className = "message-wrap";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (message.message && message.message !== "📎 Attachment") {
        const text = document.createElement("div");
        text.textContent = message.message;
        bubble.appendChild(text);
      }
      const attachments = options.attachments || await loadMessageAttachments(message.id);
      for (const attachment of attachments) bubble.appendChild(createAttachmentElement(attachment));
      const meta = document.createElement("div");
      meta.className = "message-meta";
      const time = document.createElement("span");
      time.textContent = message.created_at ? formatTime(message.created_at) : "Sending...";
      meta.appendChild(time);
      if (message.status === "failed") {
        const retry = document.createElement("button");
        retry.className = "retry-btn";
        retry.type = "button";
        retry.textContent = "RETRY";
        retry.onclick = () => retryMessage(message.retryText || "");
        meta.appendChild(retry);
      } else if (message.status === "pending") {
        meta.appendChild(Object.assign(document.createElement("span"), { className: "message-status", textContent: "Sending..." }));
      } else if (mine) {
        meta.appendChild(Object.assign(document.createElement("span"), { className: "message-status", textContent: message.is_read ? "✓✓ Read" : "✓ Sent" }));
      }
      bubble.appendChild(meta);
      wrap.appendChild(bubble);
      row.appendChild(wrap);
      messagesBox.appendChild(row);
      return row;
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient.from("messages").select("id,task_id,sender_id,receiver_id,message,is_read,created_at").eq("task_id", currentTask.id).order("created_at", { ascending: true });
      if (error) {
        messagesBox.innerHTML = '<div class="error">Unable to load messages.</div>';
        return;
      }
      messagesBox.innerHTML = "";
      if (!data?.length) messagesBox.innerHTML = '<div class="empty">No messages yet. Start the conversation.</div>';
      for (const message of data || []) await renderMessage(message);
      scrollToBottom();
      const unread = (data || []).filter(message => message.receiver_id === currentUser.id && !message.is_read).map(message => message.id);
      if (unread.length) {
        const { error: readError } = await supabaseClient.from("messages").update({ is_read: true }).in("id", unread);
        if (readError) console.warn("Could not mark messages read:", readError);
      }
    }

    function startRealtime() {
      if (!currentTask || !currentUser || realtimeChannel) return;
      realtimeChannel = supabaseClient.channel("StudTask-chat-" + currentTask.id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `task_id=eq.${currentTask.id}` }, async payload => {
          const message = payload.new;
          if (!message || message.task_id !== currentTask.id) return;
          if (message.sender_id !== currentUser.id && message.receiver_id !== currentUser.id) return;
          await renderMessage(message);
          scrollToBottom();
          if (message.receiver_id === currentUser.id && !message.is_read) {
            await supabaseClient.from("messages").update({ is_read: true }).eq("id", message.id);
          }
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") {
            realtimeStatus.textContent = "🟢 Live chat connected";
            realtimeStatus.className = "realtime-status connected";
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            realtimeStatus.textContent = "⚠️ Live chat connection issue";
            realtimeStatus.className = "realtime-status warning";
          }
        });
    }

    function showSelectedFile(file) {
      selectedFile = file;
      selectedFileName.textContent = "📎 " + file.name;
      selectedFileInfo.textContent = `${file.type || "File"} · ${formatFileSize(file.size)}`;
      selectedFileBox.style.display = "block";
    }

    function clearSelectedFile() {
      selectedFile = null;
      fileInput.value = "";
      selectedFileBox.style.display = "none";
    }

    async function uploadChatFile(file) {
      const extension = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : "file";
      const path = `${currentTask.id}/${currentUser.id}/${crypto.randomUUID()}.${extension}`;
      const { error } = await supabaseClient.storage.from("ChatFiles").upload(path, file, { upsert: false, contentType: file.type });
      if (error) throw error;
      return path;
    }

    async function insertMessageRecord(text, attachmentInfo) {
      const messageText = text || (attachmentInfo ? "📎 Attachment" : "");
      const { data, error } = await supabaseClient.from("messages").insert({ task_id: currentTask.id, sender_id: currentUser.id, receiver_id: otherUserId, message: messageText }).select("id,task_id,sender_id,receiver_id,message,is_read,created_at").single();
      if (error) throw error;
      if (attachmentInfo) {
        const { error: attachmentError } = await supabaseClient.from("message_attachments").insert({ message_id: data.id, task_id: currentTask.id, uploader_id: currentUser.id, file_name: attachmentInfo.file.name, file_path: attachmentInfo.path, mime_type: attachmentInfo.file.type, file_size: attachmentInfo.file.size });
        if (attachmentError) {
          await supabaseClient.storage.from("ChatFiles").remove([attachmentInfo.path]);
          throw attachmentError;
        }
      }
      return data;
    }

    function clearPendingMessage(id) {
      const row = document.querySelector(`[data-message-id="${CSS.escape(String(id))}"]`);
      if (row) row.remove();
    }

    async function retryMessage(text) {
      if (!text) return;
      messageInput.value = text;
      await sendMessage();
    }

    async function sendMessage() {
      if (sending || !currentTask || !otherUserId || !currentUser) return;
      const text = messageInput.value.trim();
      if (!text && !selectedFile) return;
      if (text) {
        const validation = validateMessage(text);
        if (!validation.allowed) {
          showBlockedMessage(validation.reason);
          return;
        }
      }
      const now = Date.now();
      if (now - lastSentAt < 900) {
        showBlockedMessage("⚡ Please wait a moment before sending again.");
        return;
      }
      if (text && text === lastSentText && now - lastSentAt < 10000 && !selectedFile) {
        showBlockedMessage("⚡ That message was already sent. Please type something new.");
        return;
      }

      sending = true;
      sendBtn.disabled = true;
      attachBtn.disabled = true;
      const fileToSend = selectedFile;
      const pendingId = "pending-" + crypto.randomUUID();
      const pendingMessage = { id: pendingId, sender_id: currentUser.id, message: text || "📎 Attachment", created_at: new Date().toISOString(), status: "pending" };
      await renderMessage(pendingMessage, { attachments: [] });
      scrollToBottom();

      try {
        let attachmentInfo = null;
        if (fileToSend) {
          if (fileToSend.size > 5 * 1024 * 1024) throw new Error("That file is too large. The maximum size is 5 MB.");
          const allowed = ["image/jpeg", "image/png", "image/webp", "application/pdf"];
          if (!allowed.includes(fileToSend.type)) throw new Error("Only JPG, PNG, WEBP images and PDF files are allowed.");
          const path = await uploadChatFile(fileToSend);
          attachmentInfo = { file: fileToSend, path };
        }
        const data = await insertMessageRecord(text, attachmentInfo);
        clearPendingMessage(pendingId);
        await renderMessage(data);
        lastSentText = text;
        lastSentAt = Date.now();
        messageInput.value = "";
        clearSelectedFile();
        await supabaseClient.from("notifications").insert({ user_id: otherUserId, task_id: currentTask.id, type: "new_message", title: "New message", message: `You received a new message about "${currentTask.title}".` });
        scrollToBottom();
      } catch (error) {
        clearPendingMessage(pendingId);
        const failed = { ...pendingMessage, status: "failed", retryText: text };
        await renderMessage(failed, { attachments: [] });
        const errorText = error?.message || "Message could not be sent. Please try again.";
        if (errorText.includes("STUDTASK_RATE_LIMITED")) showBlockedMessage(errorText.split("STUDTASK_RATE_LIMITED:")[1] || "You are sending messages too quickly.");
        else if (errorText.includes("STUDTASK_ACCOUNT_BANNED")) {
          showBlockedMessage("Your account is currently restricted.");
          await checkModeration();
        } else showBlockedMessage(errorText);
      } finally {
        sendBtn.disabled = false;
        attachBtn.disabled = false;
        sending = false;
      }
    }

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showBlockedMessage("That file is too large. The maximum size is 5 MB.");
        clearSelectedFile();
        return;
      }
      showSelectedFile(file);
    });
    removeFile.addEventListener("click", clearSelectedFile);
    composer.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });
    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function startChat() {
      try {
        if (!taskId) throw new Error("No chat task was specified.");
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
          location.href = "login.html";
          return;
        }
        currentUser = session.user;
        if (!(await checkModeration())) return;
        await loadTask();
        await Promise.all([loadOtherUserProfile(), loadTaskFiles(), loadMessages()]);
        startRealtime();
      } catch (error) {
        console.error("Chat startup error:", error);
        messagesBox.innerHTML = `<div class="error">❌ ${escapeHTML(error.message || "Unable to load chat.")}</div>`;
        messageInput.disabled = true;
        sendBtn.disabled = true;
        attachBtn.disabled = true;
      }
    }

    window.addEventListener("beforeunload", () => {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
    });

    startChat();
  </script>
  <script src="brand.js"></script>
</body>
</html>
