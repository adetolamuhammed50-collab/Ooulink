<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - StudTask</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 158px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f5f7fb;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #16834b;
      color: #fff;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 10px;
      margin: -6px 0 7px -10px;
      border-radius: 10px;
      transition: transform .16s ease, background .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .back:hover {
      background: rgba(255, 255, 255, .12);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .back:active {
      transform: scale(.95);
    }

    .back:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .35);
      outline-offset: 2px;
    }

    .task-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: rgba(255, 255, 255, .82);
    }

    .realtime-status {
      margin-top: 7px;
      font-size: 11px;
      color: rgba(255, 255, 255, .78);
    }

    .realtime-status.connected {
      color: #dcfce7;
    }

    .realtime-status.warning {
      color: #fef3c7;
    }

    .content {
      padding-bottom: 12px;
    }

    .files-section {
      margin: 12px;
      padding: 14px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }

    .files-title {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 700;
    }

    .file-card {
      padding: 11px;
      margin-bottom: 9px;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      transition: transform .16s ease, box-shadow .18s ease, background .18s ease;
    }

    .file-card:last-child {
      margin-bottom: 0;
    }

    .file-card:hover {
      background: #fff;
      box-shadow: 0 5px 14px rgba(0, 0, 0, .06);
    }

    .file-card:active {
      transform: scale(.99);
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .file-size {
      margin-top: 3px;
      color: #6b7280;
      font-size: 11px;
    }

    .pdf-button {
      display: block;
      margin-top: 9px;
      padding: 10px;
      background: #16834b;
      color: #fff;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .pdf-button:hover {
      filter: brightness(1.03);
      box-shadow: 0 5px 14px rgba(22, 131, 75, .2);
    }

    .pdf-button:active {
      transform: scale(.97);
    }

    .pdf-button:focus-visible {
      outline: 3px solid rgba(22, 131, 75, .22);
      outline-offset: 2px;
    }

    .no-files,
    .file-error {
      padding: 8px;
      color: #6b7280;
      font-size: 13px;
      text-align: center;
    }

    .file-error {
      color: #dc2626;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 300px;
      padding: 15px 12px;
      overflow-wrap: anywhere;
    }

    .loading,
    .empty,
    .error {
      padding: 40px 15px;
      color: #6b7280;
      text-align: center;
    }

    .error {
      color: #dc2626;
    }

    .message-row {
      display: flex;
      animation: messageIn .2s ease both;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .04);
    }

    .mine .bubble {
      background: #16834b;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .theirs .bubble {
      background: #fff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .time {
      margin-top: 4px;
      font-size: 10px;
      opacity: .7;
      text-align: right;
    }

    .blocked-message {
      display: none;
      margin: 0 10px 8px;
      padding: 10px 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      color: #9a3412;
      font-size: 12px;
      line-height: 1.4;
    }

    .composer {
      position: fixed;
      left: 50%;
      bottom: 74px;
      z-index: 40;
      display: flex;
      width: 100%;
      max-width: 480px;
      gap: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, .97);
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 14px rgba(0, 0, 0, .05);
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 22px;
      outline: none;
      background: #fff;
      font-size: 14px;
      transition: border-color .18s ease, box-shadow .18s ease, transform .16s ease;
    }

    .composer input:focus {
      border-color: #16834b;
      box-shadow: 0 0 0 3px rgba(22, 131, 75, .1);
    }

    .composer input:disabled {
      background: #f3f4f6;
    }

    .send-btn {
      flex: none;
      min-width: 74px;
      border: 0;
      border-radius: 22px;
      background: #16834b;
      color: #fff;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease, opacity .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:hover:not(:disabled) {
      filter: brightness(1.03);
      box-shadow: 0 5px 14px rgba(22, 131, 75, .2);
    }

    .send-btn:active:not(:disabled) {
      transform: scale(.95);
    }

    .send-btn:focus-visible {
      outline: 3px solid rgba(22, 131, 75, .22);
      outline-offset: 2px;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .restricted {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .62);
    }

    .restricted-box {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #fff;
      border-radius: 20px;
      text-align: center;
    }

    .restricted-icon {
      font-size: 48px;
    }

    .restricted-box h2 {
      margin: 12px 0 8px;
    }

    .restricted-box p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }

    .logout-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #16834b;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .logout-btn:hover {
      filter: brightness(1.03);
      box-shadow: 0 5px 14px rgba(22, 131, 75, .2);
    }

    .logout-btn:active {
      transform: scale(.97);
    }

    .logout-btn:focus-visible {
      outline: 3px solid rgba(22, 131, 75, .22);
      outline-offset: 2px;
    }

    .skeleton {
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(90deg, #fff 25%, #edf1f5 50%, #fff 75%);
      background-size: 200% 100%;
      animation: shine 1.2s infinite;
    }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 50;
      display: flex;
      width: 100%;
      max-width: 480px;
      height: 74px;
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, .08);
      transform: translateX(-50%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-link {
      position: relative;
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin: 0 2px;
      padding: 7px 4px;
      border: 0;
      border-radius: 13px;
      color: #6b7280;
      background: transparent;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, color .18s ease, background .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-link:hover {
      color: #16834b;
      background: #f3f9f5;
      box-shadow: 0 4px 12px rgba(22, 131, 75, .08);
    }

    .nav-link:active {
      transform: scale(.92);
    }

    .nav-link:focus-visible {
      outline: 3px solid rgba(22, 131, 75, .22);
      outline-offset: 1px;
    }

    .nav-link.active {
      color: #16834b;
      background: #eef8f2;
      box-shadow: 0 4px 12px rgba(22, 131, 75, .1);
    }

    .nav-link.active::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 50%;
      width: 24px;
      height: 3px;
      border-radius: 4px;
      background: #16834b;
      transform: translateX(-50%);
    }

    .nav-icon {
      display: grid;
      place-items: center;
      min-height: 24px;
      font-size: 20px;
      line-height: 1;
      transition: transform .16s ease;
    }

    .nav-link:hover .nav-icon,
    .nav-link:active .nav-icon,
    .nav-link.active .nav-icon {
      transform: translateY(-1px) scale(1.05);
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <a href="javascript:history.back()" class="back">← Back</a>
      <h1 id="taskTitle" class="task-title">Loading...</h1>
      <div id="subtitle" class="subtitle"></div>
      <div id="realtimeStatus" class="realtime-status">Connecting to live chat...</div>
    </header>

    <div class="content">
      <section class="files-section">
        <div class="files-title">📎 Task Files</div>
        <div id="filesContainer">
          <div class="no-files">Loading files...</div>
        </div>
      </section>

      <div id="messages" class="messages">
        <div class="loading">Loading chat...</div>
      </div>

      <div id="blockedMessage" class="blocked-message"></div>
    </div>
  </main>

  <form id="composer" class="composer">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
      maxlength="1000"
    >
    <button id="sendBtn" class="send-btn" type="submit">Send</button>
  </form>

  <nav class="nav" aria-label="Main navigation">
    <a class="nav-link" href="index.html" aria-label="Home">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>
    <a class="nav-link" href="my-tasks.html" aria-label="My Tasks">
      <span class="nav-icon">✓</span>
      <span>My Tasks</span>
    </a>
    <a class="nav-link" href="post-task.html" aria-label="Post a Task">
      <span class="nav-icon">＋</span>
      <span>Post</span>
    </a>
    <a class="nav-link" href="alerts.html" aria-label="Alerts">
      <span class="nav-icon">🔔</span>
      <span>Alerts</span>
    </a>
    <a class="nav-link" href="profile.html" aria-label="Profile">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentTask = null;
    let otherUserId = null;
    let realtimeChannel = null;
    let sending = false;
    let lastSentText = "";
    let lastSentAt = 0;
    let blockedTimer = null;
    let moderationBlocked = false;

    const params = new URLSearchParams(location.search);
    const taskId = params.get("id");

    const messagesBox = document.getElementById("messages");
    const taskTitle = document.getElementById("taskTitle");
    const subtitle = document.getElementById("subtitle");
    const realtimeStatus = document.getElementById("realtimeStatus");
    const filesContainer = document.getElementById("filesContainer");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const blockedMessage = document.getElementById("blockedMessage");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatFileSize(bytes) {
      if (!bytes) {
        return "";
      }
      if (bytes < 1024) {
        return bytes + " B";
      }
      if (bytes < 1048576) {
        return (bytes / 1024).toFixed(1) + " KB";
      }
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    function scrollToBottom() {
      if (messagesBox) {
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    function normalizeForCheck(text) {
      return String(text || "")
        .toLowerCase()
        .normalize("NFKC")
        .replace(/[\u200B-\u200D\uFEFF]/g, "");
    }

    const blockedWords = [
      "fuck",
      "fucking",
      "fucked",
      "shit",
      "bullshit",
      "bitch",
      "bastard",
      "asshole",
      "dickhead",
      "motherfucker",
      "slut",
      "whore"
    ];

    function containsContactInfo(text) {
      const normalized = normalizeForCheck(text);

      if (normalized.includes("whatsapp") || normalized.includes("wa.me")) {
        return true;
      }

      const digitsOnly = normalized.replace(/[\s().+\-]/g, "");

      if (/(?:234|0)(?:70|80|81|90|91)\d{8}/.test(digitsOnly)) {
        return true;
      }

      if (/\d{10,}/.test(digitsOnly)) {
        return true;
      }

      if (/\b(?:account|acct|account\s*no|account\s*number)\b[\s:#-]*\d{8,}/i.test(text)) {
        return true;
      }

      return false;
    }

    function validateMessage(text) {
      const normalized = normalizeForCheck(text);

      if (!normalized.trim()) {
        return {
          allowed: false,
          reason: "Please type a message."
        };
      }

      if (normalized.length > 1000) {
        return {
          allowed: false,
          reason: "Message is too long. Please keep it under 1,000 characters."
        };
      }

      for (const word of blockedWords) {
        const pattern = new RegExp(`(^|[^a-z])${word}([^a-z]|$)`, "i");
        if (pattern.test(normalized)) {
          return {
            allowed: false,
            reason: "Please keep the chat respectful. That language isn't allowed on StudTask."
          };
        }
      }

      if (containsContactInfo(text)) {
        return {
          allowed: false,
          reason: "For your safety, phone numbers, bank/account numbers and WhatsApp/contact details cannot be shared in StudTask chat."
        };
      }

      return {
        allowed: true,
        reason: ""
      };
    }

    function showBlockedMessage(message) {
      if (!blockedMessage) {
        return;
      }

      blockedMessage.textContent = "⚠️ " + message;
      blockedMessage.style.display = "block";

      clearTimeout(blockedTimer);

      blockedTimer = setTimeout(() => {
        blockedMessage.style.display = "none";
        blockedMessage.textContent = "";
      }, 5000);
    }

    function showModerationScreen(details) {
      if (moderationBlocked) {
        return;
      }

      moderationBlocked = true;

      const temporary = details.ban_type === "temporary";
      const until = temporary && details.banned_until
        ? new Date(details.banned_until).toLocaleString()
        : null;

      document.body.innerHTML = `
        <div class="restricted">
          <div class="restricted-box">
            <div class="restricted-icon">🚫</div>
            <h2>StudTask Account Restricted</h2>
            <p>Your account is currently ${temporary ? "temporarily" : "permanently"} restricted and cannot use chat.</p>
            ${until ? `<p><strong>Restriction ends:</strong><br>${escapeHTML(until)}</p>` : ""}
            ${details.ban_reason ? `<p><strong>Reason:</strong><br>${escapeHTML(details.ban_reason)}</p>` : ""}
            <p>If you believe this action was made in error, contact StudTask support.</p>
            <button class="logout-btn" onclick="logoutModerated()">LOG OUT</button>
          </div>
        </div>
      `;
    }

    async function logoutModerated() {
      await supabaseClient.auth.signOut();
      location.href = "login.html";
    }

    async function checkModeration() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        location.href = "login.html";
        return false;
      }

      const { data, error } = await supabaseClient
        .from("user_moderation")
        .select("status,ban_type,banned_until,ban_reason")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error) {
        return true;
      }

      if (data?.status === "banned") {
        const active =
          data.ban_type === "permanent" ||
          (data.ban_type === "temporary" &&
            data.banned_until &&
            new Date(data.banned_until) > new Date());

        if (active) {
          showModerationScreen(data);
          return false;
        }
      }

      return true;
    }

    async function loadTask() {
      if (!taskId) {
        throw new Error("No chat task was specified.");
      }

      const { data, error } = await supabaseClient
        .from("tasks")
        .select("id,user_id,runner_id,title,status")
        .eq("id", taskId)
        .single();

      if (error || !data) {
        console.error("Task loading error:", error);
        throw new Error("Task could not be found.");
      }

      currentTask = data;

      if (!currentTask.runner_id) {
        throw new Error("This task has not been accepted yet.");
      }

      if (
        currentUser.id !== currentTask.user_id &&
        currentUser.id !== currentTask.runner_id
      ) {
        throw new Error("You are not part of this task.");
      }

      if (currentUser.id === currentTask.user_id) {
        otherUserId = currentTask.runner_id;
        subtitle.textContent = "Chatting with the task runner";
      } else {
        otherUserId = currentTask.user_id;
        subtitle.textContent = "Chatting with the task poster";
      }

      taskTitle.textContent = currentTask.title;
    }

    async function loadTaskFiles() {
      if (!filesContainer) {
        return;
      }

      filesContainer.innerHTML = '<div class="loading">Loading files...</div>';

      const {
        data: files,
        error
      } = await supabaseClient
        .from("task_attachments")
        .select("id,file_name,file_path,file_size,mime_type,created_at")
        .eq("task_id", currentTask.id)
        .order("created_at", { ascending: true });

      if (error) {
        console.error("File loading error:", error);
        filesContainer.innerHTML = '<div class="file-error">Unable to load files.</div>';
        return;
      }

      if (!files?.length) {
        filesContainer.innerHTML = '<div class="no-files">No files attached.</div>';
        return;
      }

      filesContainer.innerHTML = "";

      for (const file of files) {
        const {
          data: signed,
          error: signedError
        } = await supabaseClient.storage
          .from("TaskFiles")
          .createSignedUrl(file.file_path, 600);

        if (signedError || !signed?.signedUrl) {
          continue;
        }

        const card = document.createElement("div");
        card.className = "file-card";

        card.innerHTML = `
          <div class="file-name">📄 ${escapeHTML(file.file_name)}</div>
          <div class="file-size">${formatFileSize(file.file_size)}</div>
          <a
            class="pdf-button"
            href="${signed.signedUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            VIEW FILE
          </a>
        `;

        filesContainer.appendChild(card);
      }
    }

    function renderMessage(message) {
      if (!messagesBox || !message || !currentUser) {
        return;
      }

      const existing = document.querySelector(
        `[data-message-id="${CSS.escape(String(message.id))}"]`
      );

      if (existing) {
        return;
      }

      const mine = message.sender_id === currentUser.id;
      const row = document.createElement("div");
      row.className = mine ? "message-row mine" : "message-row theirs";
      row.dataset.messageId = message.id;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.message;

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(message.created_at);

      bubble.appendChild(time);
      row.appendChild(bubble);
      messagesBox.appendChild(row);
    }

    async function loadMessages() {
      if (!currentTask || !currentUser) {
        return;
      }

      const {
        data,
        error
      } = await supabaseClient
        .from("messages")
        .select("id,task_id,sender_id,receiver_id,message,is_read,created_at")
        .eq("task_id", currentTask.id)
        .order("created_at", { ascending: true });

      if (error) {
        console.error("Message loading error:", error);
        messagesBox.innerHTML = '<div class="error">Unable to load messages.</div>';
        return;
      }

      messagesBox.innerHTML = "";

      if (!data?.length) {
        messagesBox.innerHTML = '<div class="empty">No messages yet. Start the conversation.</div>';
      }

      for (const message of data || []) {
        renderMessage(message);
      }

      scrollToBottom();

      const unread = (data || [])
        .filter(message => message.receiver_id === currentUser.id && !message.is_read)
        .map(message => message.id);

      if (unread.length) {
        const { error: readError } = await supabaseClient
          .from("messages")
          .update({ is_read: true })
          .in("id", unread);

        if (readError) {
          console.warn("Could not mark messages read:", readError);
        }
      }
    }

    function startRealtime() {
      if (!currentTask || !currentUser || realtimeChannel) {
        return;
      }

      realtimeChannel = supabaseClient
        .channel("studtask-chat-" + currentTask.id)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: `task_id=eq.${currentTask.id}`
          },
          async payload => {
            const message = payload.new;

            if (!message || message.task_id !== currentTask.id) {
              return;
            }

            if (
              message.sender_id !== currentUser.id &&
              message.receiver_id !== currentUser.id
            ) {
              return;
            }

            renderMessage(message);
            scrollToBottom();

            if (message.receiver_id === currentUser.id && !message.is_read) {
              const { error } = await supabaseClient
                .from("messages")
                .update({ is_read: true })
                .eq("id", message.id);

              if (error) {
                console.warn("Read update error:", error);
              }
            }
          }
        )
        .subscribe(status => {
          if (!realtimeStatus) {
            return;
          }

          if (status === "SUBSCRIBED") {
            realtimeStatus.textContent = "🟢 Live chat connected";
            realtimeStatus.className = "realtime-status connected";
          } else if (status === "CHANNEL_ERROR") {
            realtimeStatus.textContent = "⚠️ Live chat connection error";
            realtimeStatus.className = "realtime-status warning";
          } else if (status === "TIMED_OUT") {
            realtimeStatus.textContent = "⚠️ Live chat connection timed out";
            realtimeStatus.className = "realtime-status warning";
          }
        });
    }

    async function sendMessage() {
      if (sending || !currentTask || !otherUserId || !currentUser) {
        return;
      }

      const text = messageInput.value.trim();

      if (!text) {
        return;
      }

      const validation = validateMessage(text);

      if (!validation.allowed) {
        showBlockedMessage(validation.reason);
        return;
      }

      const now = Date.now();

      if (now - lastSentAt < 900) {
        showBlockedMessage("⚡ Please slow down and wait a moment before sending again.");
        return;
      }

      if (text === lastSentText && now - lastSentAt < 10000) {
        showBlockedMessage("⚡ That message was already sent. Please type something new.");
        return;
      }

      sending = true;
      sendBtn.disabled = true;

      const originalText = sendBtn.textContent;
      sendBtn.textContent = "Sending...";

      try {
        const {
          data,
          error
        } = await supabaseClient
          .from("messages")
          .insert({
            task_id: currentTask.id,
            sender_id: currentUser.id,
            receiver_id: otherUserId,
            message: text
          })
          .select("id,task_id,sender_id,receiver_id,message,is_read,created_at")
          .single();

        if (error) {
          console.error("Send message error:", error);

          const message = error.message || "";

          if (message.includes("OOULINK_RATE_LIMITED")) {
            showBlockedMessage(
              message.split("OOULINK_RATE_LIMITED:")[1] ||
              "You are sending messages too quickly. Please wait before sending another message."
            );
          } else if (message.includes("OOULINK_ACCOUNT_BANNED")) {
            showBlockedMessage("Your account is currently restricted.");
            await checkModeration();
          } else {
            showBlockedMessage("Message could not be sent. Please try again.");
          }

          return;
        }

        lastSentText = text;
        lastSentAt = Date.now();

        if (data) {
          renderMessage(data);
          scrollToBottom();
        }

        messageInput.value = "";

        const { error: notificationError } = await supabaseClient
          .from("notifications")
          .insert({
            user_id: otherUserId,
            task_id: currentTask.id,
            type: "new_message",
            title: "New message",
            message: `You received a new message about "${currentTask.title}".`
          });

        if (notificationError) {
          console.warn("Notification error:", notificationError);
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = originalText;
        sending = false;
      }
    }

    composer?.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });

    messageInput?.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function startChat() {
      try {
        if (!taskId) {
          throw new Error("No chat task was specified.");
        }

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
          location.href = "login.html";
          return;
        }

        currentUser = session.user;

        if (!(await checkModeration())) {
          return;
        }

        await loadTask();

        await Promise.all([
          loadTaskFiles(),
          loadMessages()
        ]);

        startRealtime();
      } catch (error) {
        console.error("Chat startup error:", error);

        if (messagesBox) {
          messagesBox.innerHTML = `
            <div class="error">
              ❌ ${escapeHTML(error.message || "Unable to load chat.")}
            </div>
          `;
        }

        if (messageInput) {
          messageInput.disabled = true;
        }

        if (sendBtn) {
          sendBtn.disabled = true;
        }
      }
    }

    window.addEventListener("beforeunload", () => {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
      }
    });

    startChat();
  </script>
</body>
