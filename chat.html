<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Chat • OOULink</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
  padding-bottom: 75px;
}

.header {
  background: white;
  padding: 15px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back {
  color: #2563eb;
  text-decoration: none;
  font-size: 14px;
  display: inline-block;
  margin-bottom: 10px;
}

.task-title {
  font-size: 19px;
  font-weight: bold;
  margin: 0;
}

.subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-top: 5px;
}

.realtime-status {
  font-size: 11px;
  margin-top: 6px;
}

.realtime-status.connected {
  color: #16a34a;
}

.realtime-status.warning {
  color: #d97706;
}

.files-section {
  background: white;
  margin: 12px;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.files-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
}

.file-card {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 11px;
  margin-bottom: 9px;
  background: #fafafa;
}

.file-card:last-child {
  margin-bottom: 0;
}

.file-name {
  font-size: 14px;
  font-weight: bold;
  word-break: break-word;
}

.file-size {
  font-size: 11px;
  color: #6b7280;
  margin-top: 3px;
}

.pdf-button {
  display: block;
  margin-top: 9px;
  padding: 10px;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
}

.pdf-button:active {
  transform: scale(0.98);
}

.no-files {
  color: #6b7280;
  font-size: 13px;
  text-align: center;
  padding: 8px;
}

.file-error {
  color: #dc2626;
  font-size: 13px;
  text-align: center;
  padding: 8px;
}

.messages {
  padding: 15px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.loading,
.empty,
.error {
  text-align: center;
  color: #6b7280;
  padding: 40px 15px;
}

.error {
  color: #dc2626;
}

.message-row {
  display: flex;
}

.message-row.mine {
  justify-content: flex-end;
}

.message-row.theirs {
  justify-content: flex-start;
}

.bubble {
  max-width: 78%;
  padding: 10px 13px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}

.mine .bubble {
  background: #2563eb;
  color: white;
  border-bottom-right-radius: 4px;
}

.theirs .bubble {
  background: white;
  color: #111827;
  border: 1px solid #e5e7eb;
  border-bottom-left-radius: 4px;
}

.time {
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.7;
  text-align: right;
}

.blocked-message {
  display: none;
  margin: 0 10px 8px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 12px;
  line-height: 1.4;
}

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #e5e7eb;
  padding: 10px;
  display: flex;
  gap: 8px;
  z-index: 20;
}

.composer input {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 22px;
  padding: 11px 14px;
  font-size: 14px;
  outline: none;
}

.composer input:focus {
  border-color: #2563eb;
}

.send-btn {
  border: none;
  background: #2563eb;
  color: white;
  padding: 0 18px;
  border-radius: 22px;
  font-weight: bold;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>

<body>

<div class="header">

<a
  href="javascript:history.back()"
  class="back"
>
  ← Back
</a>

<h1
  id="taskTitle"
  class="task-title"
>
  Loading...
</h1>

<div
  id="subtitle"
  class="subtitle"
></div>

<div
  id="realtimeStatus"
  class="realtime-status"
>
  Connecting to live chat...
</div>

</div>

<section class="files-section">

<div class="files-title">
  📎 Task Files
</div>

<div id="filesContainer">

<div class="no-files">
  Loading files...
</div>

</div>

</section>

<div
  id="messages"
  class="messages"
>

<div class="loading">
  Loading chat...
</div>

</div>

  id="blockedMessage"
  class="blocked-message"
></div>

<form
  id="composer"
  class="composer"
>

<input
  id="messageInput"
  type="text"
  placeholder="Type a message..."

  maxlength="1000"
>

<button
  id="sendBtn"
  class="send-btn"
  type="submit"
>
  Send
</button>

</form>

<script>

const SUPABASE_URL =
  "https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let currentTask = null;
let otherUserId = null;

let realtimeChannel = null;
let realtimeFallbackTimer = null;

const params =
  new URLSearchParams(
    window.location.search
  );

const taskId =
  params.get("id");

const messagesBox =
  document.getElementById("messages");

const taskTitle =
  document.getElementById("taskTitle");

const subtitle =
  document.getElementById("subtitle");

const filesContainer =
  document.getElementById("filesContainer");

const composer =
  document.getElementById("composer");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const blockedMessage =
  document.getElementById("blockedMessage");

const realtimeStatus =
  document.getElementById("realtimeStatus");

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function formatTime(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}

function formatFileSize(bytes) {

  if (!bytes)
    return "";

  if (bytes < 1024)
    return bytes + " B";

  if (bytes < 1024 * 1024) {

    return (
      (bytes / 1024)
        .toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / (1024 * 1024))
      .toFixed(1) +
    " MB"
  );

}

function scrollToBottom() {

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}

function normalizeForCheck(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[\u200B-\u200D\uFEFF]/g, "");

}

function containsContactInformation(text) {

  const normalized =
    normalizeForCheck(text);

  const cleaned =
    normalized.replace(
      /[\s().-]/g,
      ""
    );

  const digitsOnly =
    normalized.replace(/\D/g, "");

  const nigerianPhone =
    /(?:\+?234|0)(?:70|80|81|90|91)\d{8}/;

  const longNumber =
    /\d{10,}/;

  const accountPattern =
    /\b(?:account|acct|account\s*no|account\s*number)\b[\s:#-]*\d{8,}/i;

  const lettersOnly =
    normalized.replace(
      /[^a-z]/g,
      ""
    );

  const whatsapp =
    lettersOnly.includes(
      "whatsapp"
    );

  const whatsappLink =
    /wa\s*\.?\s*me/i.test(
      normalized
    );

  if (
    nigerianPhone.test(
      cleaned
    )
  ) {

    return {
      blocked: true,
      reason:
        "Phone numbers cannot be shared in OOULink chat."
    };

  }

  if (
    accountPattern.test(
      normalized
    ) &&
    longNumber.test(
      digitsOnly
    )
  ) {

    return {
      blocked: true,
      reason:
        "Bank or account numbers cannot be shared in OOULink chat."
    };

  }

  if (
    whatsapp ||
    whatsappLink
  ) {

    return {
      blocked: true,
      reason:
        "WhatsApp or outside contact details cannot be shared in OOULink chat."
    };

  }

  if (
    longNumber.test(
      digitsOnly
    ) &&
    digitsOnly.length >= 10
  ) {

    return {
      blocked: true,
      reason:
        "Phone numbers or account numbers cannot be shared in OOULink chat."
    };

  }

  return {
    blocked: false,
    reason: ""
  };

}

const blockedWords = [

  "fuck",
  "fucking",
  "fucked",
  "shit",
  "bullshit",
  "bitch",
  "bastard",
  "asshole",
  "dickhead",
  "motherfucker",
  "slut",
  "whore"

];

function containsBadLanguage(text) {

  const normalized =
    normalizeForCheck(text)
      .replace(
        /[^a-z0-9\s]/g,
        " "
      );

  const words =
    normalized
      .split(/\s+/)
      .filter(Boolean);

  for (
    const blocked of blockedWords
  ) {

    if (
      words.includes(
        blocked
      )
    ) {

      return {
        blocked: true,
        reason:
          "Please keep OOULink chats respectful. Abusive language is not allowed."
      };

    }

  }

  return {
    blocked: false,
    reason: ""
  };

}

function validateMessage(text) {

  const contactCheck =
    containsContactInformation(
      text
    );

  if (
    contactCheck.blocked
  ) {

    return contactCheck;

  }

  const languageCheck =
    containsBadLanguage(
      text
    );

  if (
    languageCheck.blocked
  ) {

    return languageCheck;

  }

  return {
    blocked: false,
    reason: ""
  };

}

function showBlockedMessage(
  reason
) {

  blockedMessage.textContent =
    "⚠️ " + reason;

  blockedMessage.style.display =
    "block";

  clearTimeout(
    window.blockWarningTimer
  );

  window.blockWarningTimer =
    setTimeout(
      () => {

        blockedMessage.style.display =
          "none";

      },
      4500
    );

}

async function loadTask() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("tasks")
      .select(`
        id,
        user_id,
        runner_id,
        title,
        status
      `)
      .eq(
        "id",
        taskId
      )
      .single();

  if (
    error ||
    !data
  ) {

    throw new Error(
      "Task could not be found."
    );

  }

  currentTask =
    data;

  if (
    !currentTask.runner_id
  ) {

    throw new Error(
      "This task has not been accepted yet."
    );

  }

  if (
    currentUser.id !==
      currentTask.user_id &&

    currentUser.id !==
      currentTask.runner_id
  ) {

    throw new Error(
      "You are not part of this task."
    );

  }

  if (
    currentUser.id ===
    currentTask.user_id
  ) {

    otherUserId =
      currentTask.runner_id;

    subtitle.textContent =
      "Chatting with the task runner";

  } else {

    otherUserId =
      currentTask.user_id;

    subtitle.textContent =
      "Chatting with the task poster";

  }

  taskTitle.textContent =
    currentTask.title;

}
