<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True or False • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.game{background:#fff;border:1px solid #e3eee7;border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 6px 20px #1231}.timer{font-size:14px;color:#159447;font-weight:800;margin-bottom:15px}.question{font-size:20px;font-weight:800;line-height:1.4;min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #e3eee7;background:#f8fffa;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;transition:.12s}.answer:active{transform:scale(.95)}.answer.correct{border-color:#159447;background:#eef9f1;color:#159447}.answer.wrong{border-color:#d95b48;background:#fff1ee;color:#d95b48}.message{height:30px;margin-top:14px;font-size:13px;font-weight:700;color:#159447}.start,.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:13px 22px;font-weight:800}.start{margin-top:10px}.result{display:none;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:40px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-width:350px){.question{font-size:18px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>🧠 True or False</h1><p>Think fast and see how many you can get right!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="round">0</b><span>ROUND</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="game"><div class="timer">⏱️ <span id="time">30</span>s</div><div class="question" id="question">Ready?</div><div class="answers"><button class="answer" id="trueBtn">✓ TRUE</button><button class="answer" id="falseBtn">✕ FALSE</button></div><div class="message" id="message">Choose the correct answer!</div><button class="start" id="start">START GAME</button></div><div class="result" id="result"><h2>🏆 Game Over!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">30 seconds • Correct = 1 point • Keep going!</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const question=document.getElementById("question"),trueBtn=document.getElementById("trueBtn"),falseBtn=document.getElementById("falseBtn"),scoreEl=document.getElementById("score"),roundEl=document.getElementById("round"),bestEl=document.getElementById("best"),timeEl=document.getElementById("time"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");const qs=[["Nigeria is in Africa.",true],["The sun is a planet.",false],["OOU stands for Olabisi Onabanjo University.",true],["Water freezes at 0°C.",true],["There are 24 hours in a day.",true],["The Pacific Ocean is the largest ocean.",true],["A triangle has four sides.",false],["The Earth is larger than the Moon.",true],["Lagos is the capital of Nigeria.",false],["A week has seven days.",true],["The human body has one heart.",true],["5 × 5 equals 30.",false],["The color made by mixing blue and yellow is green.",true],["January has 31 days.",true],["The Atlantic Ocean is smaller than the Pacific Ocean.",true],["A square has four equal sides.",true],["The sun rises in the west.",false],["Nigeria has 36 states.",true],["A cheetah is faster than a tortoise.",true],["10 + 10 equals 25.",false]];let score=0,round=0,time=30,timer=null,running=false,locked=false,best=Number(localStorage.getItem("ooulink_truefalse_best")||0);bestEl.textContent=best;function nextQuestion(){if(!running)return;locked=false;trueBtn.disabled=false;falseBtn.disabled=false;trueBtn.className="answer";falseBtn.className="answer";const q=qs[Math.floor(Math.random()*qs.length)];question.textContent=q[0];question.dataset.answer=q[1];round++;roundEl.textContent=round;message.textContent="Choose the correct answer!"}function answer(value,btn){if(!running||locked)return;locked=true;trueBtn.disabled=true;falseBtn.disabled=true;const correct=String(value)===question.dataset.answer;if(correct){score++;scoreEl.textContent=score;btn.classList.add("correct");message.textContent="✅ Correct!"}else{btn.classList.add("wrong");message.textContent="❌ Wrong!";(question.dataset.answer==="true"?trueBtn:falseBtn).classList.add("correct")}setTimeout(nextQuestion,450)}function endGame(){running=false;locked=true;clearInterval(timer);trueBtn.disabled=true;falseBtn.disabled=true;finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_truefalse_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best! You scored "+score+" point"+(score===1?"":"s")+"."}else resultText.textContent="You scored "+score+" point"+(score===1?"":"s")+" in 30 seconds.";result.style.display="block";question.textContent="Time's up!";message.textContent="Nice run!";start.style.display="none"}function startGame(){clearInterval(timer);score=0;round=0;time=30;running=true;locked=false;scoreEl.textContent=0;roundEl.textContent=0;timeEl.textContent=30;result.style.display="none";start.style.display="none";nextQuestion();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}trueBtn.onclick=()=>answer(true,trueBtn);falseBtn.onclick=()=>answer(false,falseBtn);start.onclick=startGame;again.onclick=()=>{start.style.display="inline-block";startGame()};</script></body></html>
