<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts - OOULink</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827;padding-bottom:82px}
.app{max-width:480px;min-height:100vh;margin:auto;background:#f5f7fb}
header{background:#2563eb;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20}
.head{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px}.count{font-size:12px;background:#ffffff2b;padding:6px 9px;border-radius:20px}
.container{padding:14px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.filter{border:1px solid #dbe2ea;background:#fff;color:#4b5563;border-radius:20px;padding:8px 12px;font-size:12px;white-space:nowrap}
.filter.active{background:#2563eb;color:#fff;border-color:#2563eb}
.group{background:#fff;border-radius:15px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 9px #0000000f;animation:up .28s ease both}
.group-head{padding:15px;cursor:pointer;user-select:none;transition:.18s}.group-head:active,.note:active{background:#f3f7ff;transform:scale(.995)}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}.title-text{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:none;background:#ef4444;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}.has-unread .badge{display:inline-block}
.meta{margin-top:6px;font-size:12px;color:#6b7280;display:flex;gap:6px}.arrow{margin-left:auto;transition:.2s}.open .arrow{transform:rotate(180deg)}
.content{display:none;border-top:1px solid #eef1f4;padding:5px 15px 15px}.content.open{display:block;animation:down .22s ease}
.note{position:relative;padding:12px 5px 12px 12px;border-bottom:1px solid #eef1f4;border-radius:10px;transition:.16s}.note:last-child{border:0}.note.unread{background:#f5f9ff}.note.unread:before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:#2563eb}
.note-top{display:flex;gap:9px}.icon{width:34px;height:34px;border-radius:10px;background:#eff6ff;display:grid;place-items:center;flex:none}.ntitle{font-weight:700;font-size:14px;line-height:1.3}.msg{font-size:13px;color:#4b5563;margin-top:4px;line-height:1.45}.time{font-size:11px;color:#9ca3af;margin-top:5px}
.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.btn,.retry{border:0;border-radius:8px;padding:8px 10px;background:#2563eb;color:#fff;font-size:11px;font-weight:700;cursor:pointer}.chat{background:#f0f7ff;padding:12px;margin-top:8px;border-radius:10px}.chat .btn{width:100%;font-size:12px}
.empty,.error{background:#fff;padding:30px 20px;border-radius:15px;text-align:center;margin-top:12px;box-shadow:0 2px 9px #0000000d}.empty-icon{font-size:34px}.empty-title{font-weight:700;font-size:16px;margin-top:7px}.empty-text{font-size:13px;color:#6b7280;margin-top:6px}.error{color:#b91c1c}.retry{margin-top:12px}
.skeleton{height:95px;background:linear-gradient(90deg,#fff 25%,#edf1f5 50%,#fff 75%);background-size:200% 100%;border-radius:15px;margin-bottom:12px;animation:shine 1.2s infinite}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e5e8e6;display:flex;justify-content:space-around;padding:11px 5px;z-index:1000}
.nav a{text-align:center;font-size:11px;color:#777;text-decoration:none}.nav a.active{color:#16834b;font-weight:700}.nav-icon{display:block;margin-bottom:2px}.bell{position:relative;display:inline-block;height:18px}.dot{position:absolute;top:-2px;right:-5px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff;display:none}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes down{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes shine{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><h1>🔔 Alerts</h1><div id="count" class="count">0 unread</div></div></header>
<div class="container">
<div id="filters" class="filters">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="unread">Unread</button>
<button class="filter" data-filter="message">Messages</button>
<button class="filter" data-filter="system">System</button>
</div>
<div id="alerts"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
</div>
<nav class="nav">
<a href="index.html"><span class="nav-icon">🏠</span>Home</a>
<a href="my-tasks.html"><span class="nav-icon">📋</span>My Tasks</a>
<a href="post-task.html"><span class="nav-icon">➕</span>Post</a>
<a href="alerts.html" class="active"><span class="bell"><span class="nav-icon">🔔</span><span id="dot" class="dot"></span></span>Alerts</a>
<a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co";
const SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const alerts=document.getElementById("alerts"),dot=document.getElementById("dot"),count=document.getElementById("count"),filters=document.getElementById("filters");
let currentUser=null,allNotifications=[],taskMap={},activeFilter="all";
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function timeAgo(d){
 const s=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/1000));
 if(s<60)return"Just now";const m=Math.floor(s/60);if(m<60)return m+" min ago";
 const h=Math.floor(m/60);if(h<24)return h+" hr ago";const day=Math.floor(h/24);
 if(day<7)return day+" day"+(day!==1?"s":"")+" ago";const w=Math.floor(day/7);
 if(w<5)return w+" week"+(w!==1?"s":"")+" ago";return new Date(d).toLocaleDateString();
}
function typeOf(n){const t=String(n.type||"").toLowerCase();return t==="new_message"||t.includes("message")||t.includes("chat")?"message":"system"}
function iconOf(n){const t=String(n.type||"").toLowerCase();if(typeOf(n)==="message")return"💬";if(t.includes("accept"))return"✅";if(t.includes("complete"))return"🎉";if(t.includes("task"))return"📋";return"🔔"}
function taskTitle(id,list){const t=taskMap[id];if(t?.title)return t.title;const n=list[0]||{};return n.task_id?(n.message?.match(/"([^"]+)"/)?.[1]||n.title||"Task"):"General"}
function groupsFor(){
 const g={};allNotifications.forEach(n=>{const type=typeOf(n);
 if(activeFilter==="unread"&&n.is_read)return;if(activeFilter==="message"&&type!=="message")return;if(activeFilter==="system"&&type!=="system")return;
 const k=n.task_id||"general";if(!g[k])g[k]=[];g[k].push(n)});return g;
}
async function updateDot(){
 if(!currentUser)return;const{count:c,error}=await supabaseClient.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",currentUser.id).eq("is_read",false);
 if(error){console.error("Notification dot error:",error);return}dot.style.display=c>0?"block":"none";count.textContent=(c||0)+" unread";
}
async function markRead(list){
 const ids=list.filter(n=>!n.is_read).map(n=>n.id);if(!ids.length)return;
 const{error}=await supabaseClient.from("notifications").update({is_read:true}).in("id",ids).eq("user_id",currentUser.id);
 if(error){console.error("Read notification error:",error);return}list.forEach(n=>n.is_read=true);await updateDot();
}
function openChat(id){if(id)window.location.href="chat.html?id="+encodeURIComponent(id)}
function openTask(id){if(id)window.location.href="task-details.html?id="+encodeURIComponent(id)}
function actionFor(n,t){
 if(!t)return null;const x=String(n.type||"").toLowerCase();
 if(x.includes("message")||x.includes("chat"))return{label:"OPEN CHAT",fn:()=>openChat(t.id)};
 if(x.includes("task")||x.includes("accept")||x.includes("complete"))return{label:"VIEW TASK",fn:()=>openTask(t.id)};
 return null;
}
function empty(text){
 alerts.innerHTML='<div class="empty"><div class="empty-icon">🔔</div><div class="empty-title">'+escapeHTML(text)+'</div><div class="empty-text">New activity will appear here automatically.</div></div>';
}
function render(){
 const groups=groupsFor(),keys=Object.keys(groups);if(!keys.length){empty(activeFilter==="all"?"No alerts yet.":"No alerts match this filter.");return}
 alerts.innerHTML="";
   keys.sort((a,b)=>new Date(groups[b][0].created_at)-new Date(groups[a][0].created_at));
 keys.forEach((id,index)=>{
  const list=groups[id],latest=list[0],task=taskMap[id],unread=list.filter(n=>!n.is_read).length;
  const group=document.createElement("div");group.className="group"+(unread?" has-unread":"");group.style.animationDelay=Math.min(index*35,280)+"ms";
  const head=document.createElement("div");head.className="group-head";
  head.innerHTML='<div class="title"><span>'+(id==="general"?"🔔":"📦")+'</span><span class="title-text">'+escapeHTML(taskTitle(id,list))+'</span><span class="badge">'+unread+'</span><span class="arrow">▼</span></div><div class="meta"><span>'+list.length+' notification'+(list.length!==1?"s":"")+'</span><span>•</span><span>Latest '+timeAgo(latest.created_at)+'</span></div>';
  const content=document.createElement("div");content.className="content";
  list.forEach(n=>{
   const item=document.createElement("div");item.className="note"+(!n.is_read?" unread":"");
   item.innerHTML='<div class="note-top"><div class="icon">'+iconOf(n)+'</div><div><div class="ntitle">'+escapeHTML(n.title||"Notification")+'</div><div class="msg">'+escapeHTML(n.message||"")+'</div><div class="time">'+timeAgo(n.created_at)+'</div></div></div>';
   const action=actionFor(n,task);if(action){const row=document.createElement("div");row.className="actions";const b=document.createElement("button");b.className="btn";b.type="button";b.textContent=action.label;b.onclick=e=>{e.stopPropagation();action.fn()};row.appendChild(b);item.appendChild(row)}
   content.appendChild(item);
  });
  const accepted=task&&task.runner_id&&(task.status==="accepted"||task.status==="completed"),participant=task&&(task.user_id===currentUser.id||task.runner_id===currentUser.id);
  if(task&&accepted&&participant){const area=document.createElement("div");area.className="chat";const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="💬 OPEN TASK CHAT";b.onclick=e=>{e.stopPropagation();openChat(task.id)};area.appendChild(b);content.appendChild(area)}
  head.onclick=async()=>{const was=content.classList.contains("open");content.classList.toggle("open");group.classList.toggle("open",!was);if(!was){await markRead(list);group.classList.remove("has-unread");content.querySelectorAll(".unread").forEach(x=>x.classList.remove("unread"))}};
  group.append(head,content);alerts.appendChild(group);
 });
}

async function loadAlerts(){
 try{
  alerts.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  const{data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError)throw sessionError;
  if(!sessionData.session){window.location.href="login.html";return}
  currentUser=sessionData.session.user;
  const{data:notifications,error}=await supabaseClient.from("notifications").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
  if(error)throw error;
  allNotifications=notifications||[];taskMap={};
  const taskIds=[...new Set(allNotifications.map(n=>n.task_id).filter(Boolean))];
  if(taskIds.length){
   const{data:tasks,error:taskError}=await supabaseClient.from("tasks").select("id,title,status,user_id,runner_id").in("id",taskIds);
   if(taskError)console.error("Task lookup error:",taskError);else(tasks||[]).forEach(t=>taskMap[t.id]=t);
  }
  await updateDot();allNotifications.length?render():empty("No alerts yet.");
 }catch(error){
  console.error("Alerts error:",error);
  alerts.innerHTML='<div class="error">❌ Unable to load alerts.<br><br>'+escapeHTML(error.message||"Please refresh the page.")+'<br><button class="retry" type="button" onclick="loadAlerts()">Try Again</button></div>';
 }
}
filters.addEventListener("click",e=>{
 const b=e.target.closest(".filter");if(!b)return;activeFilter=b.dataset.filter;
 filters.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render();
});
document.addEventListener("DOMContentLoaded",loadAlerts);
</script>
</body>
</html>
