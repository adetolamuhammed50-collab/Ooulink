<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - OOULink</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 90px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .alerts {
      padding: 15px 20px;
    }

    .alert {
      padding: 16px;
      border: 1px solid #e5e8e6;
      border-radius: 14px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .alert:active {
      background: #f7faf8;
    }

    .alert h2 {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .alert p {
      color: #777;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 5px;
    }

    .task-name {
      color: #17231d !important;
      font-weight: bold;
    }

    .time {
      display: block;
      margin-top: 8px;
      color: #999;
      font-size: 11px;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #777;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #777;
      font-size: 14px;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #c0392b;
      font-size: 14px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      background: white;
      border-top: 1px solid #e5e8e6;
    }

    nav a {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #16834b;
      font-weight: bold;
    }
  </style></head><body><div class="app">  <header>
    <a href="index.html" class="back">← Back</a>
    <h1>Alerts</h1>
    <p class="subtitle">Stay updated on your OOULink activity.</p>
  </header>  <section class="alerts" id="alertsList">
    <div class="loading">Loading your alerts...</div>
  </section></div><nav>
  <a href="index.html">🏠<br>Home</a>
  <a href="my-tasks.html">📋<br>My Tasks</a>
  <a href="post-task.html">➕<br>Post</a>
  <a href="alerts.html" class="active">🔔<br>Alerts</a>
  <a href="profile.html">👤<br>Profile</a>
</nav><script>
  const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const alertsList = document.getElementById("alertsList");

  let currentUser = null;

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function timeAgo(dateValue) {
    if (!dateValue) return "Recently";

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
      return "Recently";
    }

    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);

    if (seconds < 60) {
      return "Just now";
    }

    const minutes = Math.floor(seconds / 60);

    if (minutes < 60) {
      return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
    }

    const hours = Math.floor(minutes / 60);

    if (hours < 24) {
      return `${hours} hour${hours === 1 ? "" : "s"} ago`;
    }

    const days = Math.floor(hours / 24);

    if (days < 7) {
      return `${days} day${days === 1 ? "" : "s"} ago`;
    }

    return date.toLocaleDateString();
  }

  function statusText(status) {
    if (!status) return "Open";

    const text = String(status)
      .replace(/_/g, " ")
      .toLowerCase();

    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function createAlert(icon, title, message, task, time) {
    return `
      <div class="alert" onclick="openTask('${task.id}')">
        <h2>${icon} ${escapeHTML(title)}</h2>

        <p class="task-name">
          ${escapeHTML(task.title || "Untitled Task")}
        </p>

        <p>${escapeHTML(message)}</p>

        <p>📍 ${escapeHTML(task.location || "Location not specified")}</p>

        <p>💰 ₦${Number(task.budget || 0).toLocaleString()}</p>

        <span class="time">${escapeHTML(time)}</span>
      </div>
    `;
  }

  function openTask(taskId) {
    window.location.href =
      `task-details.html?id=${encodeURIComponent(taskId)}`;
  }

  async function loadAlerts() {
    if (!currentUser) return;

    alertsList.innerHTML = `
      <div class="loading">Loading your alerts...</div>
    `;

    /*
      We fetch tasks where the user is either:

      1. The person who posted the task
      2. The runner who accepted the task
    */

    const { data, error } = await supabaseClient
      .from("tasks")
      .select(`
        id,
        user_id,
        runner_id,
        title,
        description,
        category,
        location,
        budget,
        deadline,
        status,
        created_at
      `)
      .or(
        `user_id.eq.${currentUser.id},runner_id.eq.${currentUser.id}`
      )
      .order("created_at", { ascending: false })
      .limit(30);

    if (error) {
      console.error("Alerts error:", error);

      alertsList.innerHTML = `
        <div class="error">
          Unable to load your alerts.<br>
          Please refresh and try again.
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      alertsList.innerHTML = `
        <div class="empty">
          <div style="font-size:32px; margin-bottom:10px;">🔔</div>
          <strong>No alerts yet</strong>
          <p style="margin-top:6px;">
            Your OOULink task activity will appear here.
          </p>
        </div>
      `;

      return;
    }

    let html = "";

    data.forEach(task => {
      const isUploader = task.user_id === currentUser.id;
      const isRunner = task.runner_id === currentUser.id;

      const status = String(task.status || "open").toLowerCase();

      /*
        Uploader alerts
      */

      if (isUploader) {

        html += createAlert(
          "📋",
          "Task posted",
          "Your task has been posted and is visible to people looking for tasks.",
          task,
          timeAgo(task.created_at)
        );

        if (task.runner_id) {
          html += createAlert(
            "🤝",
            "Task accepted",
            "A runner has accepted your task.",
            task,
            timeAgo(task.created_at)
          );
        }

        if (
          status === "in_progress" ||
          status === "in progress" ||
          status === "accepted"
        ) {
          html += createAlert(
            "🔄",
            "Task in progress",
            "Your task is currently being worked on.",
            task,
            timeAgo(task.created_at)
          );
        }

        if (
          status === "completed" ||
          status === "complete"
        ) {
          html += createAlert(
            "✅",
            "Task completed",
            "Your task has been marked as completed.",
            task,
            timeAgo(task.created_at)
          );
        }

        if (status === "cancelled" || status === "canceled") {
          html += createAlert(
            "❌",
            "Task cancelled",
            "Your task has been cancelled.",
            task,
            timeAgo(task.created_at)
          );
        }
      }

      /*
        Runner alerts
      */

      if (isRunner) {

        html += createAlert(
          "🤝",
          "Task accepted",
          "You accepted this task. Check the task details and get it done.",
          task,
          timeAgo(task.created_at)
        );

        if (
          status === "in_progress" ||
          status === "in progress" ||
          status === "accepted"
        ) {
          html += createAlert(
            "🔄",
            "Task in progress",
            "This task is currently in progress.",
            task,
            timeAgo(task.created_at)
          );
        }

        if (
          status === "completed" ||
          status === "complete"
        ) {
          html += createAlert(
            "✅",
            "Task completed",
            "This task has been marked as completed.",
            task,
            timeAgo(task.created_at)
          );
        }

        if (status === "cancelled" || status === "canceled") {
          html += createAlert(
            "❌",
            "Task cancelled",
            "This task has been cancelled.",
            task,
            timeAgo(task.created_at)
          );
        }
      }
    });

    if (!html) {
      alertsList.innerHTML = `
        <div class="empty">
          <div style="font-size:32px; margin-bottom:10px;">🔔</div>
          <strong>No alerts yet</strong>
          <p style="margin-top:6px;">
            Your OOULink activity will appear here.
          </p>
        </div>
      `;

      return;
    }

    alertsList.innerHTML = html;
  }

  async function initialize() {
    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;

    await loadAlerts();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (!session) {
      window.location.href = "login.html";
    }
  });

  initialize();
</script></body>
</html>
