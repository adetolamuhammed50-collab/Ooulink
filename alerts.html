<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 80px;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      color: #b91c1c;
    }

    .task-group {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .task-header {
      padding: 16px;
      cursor: pointer;
    }

    .task-title {
      font-weight: bold;
      font-size: 17px;
    }

    .task-meta {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }

    .group-content {
      display: none;
      border-top: 1px solid #eee;
      padding: 8px 16px 16px;
    }

    .group-content.open {
      display: block;
    }

    .notification {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .notification:last-child {
      border-bottom: none;
    }

    .notification-title {
      font-weight: bold;
    }

    .notification-message {
      font-size: 14px;
      color: #4b5563;
      margin-top: 4px;
    }

    .notification-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .unread {
      font-weight: bold;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-size: 13px;
    }

    .bell-wrap {
      position: relative;
      display: inline-block;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🔔 Alerts</h1>
</header>

<div class="container">
  <div id="alertsContainer">
    <div class="loading">Loading your alerts...</div>
  </div>
</div>

<nav>
  <a href="index.html">🏠<br>Home</a>

  <a href="find-tasks.html">🔎<br>Tasks</a>

  <a href="my-tasks.html">📋<br>My Tasks</a>

  <a href="alerts.html">
    <span class="bell-wrap">
      🔔
      <span id="notificationDot" class="notification-dot"></span>
    </span>
    <br>Alerts
  </a>

  <a href="profile.html">👤<br>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const alertsContainer =
  document.getElementById("alertsContainer");

const notificationDot =
  document.getElementById("notificationDot");

let currentUser = null;


/* =========================
   TIME FORMAT
========================= */

function timeAgo(date) {

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if (seconds < 60)
    return "Just now";

  const minutes =
    Math.floor(seconds / 60);

  if (minutes < 60)
    return minutes + " min ago";

  const hours =
    Math.floor(minutes / 60);

  if (hours < 24)
    return hours + " hr ago";

  const days =
    Math.floor(hours / 24);

  return days + " day" + (days > 1 ? "s" : "") + " ago";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   UPDATE RED DOT
========================= */

async function updateNotificationDot() {

  if (!currentUser) return;

  const { count, error } =
    await supabaseClient
      .from("notifications")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("user_id", currentUser.id)
      .eq("is_read", false);

  if (error) {
    console.error(error);
    return;
  }

  notificationDot.style.display =
    count > 0 ? "block" : "none";
}


/* =========================
   LOAD ALERTS
========================= */

async function loadAlerts() {

  try {

    alertsContainer.innerHTML =
      '<div class="loading">Loading your alerts...</div>';


    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {

      window.location.href = "login.html";
      return;
    }


    currentUser =
      sessionData.session.user;


    await updateNotificationDot();


    const { data: notifications, error } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
          ascending: false
        });


    if (error) {
      throw error;
    }


    if (!notifications || notifications.length === 0) {

      alertsContainer.innerHTML =
        '<div class="empty">🔔 No alerts yet.</div>';

      return;
    }


    const groups = {};


    notifications.forEach(notification => {

      const key =
        notification.task_id ||
        "general";


      if (!groups[key]) {
        groups[key] = [];
      }


      groups[key].push(notification);

    });


    alertsContainer.innerHTML = "";


    Object.keys(groups).forEach(taskId => {

      const list =
        groups[taskId];

      const latest =
        list[0];


      const taskTitle =
        latest.task_id
          ? (
              latest.message.match(/"([^"]+)"/)?.[1] ||
              latest.title ||
              "Task"
            )
          : "General";


      const group =
        document.createElement("div");

      group.className =
        "task-group";


      const header =
        document.createElement("div");

      header.className =
        "task-header";


      header.innerHTML = `
        <div class="task-title">
          📦 ${escapeHTML(taskTitle)}
        </div>

        <div class="task-meta">
          ${list.length} notification${list.length !== 1 ? "s" : ""}
          • Latest: ${timeAgo(latest.created_at)}
          <span style="float:right">▼</span>
        </div>
      `;


      const content =
        document.createElement("div");

      content.className =
        "group-content";


      list.forEach(notification => {

        const item =
          document.createElement("div");

        item.className =
          "notification " +
          (!notification.is_read ? "unread" : "");


        item.innerHTML = `
          <div class="notification-title">
            ${escapeHTML(notification.title)}
          </div>

          <div class="notification-message">
            ${escapeHTML(notification.message)}
          </div>

          <div class="notification-time">
            ${timeAgo(notification.created_at)}
          </div>
        `;


        content.appendChild(item);

      });


      header.addEventListener("click", async () => {

        const isOpen =
          content.classList.contains("open");


        content.classList.toggle("open");


        header.querySelector(
          ".task-meta span"
        ).textContent =
          isOpen ? "▼" : "▲";


        if (!isOpen) {

          const unreadIds =
            list
              .filter(n => !n.is_read)
              .map(n => n.id);


          if (unreadIds.length > 0) {

            await supabaseClient
              .from("notifications")
              .update({
                is_read: true
              })
              .in("id", unreadIds);


            list.forEach(n => {
              n.is_read = true;
            });


            content
              .querySelectorAll(".unread")
              .forEach(el => {
                el.classList.remove("unread");
              });


            await updateNotificationDot();
          }

        }

      });


      group.appendChild(header);
      group.appendChild(content);

      alertsContainer.appendChild(group);

    });


  } catch (error) {

    console.error(
      "Alerts error:",
      error
    );


    alertsContainer.innerHTML = `
      <div class="error">
        ❌ Unable to load alerts.<br><br>
        Please refresh the page.
      </div>
    `;

  }

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadAlerts
);

</script>

</body>
</html>
