<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 88px;
    }
    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #f5f7fb;
    }
    header {
      background: #16834b;
      color: #fff;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; }
    .count {
      font-size: 12px;
      background: rgba(255,255,255,.16);
      padding: 6px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .container { padding: 14px; }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding: 2px 1px 5px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      border: 1px solid #dbe2ea;
      background: #fff;
      color: #4b5563;
      border-radius: 20px;
      padding: 9px 13px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .16s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .filter:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .filter:active { transform: scale(.96); }
    .filter:focus-visible { outline: 3px solid rgba(22,131,75,.22); outline-offset: 2px; }
    .filter.active {
      background: #16834b;
      color: #fff;
      border-color: #16834b;
      box-shadow: 0 5px 14px rgba(22,131,75,.18);
    }
    .group {
      background: #fff;
      border-radius: 15px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 9px rgba(0,0,0,.06);
      animation: up .28s ease both;
    }
    .group-head {
      padding: 15px;
      cursor: pointer;
      user-select: none;
      transition: background .18s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .group-head:hover { background: #fafdfb; }
    .group-head:active { background: #f3f9f5; transform: scale(.995); }
    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
    }
    .title-text {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: none;
      background: #ef4444;
      color: #fff;
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 10px;
    }
    .has-unread .badge { display: inline-block; }
    .meta {
      margin-top: 6px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      gap: 6px;
    }
    .arrow { margin-left: auto; transition: transform .2s ease; }
    .open .arrow { transform: rotate(180deg); }
    .content {
      display: none;
      border-top: 1px solid #eef1f4;
      padding: 5px 15px 15px;
    }
    .content.open { display: block; animation: down .22s ease; }
    .note {
      position: relative;
      padding: 12px 5px 12px 12px;
      border-bottom: 1px solid #eef1f4;
      border-radius: 10px;
      transition: background .16s ease, transform .16s ease;
    }
    .note:last-child { border: 0; }
    .note:active { background: #f3f9f5; transform: scale(.995); }
    .note.unread { background: #f4fbf7; }
    .note.unread:before {
      content: "";
      position: absolute;
      left: 2px;
      top: 17px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16834b;
    }
    .note-top { display: flex; gap: 9px; }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #eef8f2;
      display: grid;
      place-items: center;
      flex: none;
    }
    .ntitle { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .msg { font-size: 13px; color: #4b5563; margin-top: 4px; line-height: 1.45; }
    .time { font-size: 11px; color: #9ca3af; margin-top: 5px; }
    .actions { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
    .btn, .retry {
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      background: #16834b;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover, .retry:hover { box-shadow: 0 5px 14px rgba(22,131,75,.2); filter: brightness(1.03); }
    .btn:active, .retry:active { transform: scale(.96); }
    .btn:focus-visible, .retry:focus-visible { outline: 3px solid rgba(22,131,75,.22); outline-offset: 2px; }
    .chat { background: #eef8f2; padding: 12px; margin-top: 8px; border-radius: 10px; }
    .chat .btn { width: 100%; font-size: 12px; }
    .empty, .error {
      background: #fff;
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 12px;
      box-shadow: 0 2px 9px rgba(0,0,0,.05);
    }
    .empty-icon { font-size: 34px; }
    .empty-title { font-weight: 700; font-size: 16px; margin-top: 7px; }
    .empty-text { font-size: 13px; color: #6b7280; margin-top: 6px; }
    .error { color: #b91c1c; }
    .retry { margin-top: 12px; }
    .live {
      font-size: 10px;
      background: rgba(255,255,255,.14);
      padding: 5px 8px;
      border-radius: 20px;
      margin-left: 5px;
    }
    .live.on { background: #16a34a; }
    .live.off { background: #dc2626; }
    .skeleton {
      height: 95px;
      background: linear-gradient(90deg, #fff 25%, #edf1f5 50%, #fff 75%);
      background-size: 200% 100%;
      border-radius: 15px;
      margin-bottom: 12px;
      animation: shine 1.2s infinite;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #e5e8e6;
      display: flex;
      justify-content: space-around;
      padding: 8px 5px 10px;
      z-index: 1000;
      box-shadow: 0 -5px 18px rgba(0,0,0,.05);
    }
    .nav a {
      position: relative;
      min-width: 58px;
      min-height: 52px;
      padding: 5px 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-align: center;
      font-size: 11px;
      color: #777;
      text-decoration: none;
      border-radius: 13px;
      transition: color .18s ease, background .18s ease, transform .16s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .nav a:hover { color: #16834b; background: #f2f8f4; }
    .nav a:active { transform: scale(.91); }
    .nav a:focus-visible { outline: 3px solid rgba(22,131,75,.22); outline-offset: 2px; }
    .nav a.active {
      color: #16834b;
      font-weight: 700;
      background: #eef8f2;
      box-shadow: inset 0 0 0 1px rgba(22,131,75,.08);
    }
    .nav a.active::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: #16834b;
    }
    .nav-icon {
      display: block;
      font-size: 18px;
      line-height: 20px;
      transition: transform .18s ease;
    }
    .nav a:hover .nav-icon { transform: translateY(-1px) scale(1.06); }
    .nav a:active .nav-icon { transform: scale(.9); }
    .bell { position: relative; display: inline-block; height: 20px; }
    .dot {
      position: absolute;
      top: -1px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid #fff;
      display: none;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes down {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes shine { to { background-position: -200% 0; } }
    @media (max-width: 360px) {
      h1 { font-size: 21px; }
      .count { font-size: 11px; padding: 5px 7px; }
      .nav a { min-width: 52px; padding-left: 4px; padding-right: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="head">
        <h1>🔔 Alerts <span id="live" class="live">LIVE</span></h1>
        <div id="count" class="count">0 unread</div>
      </div>
    </header>

    <div class="container">
      <div id="filters" class="filters">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="unread" type="button">Unread</button>
        <button class="filter" data-filter="message" type="button">Messages</button>
        <button class="filter" data-filter="system" type="button">System</button>
      </div>

      <div id="alerts">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  </div>

  <nav class="nav" aria-label="Main navigation">
    <a href="index.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>
    <a href="my-tasks.html">
      <span class="nav-icon">✓</span>
      <span>My Tasks</span>
    </a>
    <a href="post-task.html">
      <span class="nav-icon">＋</span>
      <span>Post</span>
    </a>
    <a href="alerts.html" class="active" aria-current="page">
      <span class="bell">
        <span class="nav-icon">🔔</span>
        <span id="dot" class="dot"></span>
      </span>
      <span>Alerts</span>
    </a>
    <a href="profile.html">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const alerts = document.getElementById("alerts");
    const dot = document.getElementById("dot");
    const count = document.getElementById("count");
    const filters = document.getElementById("filters");
    const live = document.getElementById("live");

    let moderationBlocked = false;
    let currentUser = null;
    let allNotifications = [];
    let taskMap = {};
    let activeFilter = "all";
    let alertsChannel = null;
    let loading = false;

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showModerationScreen(data) {
      if (moderationBlocked) return;
      moderationBlocked = true;

      const temporary = data.ban_type === "temporary";
      const bannedUntil = temporary && data.banned_until
        ? new Date(data.banned_until).toLocaleString()
        : null;

      document.body.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999">
          <div style="width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px 22px;text-align:center">
            <div style="font-size:48px">🚫</div>
            <h2>StudTask Account Restricted</h2>
            <p>Your account is currently ${temporary ? "temporarily" : "permanently"} restricted and you cannot access alerts.</p>
            ${temporary && bannedUntil ? `<p><strong>Restriction ends:</strong><br>${escapeHTML(bannedUntil)}</p>` : ""}
            ${data.ban_reason ? `<p><strong>Reason:</strong><br>${escapeHTML(data.ban_reason)}</p>` : ""}
            <p>Please follow StudTask's rules.<br>If you believe this action was made in error, contact StudTask support.</p>
            <button onclick="logoutModerated()" style="width:100%;border:0;border-radius:12px;padding:14px;background:#16834b;color:#fff;font-weight:700">LOG OUT</button>
          </div>
        </div>`;
    }

    async function logoutModerated() {
      await supabaseClient.auth.signOut();
      location.href = "login.html";
    }

    async function checkModeration() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        location.href = "login.html";
        return false;
      }

      currentUser = session.user;

      const { data, error } = await supabaseClient
        .from("user_moderation")
        .select("status,ban_type,banned_until,ban_reason")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (error) return true;

      if (data?.status === "banned") {
        const activeBan = data.ban_type === "permanent" ||
          (data.ban_type === "temporary" && data.banned_until && new Date(data.banned_until) > new Date());

        if (activeBan) {
          showModerationScreen(data);
          return false;
        }
      }

      return true;
    }

    function timeAgo(date) {
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(date).getTime()) / 1000));

      if (seconds < 60) return "Just now";

      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} min ago`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;

      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} day${days !== 1 ? "s" : ""} ago`;

      const weeks = Math.floor(days / 7);
      if (weeks < 5) return `${weeks} week${weeks !== 1 ? "s" : ""} ago`;

      return new Date(date).toLocaleDateString();
    }

    function typeOf(notification) {
      const type = String(notification.type || "").toLowerCase();
      return type === "new_message" || type.includes("message") || type.includes("chat")
        ? "message"
        : "system";
    }

    function iconOf(notification) {
      const type = String(notification.type || "").toLowerCase();

      if (typeOf(notification) === "message") return "💬";
      if (type.includes("accept")) return "✅";
      if (type.includes("complete")) return "🎉";
      if (type.includes("reject")) return "❌";
      if (type.includes("report") || type.includes("warning") || type.includes("ban")) return "⚠️";
      if (type.includes("task")) return "📋";
      return "🔔";
    }

    function taskTitle(id, list) {
      const task = taskMap[id];
      if (task?.title) return task.title;

      const notification = list[0] || {};
      if (notification.task_id) {
        return notification.message?.match(/"([^"]+)"/)?.[1] || notification.title || "Task";
      }

      return "General";
    }

    function groupsFor() {
      const groups = {};

      allNotifications.forEach(notification => {
        const type = typeOf(notification);

        if (activeFilter === "unread" && notification.is_read) return;
        if (activeFilter === "message" && type !== "message") return;
        if (activeFilter === "system" && type !== "system") return;

        const key = notification.task_id || "general";
        if (!groups[key]) groups[key] = [];
        groups[key].push(notification);
      });

      return groups;
    }

    async function updateDot() {
      if (!currentUser) return;

      const { count: unreadCount, error } = await supabaseClient
        .from("notifications")
        .select("id", { count: "exact", head: true })
        .eq("user_id", currentUser.id)
        .eq("is_read", false);

      if (error) {
        console.error("Notification dot error:", error);
        return;
      }

      dot.style.display = unreadCount > 0 ? "block" : "none";
      count.textContent = `${unreadCount || 0} unread`;
    }

    async function markRead(list) {
      const ids = list.filter(notification => !notification.is_read).map(notification => notification.id);
      if (!ids.length) return;

      const { error } = await supabaseClient
        .from("notifications")
        .update({ is_read: true })
        .in("id", ids)
        .eq("user_id", currentUser.id);

      if (error) {
        console.error("Read notification error:", error);
        return;
      }

      list.forEach(notification => notification.is_read = true);
      await updateDot();
      render();
    }

    function openChat(id) {
      if (id) window.location.href = `chat.html?id=${encodeURIComponent(id)}`;
    }

    function openTask(id) {
      if (id) window.location.href = `task-details.html?id=${encodeURIComponent(id)}`;
    }

    function actionFor(notification, task) {
      if (!task) return null;

      const type = String(notification.type || "").toLowerCase();

      if (type.includes("message") || type.includes("chat")) {
        return { label: "OPEN CHAT", fn: () => openChat(task.id) };
      }

      if (type.includes("task") || type.includes("accept") || type.includes("complete") || type.includes("reject")) {
        return { label: "VIEW TASK", fn: () => openTask(task.id) };
      }

      return null;
    }

    function empty(text) {
      alerts.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔔</div>
          <div class="empty-title">${escapeHTML(text)}</div>
          <div class="empty-text">New activity will appear here automatically.</div>
        </div>`;
    }

    function render() {
      const groups = groupsFor();
      const keys = Object.keys(groups);

      if (!keys.length) {
        empty(activeFilter === "all" ? "No alerts yet." : "No alerts match this filter.");
        return;
      }

      alerts.innerHTML = "";

      keys.sort((a, b) => new Date(groups[b][0].created_at) - new Date(groups[a][0].created_at));

      keys.forEach((id, index) => {
        const list = groups[id];
        const latest = list[0];
        const task = taskMap[id];
        const unread = list.filter(notification => !notification.is_read).length;

        const group = document.createElement("div");
        group.className = `group${unread ? " has-unread" : ""}`;
        group.style.animationDelay = `${Math.min(index * 35, 280)}ms`;

        const head = document.createElement("div");
        head.className = "group-head";
        head.innerHTML = `
          <div class="title">
            <span>${id === "general" ? "🔔" : "📦"}</span>
            <span class="title-text">${escapeHTML(taskTitle(id, list))}</span>
            <span class="badge">${unread}</span>
            <span class="arrow">▼</span>
          </div>
          <div class="meta">
            <span>${list.length} notification${list.length !== 1 ? "s" : ""}</span>
            <span>•</span>
            <span>Latest ${timeAgo(latest.created_at)}</span>
          </div>`;

        const content = document.createElement("div");
        content.className = "content";

        list.forEach(notification => {
          const item = document.createElement("div");
          item.className = `note${!notification.is_read ? " unread" : ""}`;
          item.innerHTML = `
            <div class="note-top">
              <div class="icon">${iconOf(notification)}</div>
              <div>
                <div class="ntitle">${escapeHTML(notification.title || "Notification")}</div>
                <div class="msg">${escapeHTML(notification.message || "")}</div>
                <div class="time">${timeAgo(notification.created_at)}</div>
              </div>
            </div>`;

          const action = actionFor(notification, task);
          if (action) {
            const row = document.createElement("div");
            row.className = "actions";

            const button = document.createElement("button");
            button.className = "btn";
            button.type = "button";
            button.textContent = action.label;
            button.onclick = event => {
              event.stopPropagation();
              action.fn();
            };

            row.appendChild(button);
            item.appendChild(row);
          }

          content.appendChild(item);
        });

        const accepted = task && task.runner_id && (task.status === "accepted" || task.status === "completed");
        const participant = task && (task.user_id === currentUser.id || task.runner_id === currentUser.id);

        if (task && accepted && participant) {
          const area = document.createElement("div");
          area.className = "chat";

          const button = document.createElement("button");
          button.className = "btn";
          button.type = "button";
          button.textContent = "💬 OPEN TASK CHAT";
          button.onclick = event => {
            event.stopPropagation();
            openChat(task.id);
          };

          area.appendChild(button);
          content.appendChild(area);
        }

        head.onclick = async () => {
          const wasOpen = content.classList.contains("open");
          content.classList.toggle("open");
          group.classList.toggle("open", !wasOpen);

          if (!wasOpen) {
            await markRead(list);
            group.classList.remove("has-unread");
          }
        };

        group.append(head, content);
        alerts.appendChild(group);
      });
    }

    async function loadAlerts(showSkeleton = true) {
      loading = true;

      try {
        if (showSkeleton) {
          alerts.innerHTML = `
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>`;
        }

        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;

        if (!session) {
          location.href = "login.html";
          return;
        }

        currentUser = session.user;

        const { data, error } = await supabaseClient
          .from("notifications")
          .select("id,user_id,task_id,type,title,message,is_read,created_at")
          .eq("user_id", currentUser.id)
          .order("created_at", { ascending: false });

        if (error) throw error;

        allNotifications = data || [];
        taskMap = {};

        const ids = [...new Set(allNotifications.map(notification => notification.task_id).filter(Boolean))];

        if (ids.length) {
          const { data: tasks } = await supabaseClient
            .from("tasks")
            .select("id,title,status,user_id,runner_id")
            .in("id", ids);

          (tasks || []).forEach(task => taskMap[task.id] = task);
        }

        await updateDot();

        if (allNotifications.length) {
          render();
        } else {
          empty("No alerts yet.");
        }
      } catch (error) {
        console.error("Alerts load error:", error);
        alerts.innerHTML = `
          <div class="error">
            ❌ Unable to load alerts.<br><br>
            ${escapeHTML(error.message || "Please refresh the page.")}<br>
            <button class="retry" type="button" onclick="loadAlerts()">Try Again</button>
          </div>`;
      } finally {
        loading = false;
      }
    }

    function startRealtime() {
      if (!currentUser) return;

      if (alertsChannel) {
        supabaseClient.removeChannel(alertsChannel);
      }

      alertsChannel = supabaseClient
        .channel(`alerts-live-${currentUser.id}`)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "notifications",
            filter: `user_id=eq.${currentUser.id}`
          },
          payload => {
            const notification = payload.new;

            if (!notification || notification.user_id !== currentUser.id || allNotifications.some(item => item.id === notification.id)) {
              return;
            }

            allNotifications.unshift(notification);

            if (notification.task_id && !taskMap[notification.task_id]) {
              supabaseClient
                .from("tasks")
                .select("id,title,status,user_id,runner_id")
                .eq("id", notification.task_id)
                .maybeSingle()
                .then(({ data }) => {
                  if (data) taskMap[data.id] = data;
                  updateDot();
                  render();
                });
            } else {
              updateDot();
              render();
            }
          }
        )
        .subscribe((status, error) => {
          console.log("Alerts realtime:", status, error || "");

          if (status === "SUBSCRIBED") {
            live.textContent = "● LIVE";
            live.classList.add("on");
            live.classList.remove("off");
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
            live.textContent = "● OFFLINE";
            live.classList.add("off");
            live.classList.remove("on");

            if (currentUser) {
              setTimeout(() => startRealtime(), 4000);
            }
          }
        });
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        if (alertsChannel) supabaseClient.removeChannel(alertsChannel);
        location.href = "login.html";
      } else if (event === "TOKEN_REFRESHED" && session) {
        currentUser = session.user;
      }
    });

    filters.addEventListener("click", event => {
      const button = event.target.closest(".filter");
      if (!button) return;

      activeFilter = button.dataset.filter;

      filters.querySelectorAll(".filter").forEach(item => {
        item.classList.toggle("active", item === button);
      });

      render();
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const allowed = await checkModeration();

      if (allowed) {
        await loadAlerts();
        startRealtime();
      }
    });

    window.addEventListener("beforeunload", () => {
      if (alertsChannel) supabaseClient.removeChannel(alertsChannel);
    });
  </script>
  <script src="brand.js"></script>
</body>
</html>
