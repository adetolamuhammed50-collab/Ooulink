<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alerts - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 82px;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #f5f7fb;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      color: #b91c1c;
    }

    .task-group {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .task-header {
      padding: 16px;
      cursor: pointer;
      user-select: none;
    }

    .task-title {
      font-weight: bold;
      font-size: 17px;
    }

    .task-meta {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }

    .group-content {
      display: none;
      border-top: 1px solid #eee;
      padding: 8px 16px 16px;
    }

    .group-content.open {
      display: block;
    }

    .notification {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .notification:last-child {
      border-bottom: none;
    }

    .notification-title {
      font-weight: bold;
    }

    .notification-message {
      font-size: 14px;
      color: #4b5563;
      margin-top: 4px;
      line-height: 1.4;
    }

    .notification-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .unread {
      font-weight: bold;
    }

    /* =========================
       PERMANENT CHAT BUTTON
       ========================= */

    .chat-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .chat-button:active {
      transform: scale(0.98);
    }

    .chat-area {
      background: #f0f7ff;
      padding: 13px;
      margin: 5px -6px;
      border-radius: 10px;
    }

    /* =========================
       BOTTOM NAV
       ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 68px;
      background: #ffffff;
      border-top: 1px solid #e4e9e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.06);
    }

    .bottom-nav a {
      position: relative;
      flex: 1;
      height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: #68736d;
      font-size: 11px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav a.active {
      color: #16834b;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 22px;
    }

    .bell-wrap {
      position: relative;
      display: inline-block;
      height: 22px;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🔔 Alerts</h1>
  </header>

  <div class="container">
    <div id="alertsContainer">
      <div class="loading">
        Loading your alerts...
      </div>
    </div>
  </div>

</div>


<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="my-tasks.html">

  <span class="nav-icon">📋</span>

  <span>My Tasks</span>

</a>

  <a href="post-task.html">
    <span class="nav-icon">➕</span>
    <span>Post</span>
  </a>

  <a href="alerts.html" class="active">
    <span class="bell-wrap">
      <span class="nav-icon">🔔</span>
      <span
        id="notificationDot"
        class="notification-dot"
      ></span>
    </span>

    <span>Alerts</span>
  </a>

  <a href="profile.html">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const alertsContainer =
  document.getElementById(
    "alertsContainer"
  );

const notificationDot =
  document.getElementById(
    "notificationDot"
  );

let currentUser = null;


/* =========================
   TIME AGO
========================= */

function timeAgo(date) {

  const seconds =
    Math.floor(
      (Date.now() -
        new Date(date).getTime()) /
      1000
    );

  if (seconds < 60)
    return "Just now";

  const minutes =
    Math.floor(seconds / 60);

  if (minutes < 60)
    return minutes + " min ago";

  const hours =
    Math.floor(minutes / 60);

  if (hours < 24)
    return hours + " hr ago";

  const days =
    Math.floor(hours / 24);

  return (
    days +
    " day" +
    (days > 1 ? "s" : "") +
    " ago"
  );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   RED DOT
========================= */

async function updateNotificationDot() {

  if (!currentUser)
    return;

  const {
    count,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "is_read",
        false
      );

  if (error) {

    console.error(
      "Notification dot error:",
      error
    );

    return;
  }

  notificationDot.style.display =
    count > 0
      ? "block"
      : "none";
}


/* =========================
   MARK GROUP READ
========================= */

async function markNotificationsRead(list) {

  const unreadIds =
    list
      .filter(
        n => !n.is_read
      )
      .map(
        n => n.id
      );

  if (
    unreadIds.length === 0
  )
    return;

  const {
    error
  } =
    await supabaseClient
      .from("notifications")
      .update({
        is_read: true
      })
      .in(
        "id",
        unreadIds
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if (error) {

    console.error(
      "Read notification error:",
      error
    );

    return;
  }

  list.forEach(
    n => {
      n.is_read = true;
    }
  );

  await updateNotificationDot();
}


/* =========================
   OPEN CHAT
========================= */

async function openChat(taskId) {

  if (!taskId)
    return;

  window.location.href =
    "chat.html?id=" +
    encodeURIComponent(taskId);
}


/* =========================
   LOAD ALERTS
========================= */

async function loadAlerts() {

  try {

    alertsContainer.innerHTML =
      '<div class="loading">Loading your alerts...</div>';


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient
        .auth
        .getSession();


    if (sessionError)
      throw sessionError;


    if (!sessionData.session) {

      window.location.href =
        "login.html";

      return;
    }


    currentUser =
      sessionData.session.user;


    await updateNotificationDot();


    /*
      Get notifications.
    */

    const {
      data: notifications,
      error
    } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error)
      throw error;


    if (
      !notifications ||
      notifications.length === 0
    ) {

      alertsContainer.innerHTML =
        '<div class="empty">🔔 No alerts yet.</div>';

      return;
    }


    /*
      Group notifications by task.
    */

    const groups = {};


    notifications.forEach(
      notification => {

        const key =
          notification.task_id ||
          "general";

        if (!groups[key]) {
          groups[key] = [];
        }

        groups[key].push(
          notification
        );

      }
    );


    /*
      Get task information so we can
      know whether the task is accepted.
    */

    const taskIds =
      Object.keys(groups)
        .filter(
          id => id !== "general"
        );


    let tasks = [];


    if (taskIds.length > 0) {

      const {
        data,
        error: taskError
      } =
        await supabaseClient
          .from("tasks")
          .select(`
            id,
            title,
            status,
            user_id,
            runner_id
          `)
          .in(
            "id",
            taskIds
          );


      if (taskError) {

        console.error(
          "Task lookup error:",
          taskError
        );

      } else {

        tasks = data || [];
      }
    }


    const taskMap = {};

    tasks.forEach(
      task => {

        taskMap[task.id] =
          task;

      }
    );


    alertsContainer.innerHTML = "";


    /*
      BUILD GROUPS
    */

    Object.keys(groups).forEach(
      taskId => {

        const list =
          groups[taskId];

        const latest =
          list[0];

        const task =
          taskMap[taskId];


        /*
          Use the actual task title
          whenever possible.
        */

        const taskTitle =
          task
            ? task.title
            : (
                latest.task_id
                  ? (
                      latest.message.match(
                        /"([^"]+)"/
                      )?.[1] ||
                      latest.title ||
                      "Task"
                    )
                  : "General"
              );


        const group =
          document.createElement(
            "div"
          );

        group.className =
          "task-group";


        /*
          HEADER
        */

        const header =
          document.createElement(
            "div"
          );

        header.className =
          "task-header";


        header.innerHTML = `

          <div class="task-title">
            📦 ${escapeHTML(taskTitle)}
          </div>

          <div class="task-meta">

            ${list.length}
            notification${list.length !== 1 ? "s" : ""}

            • Latest:
            ${timeAgo(
              latest.created_at
            )}

            <span
              class="arrow"
              style="float:right"
            >
              ▼
            </span>

          </div>

        `;


        /*
          CONTENT
        */

        const content =
          document.createElement(
            "div"
          );

        content.className =
          "group-content";


        list.forEach(
          notification => {

            const item =
              document.createElement(
                "div"
              );


            item.className =
              "notification " +
              (
                !notification.is_read
                  ? "unread"
                  : ""
              );


            item.innerHTML = `

              <div class="notification-title">

                ${
                  notification.type ===
                  "new_message"
                    ? "💬 "
                    : ""
                }

                ${escapeHTML(
                  notification.title
                )}

              </div>

              <div class="notification-message">

                ${escapeHTML(
                  notification.message
                )}

              </div>

              <div class="notification-time">

                ${timeAgo(
                  notification.created_at
                )}

              </div>

            `;


            content.appendChild(
              item
            );

          }
        );


        /*
          =================================================
          PERMANENT CHAT BUTTON
          =================================================

          IMPORTANT:

          This button is NOT connected
          to notification.type.

          It appears whenever:

          1. There is a real task.
          2. The task has been accepted.
          3. The current user is the tasker
             OR the runner.

          Therefore it stays there even when
          there are no new-message notifications.
        */

        const isAccepted =
          task &&
          task.runner_id &&
          (
            task.status === "accepted" ||
            task.status === "completed"
          );


        const isParticipant =
          task &&
          (
            task.user_id ===
              currentUser.id ||

            task.runner_id ===
              currentUser.id
          );


        if (
          task &&
          isAccepted &&
          isParticipant
        ) {

          const chatArea =
            document.createElement(
              "div"
            );

          chatArea.className =
            "chat-area";


          const chatButton =
            document.createElement(
              "button"
            );

          chatButton.type =
            "button";

          chatButton.className =
            "chat-button";

          chatButton.textContent =
            "💬 OPEN TASK CHAT";


          chatButton.addEventListener(
            "click",
            event => {

              event.preventDefault();

              event.stopPropagation();

              openChat(
                task.id
              );

            }
          );


          chatArea.appendChild(
            chatButton
          );

          content.appendChild(
            chatArea
          );
        }


        /*
          OPEN / CLOSE GROUP
        */

        header.addEventListener(
          "click",
          async () => {

            const isOpen =
              content.classList.contains(
                "open"
              );


            content.classList.toggle(
              "open"
            );


            header.querySelector(
              ".arrow"
            ).textContent =
              isOpen
                ? "▼"
                : "▲";


            if (!isOpen) {

              await markNotificationsRead(
                list
              );


              content
                .querySelectorAll(
                  ".unread"
                )
                .forEach(
                  el => {

                    el.classList.remove(
                      "unread"
                    );

                  }
                );

            }

          }
        );


        group.appendChild(
          header
        );

        group.appendChild(
          content
        );

        alertsContainer.appendChild(
          group
        );

      }
    );

  } catch (error) {

    console.error(
      "Alerts error:",
      error
    );


    alertsContainer.innerHTML = `

      <div class="error">

        ❌ Unable to load alerts.

        <br><br>

        ${escapeHTML(
          error.message ||
          "Please refresh the page."
        )}

      </div>

    `;
  }
}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadAlerts
);

</script>

</body>
</html>
