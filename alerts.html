  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 90px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin-top: 15px;

    .subtitle {

      color: #777;
      font-size: 14px;
    }

    .alerts {
      padding: 15px 20px;
    }

    /* Notification dot */

    .bell-wrap {
      position: relative;
      display: inline-block;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      display: none;
    }

    /* Groups */

    .notification-group {
      border: 1px solid #e5e8e6;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      background: white;
    }

    .notification-group.unread {
      border-color: #b8dec9;
      background: #fbfffc;
    }

    .group-header {
      width: 100%;
      border: none;
      background: transparent;
      padding: 16px;
      text-align: left;
      cursor: pointer;
    }

    .group-header:active {
      background: #f5faf7;
    }

    .group-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .group-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eef8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .group-main {
      flex: 1;
      min-width: 0;
    }

    .group-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.35;
      word-break: break-word;
    }

    .group-meta {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    .group-preview {
      margin-top: 7px;
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }

    .group-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .unread-badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .chevron {
      color: #777;
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .notification-group.open .chevron {
      transform: rotate(180deg);
    }

    /* Expanded */

    .group-content {
      display: none;
      border-top: 1px solid #e5e8e6;
      background: #fafcfb;
    }

    .notification-group.open .group-content {
      display: block;
    }

    .notification-item {
      display: flex;
      gap: 11px;
      padding: 14px 16px;
      border-bottom: 1px solid #e8ebe9;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-item.unread-item {
      background: #f4fbf7;
    }

    .notification-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: white;
      border: 1px solid #e4e8e5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .notification-body {
      flex: 1;
      min-width: 0;
    }

    .notification-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .notification-message {
      font-size: 12px;
      color: #666;
      line-height: 1.45;
    }

    .notification-time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      color: #999;
    }

    .unread-mark {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .task-info {
      padding: 12px 16px;
      border-top: 1px solid #e5e8e6;
      background: white;
      font-size: 11px;
      color: #777;
      line-height: 1.7;
    }

    .task-info strong {
      color: #17231d;
    }

    /* States */

    .empty,
    .loading,
    .error {
      text-align: center;
      padding: 45px 20px;
      font-size: 14px;
    }

    .empty {
      color: #777;
    }

    .loading {
      color: #777;
    }

    .error {
      color: #c0392b;
    }

    .retry-btn {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #16834b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* Bottom nav */

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      background: white;
      border-top: 1px solid #e5e8e6;
      z-index: 20;
    }

    nav a {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #16834b;
      font-weight: bold;
    }
  </style>
</head>

<script src="notifications.js"></script>

<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const alertsList =
    document.getElementById("alertsList");


  let currentUser = null;

  let taskGroups = {};


  /* =========================
     SECURITY
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "")

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =========================
     TIME
  ========================= */

  function timeAgo(dateValue) {

    if (!dateValue) {
      return "Recently";
    }

    const date =
      new Date(dateValue);

    if (isNaN(date.getTime())) {
      return "Recently";
    }

    const seconds =
      Math.floor(
        (new Date() - date) / 1000
      );

    if (seconds < 60) {
      return "Just now";
    }

    const minutes =
      Math.floor(seconds / 60);

    if (minutes < 60) {

      return `${minutes} minute${
        minutes === 1 ? "" : "s"
      } ago`;

    }

    const hours =
      Math.floor(minutes / 60);

    if (hours < 24) {

      return `${hours} hour${
        hours === 1 ? "" : "s"
      } ago`;

    }

    const days =
      Math.floor(hours / 24);

    if (days < 7) {

      return `${days} day${
        days === 1 ? "" : "s"
      } ago`;

    }

    return date.toLocaleDateString();

  }


  /* =========================
     ICONS
  ========================= */

  function getIcon(type) {

    const icons = {

      task_posted: "📋",

      task_accepted: "🤝",

      task_progress: "🔄",

      task_completed: "✅",

      task_cancelled: "❌",

      deadline_approaching: "⏰",

      new_message: "💬",

      payment: "💰"

    };

    return icons[type] || "🔔";

  }


  function statusText(status) {

    if (!status) {
      return "Open";
    }

    const text =
      String(status)
        .replace(/_/g, " ")
        .toLowerCase();

    return (
      text.charAt(0).toUpperCase() +
      text.slice(1)
    );

  }


  /* =========================
     ADD NOTIFICATION
  ========================= */

  function addNotification(
    taskId,
    notification,
    task = null
  ) {

    if (!taskGroups[taskId]) {

      taskGroups[taskId] = {

        task: task,

        notifications: []

      };

    }

    if (
      task &&
      !taskGroups[taskId].task
    ) {

      taskGroups[taskId].task =
        task;

    }

    taskGroups[taskId]
      .notifications
      .push(notification);

  }


  /* =========================
     LOAD ALERTS
  ========================= */

  async function loadAlerts() {

    alertsList.innerHTML = `
      <div class="loading">
        Loading your alerts...
      </div>
    `;

    taskGroups = {};


    try {

      /* =========================
         GET SESSION
      ========================= */

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (sessionError) {

        throw sessionError;

      }


      if (!sessionData.session) {

        window.location.href =
          "login.html?redirect=alerts.html";

        return;

      }


      currentUser =
        sessionData.session.user;


      /* =========================
         GET NOTIFICATIONS FIRST
      ========================= */

      const {
        data: notifications,
        error: notificationError
      } =
        await supabaseClient

          .from("notifications")

          .select(`
            id,
            user_id,
            task_id,
            type,
            title,
            message,
            is_read,
            created_at
          `)

          .eq(
            "user_id",
            currentUser.id
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(100);


      if (notificationError) {

        throw notificationError;

      }


      /* =========================
         GET USER TASKS
      ========================= */

      const {
        data: tasks,
        error: taskError
      } =
        await supabaseClient

          .from("tasks")

          .select(`
            id,
            user_id,
            runner_id,
            title,
            description,
            category,
            location,
            budget,
            deadline,
            status,
            created_at
          `)

          .or(
            `user_id.eq.${currentUser.id},runner_id.eq.${currentUser.id}`
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(50);


      if (taskError) {

        throw taskError;

      }


      const taskList =
        tasks || [];


      /* =========================
         MAP TASKS
      ========================= */

      const taskMap = {};

      taskList.forEach(task => {

        taskMap[task.id] =
          task;

      });


      /* =========================
         GROUP REAL NOTIFICATIONS
      ========================= */

      (notifications || [])
        .forEach(notification => {

          const task =
            notification.task_id
              ? taskMap[notification.task_id]
              : null;


          if (
            notification.task_id &&
            !task
          ) {

            return;

          }


          const groupId =
            notification.task_id ||
            "general";


          addNotification(
            groupId,
            {
              ...notification,
              dynamic: false
            },
            task
          );

        });


      /* =========================
         FALLBACK ACTIVITY
      ========================= */

      taskList.forEach(task => {

        if (!taskGroups[task.id]) {

          taskGroups[task.id] = {

            task: task,

            notifications: []

          };

        }


        const group =
          taskGroups[task.id];


        const existingTypes =
          group.notifications
            .map(
              notification =>
                notification.type
            );


        /* Task posted */

        if (
          task.user_id === currentUser.id &&
          !existingTypes.includes(
            "task_posted"
          )
        ) {

          group.notifications.push({

            id:
              `posted-${task.id}`,

            task_id:
              task.id,

            type:
              "task_posted",

            title:
              "Task posted",

            message:
              "Your task has been posted successfully.",

            created_at:
              task.created_at,

            is_read:
              true,

            dynamic:
              true,

            task

          });

        }


        /* Task accepted */

        if (
          task.runner_id &&
          !existingTypes.includes(
            "task_accepted"
          )
        ) {

          const isUploader =
            task.user_id ===
            currentUser.id;


          const isRunner =
            task.runner_id ===
            currentUser.id;


          if (
            isUploader ||
            isRunner
          ) {

            group.notifications.push({

              id:
                `accepted-${task.id}`,

              task_id:
                task.id,

              type:
                "task_accepted",

              title:
                "Task accepted",

              message:

                isUploader

                  ? "Someone accepted your task."

                  : "You accepted this task.",

              created_at:
                task.created_at,

              is_read:
                true,

              dynamic:
                true,

              task

            });

          }

        }


        /* Completed */

        if (
          task.status ===
          "completed" &&
          !existingTypes.includes(
            "task_completed"
          )
        ) {

          group.notifications.push({

            id:
              `completed-${task.id}`,

            task_id:
              task.id,

            type:
              "task_completed",

            title:
              "Task completed",

            message:
              "This task has been marked as completed.",

            created_at:
              task.created_at,

            is_read:
              true,

            dynamic:
              true,

            task

          });

        }


        /* Cancelled */

        if (
          task.status ===
          "cancelled" &&
          !existingTypes.includes(
            "task_cancelled"
          )
        ) {

          group.notifications.push({

            id:
              `cancelled-${task.id}`,

            task_id:
              task.id,

            type:
              "task_cancelled",

            title:
              "Task cancelled",

            message:
              "This task has been cancelled.",

            created_at:
              task.created_at,

            is_read:
              true,

            dynamic:
              true,

            task

          });

        }

      });


      /* =========================
         REMOVE EMPTY GROUPS
      ========================= */

      Object.keys(taskGroups)
        .forEach(id => {

          if (
            !taskGroups[id]
              .notifications
              .length
          ) {

            delete taskGroups[id];

          }

        });


      const groups =
        Object.values(taskGroups);


      /* =========================
         NOTHING FOUND
      ========================= */

      if (!groups.length) {

        alertsList.innerHTML = `

          <div class="empty">

            <div
              style="
                font-size:38px;
                margin-bottom:12px;
              "
            >
              🔔
            </div>

            <strong>
              No alerts yet
            </strong>

            <p
              style="
                margin-top:7px;
              "
            >
              Your OOULink activity
              will appear here.
            </p>

          </div>

        `;

        return;

      }


      /* =========================
         SORT GROUPS
      ========================= */

      groups.sort(
        (a, b) => {

          const aLatest =
            Math.max(
              ...a.notifications.map(
                n =>
                  new Date(
                    n.created_at || 0
                  ).getTime()
              )
            );


          const bLatest =
            Math.max(
              ...b.notifications.map(
                n =>
                  new Date(
                    n.created_at || 0
                  ).getTime()
              )
            );


          return bLatest - aLatest;

        }
      );


      /* =========================
         RENDER
      ========================= */

      let html = "";


      groups.forEach(group => {

        const task =
          group.task;


        const list =
          [...group.notifications]
            .sort(
              (a, b) =>
                new Date(
                  b.created_at || 0
                ) -
                new Date(
                  a.created_at || 0
                )
            );


        const unread =
          list.filter(
            n =>
              n.is_read === false &&
              !n.dynamic
          );


        const unreadCount =
          unread.length;


        const latest =
          list[0];


        const title =
          task?.title ||
          "OOULink notification";


        const icon =
          getIcon(
            latest?.type
          );


        const groupId =
          task?.id ||
          "general";


        html += `

          <div
            class="
              notification-group
              ${
                unreadCount > 0
                  ? "unread"
                  : ""
              }
            "
            id="group-${escapeHTML(groupId)}"
          >

            <button
              class="group-header"
              onclick="
                toggleGroup(
                  '${escapeHTML(groupId)}'
                )
              "
            >

              <div class="group-top">

                <div class="group-icon">
                  ${icon}
                </div>


                <div class="group-main">

                  <div class="group-title">

                    ${escapeHTML(title)}

                  </div>


                  <div class="group-meta">

                    ${list.length}

                    notification${
                      list.length === 1
                        ? ""
                        : "s"
                    }

                    ${
                      task
                        ? ` • ${escapeHTML(
                            statusText(
                              task.status
