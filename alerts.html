<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alerts - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      padding-bottom: 82px;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #f5f7fb;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      color: #b91c1c;
    }

    .task-group {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .task-header {
      padding: 16px;
      cursor: pointer;
      user-select: none;
    }

    .task-title {
      font-weight: bold;
      font-size: 17px;
    }

    .task-meta {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }

    .group-content {
      display: none;
      border-top: 1px solid #eee;
      padding: 8px 16px 16px;
    }

    .group-content.open {
      display: block;
    }

    .notification {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .notification:last-child {
      border-bottom: none;
    }

    .notification-title {
      font-weight: bold;
    }

    .notification-message {
      font-size: 14px;
      color: #4b5563;
      margin-top: 4px;
    }

    .notification-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .unread {
      font-weight: bold;
    }

    /* CLICKABLE CHAT NOTIFICATION */

    .chat-notification {
      cursor: pointer;
      padding: 13px;
      margin: 4px -6px;
      border-radius: 10px;
      background: #f0f7ff;
    }

    .chat-notification:active {
      transform: scale(0.99);
    }

    .chat-link {
      margin-top: 7px;
      font-size: 12px;
      font-weight: bold;
      color: #2563eb;
    }

    /* STANDARD BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 68px;
      background: #ffffff;
      border-top: 1px solid #e4e9e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.06);
    }

    .bottom-nav a {
      position: relative;
      flex: 1;
      height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: #68736d;
      font-size: 11px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav a.active {
      color: #16834b;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 22px;
    }

    .bell-wrap {
      position: relative;
      display: inline-block;
      height: 22px;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🔔 Alerts</h1>
  </header>

  <div class="container">

    <div id="alertsContainer">
      <div class="loading">
        Loading your alerts...
      </div>
    </div>

  </div>

</div>


<!-- =========================
     BOTTOM NAV
     ========================= -->

<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="find-tasks.html">
    <span class="nav-icon">🔎</span>
    <span>Find Tasks</span>
  </a>

  <a href="post-task.html">
    <span class="nav-icon">➕</span>
    <span>Post</span>
  </a>

  <a href="alerts.html" class="active">
    <span class="bell-wrap">
      <span class="nav-icon">🔔</span>
      <span
        id="notificationDot"
        class="notification-dot"
      ></span>
    </span>

    <span>Alerts</span>
  </a>

  <a href="profile.html">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const alertsContainer =
  document.getElementById("alertsContainer");

const notificationDot =
  document.getElementById("notificationDot");

let currentUser = null;


/* =========================
   TIME AGO
   ========================= */

function timeAgo(date) {

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if (seconds < 60)
    return "Just now";

  const minutes =
    Math.floor(seconds / 60);

  if (minutes < 60)
    return minutes + " min ago";

  const hours =
    Math.floor(minutes / 60);

  if (hours < 24)
    return hours + " hr ago";

  const days =
    Math.floor(hours / 24);

  return (
    days +
    " day" +
    (days > 1 ? "s" : "") +
    " ago"
  );
}


/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   RED DOT
   ========================= */

async function updateNotificationDot() {

  if (!currentUser)
    return;

  const {
    count,
    error
  } =
    await supabaseClient
      .from("notifications")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("user_id", currentUser.id)
      .eq("is_read", false);

  if (error) {

    console.error(
      "Notification dot error:",
      error
    );

    return;
  }

  notificationDot.style.display =
    count > 0
      ? "block"
      : "none";
}


/* =========================
   MARK NOTIFICATIONS READ
   ========================= */

async function markNotificationsRead(list) {

  const unreadIds =
    list
      .filter(n => !n.is_read)
      .map(n => n.id);

  if (unreadIds.length === 0)
    return;

  const {
    error
  } =
    await supabaseClient
      .from("notifications")
      .update({
        is_read: true
      })
      .in("id", unreadIds);

  if (error) {

    console.error(
      "Read notification error:",
      error
    );

    return;
  }

  list.forEach(n => {
    n.is_read = true;
  });

  await updateNotificationDot();
}


/* =========================
   OPEN CHAT
   ========================= */

async function openChat(notification) {

  if (!notification.task_id)
    return;

  /*
    Mark this notification as read
    before opening the chat.
  */

  if (!notification.is_read) {

    const {
      error
    } =
      await supabaseClient
        .from("notifications")
        .update({
          is_read: true
        })
        .eq("id", notification.id)
        .eq("user_id", currentUser.id);

    if (error) {

      console.error(
        "Could not mark message notification read:",
        error
      );

    } else {

      notification.is_read = true;

      await updateNotificationDot();
    }
  }

  /*
    Open the exact chat belonging
    to this task.
  */

  window.location.href =
    "chat.html?id=" +
    encodeURIComponent(
      notification.task_id
    );
}


/* =========================
   LOAD ALERTS
   ========================= */

async function loadAlerts() {

  try {

    alertsContainer.innerHTML =
      '<div class="loading">Loading your alerts...</div>';


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError)
      throw sessionError;


    if (!sessionData.session) {

      window.location.href =
        "login.html";

      return;
    }


    currentUser =
      sessionData.session.user;


    await updateNotificationDot();


    const {
      data: notifications,
      error
    } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error)
      throw error;


    if (
      !notifications ||
      notifications.length === 0
    ) {

      alertsContainer.innerHTML =
        '<div class="empty">🔔 No alerts yet.</div>';

      return;
    }


    /* =========================
       GROUP BY TASK
       ========================= */

    const groups = {};


    notifications.forEach(
      notification => {

        const key =
          notification.task_id ||
          "general";


        if (!groups[key]) {

          groups[key] = [];
        }


        groups[key].push(
          notification
        );

      }
    );


    alertsContainer.innerHTML = "";


    /* =========================
       BUILD GROUPS
       ========================= */

    Object.keys(groups).forEach(
      taskId => {

        const list =
          groups[taskId];

        const latest =
          list[0];


        const taskTitle =
          latest.task_id
            ? (
                latest.message.match(
                  /"([^"]+)"/
                )?.[1] ||
                latest.title ||
                "Task"
              )
            : "General";


        const group =
          document.createElement(
            "div"
          );

        group.className =
          "task-group";


        /* =====================
           GROUP HEADER
           ===================== */

        const header =
          document.createElement(
            "div"
          );

        header.className =
          "task-header";


        header.innerHTML = `

          <div class="task-title">
            📦 ${escapeHTML(taskTitle)}
          </div>

          <div class="task-meta">

            ${list.length}
            notification${list.length !== 1 ? "s" : ""}

            • Latest:
            ${timeAgo(latest.created_at)}

            <span
              style="float:right"
            >
              ▼
            </span>

          </div>

        `;


        /* =====================
           GROUP CONTENT
           ===================== */

        const content =
          document.createElement(
            "div"
          );

        content.className =
          "group-content";


        list.forEach(
          notification => {

            const item =
              document.createElement(
                "div"
              );


            const isChat =
              notification.type ===
              "new_message";


            item.className =
              "notification " +
              (
                !notification.is_read
                  ? "unread "
                  : ""
              ) +
              (
                isChat
                  ? "chat-notification"
                  : ""
              );


            item.innerHTML = `

              <div class="notification-title">

                ${isChat ? "💬 " : ""}

                ${escapeHTML(
                  notification.title
                )}

              </div>

              <div class="notification-message">

                ${escapeHTML(
                  notification.message
                )}

              </div>

              <div class="notification-time">

                ${timeAgo(
                  notification.created_at
                )}

              </div>

              ${
                isChat
                  ? `
                    <div class="chat-link">
                      💬 Tap to open chat
                    </div>
                  `
                  : ""
              }

            `;


            /* =====================
               CHAT CLICK
               ===================== */

            if (isChat) {

              item.addEventListener(
                "click",
                async event => {

                  event.stopPropagation();

                  await openChat(
                    notification
                  );

                }
              );

            }


            content.appendChild(
              item
            );

          }
        );


        /* =====================
           GROUP OPEN/CLOSE
           ===================== */

        header.addEventListener(
          "click",
          async () => {

            const isOpen =
              content.classList.contains(
                "open"
              );


            content.classList.toggle(
              "open"
            );


            header.querySelector(
              ".task-meta span"
            ).textContent =
              isOpen
                ? "▼"
                : "▲";


            if (!isOpen) {

              /*
                Opening a task group marks
                its unread notifications as read.

                Chat notifications are also
                marked read here.
              */

              await markNotificationsRead(
                list
              );


              content
                .querySelectorAll(
                  ".unread"
                )
                .forEach(el => {

                  el.classList.remove(
                    "unread"
                  );

                });

            }

          }
        );


        group.appendChild(
          header
        );

        group.appendChild(
          content
        );

        alertsContainer.appendChild(
          group
        );

      }
    );


  } catch (error) {

    console.error(
      "Alerts error:",
      error
    );


    alertsContainer.innerHTML = `

      <div class="error">

        ❌ Unable to load alerts.

        <br><br>

        Please refresh the page.

      </div>

    `;

  }

}


/* =========================
   START
   ========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadAlerts
);

</script>

</body>
</html>
