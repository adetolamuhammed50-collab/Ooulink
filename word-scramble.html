<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Scramble • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.game{background:#fff;border:1px solid #e3eee7;border-radius:22px;padding:25px 18px;text-align:center;box-shadow:0 6px 20px #1231}.letters{font-size:30px;font-weight:900;letter-spacing:5px;color:#159447;margin:20px 0}.input{width:100%;border:2px solid #dcebe1;border-radius:13px;padding:14px;font-size:18px;text-align:center;outline:0}.input:focus{border-color:#159447}.btn{border:0;background:#159447;color:#fff;border-radius:13px;padding:13px 22px;font-weight:800;margin-top:12px}.msg{height:24px;margin-top:12px;font-size:13px;font-weight:700}.start{margin-top:15px}.result{display:none;margin-top:16px;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center}.result h2{margin:0 0 8px}.big{font-size:38px;font-weight:900;color:#159447}.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:12px 20px;font-weight:800}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="history.back()">← Back</button></header><main class="wrap"><section class="intro"><h1>🔤 Word Scramble</h1><p>Unscramble the letters before time runs out!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="round">0</b><span>ROUND</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="game"><div id="ready"><div style="font-size:48px">🔤</div><p>Can you solve the scrambled words?</p><button class="btn start" id="start">START GAME</button></div><div id="play" style="display:none"><div class="letters" id="letters"></div><input class="input" id="answer" autocomplete="off" autocapitalize="none" placeholder="Type your answer"><button class="btn" id="submit">SUBMIT</button><div class="msg" id="msg"></div></div></div><div class="result" id="result"><h2>🏆 Game Over!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const words=["campus","student","lecture","library","friend","market","coffee","school","teacher","project","mobile","computer","assignment","football","science","future","success","challenge","community","ooulink"],ready=document.getElementById("ready"),play=document.getElementById("play"),letters=document.getElementById("letters"),answer=document.getElementById("answer"),submit=document.getElementById("submit"),start=document.getElementById("start"),again=document.getElementById("again"),scoreEl=document.getElementById("score"),roundEl=document.getElementById("round"),bestEl=document.getElementById("best"),msg=document.getElementById("msg"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");let score=0,round=0,current="",timer=null,time=30,best=Number(localStorage.getItem("ooulink_word_best")||0);bestEl.textContent=best;function scramble(w){let a=w.split("");for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let s=a.join("");return s===w&&w.length>1?scramble(w):s}function next(){current=words[Math.floor(Math.random()*words.length)];letters.textContent=scramble(current).toUpperCase();answer.value="";answer.focus();round++;roundEl.textContent=round;msg.textContent=""}function end(){clearTimeout(timer);play.style.display="none";result.style.display="block";finalScore.textContent=score;if(score>best){best=score;localStorage.setItem("ooulink_word_best",best);bestEl.textContent=best;resultText.textContent="🔥 New personal best!";}else resultText.textContent="You solved "+score+" word"+(score===1?"":"s")+" correctly."}function startGame(){score=0;round=0;scoreEl.textContent=0;roundEl.textContent=0;result.style.display="none";ready.style.display="none";play.style.display="block";next();clearTimeout(timer);timer=setTimeout(end,30000)}function check(){if(!current)return;let a=answer.value.trim().toLowerCase();if(!a){msg.textContent="Type an answer first.";return}if(a===current){score++;scoreEl.textContent=score;msg.textContent="✅ Correct!";setTimeout(next,350)}else{msg.textContent="❌ Try again!";answer.select()}}start.onclick=startGame;again.onclick=startGame;submit.onclick=check;answer.addEventListener("keydown",e=>{if(e.key==="Enter")check()});</script></body></html>
