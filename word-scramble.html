<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Scramble • StudTask</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4fff7; color: #123; font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding-bottom: 88px; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #e3eee7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 5; }
    .logo { font-size: 22px; font-weight: 800; color: #159447; }
    .back, .btn, .again { border: 0; cursor: pointer; font-weight: 800; transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease; touch-action: manipulation; }
    .back { background: #eef9f1; color: #159447; border-radius: 12px; padding: 10px 13px; }
    .back:hover, .btn:hover, .again:hover { box-shadow: 0 6px 16px rgba(21,148,71,.2); }
    .back:active, .btn:active, .again:active { transform: scale(.94); opacity: .85; }
    .back:focus-visible, .btn:focus-visible, .again:focus-visible, .input:focus-visible, .bottom-nav a:focus-visible { outline: 3px solid rgba(21,148,71,.22); outline-offset: 2px; }
    .wrap { padding: 20px 18px; }
    .intro { text-align: center; }
    .intro h1 { margin: 5px 0; font-size: 27px; }
    .intro p { margin: 0; color: #6d7972; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
    .stat { background: #fff; border: 1px solid #e3eee7; border-radius: 15px; text-align: center; padding: 12px 5px; }
    .stat b { display: block; color: #159447; font-size: 20px; }
    .stat span { font-size: 10px; color: #718078; }
    .game { background: #fff; border: 1px solid #e3eee7; border-radius: 22px; padding: 25px 18px; text-align: center; box-shadow: 0 6px 20px rgba(18,51,34,.08); }
    .letters { font-size: 30px; font-weight: 900; letter-spacing: 5px; color: #159447; margin: 20px 0; word-break: break-word; }
    .input { width: 100%; border: 2px solid #dcebe1; border-radius: 13px; padding: 14px; font-size: 18px; text-align: center; outline: 0; color: #123; }
    .input:focus { border-color: #159447; }
    .btn { background: #159447; color: #fff; border-radius: 13px; padding: 13px 22px; margin-top: 12px; }
    .msg { height: 24px; margin-top: 12px; font-size: 13px; font-weight: 700; }
    .start { margin-top: 15px; }
    .result { display: none; margin-top: 16px; background: #fff; border: 1px solid #e3eee7; border-radius: 20px; padding: 20px; text-align: center; }
    .result h2 { margin: 0 0 8px; }
    .big { font-size: 38px; font-weight: 900; color: #159447; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #e5e8ec; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 9px; z-index: 10; box-shadow: 0 -6px 22px rgba(0,0,0,.06); }
    .bottom-nav a { position: relative; min-height: 54px; padding: 5px 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #687386; font-size: 9px; font-weight: 600; border-radius: 12px; transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bottom-nav a span { font-size: 18px; line-height: 20px; margin-bottom: 2px; transition: transform .16s ease; }
    .bottom-nav a:hover { color: #16834b; background: rgba(22,131,75,.05); }
    .bottom-nav a:active { transform: scale(.91); }
    .bottom-nav a:active span { transform: scale(.86); }
    .bottom-nav a.active { color: #16834b; font-weight: 800; background: rgba(22,131,75,.09); box-shadow: inset 0 0 0 1px rgba(22,131,75,.07); }
    .bottom-nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; border-radius: 10px; background: #16834b; transform: translateX(-50%); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">StudTask</div>
    <button class="back" type="button" onclick="history.back()">← Back</button>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>🔤 Word Scramble</h1>
      <p>Unscramble the letters before time runs out!</p>
    </section>

    <section class="stats">
      <div class="stat"><b id="score">0</b><span>SCORE</span></div>
      <div class="stat"><b id="round">0</b><span>ROUND</span></div>
      <div class="stat"><b id="best">0</b><span>BEST</span></div>
    </section>

    <div class="game">
      <div id="ready">
        <div style="font-size:48px">🔤</div>
        <p>Can you solve the scrambled words?</p>
        <button class="btn start" id="start" type="button">START GAME</button>
      </div>

      <div id="play" style="display:none">
        <div class="letters" id="letters"></div>
        <input class="input" id="answer" autocomplete="off" autocapitalize="none" placeholder="Type your answer">
        <button class="btn" id="submit" type="button">SUBMIT</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="result" id="result">
      <h2>🏆 Game Over!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="resultText"></p>
      <button class="again" id="again" type="button">PLAY AGAIN</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html"><span>⌂</span>Home</a>
    <a href="my-tasks.html"><span>✓</span>My Tasks</a>
    <a href="post-task.html"><span>＋</span>Post</a>
    <a href="alerts.html"><span>🔔</span>Alerts</a>
    <a href="profile.html"><span>♙</span>Profile</a>
  </nav>

  <script>
    const words = [
      "campus", "student", "lecture", "library", "friend", "market", "coffee", "school", "teacher", "project",
      "mobile", "computer", "assignment", "football", "science", "future", "success", "challenge", "community", "studtask"
    ];

    const ready = document.getElementById("ready");
    const play = document.getElementById("play");
    const letters = document.getElementById("letters");
    const answer = document.getElementById("answer");
    const submit = document.getElementById("submit");
    const start = document.getElementById("start");
    const again = document.getElementById("again");
    const scoreEl = document.getElementById("score");
    const roundEl = document.getElementById("round");
    const bestEl = document.getElementById("best");
    const msg = document.getElementById("msg");
    const result = document.getElementById("result");
    const finalScore = document.getElementById("finalScore");
    const resultText = document.getElementById("resultText");

    let score = 0;
    let round = 0;
    let current = "";
    let timer = null;
    let time = 30;
    let best = Number(localStorage.getItem("studtask_word_best") || 0);

    bestEl.textContent = best;

    function scramble(word) {
      const characters = word.split("");
      for (let i = characters.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [characters[i], characters[j]] = [characters[j], characters[i]];
      }
      const scrambled = characters.join("");
      return scrambled === word && word.length > 1 ? scramble(word) : scrambled;
    }

    function next() {
      current = words[Math.floor(Math.random() * words.length)];
      letters.textContent = scramble(current).toUpperCase();
      answer.value = "";
      answer.focus();
      round += 1;
      roundEl.textContent = round;
      msg.textContent = "";
    }

    function end() {
      clearTimeout(timer);
      play.style.display = "none";
      result.style.display = "block";
      finalScore.textContent = score;

      if (score > best) {
        best = score;
        localStorage.setItem("studtask_word_best", best);
        bestEl.textContent = best;
        resultText.textContent = "New personal best!";
      } else {
        resultText.textContent = "You solved " + score + " word" + (score === 1 ? "" : "s") + " correctly.";
      }
    }

    function startGame() {
      score = 0;
      round = 0;
      time = 30;
      scoreEl.textContent = "0";
      roundEl.textContent = "0";
      result.style.display = "none";
      ready.style.display = "none";
      play.style.display = "block";
      next();
      clearTimeout(timer);
      timer = setTimeout(end, 30000);
    }

    function check() {
      if (!current) return;
      const value = answer.value.trim().toLowerCase();

      if (!value) {
        msg.textContent = "Type an answer first.";
        return;
      }

      if (value === current) {
        score += 1;
        scoreEl.textContent = score;
        msg.textContent = "✅ Correct!";
        setTimeout(next, 350);
      } else {
        msg.textContent = "❌ Try again!";
        answer.select();
      }
    }

    start.addEventListener("click", startGame);
    again.addEventListener("click", startGame);
    submit.addEventListener("click", check);
    answer.addEventListener("keydown", event => {
      if (event.key === "Enter") check();
    });
  </script>
  <script src="brand.js"></script>
</body>
</html>
