<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16834b">
  <title>StudTask — Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:#222;font-family:Arial,sans-serif}
    main{width:100%;max-width:420px;text-align:center;background:#fff;padding:30px 22px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .logo{font-size:28px;font-weight:800;color:#16834b;margin-bottom:12px}
    p{color:#66716b;line-height:1.5;font-size:14px}
    button{margin-top:10px;border:0;border-radius:11px;padding:13px 18px;background:#16834b;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">StudTask</div>
    <h1>You’re offline</h1>
    <p>Check your internet connection and try again. Previously cached StudTask pages may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script src="brand.js"></script>
</body>
</html>
