mber(m.pending_withdrawals||0)+Number(m.failed_deposits_24h||0)+Number(m.open_reports||0)+Number(m.open_support||0);box.className="card "+(issues?"bad":"ok");box.innerHTML="<b>"+(issues?"Attention needed":"Systems healthy")+"</b><p class=\"muted\">Checked "+esc(new Date(r.data.checked_at||Date.now()).toLocaleString())+"</p><div class=\"grid\"><div class=\"metric\">Pending / processing withdrawals<b>"+Number(m.pending_withdrawals||0)+"</b></div><div class=\"metric\">Failed deposits<b>"+Number(m.failed_deposits_24h||0)+"</b></div><div class=\"metric\">Open reports<b>"+Number(m.open_reports||0)+"</b></div><div class=\"metric\">Open / pending support<b>"+Number(m.open_support||0)+"</b></div><div class=\"metric\">Active tasks<b>"+Number(m.active_tasks||0)+"</b></div><div class=\"metric\">Rate-limit rows (24h)<b>"+Number(m.rate_limit_rows_24h||0)+"</b></div></div>"}catch(error){box.className="card bad";box.innerHTML="<b>Monitoring unavailable</b><p class=\"muted\">"+esc(error.message||"Could not retrieve system health.")+"</p>"}}document.getElementById("refresh").onclick=run;run();</script></body></html>
