<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudTask System Monitoring</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.app{max-width:480px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}.ok{color:#16834b}.bad{color:#c62828}.muted{color:#687386;font-size:12px;line-height:1.5}button{width:100%;padding:12px;border:0;border-radius:10px;background:#16834b;color:#fff;font-weight:700}</style></head><body><main class="app"><a href="admin.html">← Admin</a><h1>System Monitoring</h1><div id="app">Checking...</div><button id="refresh">REFRESH</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=supabase.createClient("https://dthvdxgxesomltlruogp.supabase.co","sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr");async function run(){const a=await s.auth.getUser();if(!a.data.user){location.href="login.html";return}const r=await s.functions.invoke("admin-monitoring",{method:"GET"});if(r.error||!r.data?.ok){document.getElementById("app").innerHTML='<div class="card bad"><b>Monitoring unavailable</b><p class="muted">The monitoring service could not return its health data.</p></div>';return}const n=Number(r.data.error_count||0);const rows=Object.entries(r.data.by_source||{}).map(x=>"<div>"+x[0]+": <b>"+x[1]+"</b></div>").join("");document.getElementById("app").innerHTML='<div class="card '+(n?"bad":"ok")+'"><b>'+(n?"Errors detected":"No logged errors detected")+'</b><p class="muted">Last 24 hours: '+n+' matching error log entries.</p></div><div class="card"><b>By service</b><div class="muted">'+(rows||"No error sources reported.")+'</div></div><div class="card muted">Checked '+new Date(r.data.window_end).toLocaleString()+'</div>'}document.getElementById("refresh").onclick=run;run();</script></body></html>
