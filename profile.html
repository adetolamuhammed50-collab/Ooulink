<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 90px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    .profile {
      text-align: center;
      padding: 25px 20px;
    }

    .avatar {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      background: #edf7f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      margin-top: 12px;
      font-size: 22px;
    }

    .email {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .menu {
      padding: 0 20px;
    }

    .menu a {
      display: block;
      padding: 16px;
      margin-bottom: 10px;
      border: 1px solid #e5e8e6;
      border-radius: 12px;
      text-decoration: none;
      color: #17231d;
      font-size: 14px;
    }

    .menu a span {
      float: right;
      color: #999;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      background: white;
      border-top: 1px solid #e5e8e6;
    }

    nav a {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #16834b;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <a href="index.html" class="back">← Back</a>
  </header>

  <section class="profile">

    <div class="avatar">👤</div>

    <h1>OOULink User</h1>
    <p class="email">Welcome to OOULink</p>

  </section>

  <section class="menu">

    <a href="#">
      📍 My Location
      <span>›</span>
    </a>

    <a href="#">
      ⭐ My Ratings
      <span>›</span>
    </a>

    <a href="#">
      🛡️ Verification
      <span>›</span>
    </a>

    <a href="#">
      ⚙️ Settings
      <span>›</span>
    </a>

    <a href="#">
      ❓ Help & Support
      <span>›</span>
    </a>

  </section>

</div>

<nav>
  <a href="index.html">🏠<br>Home</a>
  <a href="my-tasks.html">📋<br>My Tasks</a>
  <a href="post-task.html">➕<br>Post</a>
  <a href="alerts.html">🔔<br>Alerts</a>
  <a href="profile.html" class="active">👤<br>Profile</a>
</nav>

</body>
</html>
