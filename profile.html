<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - OOULink</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 80px;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px 16px;
    }

    .top {
      margin-bottom: 22px;
    }

    .top a {
      text-decoration: none;
      color: #2563eb;
      font-size: 14px;
    }

    h1 {
      margin-top: 12px;
      font-size: 28px;
    }

    .subtitle {
      color: #687386;
      margin-top: 5px;
    }

    .profile-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .avatar-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: #e8eefc;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 42px;
      color: #2563eb;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-button {
      display: inline-block;
      margin-top: 12px;
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #avatarInput {
      display: none;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dce5;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .save-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
    }

    .logout-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #e0e4eb;
      border-radius: 12px;
      background: white;
      color: #dc2626;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: auto;
      height: 65px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #7a8494;
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav a span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    .bottom-nav .active {
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">
    <a href="index.html">← Back to Home</a>
    <h1>My Profile</h1>
    <p class="subtitle">Manage your OOULink account</p>
  </div>

  <div class="profile-card">

    <div class="avatar-area">

      <div class="avatar" id="avatar">
        👤
      </div>

      <label for="avatarInput" class="photo-button">
        Change Profile Picture
      </label>

      <input
        type="file"
        id="avatarInput"
        accept="image/jpeg,image/png,image/webp"
      >

    </div>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
      >
    </div>

    <div class="field">
      <label for="location">Location</label>
      <input
        type="text"
        id="location"
        placeholder="Enter your location"
      >
    </div>

    <button class="save-button" id="saveButton" onclick="saveProfile()">
      SAVE CHANGES
    </button>

    <div class="status" id="status"></div>

    <button class="logout-button" onclick="logout()">
      LOG OUT
    </button>

  </div>

</div>

<nav class="bottom-nav">

  <a href="index.html">
    <span>🏠</span>
    Home
  </a>

  <a href="my-tasks.html">
    <span>📋</span>
    My Tasks
  </a>

  <a href="post-task.html">
    <span>➕</span>
    Post
  </a>

  <a href="alerts.html">
    <span>🔔</span>
    Alerts
  </a>

  <a href="profile.html" class="active">
    <span>👤</span>
    Profile
  </a>

</nav>

<script>

  const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentUser = null;
  let selectedFile = null;

  async function loadProfile() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html?redirect=profile.html";
      return;
    }

    currentUser = session.user;

    const metadata = currentUser.user_metadata || {};

    document.getElementById("fullName").value =
      metadata.full_name || "";

    document.getElementById("location").value =
      metadata.location || "";

    if (metadata.avatar_url) {
      showAvatar(metadata.avatar_url);
    }

  }

  function showAvatar(url) {

    const avatar = document.getElementById("avatar");

    avatar.innerHTML = `
      <img src="${url}" alt="Profile picture">
    `;

  }

  document.getElementById("avatarInput").addEventListener(
    "change",
    function(event) {

      const file = event.target.files[0];

      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("Profile picture must be 2MB or smaller.");
        event.target.value = "";
        return;
      }

      selectedFile = file;

      const previewURL = URL.createObjectURL(file);

      showAvatar(previewURL);

    }
  );

  async function saveProfile() {

    if (!currentUser) return;

    const fullName =
      document.getElementById("fullName").value.trim();

    const location =
      document.getElementById("location").value.trim();

    const button =
      document.getElementById("saveButton");

    const status =
      document.getElementById("status");

    if (!fullName || !location) {
      alert("Please enter your full name and location.");
      return;
    }

    button.disabled = true;
    button.textContent = "SAVING...";
    status.textContent = "";

    try {

      let avatarURL =
        currentUser.user_metadata?.avatar_url || null;

      /*
        Upload new profile picture if one was selected.
      */

      if (selectedFile) {

        const extension =
          selectedFile.name.split(".").pop().toLowerCase();

        const filePath =
          `${currentUser.id}/avatar-${Date.now()}.${extension}`;

        const { error: uploadError } =
          await supabaseClient.storage
            .from("avatars")
            .upload(filePath, selectedFile, {
              contentType: selectedFile.type,
              upsert: false
            });

        if (uploadError) {
          throw uploadError;
        }

        const { data: publicURLData } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(filePath);

        avatarURL =
          publicURLData.publicUrl;
      }

      /*
        Save profile information in Supabase Auth metadata.
      */

      const { error: updateError } =
        await supabaseClient.auth.updateUser({
          data: {
            full_name: fullName,
            location: location,
            avatar_url: avatarURL
          }
        });

      if (updateError) {
        throw updateError;
      }

      currentUser =
        (await supabaseClient.auth.getUser()).data.user;

      selectedFile = null;

      status.textContent =
        "Profile updated successfully! ✅";

      button.textContent = "SAVED ✓";

      setTimeout(() => {
        button.textContent = "SAVE CHANGES";
        status.textContent = "";
      }, 2500);

    } catch (error) {

      console.error(error);

      status.textContent =
        "Could not save profile.";

      alert(error.message);

      button.textContent = "SAVE CHANGES";

    }

    button.disabled = false;

  }

  async function logout() {

    const { error } =
      await supabaseClient.auth.signOut();

    if (error) {
      alert(error.message);
      return;
    }

    window.location.href = "index.html";

  }

  loadProfile();

</script>

</body>
</html>
