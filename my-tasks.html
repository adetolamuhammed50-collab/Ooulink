<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - OOULink</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 90px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 15px 20px 5px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid #e5e8e6;
      border-radius: 10px;
      background: white;
      font-size: 13px;
      cursor: pointer;
    }

    .tab.active {
      background: #16834b;
      color: white;
      border-color: #16834b;
      font-weight: bold;
    }

    .task-list {
      padding: 15px 20px;
    }

    .task {
      border: 1px solid #e5e8e6;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .task:active {
      background: #f7faf8;
    }

    .task h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .task p {
      color: #777;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 9px;
      border-radius: 8px;
      background: #edf7f1;
      color: #16834b;
      font-size: 11px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #777;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      font-size: 14px;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #c0392b;
      font-size: 14px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      background: white;
      border-top: 1px solid #e5e8e6;
    }

    nav a {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #16834b;
      font-weight: bold;
    }
  </style></head><body><div class="app">  <header>
    <a href="index.html" class="back">← Back</a>
    <h1>My Tasks</h1>
    <p class="subtitle">Track tasks you posted or accepted.</p>
  </header>  <div class="tabs">
    <button class="tab active" id="postedTab">Posted</button>
    <button class="tab" id="acceptedTab">Accepted</button>
  </div>  <section class="task-list" id="taskList">
    <div class="loading">Loading your tasks...</div>
  </section></div><nav>
  <a href="index.html">🏠<br>Home</a>
  <a href="my-tasks.html" class="active">📋<br>My Tasks</a>
  <a href="post-task.html">➕<br>Post</a>
  <a href="alerts.html">🔔<br>Alerts</a>
  <a href="profile.html">👤<br>Profile</a>
</nav><script>
  const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  let moderationBlocked=false;function showModerationScreen(d){if(moderationBlocked)return;moderationBlocked=true;const t=d.ban_type==="temporary",e=t&&d.banned_until?new Date(d.banned_until).toLocaleString():null;document.body.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999"><div style="width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px 22px;text-align:center"><div style="font-size:48px">🚫</div><h2>OOULink Account Restricted</h2><p>Your account is currently ${t?"temporarily":"permanently"} restricted and you cannot access My Tasks.</p>${t&&e?`<p><strong>Restriction ends:</strong><br>${e}</p>`:""}${d.ban_reason?`<p><strong>Reason:</strong><br>${String(d.ban_reason).replace(/[<>&"]/g,"")}</p>`:""}<p>Please follow OOULink's rules. If you believe this action was made in error, contact OOULink support.</p><button onclick="logoutModerated()" style="width:100%;border:0;border-radius:12px;padding:14px;background:#16834b;color:#fff;font-weight:700">LOG OUT</button></div></div>`}async function logoutModerated(){await supabaseClient.auth.signOut();location.href="login.html"}async function checkModeration(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return false}const{data,error}=await supabaseClient.from("user_moderation").select("status,ban_type,banned_until,ban_reason").eq("user_id",session.user.id).maybeSingle();if(error)return true;if(data?.status==="banned"){const a=data.ban_type==="permanent"||(data.ban_type==="temporary"&&data.banned_until&&new Date(data.banned_until)>new Date());if(a){showModerationScreen(data);return false}}return true}

  const taskList = document.getElementById("taskList");
  const postedTab = document.getElementById("postedTab");
  const acceptedTab = document.getElementById("acceptedTab");

  let currentUser = null;
  let currentTab = "posted";

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDeadline(deadline) {
    if (!deadline) return "No deadline";

    const date = new Date(deadline);

    if (isNaN(date.getTime())) {
      return "No deadline";
    }

    const now = new Date();

    if (date < now) {
      return "Deadline passed";
    }

    const difference = date.getTime() - now.getTime();
    const minutes = Math.floor(difference / 60000);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);

    if (minutes < 60) {
      return `Due in ${minutes} minute${minutes === 1 ? "" : "s"}`;
    }

    if (hours < 24) {
      return `Due in ${hours} hour${hours === 1 ? "" : "s"}`;
    }

    if (days === 1) {
      return "Due tomorrow";
    }

    if (days < 7) {
      return `Due in ${days} days`;
    }

    return `Due ${date.toLocaleDateString()}`;
  }

  function formatStatus(status) {
    if (!status) return "Open";

    const text = String(status)
      .replace(/_/g, " ")
      .toLowerCase();

    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function showEmpty() {
    if (currentTab === "posted") {
      taskList.innerHTML = `
        <div class="empty">
          <div style="font-size:32px; margin-bottom:10px;">📋</div>
          <strong>No posted tasks yet</strong>
          <p style="margin-top:6px;">Tasks you post will appear here.</p>
        </div>
      `;
    } else {
      taskList.innerHTML = `
        <div class="empty">
          <div style="font-size:32px; margin-bottom:10px;">🤝</div>
          <strong>No accepted tasks yet</strong>
          <p style="margin-top:6px;">Tasks you accept will appear here.</p>
        </div>
      `;
    }
  }

  async function loadTasks() {
    if (!currentUser) return;

    taskList.innerHTML = `
      <div class="loading">Loading your tasks...</div>
    `;

    let query = supabaseClient
      .from("tasks")
      .select("id,title,description,category,location,budget,deadline,status,user_id,runner_id,created_at")
      .order("created_at", { ascending: false });

    if (currentTab === "posted") {
      query = query.eq("user_id", currentUser.id);
    } else {
      query = query.eq("runner_id", currentUser.id);
    }

    const { data, error } = await query;

    if (error) {
      console.error("My Tasks error:", error);

      taskList.innerHTML = `
        <div class="error">
          Unable to load your tasks.<br>
          Please refresh and try again.
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      showEmpty();
      return;
    }

    taskList.innerHTML = data.map(task => `
      <div class="task" onclick="openTask('${task.id}')">

        <h2>${escapeHTML(task.title || "Untitled Task")}</h2>

        <p>📍 ${escapeHTML(task.location || "Location not specified")}</p>

        <p>💰 ₦${Number(task.budget || 0).toLocaleString()}</p>

        <p>⏰ ${formatDeadline(task.deadline)}</p>

        <span class="status">
          ${escapeHTML(formatStatus(task.status))}
        </span>

      </div>
    `).join("");
  }

  function openTask(taskId) {
    window.location.href = `task-details.html?id=${encodeURIComponent(taskId)}`;
  }

  postedTab.addEventListener("click", () => {
    if (currentTab === "posted") return;

    currentTab = "posted";

    postedTab.classList.add("active");
    acceptedTab.classList.remove("active");

    loadTasks();
  });

  acceptedTab.addEventListener("click", () => {
    if (currentTab === "accepted") return;

    currentTab = "accepted";

    acceptedTab.classList.add("active");
    postedTab.classList.remove("active");

    loadTasks();
  });

  async function initialize(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){window.location.href="login.html";return}currentUser=session.user;if(!(await checkModeration()))return;await loadTasks()}

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (!session) {
      window.location.href = "login.html";
    }
  });

  initialize();
</script></body>
</html>
