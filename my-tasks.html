<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks - StudTask</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#17221c;padding-bottom:78px}
button,a{font:inherit;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,opacity .16s ease}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(22,131,75,.2);outline-offset:2px}
.app,header,main{width:100%;max-width:480px;margin:auto}
.app{min-height:100vh;background:#fff;padding-bottom:20px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5eae7;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.025)}
.head{display:flex;align-items:center;gap:12px}
.back{color:#16834b;text-decoration:none;font-weight:800;font-size:14px;padding:7px 4px;border-radius:9px}
.logo{font-size:21px;font-weight:800;color:#16834b}
.sub{font-size:12px;color:#777;margin-top:2px}
main{padding:0 14px 22px}
.tabs{display:flex;gap:8px;padding:15px 0 5px}
.tab{flex:1;padding:11px;border:1px solid #dce3df;border-radius:11px;background:#fff;color:#59655f;font-size:13px;font-weight:800;cursor:pointer;min-height:42px;box-shadow:0 1px 4px rgba(0,0,0,.025)}
.tab:hover{box-shadow:0 4px 10px rgba(0,0,0,.06)}
.tab.active{background:#16834b;color:#fff;border-color:#16834b;box-shadow:0 4px 10px rgba(22,131,75,.18)}
.task-list{padding:10px 0}
.task{border:1px solid #e4e9e6;border-radius:16px;padding:16px;margin-bottom:10px;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.035);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.task:hover{box-shadow:0 5px 16px rgba(0,0,0,.06);border-color:#d6dfda}
.task:active{transform:scale(.985);box-shadow:0 2px 7px rgba(0,0,0,.035)}
.task h2{font-size:16px;margin:0 0 9px}
.task p{color:#68736d;font-size:12px;margin:0 0 6px;line-height:1.4}
.status{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:8px;background:#edf7f1;color:#16834b;font-size:11px;font-weight:800}
.status.pending{background:#fff7df;color:#9a6b00}
.status.rejected{background:#fdecec;color:#c0392b}
.moderation-note{color:#c0392b!important;font-size:12px!important;margin-top:8px!important}
.empty,.loading,.error{text-align:center;padding:45px 20px;color:#68736d;font-size:14px}
.empty strong{display:block;color:#26332b;font-size:16px}
.error{color:#c0392b}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #e1e7e3;z-index:100;box-shadow:0 -4px 18px rgba(0,0,0,.05);display:flex;justify-content:center}
.navin{width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:center;padding:5px 6px}
.navin a{position:relative;flex:1;max-width:92px;text-decoration:none;color:#69736d;font-size:10px;text-align:center;padding:6px 4px;border-radius:13px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.navin a span{width:34px;height:28px;display:grid;place-items:center;font-size:19px;line-height:1;border-radius:10px;transition:transform .16s ease,background-color .16s ease}
.navin a:hover{color:#16834b;background:#f4f8f5;box-shadow:0 3px 10px rgba(22,131,75,.08)}
.navin a:active span{transform:scale(.86)}
.navin a.active{color:#16834b;background:#f0f7f3}
.navin a.active span{background:#e1f3e9}
.navin a.active::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#16834b}
@media(min-width:481px){body{background:#eef2ef}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="head">
<a href="index.html" class="back">← Back</a>
<div>
<div class="logo">StudTask</div>
<div class="sub">Track tasks you posted or accepted</div>
</div>
</div>
</header>
<main>
<div class="tabs">
<button class="tab active" id="postedTab" type="button">Posted</button>
<button class="tab" id="acceptedTab" type="button">Accepted</button>
</div>
<section class="task-list" id="taskList">
<div class="loading">Loading your tasks...</div>
</section>
</main>
</div>
<nav aria-label="Main navigation">
<div class="navin">
<a href="index.html"><span>⌂</span>Home</a>
<a href="my-tasks.html" class="active"><span>✓</span>My Tasks</a>
<a href="post-task.html"><span>＋</span>Post</a>
<a href="alerts.html"><span>🔔</span>Alerts</a>
<a href="profile.html"><span>♙</span>Profile</a>
</div>
</nav>
<script>
const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let moderationBlocked = false;

function showModerationScreen(data) {
    if (moderationBlocked) return;
    moderationBlocked = true;

    const temporary = data.ban_type === "temporary";
    const endDate = temporary && data.banned_until
        ? new Date(data.banned_until).toLocaleString()
        : null;

    document.body.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999">
            <div style="width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px 22px;text-align:center">
                <div style="font-size:48px">🚫</div>
                <h2>StudTask Account Restricted</h2>
                <p>Your account is currently ${temporary ? "temporarily" : "permanently"} restricted and you cannot access My Tasks.</p>
                ${temporary && endDate ? `<p><strong>Restriction ends:</strong><br>${endDate}</p>` : ""}
                ${data.ban_reason ? `<p><strong>Reason:</strong><br>${String(data.ban_reason).replace(/[<>&"]/g, "")}</p>` : ""}
                <p>Please follow StudTask's rules. If you believe this action was made in error, contact StudTask support.</p>
                <button onclick="logoutModerated()" style="width:100%;border:0;border-radius:12px;padding:14px;background:#16834b;color:#fff;font-weight:700">LOG OUT</button>
            </div>
        </div>
    `;
}

async function logoutModerated() {
    await supabaseClient.auth.signOut();
    location.href = "login.html";
}

async function checkModeration() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        location.href = "login.html";
        return false;
    }

    const { data, error } = await supabaseClient
        .from("user_moderation")
        .select("status,ban_type,banned_until,ban_reason")
        .eq("user_id", session.user.id)
        .maybeSingle();

    if (error) return true;

    if (data?.status === "banned") {
        const activeBan = data.ban_type === "permanent" ||
            (data.ban_type === "temporary" && data.banned_until && new Date(data.banned_until) > new Date());

        if (activeBan) {
            showModerationScreen(data);
            return false;
        }
    }

    return true;
}

const taskList = document.getElementById("taskList");
const postedTab = document.getElementById("postedTab");
const acceptedTab = document.getElementById("acceptedTab");

let currentUser = null;
let currentTab = "posted";

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[character]));
}

function formatDeadline(deadline) {
    if (!deadline) return "No deadline";

    const date = new Date(deadline);
    if (isNaN(date.getTime())) return "No deadline";

    const now = new Date();
    if (date < now) return "Deadline passed";

    const difference = date.getTime() - now.getTime();
    const minutes = Math.floor(difference / 60000);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);

    if (minutes < 60) return `Due in ${minutes} minute${minutes === 1 ? "" : "s"}`;
    if (hours < 24) return `Due in ${hours} hour${hours === 1 ? "" : "s"}`;
    if (days === 1) return "Due tomorrow";
    if (days < 7) return `Due in ${days} days`;

    return `Due ${date.toLocaleDateString()}`;
}

function formatStatus(status) {
    if (!status) return "Open";

    const text = String(status).replace(/_/g, " ").toLowerCase();
    return text.charAt(0).toUpperCase() + text.slice(1);
}

function showEmpty() {
    taskList.innerHTML = currentTab === "posted"
        ? `
            <div class="empty">
                <div style="font-size:32px;margin-bottom:10px">📋</div>
                <strong>No posted tasks yet</strong>
                <p style="margin-top:6px">Tasks you post will appear here.</p>
            </div>
        `
        : `
            <div class="empty">
                <div style="font-size:32px;margin-bottom:10px">🤝</div>
                <strong>No accepted tasks yet</strong>
                <p style="margin-top:6px">Tasks you accept will appear here.</p>
            </div>
        `;
}

async function loadTasks() {
    if (!currentUser) return;

    taskList.innerHTML = '<div class="loading">Loading your tasks...</div>';

    let query = supabaseClient
        .from("tasks")
        .select("id,title,description,category,location,budget,deadline,status,user_id,runner_id,created_at,moderation_status,moderation_note")
        .order("created_at", { ascending: false });

    if (currentTab === "posted") {
        query = query.eq("user_id", currentUser.id);
    } else {
        query = query.eq("runner_id", currentUser.id);
    }

    const { data, error } = await query;

    if (error) {
        console.error("My Tasks error:", error);
        taskList.innerHTML = '<div class="error">Unable to load your tasks.<br>Please refresh and try again.</div>';
        return;
    }

    if (!data || !data.length) {
        showEmpty();
        return;
    }

    taskList.innerHTML = data.map(task => {
        const pending = task.moderation_status === "pending";
        const rejected = task.moderation_status === "rejected";
        const approved = task.moderation_status === "approved";
        const statusText = pending
            ? "⏳ Awaiting Approval"
            : rejected
                ? "❌ Rejected"
                : escapeHTML(formatStatus(task.status));
        const statusClass = pending ? "pending" : rejected ? "rejected" : "";

        return `
            <div class="task" onclick="openTask('${task.id}')">
                <h2>${escapeHTML(task.title || "Untitled Task")}</h2>
                <p>📍 ${escapeHTML(task.location || "Location not specified")}</p>
                <p>💰 ₦${Number(task.budget || 0).toLocaleString()}</p>
                <p>⏰ ${formatDeadline(task.deadline)}</p>
                <span class="status ${statusClass}">${statusText}</span>
                ${rejected && task.moderation_note ? `<p class="moderation-note">Reason: ${escapeHTML(task.moderation_note)}</p>` : ""}
                ${pending ? '<p style="color:#9a6b00;font-size:12px;margin-top:8px">Your task is waiting for admin approval before other users can see it.</p>' : ""}
                ${approved && task.status === "open" ? '<p style="color:#16834b;font-size:12px;margin-top:8px">Your task is approved and visible to eligible users.</p>' : ""}
            </div>
        `;
    }).join("");
}

function openTask(taskId) {
    window.location.href = `task-details.html?id=${encodeURIComponent(taskId)}`;
}

postedTab.addEventListener("click", () => {
    if (currentTab === "posted") return;

    currentTab = "posted";
    postedTab.classList.add("active");
    acceptedTab.classList.remove("active");
    loadTasks();
});

acceptedTab.addEventListener("click", () => {
    if (currentTab === "accepted") return;

    currentTab = "accepted";
    acceptedTab.classList.add("active");
    postedTab.classList.remove("active");
    loadTasks();
});

async function initialize() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        location.href = "login.html";
        return;
    }

    currentUser = session.user;

    if (!(await checkModeration())) return;

    await loadTasks();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (!session) location.href = "login.html";
});

initialize();
</script>
<script src="post-again.js"></script></body>
</html>
