<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudTask Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7f6;font-family:Arial,sans-serif;color:#17231d}
    .wrap{max-width:700px;margin:auto;padding:16px}
    .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
    .logo{font-size:23px;font-weight:800;color:#16834b}
    .tag{font-size:12px;color:#777;margin-top:3px}
    .head-actions{display:flex;gap:6px}
    .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;background:#eee;color:#333;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .btn:hover{box-shadow:0 4px 12px #00000014}
    .btn:active{transform:scale(.96)}
    .btn:focus-visible{outline:2px solid #16834b;outline-offset:2px}
    .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .refresh{background:#16834b;color:#fff}
    .logout{background:#eee;color:#333}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000d}
    .title{font-size:18px;font-weight:800;margin:0 0 4px}
    .muted{color:#777;font-size:13px}
    .section{font-size:17px;font-weight:800;margin:24px 0 10px;color:#16834b}
    .status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff3cd;color:#856404;font-size:12px;font-weight:700;margin:10px 0}
    .active{background:#e8f7ee;color:#146c3a}
    .banned{background:#ffe8e8;color:#a33}
    .warned{background:#fff3cd;color:#856404}
    .taskstatus{background:#e8f1ff;color:#245b9b}
    .reportstatus{background:#fff3cd;color:#856404}
    .resolved{background:#e8f7ee;color:#146c3a}
    .rejected{background:#ffe8e8;color:#a33}
    .info{background:#f7f9f8;border-radius:10px;padding:11px;margin:8px 0;font-size:14px;line-height:1.6}
    .desc{background:#fafafa;border-left:3px solid #16834b;border-radius:8px;padding:11px;margin:9px 0;font-size:14px;line-height:1.5;white-space:pre-wrap}
    .note,.search{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;resize:vertical;font:inherit;margin:8px 0}
    .note{min-height:70px}
    .search{margin:0 0 12px;resize:none}
    .note:focus,.search:focus{outline:none;border-color:#16834b;box-shadow:0 0 0 2px #16834b22}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .actions .btn{flex:1;min-width:120px}
    .approve{background:#16834b;color:#fff}
    .reject,.danger{background:#d9534f;color:#fff}
    .warn{background:#e0a800;color:#fff}
    .ban{background:#a33;color:#fff}
    .unban{background:#555;color:#fff}
    .view{background:#2563eb;color:#fff}
    .empty{text-align:center;padding:40px 15px;color:#777}
    .loading{text-align:center;padding:30px;color:#777}
    .error{background:#ffe8e8;color:#a33;padding:12px;border-radius:10px;font-size:14px;line-height:1.5}
    .success{background:#e8f7ee;color:#146c3a;padding:12px;border-radius:10px;font-size:14px}
    .back{display:block;text-align:center;margin:20px 0;color:#16834b;text-decoration:none;font-weight:700;padding:10px;border-radius:10px;transition:background .15s,transform .15s}
    .back:hover{background:#e8f7ee}
    .back:active{transform:scale(.98)}
    .back:focus-visible{outline:2px solid #16834b;outline-offset:2px}
    .divider{height:1px;background:#e7ebe8;margin:20px 0}
    .small{font-size:12px;color:#777}
    .report-filter{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding:2px}
    .report-filter button{border:1px solid #ddd;background:#fff;border-radius:18px;padding:7px 11px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:transform .15s,background .15s,color .15s}
    .report-filter button:active{transform:scale(.95)}
    .report-filter button:focus-visible{outline:2px solid #16834b;outline-offset:2px}
    .report-filter button.active{background:#16834b;color:#fff;border-color:#16834b}
    .report-detail{background:#fafafa;border-radius:10px;padding:11px;margin:9px 0;font-size:14px;line-height:1.55;white-space:pre-wrap}
    .verify-files{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    .verify-files .btn{width:100%}
    @media(max-width:480px){
      .wrap{padding:14px}
      .head{align-items:flex-start}
      .head-actions{flex-direction:column}
      .head-actions .btn{padding:9px 10px;font-size:11px}
      .actions{flex-direction:column}
      .btn{width:100%}
      .verify-files{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      .btn,.back,.report-filter button{transition:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="logo">StudTask Admin</div>
        <div class="tag">Administration Dashboard</div>
      </div>
      <div class="head-actions">
        <button id="refreshBtn" class="btn refresh" type="button" onclick="loadAll()">↻ REFRESH</button>
        <button class="btn logout" type="button" onclick="logout()">LOG OUT</button>
      </div>
    </div>

    <div id="app" class="loading">Checking administrator access...</div>

    <a class="back" href="index.html">← Back to StudTask</a>
  </div>

  <script>
    const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let isAdmin = false;
    let allUsers = [];
    let mods = [];
    let allReports = [];
    let reportProfiles = {};

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function timeout(promise, ms = 10000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          setTimeout(() => {
            reject(new Error("The request timed out. Please check your internet connection and try again."));
          }, ms);
        })
      ]);
    }

    async function init() {
      try {
        if (!window.supabase) {
          throw new Error("Supabase library failed to load. Refresh the page and try again.");
        }

        const { data, error } = await timeout(supabaseClient.auth.getSession());
        if (error) throw error;

        if (!data?.session) {
          location.href = "login.html";
          return;
        }

        currentUser = data.session.user;

        const adminCheck = await timeout(
          supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", currentUser.id)
            .maybeSingle()
        );

        if (adminCheck.error) throw adminCheck.error;

        if (!adminCheck.data) {
          document.getElementById("app").innerHTML = `
            <div class="error">
              <b>Access denied.</b><br>
              This account is not a StudTask administrator.
            </div>
          `;
          return;
        }

        isAdmin = true;
        await loadAll();
      } catch (error) {
        document.getElementById("app").innerHTML = `
          <div class="error">
            <b>Could not verify administrator access.</b><br>
            ${esc(error.message || "Unknown error")}
            <br><br>
            <button class="btn refresh" type="button" onclick="location.reload()">TRY AGAIN</button>
          </div>
        `;
      }
    }

    async function loadAll() {
      if (!isAdmin) return;

      const button = document.getElementById("refreshBtn");
      button.disabled = true;
      renderBase();

      try {
        const [verifications, tasks, users, reports] = await Promise.all([
          getVerifications(),
          getTasks(),
          getUsers(),
          getReports()
        ]);

        if (verifications.error || tasks.error || users.error || reports.error) {
          throw verifications.error || tasks.error || users.error || reports.error;
        }

        document.getElementById("verificationBox").innerHTML = renderVerifications(
          verifications.data,
          verifications.profiles
        );

        document.getElementById("taskBox").innerHTML = renderTasks(
          tasks.data,
          tasks.profiles
        );

        allUsers = users.users || [];
        mods = users.mods || [];
        document.getElementById("userBox").innerHTML = renderUsers();

        allReports = reports.data || [];
        reportProfiles = {};
        (reports.profiles || []).forEach(profile => {
          reportProfiles[profile.id] = profile;
        });
        document.getElementById("reportBox").innerHTML = renderReports();
      } catch (error) {
        document.getElementById("app").innerHTML = `
          <div class="error">
            <b>Could not load the admin dashboard.</b><br>
            ${esc(error.message || "Unknown error")}
          </div>
        `;
      } finally {
        button.disabled = false;
      }
    }

    function renderBase() {
      document.getElementById("app").innerHTML = `
        <div class="section">🛡️ Profile Verification</div>
        <div id="verificationBox" class="loading">Loading...</div>
        <div class="divider"></div>
        <div class="section">📋 Task Moderation</div>
        <div id="taskBox" class="loading">Loading...</div>
        <div class="divider"></div>
        <div class="section">🚨 User Reports</div>
        <div id="reportBox" class="loading">Loading...</div>
        <div class="divider"></div>
        <div class="section">👤 User Moderation</div>
        <div id="userBox" class="loading">Loading...</div>
      `;
    }

    async function getVerifications() {
      const { data, error } = await supabaseClient
        .from("profile_verifications")
        .select("id,user_id,status,submitted_at,matric_number,course,reviewer_note,student_id_path,selfie_path")
        .eq("status", "pending")
        .order("submitted_at", { ascending: false });

      if (error) return { error };
      if (!data?.length) return { data: [], profiles: [] };

      const ids = data.map(item => item.user_id);
      const result = await supabaseClient
        .from("profiles")
        .select("id,username,full_name,location,avatar_url")
        .in("id", ids);

      return {
        data,
        profiles: result.data || [],
        error: result.error
      };
    }

    async function getTasks() {
      const { data, error } = await supabaseClient
        .from("tasks")
        .select("id,user_id,title,description,category,location,budget,deadline,status,created_at,moderation_status,moderation_note")
        .eq("moderation_status", "pending")
        .order("created_at", { ascending: false });

      if (error) return { error };
      if (!data?.length) return { data: [], profiles: [] };

      const ids = [...new Set(data.map(task => task.user_id))];
      const result = await supabaseClient
        .from("profiles")
        .select("id,username,full_name,location,avatar_url")
        .in("id", ids);

      return {
        data,
        profiles: result.data || [],
        error: result.error
      };
    }

    async function getUsers() {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,username,full_name,location,avatar_url")
        .order("full_name", { ascending: true });

      if (error) return { error };

      const ids = (data || []).map(user => user.id);
      if (!ids.length) {
        return { users: data || [], mods: [] };
      }

      const { data: moderationData, error: moderationError } = await supabaseClient
        .from("user_moderation")
        .select("user_id,warning_count,status,ban_type,banned_until,ban_reason")
        .in("user_id", ids);

      return {
        users: data || [],
        mods: moderationError ? [] : moderationData || [],
        error: moderationError
      };
    }

    async function getReports() {
      const { data, error } = await supabaseClient
        .from("reports")
        .select("id,task_id,reporter_id,reported_user_id,reason,details,status,created_at")
        .order("created_at", { ascending: false });

      if (error) return { error };
      if (!data?.length) return { data: [], profiles: [] };

      const ids = [
        ...new Set(
          data
            .flatMap(report => [report.reporter_id, report.reported_user_id])
            .filter(Boolean)
        )
      ];

      const result = await supabaseClient
        .from("profiles")
        .select("id,username,full_name,location")
        .in("id", ids);

      return {
        data,
        profiles: result.data || [],
        error: result.error
      };
    }

    function renderVerifications(data, profiles) {
      if (!data?.length) {
        return `
          <div class="card empty">
            🎉 No pending verification requests.<br>
            <span class="muted">New requests will appear here.</span>
          </div>
        `;
      }

      const profileMap = {};
      (profiles || []).forEach(profile => {
        profileMap[profile.id] = profile;
      });

      return data.map(item => {
        const profile = profileMap[item.user_id] || {};
        const name = profile.full_name || profile.username || "StudTask User";

        return `
          <div class="card" id="card_${esc(item.id)}">
            <div class="title">${esc(name)}</div>
            <div class="muted">@${esc(profile.username || "unknown")}</div>
            <div class="status">⏳ Pending Review</div>

            <div class="info">
              <b>Student Number:</b> ${esc(item.matric_number || "Not provided")}<br>
              <b>Course:</b> ${esc(item.course || "Not provided")}<br>
              <b>Location:</b> ${esc(profile.location || "Not provided")}<br>
              <b>Submitted:</b> ${esc(new Date(item.submitted_at).toLocaleString())}
            </div>

            <div class="verify-files">
              ${item.student_id_path
                ? `<button class="btn view" type="button" onclick="openVerificationFile(decodeURIComponent('${encodeURIComponent(item.student_id_path)}'),'Student ID')">🪪 VIEW STUDENT ID</button>`
                : `<button class="btn" type="button" disabled>🪪 ID NOT PROVIDED</button>`}
              ${item.selfie_path
                ? `<button class="btn view" type="button" onclick="openVerificationFile(decodeURIComponent('${encodeURIComponent(item.selfie_path)}'),'Selfie')">🤳 VIEW SELFIE</button>`
                : `<button class="btn" type="button" disabled>🤳 SELFIE NOT PROVIDED</button>`}
            </div>

            <textarea class="note" id="note_${esc(item.id)}" placeholder="Optional reviewer note..."></textarea>

            <div class="actions">
              <button class="btn approve" type="button" onclick="reviewVerification('${esc(item.id)}','verified','${esc(item.user_id)}')">✓ APPROVE</button>
              <button class="btn reject" type="button" onclick="reviewVerification('${esc(item.id)}','rejected','${esc(item.user_id)}')">✕ REJECT</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function openVerificationFile(path, label) {
      if (!isAdmin || !path) return;

      try {
        const { data, error } = await supabaseClient
          .storage
          .from("VerificationFiles")
          .createSignedUrl(path, 300);

        if (error) throw error;
        if (!data?.signedUrl) {
          throw new Error("Could not create a secure viewing link.");
        }

        window.open(data.signedUrl, "_blank", "noopener,noreferrer");
      } catch (error) {
        alert("Could not open " + label + ": " + (error.message || "Unknown error"));
      }
    }

    function renderTasks(data, profiles) {
      if (!data?.length) {
        return `
          <div class="card empty">
            🎉 No pending tasks.<br>
            <span class="muted">New tasks waiting for moderation will appear here.</span>
          </div>
        `;
      }

      const profileMap = {};
      (profiles || []).forEach(profile => {
        profileMap[profile.id] = profile;
      });

      return data.map(task => {
        const profile = profileMap[task.user_id] || {};
        const name = profile.full_name || profile.username || "StudTask User";

        return `
          <div class="card" id="taskcard_${esc(task.id)}">
            <div class="title">${esc(task.title)}</div>
            <div class="muted">Posted by ${esc(name)} · @${esc(profile.username || "unknown")}</div>
            <div class="status taskstatus">⏳ Pending Task Review</div>

            <div class="desc">${esc(task.description)}</div>

            <div class="info">
              <b>Category:</b> ${esc(task.category)}<br>
              <b>Location:</b> ${esc(task.location)}<br>
              <b>Budget:</b> ₦${esc(Number(task.budget || 0).toLocaleString())}<br>
              <b>Deadline:</b> ${esc(new Date(task.deadline).toLocaleString())}<br>
              <b>Task status:</b> ${esc(task.status)}<br>
              <b>Submitted:</b> ${esc(new Date(task.created_at).toLocaleString())}
            </div>

            <textarea class="note" id="tasknote_${esc(task.id)}" placeholder="Optional moderation note..."></textarea>

            <div class="actions">
              <button class="btn approve" type="button" onclick="moderateTask('${esc(task.id)}','approved','${esc(task.user_id)}')">✓ APPROVE TASK</button>
              <button class="btn reject" type="button" onclick="moderateTask('${esc(task.id)}','rejected','${esc(task.user_id)}')">✕ REJECT TASK</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function reportStatusClass(status) {
      const value = String(status || "pending").toLowerCase();

      if (value === "resolved" || value === "reviewed") return "resolved";
      if (value === "rejected" || value === "dismissed") return "rejected";
      return "reportstatus";
    }

    function renderReports() {
      if (!allReports.length) {
        return `
          <div class="card empty">
            🎉 No reports found.<br>
            <span class="muted">User reports will appear here when submitted.</span>
          </div>
        `;
      }

      const filter = window.reportFilter || "all";
      const rows = allReports.filter(report => {
        return filter === "all" || String(report.status || "pending").toLowerCase() === filter;
      });

      let html = `
        <div class="report-filter">
          <button class="${filter === "all" ? "active" : ""}" type="button" onclick="setReportFilter('all')">ALL</button>
          <button class="${filter === "pending" ? "active" : ""}" type="button" onclick="setReportFilter('pending')">PENDING</button>
          <button class="${filter === "resolved" ? "active" : ""}" type="button" onclick="setReportFilter('resolved')">RESOLVED</button>
          <button class="${filter === "dismissed" ? "active" : ""}" type="button" onclick="setReportFilter('dismissed')">DISMISSED</button>
        </div>
      `;

      if (!rows.length) {
        return html + `<div class="card empty">No ${esc(filter)} reports.</div>`;
      }

      html += rows.map(report => {
        const reporter = reportProfiles[report.reporter_id] || {};
        const reported = reportProfiles[report.reported_user_id] || {};
        const status = String(report.status || "pending").toLowerCase();

        return `
          <div class="card" id="report_${esc(report.id)}">
            <div class="title">🚨 ${esc(report.reason || "User Report")}</div>
            <span class="status ${reportStatusClass(status)}">${esc(status.toUpperCase())}</span>

            <div class="info">
              <b>Reported user:</b> ${esc(reported.full_name || reported.username || "Unknown user")}<br>
              <b>Reported by:</b> ${esc(reporter.full_name || reporter.username || "Unknown user")}<br>
              <b>Submitted:</b> ${esc(new Date(report.created_at).toLocaleString())}
              ${report.task_id ? `<br><b>Task:</b> ${esc(report.task_id)}` : ""}
            </div>

            <div class="report-detail">${esc(report.details || "No additional details provided.")}</div>

            <div class="actions">
              ${report.task_id
                ? `<button class="btn view" type="button" onclick="openTask('${esc(report.task_id)}')">📋 VIEW TASK</button>`
                : ""}
              ${report.reported_user_id
                ? `<button class="btn view" type="button" onclick="openUser('${esc(report.reported_user_id)}')">👤 VIEW USER</button>`
                : ""}
            </div>
          </div>
        `;
      }).join("");

      return html;
    }

    function setReportFilter(filter) {
      window.reportFilter = filter;
      document.getElementById("reportBox").innerHTML = renderReports();
    }

    function openTask(id) {
      if (id) {
        window.location.href = "task-details.html?id=" + encodeURIComponent(id);
      }
    }

    function openUser(id) {
      if (id) {
        window.location.href = "profile.html?id=" + encodeURIComponent(id);
      }
    }

    function getMod(id) {
      return mods.find(item => item.user_id === id) || {
        warning_count: 0,
        status: "active"
      };
    }

    function renderUsers() {
      if (!allUsers.length) {
        return `<div class="card empty">No users found.</div>`;
      }

      return `
        <input id="userSearch" class="search" placeholder="Search users..." oninput="filterUsers()">
        <div id="userList">${userCards(allUsers)}</div>
      `;
    }

    function userCards(users) {
      if (!users.length) {
        return `<div class="card empty">No matching users.</div>`;
      }

      return users.map(user => {
        const moderation = getMod(user.id);
        const banned = moderation.status === "banned";
        const warned = moderation.status === "warned";
        const name = user.full_name || user.username || "StudTask User";
        const until = moderation.banned_until ? new Date(moderation.banned_until) : null;
        const activeBan = banned && (!until || until > new Date());
        const status = activeBan ? "banned" : warned ? "warned" : "active";

        return `
          <div class="card" id="usercard_${esc(user.id)}">
            <div class="title">${esc(name)}</div>
            <div class="muted">@${esc(user.username || "unknown")}</div>
            <div class="status ${status}">
              ${activeBan ? "🚫 BANNED" : warned ? "⚠️ WARNED" : "✓ ACTIVE"}
            </div>

            <div class="info">
              <b>Location:</b> ${esc(user.location || "Not provided")}<br>
              <b>Warnings:</b> ${esc(moderation.warning_count || 0)}
              ${moderation.ban_type ? `<br><b>Ban:</b> ${esc(moderation.ban_type)}` : ""}
              ${until ? `<br><b>Until:</b> ${esc(until.toLocaleString())}` : ""}
              ${moderation.ban_reason ? `<br><b>Reason:</b> ${esc(moderation.ban_reason)}` : ""}
            </div>

            <textarea class="note" id="reason_${esc(user.id)}" placeholder="Reason for warning/ban..."></textarea>

            <div class="actions">
              ${activeBan
                ? `<button class="btn unban" type="button" onclick="moderateUser('${esc(user.id)}','unban')">✓ UNBAN</button>`
                : `<button class="btn warn" type="button" onclick="moderateUser('${esc(user.id)}','warning')">⚠ WARN</button>
                   <button class="btn ban" type="button" onclick="moderateUser('${esc(user.id)}','temporary_ban')">⏳ BAN 7 DAYS</button>
                   <button class="btn danger" type="button" onclick="moderateUser('${esc(user.id)}','permanent_ban')">🚫 PERMANENT BAN</button>`}
            </div>
          </div>
        `;
      }).join("");
    }

    function filterUsers() {
      const query = (document.getElementById("userSearch")?.value || "").toLowerCase();
      const list = document.getElementById("userList");
      if (!list) return;

      list.innerHTML = userCards(
        allUsers.filter(user => {
          return (
            (user.full_name || "").toLowerCase().includes(query) ||
            (user.username || "").toLowerCase().includes(query) ||
            (user.location || "").toLowerCase().includes(query)
          );
        })
      );
    }

    async function reviewVerification(id, status, userId) {
      if (!isAdmin || !currentUser) return;

      const note = document.getElementById("note_" + id)?.value.trim() || null;
      const action = status === "verified" ? "approve" : "reject";

      if (!confirm("Are you sure you want to " + action + " this verification request?")) {
        return;
      }

      const { error } = await supabaseClient
        .from("profile_verifications")
        .update({
          status,
          reviewed_at: new Date().toISOString(),
          reviewed_by: currentUser.id,
          reviewer_note: note
        })
        .eq("id", id)
        .eq("status", "pending");

      if (error) {
        alert("Could not update verification: " + error.message);
        return;
      }

      await supabaseClient.from("admin_logs").insert({
        admin_id: currentUser.id,
        action: status === "verified"
          ? "profile_verification_approved"
          : "profile_verification_rejected",
        target_user_id: userId,
        target_task_id: null,
        details: note || "Profile verification reviewed"
      });

      alert(
        status === "verified"
          ? "Profile verified successfully."
          : "Verification rejected."
      );

      await loadAll();
    }

    async function moderateTask(id, status, userId) {
      if (!isAdmin || !currentUser) return;

      const note = document.getElementById("tasknote_" + id)?.value.trim() || null;

      if (status === "rejected" && !note) {
        alert("Please enter a reason before rejecting this task.");
        return;
      }

      const action = status === "approved" ? "approve" : "reject";
      if (!confirm("Are you sure you want to " + action + " this task?")) {
        return;
      }

      const { data, error } = await supabaseClient
        .from("tasks")
        .update({
          moderation_status: status,
          moderation_note: note
        })
        .eq("id", id)
        .eq("moderation_status", "pending")
        .select("id,moderation_status,moderation_note")
        .maybeSingle();

      if (error) {
        console.error("Task moderation error:", error);
        alert("Could not moderate task: " + error.message);
        return;
      }

      if (!data) {
        alert("No task was updated. It may already have been reviewed.");
        return;
      }

      const card = document.getElementById("taskcard_" + id);
      if (card) card.remove();

      const { error: logError } = await supabaseClient.from("admin_logs").insert({
        admin_id: currentUser.id,
        action: status === "approved"
          ? "task_moderation_approved"
          : "task_moderation_rejected",
        target_user_id: userId,
        target_task_id: id,
        details: note || "Task moderation reviewed"
      });

      if (logError) {
        console.error("Admin log error:", logError);
      }

      if (!document.querySelector("#taskBox .card")) {
        document.getElementById("taskBox").innerHTML = `
          <div class="card empty">
            🎉 No pending tasks.<br>
            <span class="muted">New tasks waiting for moderation will appear here.</span>
          </div>
        `;
      }

      alert(
        status === "approved"
          ? "Task approved successfully. It can now appear to users."
          : "Task rejected successfully. It will remain hidden from users."
      );
    }

    async function moderateUser(userId, action) {
      if (!isAdmin || !currentUser || userId === currentUser.id) {
        alert("You cannot moderate your own account.");
        return;
      }

      const reason = document.getElementById("reason_" + userId)?.value.trim() || "";

      if (action !== "unban" && !reason) {
        alert("Please enter a reason.");
        return;
      }

      const moderation = getMod(userId);
      let warningCount = Number(moderation.warning_count || 0);
      let status = "active";
      let banType = null;
      let bannedUntil = null;
      let banReason = null;

      if (action === "warning") {
        warningCount++;
        status = "warned";
        banReason = reason;
      } else if (action === "temporary_ban") {
        status = "banned";
        banType = "temporary";
        bannedUntil = new Date(Date.now() + 7 * 86400000).toISOString();
        banReason = reason;
      } else if (action === "permanent_ban") {
        status = "banned";
        banType = "permanent";
        banReason = reason;
      } else if (action === "unban") {
        status = "active";
        banType = null;
        bannedUntil = null;
        banReason = null;
      }

      const label = action === "warning"
        ? "warn"
        : action === "temporary_ban"
          ? "temporarily ban"
          : "permanently ban";

      if (!confirm(
        "Are you sure you want to " +
        (action === "unban" ? "unban" : label) +
        " this user?"
      )) {
        return;
      }

      const { error } = await supabaseClient
        .from("user_moderation")
        .upsert({
          user_id: userId,
          warning_count: warningCount,
          status,
          ban_type: banType,
          banned_until: banReason ? bannedUntil : null,
          ban_reason: banReason,
          updated_at: new Date().toISOString()
        }, { onConflict: "user_id" });

      if (error) {
        alert("Could not update user moderation: " + error.message);
        return;
      }

      const { error: logError } = await supabaseClient
        .from("user_moderation_logs")
        .insert({
          user_id: userId,
          admin_id: currentUser.id,
          action,
          reason: reason || null,
          ban_until: bannedUntil
        });

      if (logError) {
        alert("Moderation updated, but the moderation log could not be saved.");
        await loadAll();
        return;
      }

      await supabaseClient.from("admin_logs").insert({
        admin_id: currentUser.id,
        action: "user_" + action,
        target_user_id: userId,
        target_task_id: null,
        details: reason || "User moderation action"
      });

      alert(
        action === "warning"
          ? "Warning issued."
          : action === "temporary_ban"
            ? "User temporarily banned for 7 days."
            : action === "permanent_ban"
              ? "User permanently banned."
              : "User unbanned."
      );

      await loadAll();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.href = "login.html";
    }

    window.reportFilter = "all";
    init();
  </script>
</body>
