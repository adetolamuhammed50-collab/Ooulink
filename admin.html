<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OOULink Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;font-family:Arial,sans-serif;color:#17231d}.wrap{max-width:700px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.logo{font-size:23px;font-weight:800;color:#16834b}.tag{font-size:12px;color:#777;margin-top:3px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;transition:.15s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:not-allowed}.refresh{background:#16834b;color:#fff}.logout{background:#eee;color:#333}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000d}.title{font-size:18px;font-weight:800;margin:0 0 4px}.muted{color:#777;font-size:13px}.section{font-size:17px;font-weight:800;margin:24px 0 10px;color:#16834b}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff3cd;color:#856404;font-size:12px;font-weight:700;margin:10px 0}.taskstatus{background:#e8f1ff;color:#245b9b}.info{background:#f7f9f8;border-radius:10px;padding:11px;margin:8px 0;font-size:14px;line-height:1.6}.desc{background:#fafafa;border-left:3px solid #16834b;border-radius:8px;padding:11px;margin:9px 0;font-size:14px;line-height:1.5;white-space:pre-wrap}.note{width:100%;min-height:70px;border:1px solid #ddd;border-radius:10px;padding:10px;resize:vertical;font:inherit;margin:8px 0}.actions{display:flex;gap:8px}.approve{background:#16834b;color:#fff;flex:1}.reject{background:#d9534f;color:#fff;flex:1}.empty{text-align:center;padding:40px 15px;color:#777}.loading{text-align:center;padding:30px;color:#777}.error{background:#ffe8e8;color:#a33;padding:12px;border-radius:10px;font-size:14px;line-height:1.5}.success{background:#e8f7ee;color:#146c3a;padding:12px;border-radius:10px;font-size:14px}.back{display:block;text-align:center;margin:20px 0;color:#16834b;text-decoration:none;font-weight:700}.divider{height:1px;background:#e7ebe8;margin:20px 0}@media(max-width:480px){.wrap{padding:14px}.head{align-items:flex-start}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><div class="wrap"><div class="head"><div><div class="logo">OOULink Admin</div><div class="tag">Administration Dashboard</div></div><div style="display:flex;gap:6px"><button id="refreshBtn" class="btn refresh" onclick="loadAll()">↻ Refresh</button><button class="btn logout" onclick="logout()">LOG OUT</button></div></div><div id="app" class="loading">Checking admin access...</div><a class="back" href="index.html">← Back to OOULink</a></div><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,isAdmin=false;async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return}currentUser=session.user;const{data,error}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(error){document.getElementById("app").innerHTML='<div class="error">Could not verify admin access.<br>'+esc(error.message)+'</div>';return}if(!data){document.getElementById("app").innerHTML='<div class="error">Access denied. This account is not an OOULink administrator.</div>';return}isAdmin=true;loadAll()}async function loadAll(){if(!isAdmin)return;const app=document.getElementById("app"),btn=document.getElementById("refreshBtn");btn.disabled=true;app.innerHTML='<div class="loading">Loading admin dashboard...</div>';const[v,t]=await Promise.all([getVerifications(),getTasks()]);btn.disabled=false;if(v.error||t.error){app.innerHTML='<div class="error">Could not load the admin dashboard.<br>'+esc(v.error?.message||t.error?.message)+'</div>';return}app.innerHTML='<div class="section">🛡️ Profile Verification</div>'+renderVerifications(v.data,v.profiles)+'<div class="divider"></div><div class="section">📋 Task Moderation</div>'+renderTasks(t.data,t.profiles)}async function getVerifications(){const{data,error}=await supabaseClient.from("profile_verifications").select("id,user_id,status,submitted_at,matric_number,course,reviewer_note").eq("status","pending").order("submitted_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[]};const ids=data.map(v=>v.user_id),r=await supabaseClient.from("profiles").select("id,username,full_name,location,avatar_url").in("id",ids);return{data,profiles:r.data||[],error:r.error}}async function getTasks(){const{data,error}=await supabaseClient.from("tasks").select("id,user_id,title,description,category,location,budget,deadline,status,created_at,moderation_status,moderation_note").eq("moderation_status","pending").order("created_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[]};const ids=[...new Set(data.map(t=>t.user_id))],r=await supabaseClient.from("profiles").select("id,username,full_name,location,avatar_url").in("id",ids);return{data,profiles:r.data||[],error:r.error}}function renderVerifications(data,profiles){if(!data?.length)return'<div class="card empty">🎉 No pending verification requests.<br><span class="muted">New requests will appear here.</span></div>';const pm={};(profiles||[]).forEach(p=>pm[p.id]=p);return data.map(v=>{const p=pm[v.user_id]||{},name=p.full_name||p.username||"OOULink User";return'<div class="card" id="card_'+esc(v.id)+'"><div class="title">'+esc(name)+'</div><div class="muted">@'+esc(p.username||"unknown")+'</div><div class="status">⏳ Pending Review</div><div class="info"><b>Matric:</b> '+esc(v.matric_number||"Not provided")+'<br><b>Course:</b> '+esc(v.course||"Not provided")+'<br><b>Location:</b> '+esc(p.location||"Not provided")+'<br><b>Submitted:</b> '+esc(new Date(v.submitted_at).toLocaleString())+'</div><textarea class="note" id="note_'+esc(v.id)+'" placeholder="Optional reviewer note..."></textarea><div class="actions"><button class="btn approve" onclick="reviewVerification(\''+esc(v.id)+'\',\'verified\',\''+esc(v.user_id)+'\')">✓ APPROVE</button><button class="btn reject" onclick="reviewVerification(\''+esc(v.id)+'\',\'rejected\',\''+esc(v.user_id)+'\')">✕ REJECT</button></div></div>'}).join("")}function renderTasks(data,profiles){if(!data?.length)return'<div class="card empty">🎉 No pending tasks.<br><span class="muted">New tasks waiting for moderation will appear here.</span></div>';const pm={};(profiles||[]).forEach(p=>pm[p.id]=p);return data.map(t=>{const p=pm[t.user_id]||{},name=p.full_name||p.username||"OOULink User";return'<div class="card" id="taskcard_'+esc(t.id)+'"><div class="title">'+esc(t.title)+'</div><div class="muted">Posted by '+esc(name)+' · @'+esc(p.username||"unknown")+'</div><div class="status taskstatus">⏳ Pending Task Review</div><div class="desc">'+esc(t.description)+'</div><div class="info"><b>Category:</b> '+esc(t.category)+'<br><b>Location:</b> '+esc(t.location)+'<br><b>Budget:</b> ₦'+esc(Number(t.budget||0).toLocaleString())+'<br><b>Deadline:</b> '+esc(new Date(t.deadline).toLocaleString())+'<br><b>Task status:</b> '+esc(t.status)+'<br><b>Submitted:</b> '+esc(new Date(t.created_at).toLocaleString())+'</div><textarea class="note" id="tasknote_'+esc(t.id)+'" placeholder="Optional moderation note..."></textarea><div class="actions"><button class="btn approve" onclick="moderateTask(\''+esc(t.id)+'\',\'approved\',\''+esc(t.user_id)+'\')">✓ APPROVE TASK</button><button class="btn reject" onclick="moderateTask(\''+esc(t.id)+'\',\'rejected\',\''+esc(t.user_id)+'\')">✕ REJECT TASK</button></div></div>'}).join("")}async function reviewVerification(id,status,userId){if(!isAdmin||!currentUser)return;const note=document.getElementById("note_"+id)?.value.trim()||null,label=status==="verified"?"approve":"reject";if(!confirm("Are you sure you want to "+label+" this verification request?"))return;const card=document.getElementById("card_"+id);card?.querySelectorAll("button").forEach(b=>b.disabled=true);const{error}=await supabaseClient.from("profile_verifications").update({status,reviewed_at:new Date().toISOString(),reviewed_by:currentUser.id,reviewer_note:note}).eq("id",id).eq("status","pending");if(error){alert("Could not update verification: "+error.message);card?.querySelectorAll("button").forEach(b=>b.disabled=false);return}const{error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="verified"?"profile_verification_approved":"profile_verification_rejected",target_user_id:userId,target_task_id:null,details:note||"Profile verification reviewed"});if(logError){console.error("Admin log error:",logError);alert(status==="verified"?"Profile verified, but the audit log could not be saved.":"Verification rejected, but the audit log could not be saved.");loadAll();return}alert(status==="verified"?"Profile verified successfully.":"Verification rejected.");loadAll()}async function moderateTask(id,status,userId){if(!isAdmin||!currentUser)return;const note=document.getElementById("tasknote_"+id)?.value.trim()||null;if(status==="rejected"&&!note){alert("Please enter a reason before rejecting this task.");return}const label=status==="approved"?"approve":"reject";if(!confirm("Are you sure you want to "+label+" this task?"))return;const card=document.getElementById("taskcard_"+id);card?.querySelectorAll("button").forEach(b=>b.disabled=true);const{error}=await supabaseClient.from("tasks").update({moderation_status:status,moderation_note:note}).eq("id",id).eq("moderation_status","pending");if(error){alert("Could not moderate task: "+error.message);card?.querySelectorAll("button").forEach(b=>b.disabled=false);return}const{error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="approved"?"task_moderation_approved":"task_moderation_rejected",target_user_id:userId,target_task_id:id,details:note||"Task moderation reviewed"});if(logError){console.error("Admin log error:",logError);alert(status==="approved"?"Task approved, but the audit log could not be saved.":"Task rejected, but the audit log could not be saved.");loadAll();return}alert(status==="approved"?"Task approved successfully. It can now appear to users.":"Task rejected successfully.");loadAll()}async function logout(){await supabaseClient.auth.signOut();location.href="login.html"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}init();</script></body></html>
