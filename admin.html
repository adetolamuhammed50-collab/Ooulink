<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard — OOULink</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f4f7f5;color:#17201b;padding:18px}.wrap{max-width:760px;margin:auto}.head{background:#16834b;color:#fff;border-radius:18px;padding:20px;margin-bottom:15px}.head h1{font-size:24px;margin-bottom:5px}.head p{font-size:13px;opacity:.9}.card{background:#fff;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 2px 10px #0000000b}.card h2{font-size:18px;margin-bottom:13px}.item{border:1px solid #e1e7e3;border-radius:13px;padding:14px;margin-bottom:10px}.item:last-child{margin-bottom:0}.name{font-weight:700;font-size:15px}.meta{font-size:12px;color:#68736d;margin-top:5px;line-height:1.5}.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#fff3cd;color:#795b00;font-size:11px;font-weight:700;margin-top:7px}.verified{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;font-size:12px;cursor:pointer;background:#16834b;color:#fff}button:disabled{opacity:.55}.red{background:#dc2626}.orange{background:#d97706}.gray{background:#68736d}.blue{background:#2563eb}input,textarea,select{width:100%;padding:11px;border:1px solid #d8dfda;border-radius:10px;font-size:13px;margin-top:8px;background:#fff}textarea{min-height:70px;resize:vertical}.empty{padding:15px;text-align:center;color:#78817c;font-size:13px;background:#f8faf9;border-radius:10px}.topbtn{float:right;background:#fff;color:#16834b;padding:8px 11px}.status-active{background:#dcfce7;color:#166534}.status-warned{background:#fef3c7;color:#92400e}.status-banned{background:#fee2e2;color:#991b1b}.small{font-size:11px;color:#737d77;margin-top:8px}.dangerbox{background:#fff5f5;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-top:10px;font-size:12px}@media(max-width:500px){body{padding:10px}.head{border-radius:14px}.card{padding:14px}}\n</style></head><body><div class="wrap"><div class="head"><button class="topbtn" onclick="loadAll()">↻ REFRESH</button><h1>OOULink Admin</h1><p id="adminStatus">Checking administrator access...</p></div><div id="app"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,isAdmin=false;async function init(){const{data,error}=await supabaseClient.auth.getSession();if(error||!data.session){document.getElementById("adminStatus").textContent="Please log in.";return}currentUser=data.session.user;const{data:admin,error:adminError}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(adminError||!admin){document.getElementById("adminStatus").textContent="Access denied.";document.getElementById("app").innerHTML='<div class="card"><div class="empty">You are not authorized to access the Admin Dashboard.</div></div>';return}isAdmin=true;document.getElementById("adminStatus").textContent="Administrator access confirmed.";loadAll()}async function loadAll(){if(!isAdmin)return;document.getElementById("app").innerHTML='<div class="card"><div class="empty">Loading admin data...</div></div>';await Promise.all([getVerifications(),getTasks(),getUsers()])}async function getVerifications(){const{data,error}=await supabaseClient.from("profile_verifications").select("id,user_id,status,matric_number,course,submitted_at,reviewer_note,profiles:user_id(full_name,username,location)").eq("status","pending").order("submitted_at",{ascending:true});if(error){renderSection("Profile Verification",'<div class="dangerbox">Could not load verification requests.<br>'+esc(error.message)+"</div>");return}renderVerifications(data||[])}async function getTasks(){const{data,error}=await supabaseClient.from("tasks").select("id,user_id,title,description,category,location,budget,deadline,status,created_at,moderation_status,moderation_note,profiles:user_id(full_name,username)").eq("moderation_status","pending").order("created_at",{ascending:true});if(error){renderSection("Task Moderation",'<div class="dangerbox">Could not load tasks.<br>'+esc(error.message)+"</div>");return}renderTasks(data||[])}async function getUsers(){const{data:profiles,error}=await supabaseClient.from("profiles").select("id,full_name,username,location,created_at").order("created_at",{ascending:false}).limit(100);if(error){renderSection("User Moderation",'<div class="dangerbox">Could not load users.<br>'+esc(error.message)+"</div>");return}const ids=(profiles||[]).map(x=>x.id);let mods=[];if(ids.length){const{data,error:me}=await supabaseClient.from("user_moderation").select("user_id,warning_count,status,ban_type,banned_until,ban_reason,updated_at").in("user_id",ids);if(!me)mods=me||[]}renderUsers(profiles||[],mods)}function renderBase(){document.getElementById("app").innerHTML='<div id="verifications"></div><div id="tasks"></div><div id="users"></div>'}function renderSection(title,html){let el=document.getElementById(title==="Profile Verification"?"verifications":title==="Task Moderation"?"tasks":"users");if(el)el.innerHTML='<div class="card"><h2>'+title+"</h2>"+html+"</div>"}function renderVerifications(rows){let html=rows.length?rows.map(v=>'<div class="item"><div class="name">'+esc(v.profiles?.full_name||v.profiles?.username||"Unknown user")+'</div><div class="meta">Username: '+esc(v.profiles?.username||"—")+'<br>Location: '+esc(v.profiles?.location||"—")+'<br>Matric: '+esc(v.matric_number||"—")+'<br>Course: '+esc(v.course||"—")+'<br>Submitted: '+new Date(v.submitted_at).toLocaleString()+"</div><textarea id=\"vnote_"+v.id+'" placeholder="Optional reviewer note"></textarea><div class="btns"><button class="blue" onclick="reviewVerification(\''+v.id+"','verified','"+v.user_id+'\')\">✓ VERIFY</button><button class=\"red\" onclick=\"reviewVerification('"+v.id+"','rejected','"+v.user_id+"')\">REJECT</button></div></div>').join(""):'<div class="empty">No pending verification requests.</div>';renderSection("Profile Verification",html)}function renderTasks(rows){let html=rows.length?rows.map(t=>'<div class="item"><div class="name">'+esc(t.title)+'</div><div class="meta">Posted by: '+esc(t.profiles?.full_name||t.profiles?.username||"Unknown")+'<br>Category: '+esc(t.category)+'<br>Location: '+esc(t.location)+'<br>Budget: ₦'+Number(t.budget||0).toLocaleString()+'<br>Deadline: '+new Date(t.deadline).toLocaleString()+"</div><div class=\"small\">"+esc(t.description||"")+'</div><textarea id="tasknote_'+t.id+'" placeholder="Reason/note (required when rejecting)"></textarea><div class="btns"><button class="blue" onclick="moderateTask(\''+t.id+"','approved','"+t.user_id+'\')\">✓ APPROVE</button><button class=\"red\" onclick=\"moderateTask(\''+t.id+"','rejected','"+t.user_id+'\')\">REJECT</button></div></div>').join(""):'<div class="empty">No pending task moderation requests.</div>';renderSection("Task Moderation",html)}function renderUsers(profiles,mods){let map={};mods.forEach(m=>map[m.user_id]=m);let html='<input id="userSearch" placeholder="Search by name or username..." oninput="filterUsers()">';html+='<div id="userList">'+(profiles.length?profiles.map(p=>userCard(p,map[p.id])).join(""):'<div class="empty">No users found.</div>')+"</div>";renderSection("User Moderation",html);window.adminProfiles=profiles;window.adminMods=map}function userCard(p,m){m=m||{warning_count:0,status:"active"};let banned=m.status==="banned",expired=banned&&m.ban_type==="temporary"&&m.banned_until&&new Date(m.banned_until)<=new Date();let status=expired?"active":m.status;let badge=status==="banned"?"status-banned":status==="warned"?"status-warned":"status-active";let until=m.banned_until&&!expired?"<br>Until: "+new Date(m.banned_until).toLocaleString():"";return '<div class="item user-item" data-search="'+esc((p.full_name||"")+" "+(p.username||"")).toLowerCase()+'"><div class="name">'+esc(p.full_name||p.username||"Unknown user")+'</div><div class="meta">@'+esc(p.username||"—")+'<br>'+esc(p.location||"—")+'</div><span class="badge '+badge+'">'+status.toUpperCase()+"</span><div class=\"small\">Warnings: "+(m.warning_count||0)+until+(m.ban_reason?"<br>Reason: "+esc(m.ban_reason):"")+'</div><textarea id="reason_'+p.id+'" placeholder="Reason for moderation action"></textarea><div class="btns">'+(status!=="banned"?'<button class="orange" onclick="moderateUser(\''+p.id+"','warning')\">⚠ WARN</button><button class=\"orange\" onclick=\"moderateUser('"+p.id+"','temporary_ban')\">⏱ TEMP BAN</button><button class=\"red\" onclick=\"moderateUser('"+p.id+"','permanent_ban')\">🚫 PERMANENT BAN</button>":'<button class=\"blue\" onclick=\"moderateUser(\''+p.id+"','unban')\">🔓 UNBAN</button>")+'</div></div>'}function filterUsers(){const q=(document.getElementById("userSearch")?.value||"").toLowerCase();document.querySelectorAll(".user-item").forEach(x=>x.style.display=x.dataset.search.includes(q)?"":"none")}async function reviewVerification(id,status,userId){if(!isAdmin)return;const note=document.getElementById("vnote_"+id)?.value.trim()||null;if(status==="rejected"&&!note){alert("Please enter a reason before rejecting.");return}if(!confirm(status==="verified"?"Verify this profile?":"Reject this verification request?"))return;const{error}=await supabaseClient.from("profile_verifications").update({status,reviewed_at:new Date().toISOString(),reviewed_by:currentUser.id,reviewer_note:note}).eq("id",id).eq("status","pending");if(error){alert("Could not review request.\\n\\n"+error.message);return}const{error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="verified"?"verification_approved":"verification_rejected",target_user_id:userId,details:note||"Verification reviewed"});if(logError)console.error(logError);alert(status==="verified"?"Profile verified.":"Verification rejected.");loadAll()}async function moderateTask(id,status,userId){if(!isAdmin)return;const note=document.getElementById("tasknote_"+id)?.value.trim()||null;if(status==="rejected"&&!note){alert("Please enter a reason before rejecting this task.");return}if(!confirm(status==="approved"?"Approve this task?":"Reject this task?"))return;const{error}=await supabaseClient.from("tasks").update({moderation_status:status,moderation_note:note}).eq("id",id).eq("moderation_status","pending");if(error){alert("Could not moderate task.\\n\\n"+error.message);return}const{error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="approved"?"task_moderation_approved":"task_moderation_rejected",target_user_id:userId,target_task_id:id,details:note||"Task moderation reviewed"});if(logError)console.error(logError);alert(status==="approved"?"Task approved.":"Task rejected.");loadAll()}async function moderateUser(userId,action){if(!isAdmin||userId===currentUser.id){if(userId===currentUser.id)alert("You cannot moderate your own account.");return}const reason=document.getElementById("reason_"+userId)?.value.trim()||"";if(!reason){alert("Please enter a reason.");return}let updates={user_id:userId,updated_at:new Date().toISOString()},logAction=action,banUntil=null;if(action==="warning"){const{data:old}=await supabaseClient.from("user_moderation").select("warning_count").eq("user_id",userId).maybeSingle();const count=(old?.warning_count||0)+1;updates.warning_count=count;updates.status="warned";updates.ban_type=null;updates.banned_until=null;updates.ban_reason=reason}else if(action==="temporary_ban"){const d=new Date(Date.now()+7*24*60*60*1000);banUntil=d.toISOString();updates.warning_count=0;updates.status="banned";updates.ban_type="temporary";updates.banned_until=banUntil;updates.ban_reason=reason}else if(action==="permanent_ban"){updates.warning_count=0;updates.status="banned";updates.ban_type="permanent";updates.banned_until=null;updates.ban_reason=reason}else if(action==="unban"){updates.status="active";updates.ban_type=null;updates.banned_until=null;updates.ban_reason=reason}if(!confirm(action==="warning"?"Issue a warning?":action==="temporary_ban"?"Temporarily ban this user for 7 days?":action==="permanent_ban"?"Permanently ban this user?":"Unban this user?"))return;const{error}=await supabaseClient.from("user_moderation").upsert(updates,{onConflict:"user_id"});if(error){alert("Could not update moderation status.\\n\\n"+error.message);return}const{error:logError}=await supabaseClient.from("user_moderation_logs").insert({user_id:userId,admin_id:currentUser.id,action:logAction,reason,ban_until:banUntil});if(logError){alert("Moderation was applied, but the history log failed.\\n\\n"+logError.message);return}const{error:adminLogError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:"user_"+action,target_user_id:userId,details:reason});if(adminLogError)console.error(adminLogError);alert(action==="warning"?"Warning issued.":action==="temporary_ban"?"User temporarily banned for 7 days.":action==="permanent_ban"?"User permanently banned.":"User unbanned.");loadAll()}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}async function logout(){await supabaseClient.auth.signOut();location.href="index.html"}renderBase();init();</script></body></html>
