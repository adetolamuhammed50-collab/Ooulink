-size:15px;color:#17231d;user-select:none;touch-action:manipulation;transition:background .15s,transform .12s}.admin-panel>summary::-webkit-details-marker{display:none}.admin-panel>summary:before{content:"";width:8px;height:8px;border-right:2px solid #2563eb;border-bottom:2px solid #2563eb;transform:rotate(-45deg);transition:transform .18s;flex:none}.admin-panel[open]>summary:before{transform:rotate(45deg)}.admin-panel>summary:after{content:"TAP TO OPEN";font-size:9px;color:#94a3b8;font-weight:800;letter-spacing:.5px;margin-left:auto}.admin-panel[open]>summary:after{content:"TAP TO CLOSE";color:#2563eb}.admin-panel>summary:hover{background:#f3f7ff}.admin-panel>summary:active{transform:scale(.99);background:#edf4ff}.admin-panel>div{padding:0 14px 14px}.admin-panel[open]>summary{background:linear-gradient(90deg,#eef6ff,#f0fbf5);color:#14532d}.admin-panel[open]>div{animation:panelIn .18s ease}@keyframes panelIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}.stat{position:relative;overflow:hidden;border-radius:17px;padding:15px;color:#fff;min-height:104px;box-shadow:0 7px 18px #00000012;transition:transform .16s,box-shadow .16s}.stat:hover{transform:translateY(-2px);box-shadow:0 10px 22px #00000018}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;bottom:-28px;background:#fff2;pointer-events:none}.stat .label{font-size:11px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.5px}.stat .num{font-size:31px;font-weight:900;margin-top:8px;line-height:1}.s-users{background:linear-gradient(135deg,#334155,#64748b)}.s-verified{background:linear-gradient(135deg,#087f5b,#20b47a)}.s-unverified{background:linear-gradient(135deg,#7c3aed,#a855f7)}.s-alltasks{background:linear-gradient(135deg,#2563eb,#4f7df3)}.s-approved{background:linear-gradient(135deg,#0f9f68,#34c98a)}.s-rejected{background:linear-gradient(135deg,#c92f45,#ef6262)}.s-pending{background:linear-gradient(135deg,#d97706,#f59e0b)}.stat-note{font-size:10px;margin-top:6px;opacity:.82}.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 4px 15px #1e293b0d;border:1px solid #e5eaf0;transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-1px);box-shadow:0 8px 20px #1e293b12}.title{font-size:18px;font-weight:900;margin:0 0 4px}.muted{color:#6b7280;font-size:13px}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff3cd;color:#856404;font-size:12px;font-weight:800;margin:10px 0}.active,.resolved{background:#dcfce7;color:#166534}.banned,.rejected{background:#fee2e2;color:#991b1b}.warned,.reportstatus{background:#fef3c7;color:#92400e}.taskstatus{background:#dbeafe;color:#1d4ed8}.info{background:#f8fafc;border-radius:11px;padding:11px;margin:8px 0;font-size:14px;line-height:1.6}.desc,.report-detail{background:#fafafa;border-radius:8px;padding:11px;margin:9px 0;font-size:14px;line-height:1.55;white-space:pre-wrap}.desc{border-left:3px solid #2563eb}.note,.search{width:100%;border:1px solid #d7dee8;border-radius:11px;padding:10px;resize:vertical;font:inherit;margin:8px 0;background:#fff}.note{min-height:70px}.search{margin:0 0 12px;resize:none}.note:focus,.search:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px #2563eb22}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1;min-width:120px}.empty{text-align:center;padding:40px 15px;color:#6b7280}.loading{text-align:center;padding:30px;color:#6b7280}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;font-size:14px;line-height:1.5}.back{display:block;text-align:center;margin:20px 0;color:#2563eb;text-decoration:none;font-weight:800;padding:10px;border-radius:10px;transition:background .15s,transform .15s}.back:hover{background:#eef4ff}.back:active{transform:scale(.98)}.report-filter{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding:2px}.report-filter button{border:1px solid #d7dee8;background:#fff;border-radius:18px;padding:8px 12px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:transform .15s,background .15s,color .15s,box-shadow .15s}.report-filter button:active{transform:scale(.95)}.report-filter button:hover{transform:translateY(-1px);box-shadow:0 4px 10px #00000012}.report-filter button.active{background:#2563eb;color:#fff;border-color:#2563eb}.verify-files{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.verify-files .btn{width:100%}@media(max-width:480px){.wrap{padding:13px}.head{align-items:flex-start}.head-actions{flex-direction:column}.head-actions .btn{padding:9px 10px;font-size:11px}.stats{gap:8px}.stat{min-height:96px;padding:13px}.stat .num{font-size:27px}.actions{flex-direction:column}.btn{width:100%}.verify-files{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.btn,.card,.stat,.back,.admin-panel>summary,.report-filter button{transition:none}}

<body>
<div class="wrap"><div class="head"><div><div class="logo">StudTask Admin</div><div class="tag">Administration Dashboard</div></div><div class="head-actions"><button id="refreshBtn" class="btn refresh" type="button" onclick="loadAll()">↻ REFRESH</button><button class="btn logout" type="button" onclick="logout()">LOG OUT</button></div></div><div id="app" class="loading">Checking administrator access...</div><a class="back" href="index.html">← Back to StudTask</a></div>
<script>
const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,isAdmin=false,allUsers=[],mods=[],allReports=[],reportProfiles={},reportTasks={};window.reportFilter="all";
function esc(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]))}function timeout(promise,ms=10000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("The request timed out. Please check your internet connection and try again.")),ms))])}
async function init(){try{if(!window.supabase)throw new Error("Supabase library failed to load. Refresh the page and try again.");const {data,error}=await timeout(supabaseClient.auth.getSession());if(error)throw error;if(!data?.session){location.href="login.html";return}currentUser=data.session.user;const adminCheck=await timeout(supabaseClient.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle());if(adminCheck.error)throw adminCheck.error;if(!adminCheck.data){document.getElementById("app").innerHTML='<div class="error"><b>Access denied.</b><br>This account is not a StudTask administrator.</div>';return}isAdmin=true;await loadAll()}catch(error){document.getElementById("app").innerHTML=`<div class="error"><b>Could not verify administrator access.</b><br>${esc(error.message||"Unknown error")}<br><br><button class="btn refresh" type="button" onclick="location.reload()">TRY AGAIN</button></div>`}}
async function loadAll(){if(!isAdmin)return;const button=document.getElementById("refreshBtn");button.disabled=true;renderBase();try{const [verifications,tasks,users,reports,stats,disputes]=await Promise.all([getVerifications(),getTasks(),getUsers(),getReports(),getStats(),getDisputes()]);if(verifications.error||tasks.error||users.error||reports.error||stats.error||disputes.error)throw verifications.error||tasks.error||users.error||reports.error||stats.error||disputes.error;document.getElementById("statsBox").innerHTML=renderStats(stats);document.getElementById("verificationBox").innerHTML=renderVerifications(verifications.data,verifications.profiles);document.getElementById("taskBox").innerHTML=renderTasks(tasks.data,tasks.profiles);allUsers=users.users||[];mods=users.mods||[];document.getElementById("userBox").innerHTML=renderUsers();allReports=reports.data||[];reportProfiles={};reportTasks={};(reports.profiles||[]).forEach(profile=>reportProfiles[profile.id]=profile);(reports.tasks||[]).forEach(task=>reportTasks[task.id]=task);document.getElementById("reportBox").innerHTML=renderReports();document.getElementById("disputeBox").innerHTML=renderDisputes(disputes.data||[],disputes.profiles||{},disputes.tasks||{})}catch(error){document.getElementById("app").innerHTML=`<div class="error"><b>Could not load the admin dashboard.</b><br>${esc(error.message||"Unknown error")}</div>`}finally{button.disabled=false}}
async function getStats(){const [users,verifications,tasks]=await Promise.all([supabaseClient.from("profiles").select("id",{count:"exact",head:true}),supabaseClient.from("profile_verifications").select("user_id,status"),supabaseClient.from("tasks").select("id,moderation_status")]);if(users.error||verifications.error||tasks.error)return{error:users.error||verifications.error||tasks.error};const verified=new Set((verifications.data||[]).filter(v=>v.status==="verified").map(v=>v.user_id));const list=tasks.data||[];return{users:users.count||0,verified:verified.size,unverified:Math.max(0,(users.count||0)-verified.size),tasks:list.length,approved:list.filter(t=>t.moderation_status==="approved").length,rejected:list.filter(t=>t.moderation_status==="rejected").length,pending:list.filter(t=>!t.moderation_status||t.moderation_status==="pending").length}}
async function getDisputes(){
      const { data, error } = await supabaseClient
        .from('task_disputes')
        .select('id,task_id,opened_by,reason,description,status,resolution,resolved_by,admin_note,created_at,resolved_at')
        .order('created_at', { ascending: false });
      if(error) return { error };
      const disputes = data || [];
      const ids = new Set();
      disputes.forEach(dispute => {
        if(dispute.opened_by) ids.add(dispute.opened_by);
        if(dispute.resolved_by) ids.add(dispute.resolved_by);
      });
      const taskIds = [...new Set(disputes.map(dispute => dispute.task_id).filter(Boolean))];
      const [profilesResult, tasksResult] = await Promise.all([
        ids.size ? supabaseClient.from('profiles').select('id,username,full_name').in('id', [...ids]) : Promise.resolve({ data: [], error: null }),
        taskIds.length ? supabaseClient.from('tasks').select('id,title,user_id,runner_id,budget,status').in('id', taskIds) : Promise.resolve({ data: [], error: null })
      ]);
      if(profilesResult.error) return { error: profilesResult.error };
      if(tasksResult.error) return { error: tasksResult.error };
      const profiles = {};
      (profilesResult.data || []).forEach(profile => profiles[profile.id] = profile);
      const tasks = {};
      (tasksResult.data || []).forEach(task => tasks[task.id] = task);
      return { data: disputes, profiles, tasks };
    }

    function profileLabel(profiles, id){
      const profile = profiles[id];
      if(!profile) return id ? String(id).slice(0, 8) + '...' : 'Unknown user';
      return profile.full_name || profile.username || String(id).slice(0, 8) + '...';
    }

    function renderDisputes(disputes, profiles, tasks){
      if(!disputes.length) return '<div class="empty">No disputes have been opened.</div>';
      return disputes.map(dispute => {
        const task = tasks[dispute.task_id] || {};
        const isOpen = dispute.status === 'open' || dispute.status === 'under_review';
        const openedBy = profileLabel(profiles, dispute.opened_by);
        const taskOwner = profileLabel(profiles, task.user_id);
        const runner = profileLabel(profiles, task.runner_id);
        const created = dispute.created_at ? new Date(dispute.created_at).toLocaleString() : 'Unknown';
        const resolved = dispute.resolved_at ? new Date(dispute.resolved_at).toLocaleString() : '';
        const statusClass = isOpen ? 'warned' : 'resolved';
        const controls = isOpen ? `
          <textarea class="note" id="disputeNote-${dispute.id}" placeholder="Optional admin note or reason"></textarea>
          <div class="actions">
            <button class="btn approve" type="button" onclick="resolveDispute('${dispute.id}','runner')">✓ Resolve for Runner</button>
            <button class="btn reject" type="button" onclick="resolveDispute('${dispute.id}','poster')">↩ Resolve for Poster</button>
            <button class="btn dismiss" type="button" onclick="resolveDispute('${dispute.id}','dismissed')">Dismiss</button>
          </div>` : `
          <div class="info"><b>Resolution:</b> ${esc(dispute.resolution || '—')}<br><b>Resolved:</b> ${esc(resolved || '—')}${dispute.admin_note ? `<br><b>Admin note:</b> ${esc(dispute.admin_note)}` : ''}</div>`;
        return `<div class="card">
          <div class="title">${esc(task.title || 'Task dispute')}</div>
          <div class="muted">Opened ${esc(created)}</div>
          <span class="status ${statusClass}">${esc(dispute.status || 'unknown')}</span>
          <div class="info"><b>Reason:</b> ${esc(dispute.reason || '—')}<br><b>Opened by:</b> ${esc(openedBy)}<br><b>Poster:</b> ${esc(taskOwner)}<br><b>Runner:</b> ${esc(runner)}<br><b>Budget:</b> ₦${esc(Number(task.budget || 0).toLocaleString())}</div>
          <div class="desc">${esc(dispute.description || 'No description provided.')}</div>
          ${controls}
        </div>`;
      }).join('');
    }

    async function resolveDispute(disputeId, resolution){
      const labels = { runner: 'resolve this dispute for the runner', poster: 'resolve this dispute for the poster', dismissed: 'dismiss this dispute' };
      if(!confirm(`Are you sure you want to ${labels[resolution] || 'resolve this dispute'}? This may move or refund task funds.`)) return;
      const noteElement = document.getElementById(`disputeNote-${disputeId}`);
      const adminNote = noteElement ? noteElement.value.trim() || null : null;
      try{
        const { error } = await supabaseClient.rpc('admin_resolve_task_dispute', {
          p_dispute_id: disputeId,
          p_resolution: resolution,
          p_admin_note: adminNote
        });
        if(error) throw error;
        alert('Dispute resolved successfully.');
        await loadAll();
      }catch(error){
        alert(`Could not resolve dispute: ${error.message || 'Unknown error'}`);
      }
    }

    function renderStats(s){return`<div class="stats"><div class="stat s-users"><div class="label">All Users</div><div class="num">${s.users}</div><div class="stat-note">Registered profiles</div></div><div class="stat s-verified"><div class="label">Verified Users</div><div class="num">${s.verified}</div><div class="stat-note">Approved profiles</div></div><div class="stat s-unverified"><div class="label">Non-Verified</div><div class="num">${s.unverified}</div><div class="stat-note">Not yet verified</div></div><div class="stat s-alltasks"><div class="label">All Tasks</div><div class="num">${s.tasks}</div><div class="stat-note">All submitted tasks</div></div><div class="stat s-approved"><div class="label">Approved Tasks</div><div class="num">${s.approved}</div><div class="stat-note">Moderation approved</div></div><div class="stat s-rejected"><div class="label">Rejected Tasks</div><div class="num">${s.rejected}</div><div class="stat-note">Moderation rejected</div></div><div class="stat s-pending"><div class="label">Pending Tasks</div><div class="num">${s.pending}</div><div class="stat-note">Awaiting moderation</div></div></div>`}
function renderBase(){document.getElementById("app").innerHTML='<div id="statsBox"></div><div class="admin-accordion"><details class="admin-panel"><summary>🛡️ Profile Verification</summary><div id="verificationBox" class="loading">Loading...</div></details><details class="admin-panel"><summary>📋 Task Moderation</summary><div id="taskBox" class="loading">Loading...</div></details><details class="admin-panel"><summary>💳 Test Payments</summary><div><div class="info">Open the simulated payment-provider dashboard to confirm or fail test deposits. No real money is involved.</div><div class="actions"><button class="btn approve" type="button" onclick="location.href=&quot;test-payments.html&quot;">💳 OPEN TEST PAYMENTS</button></div></div></details><details class="admin-panel"><summary>🚨 User Reports</summary><div id="reportBox" class="loading">Loading...</div></details><details class="admin-panel"><summary>⚖️ Task Disputes</summary><div id="disputeBox" class="loading">Loading...</div></details><details class="admin-panel"><summary>👤 User Moderation</summary><div id="userBox" class="loading">Loading...</div></details></div>'}
async function getVerifications(){const {data,error}=await supabaseClient.from("profile_verifications").select("id,user_id,status,submitted_at,matric_number,course,reviewer_note,student_id_path,selfie_path").eq("status","pending").order("submitted_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[]};const ids=data.map(item=>item.user_id),result=await supabaseClient.from("profiles").select("id,username,full_name,location,avatar_url").in("id",ids);return{data,profiles:result.data||[],error:result.error}}
async function getTasks(){const {data,error}=await supabaseClient.from("tasks").select("id,user_id,title,description,category,location,budget,deadline,status,created_at,moderation_status,moderation_note").eq("moderation_status","pending").order("created_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[]};const ids=[...new Set(data.map(task=>task.user_id))],result=await supabaseClient.from("profiles").select("id,username,full_name,location,avatar_url").in("id",ids);return{data,profiles:result.data||[],error:result.error}}
async function getUsers(){const {data,error}=await supabaseClient.from("profiles").select("id,username,full_name,location,avatar_url").order("full_name",{ascending:true});if(error)return{error};const ids=(data||[]).map(user=>user.id);if(!ids.length)return{users:data||[],mods:[]};const {data:moderationData,error:moderationError}=await supabaseClient.from("user_moderation").select("user_id,warning_count,status,ban_type,banned_until,ban_reason").in("user_id",ids);return{users:data||[],mods:moderationError?[]:moderationData||[],error:moderationError}}
async function getReports(){const {data,error}=await supabaseClient.from("reports").select("id,task_id,reporter_id,reported_user_id,reason,details,status,created_at").order("created_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[],tasks:[]};const ids=[...new Set(data.flatMap(report=>[report.reporter_id,report.reported_user_id]).filter(Boolean))],profileResult=ids.length?await supabaseClient.from("profiles").select("id,username,full_name,location").in("id",ids):{data:[],error:null},taskIds=[...new Set(data.map(report=>report.task_id).filter(Boolean))],taskResult=taskIds.length?await supabaseClient.from("tasks").select("id,title,status,moderation_status,location,budget,deadline").in("id",taskIds):{data:[],error:null};return{data,profiles:profileResult.data||[],tasks:taskResult.data||[],error:profileResult.error||taskResult.error}}
function renderVerifications(data,profiles){if(!data?.length)return'<div class="card empty">🎉 No pending verification requests.<br><span class="muted">New requests will appear here.</span></div>';const map={};(profiles||[]).forEach(profile=>map[profile.id]=profile);return data.map(item=>{const profile=map[item.user_id]||{},name=profile.full_name||profile.username||"StudTask User";return `<div class="card"><div class="title">${esc(name)}</div><div class="muted">@${esc(profile.username||"unknown")}</div><div class="status">⏳ Pending Review</div><div class="info"><b>Student Number:</b> ${esc(item.matric_number||"Not provided")}<br><b>Course:</b> ${esc(item.course||"Not provided")}<br><b>Location:</b> ${esc(profile.location||"Not provided")}<br><b>Submitted:</b> ${esc(new Date(item.submitted_at).toLocaleString())}</div><div class="verify-files">${item.student_id_path?`<button class="btn view" type="button" onclick="openVerificationFile(decodeURIComponent('${encodeURIComponent(item.student_id_path)}'),'Student ID')">🪪 VIEW STUDENT ID</button>`:`<button class="btn" type="button" disabled>🪪 ID NOT PROVIDED</button>`}${item.selfie_path?`<button class="btn view" type="button" onclick="openVerificationFile(decodeURIComponent('${encodeURIComponent(item.selfie_path)}'),'Selfie')">🤳 VIEW SELFIE</button>`:`<button class="btn" type="button" disabled>🤳 SELFIE NOT PROVIDED</button>`}</div><textarea class="note" id="note_${esc(item.id)}" placeholder="Optional reviewer note..."></textarea><div class="actions"><button class="btn approve" type="button" onclick="reviewVerification('${esc(item.id)}','verified','${esc(item.user_id)}')">✓ APPROVE</button><button class="btn reject" type="button" onclick="reviewVerification('${esc(item.id)}','rejected','${esc(item.user_id)}')">✕ REJECT</button></div></div>`}).join("")}
async function openVerificationFile(path,label){if(!isAdmin||!path)return;try{const {data,error}=await supabaseClient.storage.from("VerificationFiles").createSignedUrl(path,300);if(error)throw error;if(!data?.signedUrl)throw new Error("Could not create a secure viewing link.");window.open(data.signedUrl,"_blank","noopener,noreferrer")}catch(error){alert("Could not open "+label+": "+(error.message||"Unknown error"))}}
function renderTasks(data,profiles){if(!data?.length)return'<div class="card empty">🎉 No pending tasks.<br><span class="muted">New tasks waiting for moderation will appear here.</span></div>';const map={};(profiles||[]).forEach(profile=>map[profile.id]=profile);return data.map(task=>{const profile=map[task.user_id]||{},name=profile.full_name||profile.username||"StudTask User";return `<div class="card"><div class="title">${esc(task.title)}</div><div class="muted">Posted by ${esc(name)} · @${esc(profile.username||"unknown")}</div><div class="status taskstatus">⏳ Pending Task Review</div><div class="desc">${esc(task.description)}</div><div class="info"><b>Category:</b> ${esc(task.category)}<br><b>Location:</b> ${esc(task.location)}<br><b>Budget:</b> ₦${esc(Number(task.budget||0).toLocaleString())}<br><b>Deadline:</b> ${esc(new Date(task.deadline).toLocaleString())}<br><b>Task status:</b> ${esc(task.status)}<br><b>Submitted:</b> ${esc(new Date(task.created_at).toLocaleString())}</div><textarea class="note" id="tasknote_${esc(task.id)}" placeholder="Optional moderation note..."></textarea><div class="actions"><button class="btn approve" type="button" onclick="moderateTask('${esc(task.id)}','approved','${esc(task.user_id)}')">✓ APPROVE TASK</button><button class="btn reject" type="button" onclick="moderateTask('${esc(task.id)}','rejected','${esc(task.user_id)}')">✕ REJECT TASK</button></div></div>`}).join("")}
function reportStatusClass(status){const value=String(status||"pending").toLowerCase();if(value==="resolved"||value==="reviewed")return"resolved";if(value==="rejected"||value==="dismissed")return"rejected";return"reportstatus"}
function renderReports(){if(!allReports.length)return'<div class="card empty">🎉 No reports found.<br><span class="muted">User reports will appear here when submitted.</span></div>';const filter=window.reportFilter||"all",rows=allReports.filter(report=>filter==="all"||String(report.status||"pending").toLowerCase()===filter);let html=`<div class="report-filter"><button class="${filter==="all"?"active":""}" type="button" onclick="setReportFilter('all')">ALL</button><button class="${filter==="pending"?"active":""}" type="button" onclick="setReportFilter('pending')">PENDING</button><button class="${filter==="resolved"?"active":""}" type="button" onclick="setReportFilter('resolved')">RESOLVED</button><button class="${filter==="dismissed"?"active":""}" type="button" onclick="setReportFilter('dismissed')">DISMISSED</button></div>`;if(!rows.length)return html+`<div class="card empty">No ${esc(filter)} reports.</div>`;return html+rows.map(report=>{const reporter=reportProfiles[report.reporter_id]||{},reported=reportProfiles[report.reported_user_id]||{},task=reportTasks[report.task_id]||{},status=String(report.status||"pending").toLowerCase(),pending=status==="pending";return `<div class="card"><div class="title">🚨 ${esc(report.reason||"User Report")}</div><span class="status ${reportStatusClass(status)}">${esc(status.toUpperCase())}</span><div class="info"><b>Reported user:</b> ${esc(reported.full_name||reported.username||"Unknown user")} ${reported.username?`(@${esc(reported.username)})`:""}<br><b>Reported by:</b> ${esc(reporter.full_name||reporter.username||"Unknown user")} ${reporter.username?`(@${esc(reporter.username)})`:""}<br><b>Submitted:</b> ${esc(new Date(report.created_at).toLocaleString())}${report.task_id?`<br><b>Task:</b> ${esc(task.title||report.task_id)}`:""}</div>${task.title?`<div class="report-detail"><b>Task status:</b> ${esc(task.status||"Unknown")}<br><b>Task location:</b> ${esc(task.location||"Not provided")}<br><b>Task budget:</b> ₦${esc(Number(task.budget||0).toLocaleString())}</div>`:""}<div class="report-detail">${esc(report.details||"No additional details provided.")}</div><div class="actions">${report.task_id?`<button class="btn view" type="button" onclick="openTask('${esc(report.task_id)}')">📋 VIEW TASK</button>`:""}${report.reported_user_id?`<button class="btn view" type="button" onclick="openUser('${esc(report.reported_user_id)}')">👤 VIEW USER</button>`:""}${pending?`<button class="btn approve" type="button" onclick="updateReportStatus('${esc(report.id)}','resolved')">✓ RESOLVE</button><button class="btn dismiss" type="button" onclick="updateReportStatus('${esc(report.id)}','dismissed')">✕ DISMISS</button>`:""}</div></div>`}).join("")}
function setReportFilter(filter){window.reportFilter=filter;document.getElementById("reportBox").innerHTML=renderReports()}
async function updateReportStatus(reportId,status){if(!isAdmin||!currentUser||!["resolved","dismissed"].includes(status))return;const action=status==="resolved"?"resolve":"dismiss";if(!confirm("Are you sure you want to "+action+" this report?"))return;const {data,error}=await supabaseClient.from("reports").update({status}).eq("id",reportId).eq("status","pending").select("id,status").maybeSingle();if(error){alert("Could not update report: "+error.message);return}if(!data){alert("This report was already reviewed or could not be updated.");return}const {error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="resolved"?"report_resolved":"report_dismissed",target_user_id:null,target_task_id:null,details:"User report "+action+"ed. Report ID: "+reportId});if(logError)console.error("Report admin log error:",logError);const report=allReports.find(item=>item.id===reportId);if(report)report.status=status;document.getElementById("reportBox").innerHTML=renderReports();alert(status==="resolved"?"Report resolved successfully.":"Report dismissed successfully.")}
function openTask(id){if(id)window.location.href="task-details.html?id="+encodeURIComponent(id)}function openUser(id){if(id)window.location.href="profile.html?id="+encodeURIComponent(id)}function getMod(id){return mods.find(item=>item.user_id===id)||{warning_count:0,status:"active"}}
function renderUsers(){if(!allUsers.length)return'<div class="card empty">No users found.</div>';return'<input id="userSearch" class="search" placeholder="Search users..." oninput="filterUsers()"><div id="userList">'+userCards(allUsers)+'</div>'}
function userCards(users){if(!users.length)return'<div class="card empty">No matching users.</div>';return users.map(user=>{const moderation=getMod(user.id),banned=moderation.status==="banned",warned=moderation.status==="warned",name=user.full_name||user.username||"StudTask User",until=moderation.banned_until?new Date(moderation.banned_until):null,activeBan=banned&&(!until||until>new Date()),status=activeBan?"banned":warned?"warned":"active";return `<div class="card"><div class="title">${esc(name)}</div><div class="muted">@${esc(user.username||"unknown")}</div><div class="status ${status}">${activeBan?"🚫 BANNED":warned?"⚠️ WARNED":"✓ ACTIVE"}</div><div class="info"><b>Location:</b> ${esc(user.location||"Not provided")}<br><b>Warnings:</b> ${esc(moderation.warning_count||0)}${moderation.ban_type?`<br><b>Ban:</b> ${esc(moderation.ban_type)}`:""}${until?`<br><b>Until:</b> ${esc(until.toLocaleString())}`:""}${moderation.ban_reason?`<br><b>Reason:</b> ${esc(moderation.ban_reason)}`:""}</div><textarea class="note" id="reason_${esc(user.id)}" placeholder="Reason for warning/ban..."></textarea><div class="actions"><button class="btn view" type="button" onclick="openUser('${esc(user.id)}')">👤 VIEW USER</button>${activeBan?`<button class="btn unban" type="button" onclick="moderateUser('${esc(user.id)}','unban')">✓ UNBAN</button>`:`<button class="btn warn" type="button" onclick="moderateUser('${esc(user.id)}','warning')">⚠ WARN</button><button class="btn ban" type="button" onclick="moderateUser('${esc(user.id)}','temporary_ban')">⏳ BAN 7 DAYS</button><button class="btn danger" type="button" onclick="moderateUser('${esc(user.id)}','permanent_ban')">🚫 PERMANENT BAN</button>`}</div></div>`}).join("")}
function filterUsers(){const query=(document.getElementById("userSearch")?.value||"").toLowerCase(),list=document.getElementById("userList");if(!list)return;list.innerHTML=userCards(allUsers.filter(user=>(user.full_name||"").toLowerCase().includes(query)||(user.username||"").toLowerCase().includes(query)||(user.location||"").toLowerCase().includes(query)))}
async function reviewVerification(id,status,userId){if(!isAdmin||!currentUser)return;const note=document.getElementById("note_"+id)?.value.trim()||null,action=status==="verified"?"approve":"reject";if(!confirm("Are you sure you want to "+action+" this verification request?"))return;const {error}=await supabaseClient.from("profile_verifications").update({status,reviewed_at:new Date().toISOString(),reviewed_by:currentUser.id,reviewer_note:note}).eq("id",id).eq("status","pending");if(error){alert("Could not update verification: "+error.message);return}await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="verified"?"profile_verification_approved":"profile_verification_rejected",target_user_id:userId,target_task_id:null,details:note||"Profile verification reviewed"});alert(status==="verified"?"Profile verified successfully.":"Verification rejected.");await loadAll()}
async function moderateTask(id,status,userId){if(!isAdmin||!currentUser)return;const note=document.getElementById("tasknote_"+id)?.value.trim()||null;if(status==="rejected"&&!note){alert("Please enter a reason before rejecting this task.");return}const action=status==="approved"?"approve":"reject";if(!confirm("Are you sure you want to "+action+" this task?"))return;const {data,error}=await supabaseClient.from("tasks").update({moderation_status:status,moderation_note:note}).eq("id",id).eq("moderation_status","pending").select("id,moderation_status,moderation_note").maybeSingle();if(error){alert("Could not moderate task: "+error.message);return}if(!data){alert("No task was updated. It may already have been reviewed.");return}const {error:logError}=await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:status==="approved"?"task_moderation_approved":"task_moderation_rejected",target_user_id:userId,target_task_id:id,details:note||"Task moderation reviewed"});if(logError)console.error("Admin log error:",logError);alert(status==="approved"?"Task approved successfully. It can now appear to users.":"Task rejected successfully. It will remain hidden from users.");await loadAll()}
async function moderateUser(userId,action){if(!isAdmin||!currentUser||userId===currentUser.id){alert("You cannot moderate your own account.");return}const reason=document.getElementById("reason_"+userId)?.value.trim()||"";if(action!=="unban"&&!reason){alert("Please enter a reason.");return}const moderation=getMod(userId);let warningCount=Number(moderation.warning_count||0),status="active",banType=null,bannedUntil=null,banReason=null;if(action==="warning"){warningCount++;status="warned";banReason=reason}else if(action==="temporary_ban"){status="banned";banType="temporary";bannedUntil=new Date(Date.now()+7*86400000).toISOString();banReason=reason}else if(action==="permanent_ban"){status="banned";banType="permanent";banReason=reason}const label=action==="warning"?"warn":action==="temporary_ban"?"temporarily ban":"permanently ban";if(!confirm("Are you sure you want to "+(action==="unban"?"unban":label)+" this user?"))return;const {error}=await supabaseClient.from("user_moderation").upsert({user_id:userId,warning_count:warningCount,status,ban_type:banType,banned_until:banReason?bannedUntil:null,ban_reason:banReason,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){alert("Could not update user moderation: "+error.message);return}const {error:logError}=await supabaseClient.from("user_moderation_logs").insert({user_id:userId,admin_id:currentUser.id,action,reason:reason||null,ban_until:bannedUntil});if(logError){alert("Moderation updated, but the moderation log could not be saved.");await loadAll();return}await supabaseClient.from("admin_logs").insert({admin_id:currentUser.id,action:"user_"+action,target_user_id:userId,target_task_id:null,details:reason||"User moderation action"});alert(action==="warning"?"Warning issued.":action==="temporary_ban"?"User temporarily banned for 7 days.":action==="permanent_ban"?"User permanently banned.":"User unbanned.");await loadAll()}
async function logout(){await supabaseClient.auth.signOut();location.href="login.html"}init();
</script>
