<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Tasks - OOULink</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding-bottom: 75px;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .back {
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 26px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .search-box {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .search-box:focus {
      border-color: #111;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    #tasks {
      padding: 15px 20px;
    }

    .task {
      border: 1px solid #e6e6e6;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .task:active {
      transform: scale(0.98);
    }

    .category {
      display: inline-block;
      font-size: 12px;
      background: #f0f0f0;
      padding: 5px 9px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .task h3 {
      margin: 3px 0 8px;
      font-size: 17px;
    }

    .task p {
      margin: 6px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    .budget {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .view-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      padding: 30px 10px;
      color: #777;
      font-size: 14px;
    }

    nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid #e5e8e6;
  display: flex;
  justify-content: space-around;
  padding: 12px 5px;
  z-index: 1000;
      }
    
    nav a {
  text-decoration: none;
  color: #777;
  font-size: 11px;
  text-align: center;
  transition: transform 0.18s ease, color 0.18s ease;
      }
    
    nav a.active {
  color: #16834b;
  font-weight: bold;
  transform: translateY(-2px);
      }
    
  </style>
</head>

<body>

<div class="app">

  <header>
    <a href="index.html" class="back">← Back</a>

    <h1>Find Tasks</h1>
    <div class="subtitle">Find tasks you can complete and earn.</div>

    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="🔎 Search tasks..."
      oninput="filterTasks()"
    >

    <select id="categoryFilter" onchange="filterTasks()">
      <option value="all">All Categories</option>
      <option value="Errands">Errands</option>
      <option value="Physical Help">Physical Help</option>
      <option value="Digital Work">Digital Work</option>
      <option value="Creative Skills">Creative Skills</option>
      <option value="Academic Support">Academic Support</option>
      <option value="Campus Services">Campus Services</option>
      <option value="Other">Other</option>
    </select>
  </header>

  <div id="tasks">
    <div class="message">Loading tasks...</div>
  </div>

</div>

<nav>
  <a href="index.html">🏠<br>Home</a>
  <a href="my-tasks.html">📋<br>My Tasks</a>
  <a href="post-task.html">➕<br>Post</a>
  <a href="alerts.html">🔔<br>Alerts</a>
  <a href="profile.html">👤<br>Profile</a>
</nav>

<script>
  const SUPABASE_URL = "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allTasks = [];

  async function loadTasks() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data, error } = await supabaseClient
      .from("tasks")
      .select("*")
      .eq("status", "open")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("tasks").innerHTML =
        `<div class="message">Unable to load tasks.</div>`;
      console.error(error);
      return;
    }

    allTasks = data || [];

    filterTasks();
  }

  function filterTasks() {

    const search =
      document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const category =
      document.getElementById("categoryFilter").value;

    const filtered = allTasks.filter(task => {

      const matchesSearch =
        !search ||
        (task.title || "").toLowerCase().includes(search) ||
        (task.description || "").toLowerCase().includes(search) ||
        (task.location || "").toLowerCase().includes(search);

      const matchesCategory =
        category === "all" ||
        task.category === category;

      return matchesSearch && matchesCategory;
    });

    displayTasks(filtered);
  }

  function displayTasks(tasks) {

    const container = document.getElementById("tasks");

    if (!tasks.length) {
      container.innerHTML =
        `<div class="message">No tasks found.</div>`;
      return;
    }

    container.innerHTML = tasks.map(task => {

      return `
        <div class="task" onclick="openTask('${task.id}')">

          <span class="category">
            ${escapeHtml(task.category)}
          </span>

          <h3>
            ${escapeHtml(task.title)}
          </h3>

          <p>
            📍 ${escapeHtml(task.location)}
          </p>

          <p>
            🕒 ${formatDate(task.deadline)}
          </p>

          <p>
            ${escapeHtml(task.description)}
          </p>

          <div class="budget">
            ₦${Number(task.budget).toLocaleString()}
          </div>

          <button
            class="view-btn"
            onclick="event.stopPropagation(); openTask('${task.id}')">
            VIEW TASK
          </button>

        </div>
      `;

    }).join("");
  }

  function openTask(taskId) {
    window.location.href =
      "task-details.html?id=" +
      encodeURIComponent(taskId);
  }

  function formatDate(date) {

    if (!date) return "No deadline";

    return new Date(date).toLocaleString();
  }

  function escapeHtml(text) {

    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadTasks();
</script>

</body>
</html>
