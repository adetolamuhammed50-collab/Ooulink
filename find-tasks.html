<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Tasks - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 30px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .filters {
      padding: 15px 20px 5px;
    }

    .filter {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e8e6;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .task-list {
      padding: 15px 20px;
    }

    .task {
      border: 1px solid #e5e8e6;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .task h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .task p {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .task-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .price {
      font-weight: 800;
      color: #16834b;
    }

    .tag {
      background: #edf7f1;
      color: #16834b;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
    }

    .accept {
      margin-top: 12px;
      width: 100%;
      background: #16834b;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <a href="index.html" class="back">← Back</a>

    <h1>Find Tasks</h1>
    <p class="subtitle">Find tasks you can complete and earn.</p>
  </header>

  <div class="filters">
    <select class="filter">
      <option>All categories</option>
      <option>Errands</option>
      <option>Printing</option>
      <option>Digital</option>
      <option>Cleaning</option>
      <option>Moving</option>
      <option>Creative</option>
      <option>Tutoring</option>
    </select>
  </div>

  <section class="task-list">

    <div class="task">
      <h2>🖨️ Print & Deliver Assignment</h2>
      <p>📍 OOU — Ibogun Campus</p>
      <p>⏰ Due today</p>

      <div class="task-bottom">
        <span class="price">₦1,000</span>
        <span class="tag">Printing</span>
      </div>

      <button class="accept">ACCEPT TASK</button>
    </div>

    <div class="task">
      <h2>🍱 Pick Up Food</h2>
      <p>📍 OOU — Ibogun Campus</p>
      <p>⏰ Due in 1 hour</p>

      <div class="task-bottom">
        <span class="price">₦700</span>
        <span class="tag">Errand</span>
      </div>

      <button class="accept">ACCEPT TASK</button>
    </div>

    <div class="task">
      <h2>⌨️ Type Assignment</h2>
      <p>📍 OOU — Ibogun Campus</p>
      <p>⏰ Due tomorrow</p>

      <div class="task-bottom">
        <span class="price">₦1,500</span>
        <span class="tag">Digital</span>
      </div>

      <button class="accept">ACCEPT TASK</button>
    </div>

  </section>

</div>

</body>
</html>
