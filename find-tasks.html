<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Tasks - OOULink</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f5f7fa;
color: #172033;
-webkit-tap-highlight-color: transparent;
}

button,
input,
select {
font: inherit;
}

button,
.task,
nav a {
-webkit-user-select: none;

}

button {
-webkit-tap-highlight-color: transparent;
}

.app {
max-width: 480px;
margin: auto;
min-height: 100vh;
background: #fff;
padding-bottom: 82px;
}

header {
padding: 20px;
border-bottom: 1px solid #edf0ee;
background: #fff;
position: sticky;

z-index: 20;
animation: headerIn .35s ease both;
}

@keyframes headerIn {
from {
opacity: 0;
transform: translateY(-8px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.back {
display: inline-block;
text-decoration: none;
color: #555;
font-size: 14px;
padding: 5px 0;
transition:
transform .15s ease,
color .15s ease;
}

.back:active {
transform: translateX(-3px);

}

h1 {
margin: 15px 0 5px;
font-size: 26px;
letter-spacing: -.4px;
animation: textIn .4s ease .04s both;
}

.subtitle {
color: #777;
font-size: 14px;
line-height: 1.45;
margin-bottom: 18px;
animation: textIn .4s ease .08s both;
}

@keyframes textIn {
from {
opacity: 0;
transform: translateY(5px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.search-wrap {
position: relative;
margin-bottom: 12px;
animation: textIn .4s ease .12s both;
}

.search-icon {
position: absolute;
left: 14px;
top: 50%;
transform: translateY(-50%);
font-size: 15px;
pointer-events: none;
transition: transform .2s ease;
}

.search-wrap:focus-within .search-icon {
transform: translateY(-50%) scale(1.08);
}

.search-box {
width: 100%;
padding: 14px 42px 14px 40px;
border: 1px solid #ddd;
border-radius: 13px;
font-size: 15px;
outline: none;
background: #fff;
transition:
border-color .2s ease,
box-shadow .2s ease,
transform .15s ease;
}

.search-box:focus {
border-color: #16834b;
box-shadow: 0 0 0 3px rgba(22,131,75,.08);
}

.search-box:active {
transform: scale(.998);
}

.clear-search {
position: absolute;
right: 10px;
top: 50%;
transform: translateY(-50%);
border: 0;
background: #f0f2f1;
color: #666;
width: 27px;
height: 27px;
border-radius: 50%;
display: none;
align-items: center;
justify-content: center;
cursor: pointer;
transition:
transform .15s ease,
background .15s ease;
}

.clear-search.show {
display: flex;
animation: popIn .18s ease both;
}

.clear-search:active {
transform: translateY(-50%) scale(.88);
background: #e5e9e7;
}

.filter-row {
display: flex;
gap: 9px;
animation: textIn .4s ease .16s both;
}

.filter-select {
flex: 1;
min-width: 0;
padding: 13px 10px;
border: 1px solid #ddd;
border-radius: 12px;
background: white;
font-size: 14px;
outline: none;
color: #172033;
transition:
border-color .2s ease,
box-shadow .2s ease,
transform .15s ease;
}

.filter-select:focus {
border-color: #16834b;
box-shadow: 0 0 0 3px rgba(22,131,75,.07);
}

.filter-select:active {
transform: scale(.995);
}

.results-bar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px 2px;
font-size: 13px;
color: #777;
animation: textIn .4s ease .2s both;
}

.results-count {
font-weight: 600;
color: #555;
transition:
opacity .18s ease,
transform .18s ease;
}

.results-count.updating {
opacity: .45;
transform: translateY(2px);
}

.clear-filters {
border: 0;
background: transparent;
color: #16834b;
font-size: 13px;
font-weight: 600;
padding: 4px 0;
cursor: pointer;
display: none;
transition:
transform .15s ease,
opacity .15s ease;
}

.clear-filters.show {
display: block;
animation: popIn .18s ease both;
}

.clear-filters:active {
transform: scale(.94);
}

@keyframes popIn {
from {
opacity: 0;
transform: scale(.9);
}
to {
opacity: 1;
transform: scale(1);
}
}

#tasks {
padding: 12px 20px 20px;
transition:
opacity .18s ease,
transform .18s ease;
}

#tasks.refreshing {
opacity: .55;
transform: translateY(3px);
}

.task {
border: 1px solid #e5e9e7;
border-radius: 17px;
padding: 16px;
margin-bottom: 14px;
background: #fff;
cursor: pointer;
box-shadow: 0 2px 7px rgba(20,40,30,.035);
transition:
transform .18s ease,
box-shadow .18s ease,
border-color .18s ease,
opacity .18s ease;
animation: cardIn .32s cubic-bezier(.22,.8,.25,1) both;
will-change: transform, opacity;
}

.task:hover {
border-color: #cfd8d3;
box-shadow: 0 5px 16px rgba(20,40,30,.07);
}

.task:active {
transform: scale(.985);
box-shadow: 0 2px 7px rgba(20,40,30,.04);
}

.task.opening {
animation: cardOpen .2s ease both;
}

@keyframes cardIn {
from {
opacity: 0;
transform: translateY(9px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@keyframes cardOpen {
from {
opacity: .7;
transform: scale(.99);
}
to {
opacity: 1;
transform: scale(1);
}
}

.task-top {
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
margin-bottom: 9px;
}

.category {
display: inline-flex;
align-items: center;
font-size: 11px;
font-weight: 700;
color: #16834b;
background: #eaf7f0;

border-radius: 20px;

letter-spacing: .25px;
}

.status-badge {
font-size: 11px;
font-weight: 700;
color: #347357;
background: #f1f8f4;
border: 1px solid #dceee4;
padding: 5px 8px;
border-radius: 20px;
white-space: nowrap;
}

.task h3 {
margin: 0 0 9px;
font-size: 18px;
line-height: 1.3;
letter-spacing: -.2px;
color: #172033;
}

.task-description {
margin: 0 0 13px;
color: #666;
font-size: 13px;
line-height: 1.5;
display: -webkit-box;
-webkit-line-clamp: 3;
-webkit-box-orient: vertical;
overflow: hidden;
}

.task-meta {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 13px;
}

.meta-item {
min-width: 0;
background: #f7f9f8;
border-radius: 11px;
padding: 9px 10px;
transition:
transform .15s ease,
background .15s ease;
}

.meta-item:active {
transform: scale(.985);
background: #f2f6f4;
}

.meta-label {
display: block;
font-size: 10px;
color: #8a928e;
text-transform: uppercase;
letter-spacing: .35px;
margin-bottom: 3px;
font-weight: 700;
}

.meta-value {
display: block;
font-size: 12px;
font-weight: 600;
color: #424b46;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.deadline-soon {
color: #c57918;
}

.budget-row {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
padding-top: 12px;
border-top: 1px solid #edf0ee;
}

.budget-label {
font-size: 11px;
color: #888;
font-weight: 600;
}

.budget {
font-size: 20px;

color: #16834b;
letter-spacing: -.3px;

.task:hover .budget {
transform: translateX(-2px);
}

.view-btn {
width: 100%;
border: none;
background: #16834b;
color: white;
padding: 12px;
border-radius: 11px;
margin-top: 13px;
font-weight: 700;
font-size: 13px;
cursor: pointer;
transition:
transform .15s ease,
background .15s ease,
box-shadow .15s ease;

}

.view-btn:hover {

}

.view-btn:active {
transform: scale(.98);
box-shadow: none;
}

.view-btn::after {
content: "";
position: absolute;
inset: 0;
background: rgba(255,255,255,.12);
opacity: 0;
transition: opacity .15s ease;
}

.view-btn:active::after {
opacity: 1;
}

.message {
text-align: center;
padding: 42px 18px;
color: #777;
font-size: 14px;
line-height: 1.5;
animation: emptyIn .3s ease both;
}

@keyframes emptyIn {
from {
opacity: 0;
transform: translateY(8px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.empty-icon {
font-size: 34px;
margin-bottom: 9px;
animation: iconFloat .35s ease .08s both;
}

@keyframes iconFloat {
from {
opacity: 0;
transform: scale(.8) translateY(5px);
}
to {
opacity: 1;
transform: scale(1) translateY(0);
}
}

.empty-title {
font-size: 16px;
font-weight: 700;
color: #303934;
margin-bottom: 5px;
}

.empty-text {
font-size: 13px;
color: #858b88;
}

.empty-action {
margin-top: 15px;
border: 0;
background: #16834b;
color: white;
padding: 10px 15px;
border-radius: 10px;
font-weight: 700;
font-size: 13px;
cursor: pointer;
transition:
transform .15s ease,
background .15s ease;
}

.empty-action:active {
transform: scale(.95);
background: #126d3e;
}

.skeleton {
border: 1px solid #edf0ee;
border-radius: 17px;
padding: 16px;
margin-bottom: 14px;
overflow: hidden;
position: relative;
background: #fff;
animation: skeletonIn .25s ease both;
}

.skeleton:nth-child(2) {
animation-delay: .05s;
}

.skeleton:nth-child(3) {
animation-delay: .1s;
}

@keyframes skeletonIn {
from {
opacity: 0;
transform: translateY(6px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.skeleton-line,
.skeleton-pill,
.skeleton-button {
position: relative;
overflow: hidden;
background: #edf0ee;
}

.skeleton-line::after,
.skeleton-pill::after,
.skeleton-button::after {
content: "";
position: absolute;
top: 0;
left: -120%;
width: 65%;
height: 100%;
background: linear-gradient(
90deg,
transparent,
rgba(255,255,255,.75),
transparent
);
animation: shimmer 1.25s ease-in-out infinite;
}

.skeleton-line {
height: 11px;
border-radius: 7px;
margin-bottom: 10px;
}

.skeleton-pill {
width: 82px;
height: 23px;
border-radius: 20px;
margin-bottom: 13px;
}

.skeleton-title {
width: 78%;
height: 18px;
margin-bottom: 12px;
}

.skeleton-short {
width: 48%;
}

.skeleton-button {
width: 100%;
height: 40px;
border-radius: 11px;
margin-top: 13px;
}

@keyframes shimmer {
0% {
left: -120%;
}
100% {
left: 150%;
}
}

nav {
position: fixed;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 100%;
max-width: 480px;
background: rgba(255,255,255,.97);
border-top: 1px solid #e5e8e6;
display: flex;

padding: 11px 5px calc(11px + env(safe-area-inset-bottom));

nav a {

nav a:active {

}

@media (max-width: 360px) {
header {
padding: 18px 16px;
}

#tasks {

}

.results-bar {
padding-left: 16px;
padding-right: 16px;
}

.task {
padding: 14px;
}

.task-meta {
gap: 6px;
}
}

@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
animation-duration: .01ms !important;
animation-iteration-count: 1 !important;
transition-duration: .01ms !important;
scroll-behavior: auto !important;
}
}
</style>

  <body>

<script>
const SUPABASE_URL =
"https://dthvdxgxesomltlruogp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allTasks = [];

const tasksContainer =
document.getElementById("tasks");

const searchInput =
document.getElementById("searchInput");

const categoryFilter =
document.getElementById("categoryFilter");

const sortFilter =
document.getElementById("sortFilter");

const clearSearchButton =
document.getElementById("clearSearch");

const clearFiltersButton =
document.getElementById("clearFilters");

const resultsCount =
document.getElementById("resultsCount");


searchInput.addEventListener(
"input",
filterTasks
);

categoryFilter.addEventListener(
"change",
filterTasks
);

sortFilter.addEventListener(
"change",
filterTasks
);


function showSkeletons() {

tasksContainer.classList.remove(
"refreshing"
);

tasksContainer.innerHTML = `
<div class="skeleton">

<div class="skeleton-pill"></div>

<div class="skeleton-line skeleton-title"></div>

<div class="skeleton-line"></div>

<div class="skeleton-line skeleton-short"></div>

<div class="skeleton-button"></div>

</div>

<div class="skeleton">

<div class="skeleton-pill"></div>

<div class="skeleton-line skeleton-title"></div>

<div class="skeleton-line"></div>

<div class="skeleton-line skeleton-short"></div>

<div class="skeleton-button"></div>

</div>

<div class="skeleton">

<div class="skeleton-pill"></div>

<div class="skeleton-line skeleton-title"></div>

<div class="skeleton-line"></div>

<div class="skeleton-line skeleton-short"></div>

<div class="skeleton-button"></div>

</div>
`;

resultsCount.textContent =
"Loading...";

resultsCount.classList.remove(
"updating"
);
}


async function loadTasks() {

showSkeletons();

const {
data: { session }
} =
await supabaseClient.auth.getSession();

if (!session) {

window.location.href =
"login.html";

return;
}

const {
data,
error
} =
await supabaseClient
.from("tasks")
.select("*")
.eq("status", "open")
.order("created_at", {
ascending: false
});

if (error) {

tasksContainer.innerHTML = `
<div class="message">

<div class="empty-icon">
⚠️
</div>

<div class="empty-title">
Unable to load tasks
</div>

<div class="empty-text">
Please check your connection and try again.
</div>

<button
type="button"
class="empty-action"
onclick="loadTasks()"
>
Try again
</button>

</div>
`;

resultsCount.textContent =
"Unable to load";

console.error(error);

return;
}

allTasks = data || [];

filterTasks();
}


function filterTasks() {

const search =
searchInput.value
.trim()
.toLowerCase();

const category =
categoryFilter.value;

const sort =
sortFilter.value;

let filtered =
allTasks.filter(task => {

const title =
(task.title || "")
.toLowerCase();

const description =
(task.description || "")
.toLowerCase();

const location =
(task.location || "")
.toLowerCase();

const taskCategory =
(task.category || "")
.toLowerCase();

const matchesSearch =
!search ||
title.includes(search) ||
description.includes(search) ||
location.includes(search) ||
taskCategory.includes(search);

const matchesCategory =
category === "all" ||
task.category === category;

return (
matchesSearch &&
matchesCategory
);
});


filtered.sort((a, b) => {

if (sort === "highest") {

return Number(b.budget || 0) -
Number(a.budget || 0);

}

if (sort === "lowest") {

return Number(a.budget || 0) -
Number(b.budget || 0);

}

if (sort === "deadline") {

const dateA =
a.deadline
? new Date(a.deadline).getTime()
: Number.MAX_SAFE_INTEGER;

const dateB =
b.deadline
? new Date(b.deadline).getTime()
: Number.MAX_SAFE_INTEGER;

return dateA - dateB;

}

const dateA =
a.created_at
? new Date(a.created_at).getTime()
: 0;

const dateB =
b.created_at
? new Date(b.created_at).getTime()
: 0;

return dateB - dateA;

});


updateFilterControls(
search,
category,
sort
);

displayTasks(filtered);
}


function updateFilterControls(
search,
category,
sort
) {

clearSearchButton.classList.toggle(
"show",
Boolean(search)
);

const hasFilters =
Boolean(search) ||
category !== "all" ||
sort !== "newest";

clearFiltersButton.classList.toggle(
"show",
hasFilters
);
}


function updateResultsCount(
count
) {

resultsCount.classList.add(
"updating"
);

setTimeout(() => {

resultsCount.textContent =
count === 1
? "1 task available"
: `${count} tasks available`;

resultsCount.classList.remove(
"updating"
);

}, 80);
}


function displayTasks(tasks) {

tasksContainer.classList.add(
"refreshing"
);

setTimeout(() => {

if (!tasks.length) {

tasksContainer.innerHTML = `
<div class="message">

<div class="empty-icon">
🔎
</div>

<div class="empty-title">
No tasks found
</div>

<div class="empty-text">
Try another search or remove your filters.
</div>

<button
type="button"
class="empty-action"
onclick="clearFilters()"
>
Clear filters
</button>

</div>
`;

updateResultsCount(0);

tasksContainer.classList.remove(
"refreshing"
);

return;
}


tasksContainer.innerHTML =
tasks.map((task, index) => {

const category =
escapeHtml(
task.category || "Other"
);

const title =
escapeHtml(
task.title || "Untitled task"
);

const description =
escapeHtml(
task.description ||
"No description provided."
);

const location =
escapeHtml(
task.location ||
"Location not specified"
);

const budget =
Number(task.budget || 0)
.toLocaleString();

const deadline =
formatDeadline(task.deadline);

const deadlineClass =
getDeadlineClass(
task.deadline
);

return `
<div
class="task"
style="animation-delay:${Math.min(
index * 35,
250
)}ms"
onclick="openTask('${escapeJs(
task.id
)}')"
>

<div class="task-top">

<span class="category">
${category}
</span>

<span class="status-badge">
● Open
</span>

</div>

<h3>
${title}
</h3>

<p class="task-description">
${description}
</p>

<div class="task-meta">

<div class="meta-item">

<span class="meta-label">
Location
</span>

<span class="meta-value">
📍 ${location}
</span>

</div>

<div class="meta-item">

<span class="meta-label">
Deadline
</span>

<span
class="meta-value ${deadlineClass}"
>
⏰ ${deadline}
</span>

</div>

</div>

function formatDeadline(date) {

if (!date) {
return "No deadline";
}

const deadline =
new Date(date);

if (
Number.isNaN(
deadline.getTime()
)
) {
return "No deadline";
}

const now =
new Date();

const diff =
deadline.getTime() -
now.getTime();

const day =
24 * 60 * 60 * 1000;

if (diff < 0) {
return "Deadline passed";
}

if (
diff <
60 * 60 * 1000
) {

const minutes =
Math.max(
1,
Math.ceil(
diff / 60000
)
);

return `Due in ${minutes}m`;
}

if (diff < day) {

const hours =
Math.max(
1,
Math.ceil(
diff / 3600000
)
);

return `Due in ${hours}h`;
}

if (diff < 2 * day) {
return "Due tomorrow";
}

if (diff < 7 * day) {

const days =
Math.ceil(
diff / day
);

return `Due in ${days} days`;
}

return deadline.toLocaleDateString(
undefined,
{
day: "numeric",
month: "short",
year: "numeric"
}
);
}


function getDeadlineClass(date) {

if (!date) {
return "";
}

const deadline =
new Date(date);

if (
Number.isNaN(
deadline.getTime()
)
) {
return "";
}

const diff =
deadline.getTime() -
Date.now();

if (diff < 0) {
return "";
}

if (
diff <
24 * 60 * 60 * 1000
) {
return "deadline-soon";
}

return "";
}


function escapeHtml(text) {

return String(text || "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}


function escapeJs(text) {

return String(text || "")
.replace(/\\/g, "\\\\")
.replace(/'/g, "\\'")
.replace(/"/g, '\\"')
.replace(/\n/g, "\\n")
.replace(/\r/g, "\\r");
}
