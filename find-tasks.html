<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Tasks - OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17231d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 30px;
    }

    header {
      padding: 25px 20px 15px;
      border-bottom: 1px solid #e5e8e6;
    }

    .back {
      color: #16834b;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .filters {
      padding: 15px 20px 5px;
    }

    .filter {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e8e6;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .task-list {
      padding: 15px 20px;
    }

    .task {
      border: 1px solid #e5e8e6;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .task h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .task p {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .task-description {
      color: #555 !important;
      margin-top: 5px;
    }

    .task-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .price {
      font-weight: 800;
      color: #16834b;
    }

    .tag {
      background: #edf7f1;
      color: #16834b;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
    }

    .accept {
      margin-top: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: #16834b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #777;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 35px 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <a href="index.html" class="back">← Back</a>

    <h1>Find Tasks</h1>
    <p class="subtitle">Find tasks you can complete and earn.</p>
  </header>

  <div class="filters">
    <select class="filter" id="categoryFilter">
      <option value="All">All categories</option>
      <option value="Errands">Errands</option>
      <option value="Physical Help">Physical Help</option>
      <option value="Digital Work">Digital Work</option>
      <option value="Creative Skills">Creative Skills</option>
      <option value="Academic Support">Academic Support</option>
      <option value="Campus Services">Campus Services</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <section class="task-list" id="taskList">
    <div class="loading">
      Loading available tasks...
    </div>
  </section>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  let allTasks = [];


  async function loadTasks() {

    const taskList =
      document.getElementById("taskList");

    /* Check login */

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

      taskList.innerHTML = `
        <div class="empty">
          <h3>Please log in</h3>
          <p style="margin-top:8px;">
            You need an account to find tasks.
          </p>
          <button
            onclick="window.location.href='login.html'"
            style="
              margin-top:15px;
              border:none;
              border-radius:10px;
              padding:12px 20px;
              background:#16834b;
              color:white;
              font-weight:bold;
            "
          >
            LOG IN
          </button>
        </div>
      `;

      return;
    }


    /* Get open tasks */

    const {
      data,
      error
    } = await supabaseClient
      .from("tasks")
      .select("*")
      .eq("status", "open")
      .order("created_at", { ascending: false });


    if (error) {

      console.error(error);

      taskList.innerHTML = `
        <div class="empty">
          <h3>Couldn't load tasks</h3>
          <p style="margin-top:8px;">
            ${escapeHtml(error.message)}
          </p>
        </div>
      `;

      return;
    }


    allTasks = data || [];

    displayTasks(allTasks);
  }


  function displayTasks(tasks) {

    const taskList =
      document.getElementById("taskList");


    if (!tasks.length) {

      taskList.innerHTML = `
        <div class="empty">
          <h3>No tasks available yet</h3>
          <p style="margin-top:8px;">
            Check back later for new tasks.
          </p>
        </div>
      `;

      return;
    }


    taskList.innerHTML = tasks.map(task => {

      const deadline =
        new Date(task.deadline);

      const formattedDeadline =
        deadline.toLocaleString([], {
          dateStyle: "medium",
          timeStyle: "short"
        });


      return `
        <div class="task">

          <h2>
            ${escapeHtml(task.title)}
          </h2>

          <p>
            📍 ${escapeHtml(task.location)}
          </p>

          <p>
            ⏰ ${formattedDeadline}
          </p>

          <p class="task-description">
            ${escapeHtml(task.description)}
          </p>

          <div class="task-bottom">

            <span class="price">
              ₦${Number(task.budget).toLocaleString()}
            </span>

            <span class="tag">
              ${escapeHtml(task.category)}
            </span>

          </div>

          <button
            class="accept"
            onclick="acceptTask('${task.id}')"
          >
            ACCEPT TASK
          </button>

        </div>
      `;

    }).join("");
  }


  function filterTasks() {

    const selected =
      document.getElementById("categoryFilter").value;


    if (selected === "All") {

      displayTasks(allTasks);

      return;
    }


    const filtered =
      allTasks.filter(
        task => task.category === selected
      );


    displayTasks(filtered);
  }


  async function acceptTask(taskId) {

    alert(
      "Task acceptance and payment are coming next! 🚀"
    );
  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  document
    .getElementById("categoryFilter")
    .addEventListener("change", filterTasks);


  loadTasks();

</script>

</body>
</html>
