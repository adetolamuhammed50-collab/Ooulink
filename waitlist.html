<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#16834b"><title>Join the StudTask Waitlist</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#172033}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#fff}.wrap{padding:18px}.back{color:#16834b;text-decoration:none;font-size:13px;font-weight:800}.hero{margin-top:18px;padding:24px 20px;border-radius:22px;background:linear-gradient(135deg,#16834b,#0d6238);color:#fff}.hero h1{margin:0 0 9px;font-size:29px;line-height:1.15}.hero p{margin:0;font-size:13px;line-height:1.55;opacity:.94}.card{margin-top:15px;padding:18px;border:1px solid #e0e8e3;border-radius:18px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.05)}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.input{width:100%;padding:13px;border:1px solid #d8e0db;border-radius:11px;font-size:16px;outline:0}.input:focus{border-color:#16834b;box-shadow:0 0 0 3px rgba(22,131,75,.1)}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#16834b;color:#fff;font-size:13px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.65}.note,.status{font-size:11px;color:#68736d;line-height:1.5}.status{margin-top:10px}.success{color:#16834b;font-weight:800}.error{color:#b42318;font-weight:700}.brand{display:block;margin-top:18px;text-align:center;color:#89938d;font-size:10px}</style></head><body><main class="app"><div class="wrap"><a class="back" href="index.html">← Back to StudTask</a><section class="hero"><h1>StudTask is launching soon.</h1><p>Join the waitlist and be among the first students to know when StudTask opens for everyone.</p></section><section class="card"><form id="waitlistForm"><div class="field"><label for="name">FULL NAME</label><input class="input" id="name" maxlength="100" autocomplete="name" required></div><div class="field"><label for="email">EMAIL</label><input class="input" id="email" type="email" maxlength="254" autocomplete="email" required></div><div class="field"><label for="phone">PHONE NUMBER</label><input class="input" id="phone" type="tel" maxlength="30" autocomplete="tel" required></div><div class="field"><label for="campus">CAMPUS <span style="font-weight:400;color:#89938d">(optional)</span></label><input class="input" id="campus" maxlength="100" placeholder="e.g. OOU Ibogun"></div><button class="btn" id="submitBtn" type="submit">JOIN THE WAITLIST</button><div id="status" class="status" aria-live="polite"></div></form></section><p class="note" style="text-align:center;margin:14px 5px">We’ll use these details only for StudTask launch updates. You can ask us to stop contacting you.</p><div class="brand">StudTask • Connect. Get things done. Earn.</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),form=document.getElementById("waitlistForm"),btn=document.getElementById("submitBtn"),status=document.getElementById("status");const clean=v=>String(v||"").trim();form.addEventListener("submit",async e=>{e.preventDefault();const full_name=clean(document.getElementById("name").value),email=clean(document.getElementById("email").value).toLowerCase(),phone=clean(document.getElementById("phone").value),campus=clean(document.getElementById("campus").value)||null;if(full_name.length<2||email.length<5||phone.length<7){status.className="status error";status.textContent="Please enter valid details.";return}btn.disabled=true;btn.textContent="JOINING...";status.className="status";status.textContent="";try{const{error}=await client.from("waitlist_signups").insert({full_name,email,phone,campus});if(error){if(error.code==="23505")throw new Error("This email is already on the waitlist.");throw error}form.reset();status.className="status success";status.textContent="You’re on the StudTask waitlist. We’ll keep you updated."}catch(error){status.className="status error";status.textContent=error.message||"Could not join the waitlist. Please try again."}finally{btn.disabled=false;btn.textContent="JOIN THE WAITLIST"}});</script><script src="brand.js"></script></body></html>
