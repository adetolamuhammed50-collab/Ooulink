ntifier,password){const value=identifier.trim();if(value.includes("@")){const{data,error}=await supabaseClient.auth.signInWithPassword({email:value,password});if(error)throw error;return data.session}const{data,error}=await supabaseClient.functions.invoke("username-login",{body:{identifier:value,password}});if(error)throw new Error("Invalid username/email or password.");if(!data?.access_token||!data?.refresh_token)throw new Error("Invalid username/email or password.");const{data:sessionData,error:sessionError}=await supabaseClient.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(sessionError)throw sessionError;return sessionData.session}form.addEventListener("submit",async e=>{e.preventDefault();const identifier=identifierInput.value.trim(),password=passwordInput.value;if(!identifier||!password){showMessage("Enter your email or username and password.","error");return}message.className="message";message.textContent="";button.disabled=true;button.textContent="LOGGING IN...";try{await resolveLogin(identifier,password);showMessage("Login successful!","success");setTimeout(()=>window.location.href="index.html",700)}catch(error){showMessage(error.message||"Login failed. Please try again.","error")}finally{button.disabled=false;button.textContent="LOG IN"}});</script></body></html>
