<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streak Master • OOULink</title><style>*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:#123;font-family:Arial,sans-serif;max-width:480px;margin:auto;padding-bottom:78px}.header{height:64px;background:#fff;border-bottom:1px solid #e3eee7;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;color:#159447}.back{border:0;background:#eef9f1;color:#159447;border-radius:12px;padding:9px 12px;font-weight:700}.wrap{padding:20px 18px}.intro{text-align:center}.intro h1{margin:5px 0;font-size:27px}.intro p{margin:0;color:#6d7972;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3eee7;border-radius:15px;text-align:center;padding:12px 5px}.stat b{display:block;color:#159447;font-size:20px}.stat span{font-size:10px;color:#718078}.game{background:#fff;border:1px solid #e3eee7;border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 6px 20px #1231}.timer{font-size:14px;color:#159447;font-weight:800;margin-bottom:16px}.question{font-size:21px;font-weight:800;min-height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #e3eee7;background:#f8fffa;border-radius:14px;padding:14px 8px;font-size:14px;font-weight:700;cursor:pointer;transition:.12s}.answer:active{transform:scale(.95)}.answer.correct{border-color:#159447;background:#eef9f1;color:#159447}.answer.wrong{border-color:#d95b48;background:#fff1ee;color:#d95b48}.message{height:30px;margin-top:14px;font-size:13px;font-weight:700;color:#159447}.start,.again{border:0;background:#159447;color:#fff;border-radius:13px;padding:13px 22px;font-weight:800}.start{margin-top:10px}.result{display:none;background:#fff;border:1px solid #e3eee7;border-radius:20px;padding:20px;text-align:center;margin-top:16px}.result h2{margin:0 0 8px}.big{font-size:40px;font-weight:900;color:#159447}.result p{color:#68756e;font-size:13px}.hint{text-align:center;color:#87938c;font-size:11px;margin:12px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:64px;background:#fff;border-top:1px solid #e3eee7;display:flex;justify-content:space-around;align-items:center;z-index:10}.bottom a{text-decoration:none;color:#718078;font-size:10px;text-align:center}.bottom span{display:block;font-size:20px;margin-bottom:2px}.bottom .active{color:#159447;font-weight:800}@media(max-width:350px){.question{font-size:18px}.answer{padding:12px 6px}}</style></head><body><header class="header"><div class="logo">OOULink</div><button class="back" onclick="location.href='games.html'">← Games</button></header><main class="wrap"><section class="intro"><h1>🔥 Streak Master</h1><p>Answer correctly and keep your streak alive!</p></section><section class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="streak">0</b><span>STREAK</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></section><div class="game"><div class="timer">⏱️ <span id="time">30</span>s</div><div class="question" id="question">Ready?</div><div class="answers" id="answers"></div><div class="message" id="message">Get every answer right!</div><button class="start" id="start">START GAME</button></div><div class="result" id="result"><h2>🏆 Streak Complete!</h2><div class="big" id="finalScore">0</div><p id="resultText"></p><button class="again" id="again">PLAY AGAIN</button></div><div class="hint">30 seconds • Correct answers increase your streak • Wrong answers reset it</div></main><nav class="bottom"><a href="index.html"><span>🏠</span>Home</a><a href="my-tasks.html"><span>📋</span>My Tasks</a><a href="post-task.html"><span>➕</span>Post</a><a href="alerts.html"><span>🔔</span>Alerts</a><a href="profile.html"><span>👤</span>Profile</a></nav><script>const question=document.getElementById("question"),answers=document.getElementById("answers"),scoreEl=document.getElementById("score"),streakEl=document.getElementById("streak"),bestEl=document.getElementById("best"),timeEl=document.getElementById("time"),message=document.getElementById("message"),start=document.getElementById("start"),again=document.getElementById("again"),result=document.getElementById("result"),finalScore=document.getElementById("finalScore"),resultText=document.getElementById("resultText");const qs=[["What is 2 + 2?",["3","4","5","6"],"4"],["Which planet is known as the Red Planet?",["Earth","Mars","Venus","Jupiter"],"Mars"],["How many days are in a week?",["5","6","7","8"],"7"],["What color do you get by mixing blue and yellow?",["Green","Purple","Orange","Red"],"Green"],["Which is the largest ocean?",["Atlantic","Indian","Pacific","Arctic"],"Pacific"],["How many months are in a year?",["10","11","12","13"],"12"],["Which animal is known as man's best friend?",["Cat","Dog","Horse","Lion"],"Dog"],["What is 5 × 5?",["20","25","30","35"],"25"],["Which continent is Nigeria in?",["Asia","Africa","Europe","South America"],"Africa"],["How many hours are in a day?",["12","18","24","36"],"24"],["Which gas do humans need to breathe?",["Oxygen","Helium","Hydrogen","Neon"],"Oxygen"],["What is the opposite of hot?",["Warm","Cold","Dry","Bright"],"Cold"],["Which shape has three sides?",["Square","Circle","Triangle","Rectangle"],"Triangle"],["What is 10 - 3?",["5","6","7","8"],"7"],["Which is faster?",["Car","Snail","Cheetah","Turtle"],"Cheetah"]];let score=0,streak=0,time=30,timer=null,running=false,best=Number(localStorage.getItem("ooulink_streak_best")||0),current=null;bestEl.textContent=best;function nextQuestion(){if(!running)return;current=qs[Math.floor(Math.random()*qs.length)];question.textContent=current[0];answers.innerHTML="";let opts=[...current[1]];for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),x=opts[i];opts[i]=opts[j];opts[j]=x}opts.forEach(v=>{const b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=()=>answer(b,v);answers.appendChild(b)})}function answer(btn,value){if(!running)return;const all=[...answers.children];all.forEach(b=>b.disabled=true);if(value===current[2]){btn.classList.add("correct");score++;streak++;message.textContent="🔥 Correct! Streak "+streak+"!";scoreEl.textContent=score;streakEl.textContent=streak;if(streak>best){best=streak;bestEl.textContent=best;localStorage.setItem("ooulink_streak_best",best)}}else{btn.classList.add("wrong");streak=0;streakEl.textContent=0;message.textContent="❌ Wrong! Streak reset.";all.forEach(b=>{if(b.textContent===current[2])b.classList.add("correct")})}setTimeout(nextQuestion,450)}function endGame(){running=false;clearInterval(timer);finalScore.textContent=score;resultText.textContent="You scored "+score+" point"+(score===1?"":"s")+" with a best streak of "+best+".";result.style.display="block";answers.innerHTML="";question.textContent="Time's up!";message.textContent="Great run!";start.style.display="none"}function startGame(){clearInterval(timer);score=0;streak=0;time=30;running=true;scoreEl.textContent=0;streakEl.textContent=0;timeEl.textContent=30;result.style.display="none";start.style.display="none";message.textContent="Get every answer right!";nextQuestion();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}start.onclick=startGame;again.onclick=()=>{start.style.display="inline-block";startGame()};</script></body></html>
