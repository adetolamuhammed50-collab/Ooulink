<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Task — OOULink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7f6;
      color: #17201b;
      padding-bottom: 82px;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      padding: 22px 20px 15px;
      border-bottom: 1px solid #e8ece9;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #16834b;
      font-size: 15px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #6b756f;
      font-size: 14px;
    }

    .form {
      padding: 22px 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d9dfdb;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #16834b;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .post-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #16834b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .post-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .note {
      margin-top: 15px;
      padding: 13px;
      background: #f0f8f3;
      border-radius: 10px;
      color: #416050;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================
       STANDARD BOTTOM NAV
       ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 68px;
      background: #ffffff;
      border-top: 1px solid #e4e9e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.06);
    }

    .bottom-nav a {
      position: relative;
      flex: 1;
      height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: #68736d;
      font-size: 11px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav a.active {
      color: #16834b;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 22px;
    }

    .bell-wrap {
      position: relative;
      display: inline-block;
      height: 22px;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -5px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      display: none;
    }

    @media (min-width: 481px) {
      .bottom-nav {
        border-radius: 14px 14px 0 0;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <a href="index.html" class="back">← Back</a>

    <h1>Post a Task</h1>

    <p class="subtitle">
      Tell people around you what you need done.
    </p>
  </header>

  <main class="form">

    <label for="title">What do you need done?</label>

    <input
      type="text"
      id="title"
      placeholder="e.g. Print & Deliver Assignment"
    >

    <label for="description">Describe the task</label>

    <textarea
      id="description"
      placeholder="Give runners enough information to understand what you need..."
    ></textarea>

    <label for="category">Category</label>

    <select id="category">
      <option value="">Select a category</option>
      <option>Errands</option>
      <option>Physical Help</option>
      <option>Digital Work</option>
      <option>Creative Skills</option>
      <option>Academic Support</option>
      <option>Campus Services</option>
      <option>Other</option>
    </select>

    <label for="location">Where should it be done?</label>

    <input
      type="text"
      id="location"
      placeholder="e.g. Ibogun Campus"
    >

    <div class="row">

      <div>
        <label for="budget">Budget (₦)</label>

        <input
          type="number"
          id="budget"
          placeholder="1000"
          min="1"
        >
      </div>

      <div>
        <label for="deadline">Deadline</label>

        <input
          type="datetime-local"
          id="deadline"
        >
      </div>

    </div>

    <button
      class="post-button"
      id="postButton"
      onclick="postTask()"
    >
      POST TASK
    </button>

    <div class="note">
      💡 Payment will be connected later. For now, your task will be saved
      securely so runners can see it.
    </div>

  </main>

</div>


<!-- =========================
     BOTTOM NAVIGATION
     ========================= -->

<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>

  <a href="find-tasks.html">
    <span class="nav-icon">🔎</span>
    <span>Find Tasks</span>
  </a>

  <a href="post-task.html" class="active">
    <span class="nav-icon">➕</span>
    <span>Post</span>
  </a>

  <a href="alerts.html">
    <span class="bell-wrap">
      <span class="nav-icon">🔔</span>
      <span id="notificationDot" class="notification-dot"></span>
    </span>
    <span>Alerts</span>
  </a>

  <a href="profile.html">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>

</nav>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://dthvdxgxesomltlruogp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     NOTIFICATION DOT
     ========================= */

  async function updateNotificationDot() {

    const dot =
      document.getElementById("notificationDot");

    if (!dot) return;

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error || !data.session) {
      dot.style.display = "none";
      return;
    }

    const userId =
      data.session.user.id;

    const {
      count,
      error: notificationError
    } =
      await supabaseClient
        .from("notifications")
        .select("id", {
          count: "exact",
          head: true
        })
        .eq("user_id", userId)
        .eq("is_read", false);

    if (notificationError) {

      console.error(
        "Notification dot error:",
        notificationError
      );

      return;
    }

    dot.style.display =
      count > 0
        ? "block"
        : "none";
  }


  /* =========================
     POST TASK
     ========================= */

  async function postTask() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const category =
      document
        .getElementById("category")
        .value;

    const location =
      document
        .getElementById("location")
        .value
        .trim();

    const budget =
      document
        .getElementById("budget")
        .value;

    const deadline =
      document
        .getElementById("deadline")
        .value;

    const button =
      document.getElementById("postButton");


    /* Check fields */

    if (
      !title ||
      !description ||
      !category ||
      !location ||
      !budget ||
      !deadline
    ) {

      alert(
        "Please fill in all the task details."
      );

      return;
    }


    /* Check login */

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      alert(
        "You need to be logged in to post a task."
      );

      window.location.href =
        "login.html";

      return;
    }


    /* Prevent double submission */

    button.disabled = true;

    button.textContent =
      "POSTING...";


    /* =========================
       SAVE TASK
       ========================= */

    const {
      data: task,
      error
    } =
      await supabaseClient
        .from("tasks")
        .insert([
          {
            user_id:
              session.user.id,

            title:
              title,

            description:
              description,

            category:
              category,

            location:
              location,

            budget:
              Number(budget),

            deadline:
              new Date(
                deadline
              ).toISOString(),

            status:
              "open"
          }
        ])
        .select()
        .single();


    /* Handle task error */

    if (error) {

      console.error(
        "Task creation error:",
        error
      );

      alert(
        "Could not post your task.\n\n" +
        error.message
      );

      button.disabled = false;

      button.textContent =
        "POST TASK";

      return;
    }


    /* =========================
       CREATE NOTIFICATION
       ========================= */

    const {
      error: notificationError
    } =
      await supabaseClient
        .from("notifications")
        .insert({
          user_id:
            session.user.id,

          task_id:
            task.id,

          type:
            "task_posted",

          title:
            "Task posted",

          message:
            `Your task "${task.title}" was posted successfully.`
        });


    /*
      The task itself was already created.

      So even if notification creation
      fails, we do NOT delete the task.
    */

    if (notificationError) {

      console.error(
        "Notification creation error:",
        notificationError
      );

    }


    /* =========================
       SUCCESS
       ========================= */

    alert(
      "Task posted successfully! 🎉\n\n" +
      "Your task is now available for runners to find."
    );

    window.location.href =
      "find-tasks.html";

  }


  /* Load notification dot */

  document.addEventListener(
    "DOMContentLoaded",
    updateNotificationDot
  );

</script>

</body>
</html>
