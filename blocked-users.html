<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16834b"><title>Blocked Users - StudTask</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;padding-bottom:80px}.app{max-width:480px;margin:auto;padding:18px 15px}.back{display:inline-block;color:#16834b;text-decoration:none;font-weight:800;font-size:13px;margin-bottom:15px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(0,0,0,.06)}h1{font-size:24px;margin:0}.sub{color:#687386;font-size:12px;line-height:1.5;margin:6px 0 16px}.empty,.error,.loading{text-align:center;padding:35px 12px;color:#687386;font-size:13px}.error{color:#c62828}.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #edf0f3}.item:first-child{border-top:0}.avatar{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;background:#eaf7ef;display:grid;place-items:center;color:#16834b;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.handle{color:#16834b;font-size:11px;margin-top:3px}.btn{border:0;border-radius:9px;padding:9px 10px;background:#ecfdf3;color:#15803d;font-size:10px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e7ebef;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;color:#687386;text-align:center;font-size:9px;padding:8px 2px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav a:last-child{color:#16834b;font-weight:800}.icon{font-size:17px;margin-bottom:2px}</style></head><body><main class="app"><a class="back" href="profile.html">← Back to Profile</a><section class="card"><h1>Blocked Users</h1><p class="sub">Users you block cannot start or continue task chat with you.</p><div id="list"><div class="loading">Loading...</div></div></section></main><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Home</a><a href="my-tasks.html"><span class="icon">✓</span>My Tasks</a><a href="post-task.html"><span class="icon">＋</span>Post</a><a href="alerts.html"><span class="icon">🔔</span>Alerts</a><a href="profile.html"><span class="icon">♙</span>Profile</a></nav><script>const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),list=document.getElementById("list");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));async function load(){const s=await supabaseClient.auth.getSession();if(!s.data?.session){location.href="login.html";return}const uid=s.data.session.user.id,r=await supabaseClient.from("user_blocks").select("id,blocked_id,created_at").eq("blocker_id",uid).order("created_at",{ascending:false});if(r.error){list.innerHTML='<div class="error">Could not load blocked users.</div>';return}const rows=r.data||[];if(!rows.length){list.innerHTML='<div class="empty">You have not blocked anyone.</div>';return}const ids=rows.map(x=>x.blocked_id),p=await supabaseClient.from("profiles").select("id,full_name,username,avatar_url").in("id",ids),map=new Map((p.data||[]).map(x=>[x.id,x]));list.innerHTML="";for(const row of rows){const u=map.get(row.blocked_id)||{},item=document.createElement("div");item.className="item";const av=document.createElement("div");av.className="avatar";av.textContent=(u.full_name||u.username||"U").trim().charAt(0).toUpperCase();if(u.avatar_url){const im=document.createElement("img");im.src=u.avatar_url;im.alt="";im.onerror=()=>im.remove();av.textContent="";av.appendChild(im)}const info=document.createElement("div");info.className="info";info.innerHTML='<div class="name">'+esc(u.full_name||"StudTask User")+'</div><div class="handle">'+esc(u.username?"@"+u.username:"User")+'</div>';const b=document.createElement("button");b.className="btn";b.textContent="UNBLOCK";b.onclick=async()=>{b.disabled=true;const x=await supabaseClient.from("user_blocks").delete().eq("id",row.id);if(x.error){b.disabled=false;alert("Could not unblock this user.");return}item.remove();if(!list.children.length)list.innerHTML='<div class="empty">You have not blocked anyone.</div>'};item.append(av,info,b);list.appendChild(item)}}load();</script></body></html>
